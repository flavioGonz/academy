<text x="882.0" y="310.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#D2492F" text-anchor="middle">No puede iniciar sesión</text>
<text x="882.0" y="344.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="middle">y si estaba adentro, lo expulsa</text>
<text x="636.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Lo mismo pasa cuando vence la vigencia:</text>
