<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">No aparece online: revisá estas cuatro cosas</text>
<rect x="48" y="128" width="560" height="60" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="158" r="18" fill="#17A8D4"/><text x="80.0" y="164.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="112.0" y="155.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Allow ISUP Registration</text>
<text x="112.0" y="177.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">activado en el SYS</text>
<rect x="48" y="200" width="560" height="60" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="230" r="18" fill="#17A8D4"/><text x="80.0" y="236.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="112.0" y="227.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Device ID</text>
<text x="112.0" y="249.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">idéntico en la cámara y en HikCentral</text>
<rect x="48" y="272" width="560" height="60" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="302" r="18" fill="#17A8D4"/><text x="80.0" y="308.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="112.0" y="299.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Clave ISUP</text>
<text x="112.0" y="321.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">la misma de los dos lados (ISUP 5.0)</text>
<rect x="48" y="344" width="560" height="60" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="374" r="18" fill="#17A8D4"/><text x="80.0" y="380.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="112.0" y="371.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Puerto 7660</text>
<text x="112.0" y="393.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">alcanzable desde la red de la cámara</text>
<rect x="648" y="128" width="504" height="48" rx="10" fill="#03213C"/><text x="664.0" y="157.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">Test-NetConnection 192.168.88.10 -Port 7660</text>
<rect x="648" y="196" width="504" height="118" rx="12" fill="#03213C"/><text x="664.0" y="218.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SI LLEGA</text><text x="664.0" y="245.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">ComputerName     : 192.168.88.10</text><text x="664.0" y="271.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">RemotePort       : 7660</text><text x="664.0" y="297.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE0C0" text-anchor="start">TcpTestSucceeded : True</text>
<rect x="648" y="340" width="504" height="92" rx="12" fill="#03213C"/><text x="664.0" y="362.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SI NO LLEGA</text><text x="664.0" y="389.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">RemotePort       : 7660</text><text x="664.0" y="415.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFB4A3" text-anchor="start">TcpTestSucceeded : False</text>
<rect x="48" y="444" width="560" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="456" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="478.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">False: es red, no es la cámara</tspan></text><text x="74.0" y="504.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si da False, el problema está en el camino: firewall del</tspan><tspan x="74.0" dy="21.6">servidor, ruta o VPN. Antes de tocar la cámara, que el puerto</tspan><tspan x="74.0" dy="21.6">conteste.</tspan></text>
<rect x="648" y="456" width="504" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="648" y="468" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="674.0" y="490.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="674.0" dy="0.0">Probalo desde una PC de la misma red que la cámara, no</tspan><tspan x="674.0" dy="21.6">desde el propio servidor.</tspan></text>
