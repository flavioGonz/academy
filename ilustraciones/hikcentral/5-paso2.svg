<rect x="560.7" y="376.0" width="78.6" height="27" rx="13.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="600.0" y="395.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#0E8F5E" text-anchor="middle">iguales</text>
<rect x="48" y="452" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="464" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="486.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Del lado del SYS, primero</tspan></text><text x="74.0" y="513.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Antes de cargar la cámara, el SYS tiene que aceptar ISUP:</tspan><tspan x="74.0" dy="21.6">System &gt; Network &gt; Device Access Protocol &gt; Allow ISUP</tspan><tspan x="74.0" dy="21.6">Registration.</tspan></text>
<rect x="612" y="452" width="540" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="464" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="486.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">La cámara llama</tspan></text><text x="638.0" y="513.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Server address es la IP del SYS que la cámara alcanza. El</tspan><tspan x="638.0" dy="21.6">equipo sale hacia el 7660: no hace falta abrir nada hacia</tspan><tspan x="638.0" dy="21.6">la cámara.</tspan></text>
<text x="48.0" y="644.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#B45309" text-anchor="start">Rutas de menú de V2.x; en V3.x pueden cambiar de nombre.</text>
