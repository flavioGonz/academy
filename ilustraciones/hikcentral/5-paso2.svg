<rect x="632" y="124" width="520" height="300" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M632 138a14 14 0 0 1 14 -14h492a14 14 0 0 1 14 14v26h-520z" fill="#E5F0FB"/><circle cx="652" cy="144" r="5" fill="#C2D4E6"/><circle cx="670" cy="144" r="5" fill="#C2D4E6"/><circle cx="688" cy="144" r="5" fill="#C2D4E6"/><text x="708.0" y="150.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">HikCentral · Add Encoding Device</text><text x="652.0" y="194.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Access Protocol</text><text x="1132.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Hikvision ISUP</text><text x="652.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Adding mode</text><text x="1132.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Device ID</text><text x="652.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Device ID</text><text x="1132.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">LAB-CAM-01</text><text x="652.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">ISUP 5.0: clave</text><text x="1132.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ejemplo.2026!</text><text x="652.0" y="346.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Add Resource to Area</text><text x="1132.0" y="346.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">on</text>
