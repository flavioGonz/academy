<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Típica para un servidor, personalizada para separar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Típica para un servidor, personalizada para separar</text>
<rect x="48" y="124" width="540" height="380" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Instalación típica</text>
<rect x="72" y="174" width="492" height="196" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<text x="92.0" y="204.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="start" letter-spacing="1.5">UNA PC</text>
<rect x="92.0" y="231.0" width="127.4" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="155.7" y="252.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">SYS (gestión)</text>
<rect x="328.0" y="231.0" width="127.4" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="391.7" y="252.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">Base de datos</text>
<rect x="92.0" y="283.0" width="159.2" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="171.6" y="304.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">Streaming Gateway</text>
<rect x="328.0" y="283.0" width="135.3" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="395.6" y="304.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">Control Client</text>
<text x="92.0" y="352.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Todo menos el Streaming Server.</text>
<text x="72.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Para el laboratorio y la mayoría de las obras:</text>
<text x="72.0" y="436.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">un servidor con SYS, base y clientes.</text>
<rect x="612" y="124" width="540" height="380" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Instalación personalizada</text>
<rect x="636" y="174" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="656.0" y="204.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">PC 1</text>
<rect x="656.0" y="231.0" width="47.9" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="679.9" y="252.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">SYS</text>
<rect x="898" y="174" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="918.0" y="204.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">PC 2</text>
<rect x="918.0" y="231.0" width="151.2" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="993.6" y="252.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">Streaming Server</text>
<text x="636.0" y="336.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Elegís módulos y carpetas.</text>
<text x="636.0" y="366.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">SYS y Streaming Server nunca en la misma PC.</text>
<text x="636.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Acá también se decide Normal o</text>
<text x="636.0" y="436.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Mirror Hot Spare (servidor de respaldo).</text>
<rect x="48" y="528" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="540" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="562.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Siempre como administrador</tspan></text><text x="74.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Clic derecho &gt; Ejecutar como administrador. Sin permisos de administrador, la instalación falla. Si el asistente pide</tspan><tspan x="74.0" dy="21.6">reiniciar, reiniciá.</tspan></text>
</svg>