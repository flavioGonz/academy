<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Asistencia: primero la hora, después los turnos</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Asistencia: primero la hora, después los turnos</text>
<rect x="48" y="132" width="262" height="150" rx="14" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<circle cx="80" cy="166" r="18" fill="#B45309"/><text x="80.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
<text x="108.0" y="173.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Hora y zona</text>
<text x="68.0" y="216.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">SYS y controladoras iguales</tspan></text>
<path d="M312.0 207.0L328.0 207.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="132" width="262" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="362" cy="166" r="18" fill="#17A8D4"/><text x="362.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="390.0" y="173.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Puntos de marca</text>
<text x="350.0" y="216.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="350.0" dy="0.0">qué lectoras: entrada,</tspan><tspan x="350.0" dy="21.6">salida o ambas</tspan></text>
<path d="M594.0 207.0L610.0 207.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="132" width="262" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="644" cy="166" r="18" fill="#17A8D4"/><text x="644.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="672.0" y="173.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Regla general</text>
<text x="632.0" y="216.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">fin de semana y ausencias</tspan></text>
<path d="M876.0 207.0L892.0 207.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="132" width="262" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="926" cy="166" r="18" fill="#17A8D4"/><text x="926.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="954.0" y="173.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Plantilla de turno</text>
<text x="914.0" y="216.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="914.0" dy="0.0">Normal o Man-Hour</tspan></text>
<rect x="48" y="308" width="262" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="342" r="18" fill="#17A8D4"/><text x="80.0" y="348.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="108.0" y="349.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Turno</text>
<text x="68.0" y="392.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">repetir por semana</tspan></text>
<path d="M312.0 383.0L328.0 383.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="308" width="262" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="362" cy="342" r="18" fill="#17A8D4"/><text x="362.0" y="348.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="390.0" y="349.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Asignar</text>
<text x="350.0" y="392.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="350.0" dy="0.0">a personas, con fechas</tspan></text>
<path d="M594.0 383.0L610.0 383.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="308" width="262" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="644" cy="342" r="18" fill="#17A8D4"/><text x="644.0" y="348.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="672.0" y="349.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Registros</text>
<text x="632.0" y="392.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">al día siguiente</tspan></text>
<rect x="894" y="308" width="258" height="150" rx="14" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="914.0" y="344.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">La plataforma calcula</text>
<text x="914.0" y="372.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">con la hora del servidor</text>
<text x="914.0" y="396.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y no maneja múltiples</text>
<text x="914.0" y="420.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">zonas horarias.</text>
<rect x="48" y="492" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="504" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La receta, en orden</tspan></text><text x="74.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Receta del soporte de Hikvision USA: controladora y personas con credenciales, puntos de marca, regla general, plantilla,</tspan><tspan x="74.0" dy="21.6">turno, asignación y registros. Las mismas lectoras de acceso hacen de reloj.</tspan></text>
<text x="48.0" y="640.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0A63B8" text-anchor="start">Primero la hora, después los turnos.</text>
</svg>