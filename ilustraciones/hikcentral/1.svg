<rect x="752" y="138" width="400" height="64" rx="14" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/>
<text x="774.0" y="176.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#B45309" text-anchor="start">VSM217: Control Client de otra versión</text>
