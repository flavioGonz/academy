<rect x="752" y="456" width="400" height="64" rx="14" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/>
<text x="774.0" y="494.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#B45309" text-anchor="start">Cámara offline en la plataforma</text>
<text x="752.0" y="116.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">SÍNTOMA TÍPICO DE ESA CAPA</text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">El Streaming Gateway viene dentro del SYS y, según el FAQ, sirve hasta 200 cámaras reenviadas.</text>
<text x="48.0" y="592.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Por eso el Streaming Server va en otra máquina: nunca junto al SYS.</text>
<text x="48.0" y="636.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#0A63B8" text-anchor="start">Antes de diagnosticar: equipo, SYS, streaming o cliente.</text>
