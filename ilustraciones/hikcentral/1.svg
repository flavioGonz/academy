<text x="72.0" y="270.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Streaming Server</text>
<text x="72.0" y="300.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">otra máquina, solo si hace falta</text>
