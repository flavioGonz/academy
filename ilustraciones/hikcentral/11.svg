<text x="72.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">recursos y aplicaciones</text>
<text x="72.0" y="346.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="start">No se editan ni se borran.</text>
