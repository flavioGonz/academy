<rect x="396" y="182" width="472" height="52" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="414.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Vigencia</text>
<text x="850.0" y="214.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="end">hoy a fin de año</text>
<rect x="396" y="246" width="472" height="52" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="414.0" y="278.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Horario de permisos</text>
<text x="850.0" y="278.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="end">todos los días 19:00 a 07:00</text>
