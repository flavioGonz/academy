<text x="414.0" y="342.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Áreas visibles</text>
<text x="850.0" y="342.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="end">solo Depósito</text>
