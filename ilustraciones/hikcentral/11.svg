<rect x="916" y="352" width="236" height="93" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="916" y="364" width="5" height="69" rx="2.5" fill="#B45309"/><text x="942.0" y="386.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="942.0" dy="0.0">Rol vencido o fuera de</tspan><tspan x="942.0" dy="20.2">horario: el usuario es</tspan><tspan x="942.0" dy="20.2">expulsado.</tspan></text>
<rect x="48" y="384" width="300" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="396" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="74.0" y="418.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Endurecer</tspan></text><text x="74.0" y="444.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Contraseña mínima: subila de</tspan><tspan x="74.0" dy="20.2">Medium a Strong.</tspan></text>
<text x="48.0" y="580.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0A63B8" text-anchor="start">Cada persona su usuario, cada usuario el rol mínimo.</text>
<text x="48.0" y="616.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">Datos del rol de ejemplo del laboratorio. Ruta en V2.x: Account and Security &gt; Roles.</text>
