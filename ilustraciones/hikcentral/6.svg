<text x="48.0" y="548.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">En el alta, activá Add Resource to Area. Si te lo olvidaste, importá los canales desde el área.</text>
<text x="48.0" y="588.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0A63B8" text-anchor="start">El árbol de áreas se diseña antes de dar de alta el primer equipo.</text>
