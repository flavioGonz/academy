<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Nada llega a la puerta hasta que aplicás</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Nada llega a la puerta hasta que aplicás</text>
<rect x="48" y="140" width="270" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(70 160) scale(1.3)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
<text x="112.0" y="182.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Persona</text>
<text x="70.0" y="226.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">Prueba Lab · ID 9001</text>
<text x="70.0" y="258.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="70.0" dy="0.0">con credencial: tarjeta,</tspan><tspan x="70.0" dy="20.2">huella, rostro, PIN o QR</tspan></text>
<path d="M320.0 225.0L346.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="348" y="140" width="270" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(370 160) scale(1.3)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/></g>
<text x="412.0" y="182.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Nivel de acceso</text>
<text x="370.0" y="226.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">Oficina hábil</text>
<text x="370.0" y="258.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="370.0" dy="0.0">puertas + plantilla de</tspan><tspan x="370.0" dy="20.2">horario</tspan></text>
<path d="M620.0 225.0L646.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="648" y="140" width="270" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(670 160) scale(1.3)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></g>
<text x="712.0" y="182.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Asignación</text>
<text x="670.0" y="226.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">a la persona</text>
<text x="670.0" y="258.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="670.0" dy="0.0">o a un departamento entero</tspan></text>
<path d="M920.0 225.0L946.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="948" y="140" width="204" height="170" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="968.0" y="182.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">Aplicar</text>
<text x="968.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">a los dispositivos</text>
<text x="968.0" y="252.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">recién acá viaja</text>
<text x="968.0" y="274.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">a la controladora</text>
<rect x="948" y="370" width="204" height="84" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="3"/><g transform="translate(968 396.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/><circle cx="15" cy="12" r="1"/></g><text x="1012.0" y="408.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Controladora</text><text x="1012.0" y="431.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Puerta Lab</text>
<path d="M1050.0 312.0C1050.0 343.9,1050.0 338.1,1050.0 370.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="350" width="870" height="170" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="68.0" y="382.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Si no aplicaste</text>
<text x="72.0" y="412.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">La plataforma muestra el permiso, pero la controladora no lo tiene: la tarjeta no abre.</text>
<text x="72.0" y="444.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Al lado de Apply aparece un ícono de pendiente.</text>
<text x="72.0" y="476.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Si el aplicado falla, Access Control Test muestra en qué quedó.</text>
<text x="48.0" y="580.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Alta de personas: en la plataforma, y de ahí a los equipos. Una sola fuente de verdad.</text>
<text x="48.0" y="616.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">Plantilla de ejemplo del laboratorio: lunes a viernes, 08:00 a 19:00.</text>
</svg>