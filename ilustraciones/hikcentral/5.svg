<text x="620.0" y="336.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">equipo → SYS</text>
<text x="444.0" y="488.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Sin IP fija: alcanza con salida.</text>
<text x="444.0" y="518.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">puerto 7660 · Device ID + clave</text>
<rect x="800" y="124" width="352" height="420" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="820.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Por Hik-Connect</text>
<text x="820.0" y="182.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Los dos pasan por la nube</text>
<rect x="824" y="214" width="140" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(844 240.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="888.0" y="262.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">SYS</text>
<rect x="988" y="214" width="140" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(1008 240.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="1052.0" y="262.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Nube</text>
<rect x="824" y="360" width="304" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(844 386.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 15 5l2 5-12 3.5z"/><path d="m17 10 3.5 1.5M9 13l1 4M6 17h8"/></g><text x="888.0" y="398.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Cámara o NVR</text><text x="888.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Hik-Connect activo</text>
<path d="M1058.0 360.0C1058.0 325.9,1058.0 332.1,1058.0 298.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M988.0 256.0C976.0 256.0,976.0 256.0,964.0 256.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="820.0" y="488.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Serie y código de verificación.</text>
<text x="820.0" y="518.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="start">no graba en Hybrid SAN ni Cloud</text>
<text x="48.0" y="586.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">IP fija y ruta, por IP. Sin IP fija, ISUP. Hik-Connect, solo si aceptás sus límites de grabación.</text>
<text x="48.0" y="622.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Para equipos de otras marcas, ONVIF. Abrir el 8000 o el 80 a internet: no.</text>
