<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres formas de alta: fijate quién llama a quién</text>
<rect x="48" y="124" width="352" height="420" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Por IP o dominio</text>
<text x="68.0" y="182.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">El SYS entra al equipo</text>
