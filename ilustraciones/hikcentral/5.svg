<text x="68.0" y="488.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Hace falta IP fija y ruta al equipo.</text>
<text x="68.0" y="518.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">puerto 8000 · 8443 cifrado</text>
