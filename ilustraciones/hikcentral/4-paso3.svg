<text x="48.0" y="572.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">La ruta de origen es de ejemplo: usá la que muestra la pestaña Back Up de tu servidor.</text>
<text x="48.0" y="612.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Después, abrí la carpeta de destino y fijate que estén los archivos con fecha de hoy.</text>
