<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Antes de tocar el servidor: backup afuera y licencia libre</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Antes de tocar el servidor: backup afuera y licencia libre</text>
<rect x="48" y="132" width="206" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="166" r="18" fill="#17A8D4"/><text x="80.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="68.0" y="214.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Backup ahora</text>
<text x="68.0" y="244.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Back Up Now</text>
<path d="M256.0 202.0L270.0 202.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="272" y="132" width="206" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="304" cy="166" r="18" fill="#17A8D4"/><text x="304.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="292.0" y="214.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Copia afuera</text>
<text x="292.0" y="244.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">otra máquina, verificada</text>
<path d="M480.0 202.0L494.0 202.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="496" y="132" width="206" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="528" cy="166" r="18" fill="#17A8D4"/><text x="528.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="516.0" y="214.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Desactivar licencia</text>
<text x="516.0" y="244.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">online u offline</text>
<path d="M704.0 202.0L718.0 202.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="720" y="132" width="206" height="140" rx="14" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<circle cx="752" cy="166" r="18" fill="#17A8D4"/><text x="752.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="740.0" y="214.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Cambiar o migrar</text>
<text x="740.0" y="244.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">disco, servidor, VM</text>
<path d="M928.0 202.0L942.0 202.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="944" y="132" width="206" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="976" cy="166" r="18" fill="#17A8D4"/><text x="976.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="964.0" y="214.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Reactivar y revisar</text>
<text x="964.0" y="244.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">licencia y servicios</text>
<rect x="48" y="304" width="540" height="236" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="336.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Si cambiás hardware sin desactivar</text>
<circle cx="77" cy="374.7" r="4.5" fill="#D2492F"/><text x="92.0" y="380.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">En máquina física la licencia queda atada al hardware:</tspan><tspan x="92.0" dy="21.6">se invalida.</tspan></text><circle cx="77" cy="427.9" r="4.5" fill="#D2492F"/><text x="92.0" y="433.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">El SYS alterna entre Starting y Stopped en Service</tspan><tspan x="92.0" dy="21.6">Manager.</tspan></text><circle cx="77" cy="481.1" r="4.5" fill="#D2492F"/><text x="92.0" y="486.4" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">En el servidor nuevo, el código da 1108: ya está usado</tspan><tspan x="92.0" dy="21.6">en otro SYS.</tspan></text>
<rect x="612" y="304" width="540" height="236" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="632.0" y="336.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Si el backup quedó solo en el SYS</text>
<circle cx="641" cy="374.7" r="4.5" fill="#D2492F"/><text x="656.0" y="380.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">El backup programado se guarda en el propio servidor</tspan><tspan x="656.0" dy="21.6">SYS.</tspan></text><circle cx="641" cy="427.9" r="4.5" fill="#D2492F"/><text x="656.0" y="433.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Si muere el disco, se lleva el sistema y sus backups.</tspan></text><circle cx="641" cy="459.5" r="4.5" fill="#0E8F5E"/><text x="656.0" y="464.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Por eso se copia a otra máquina y se prueba que abra.</tspan></text>
<text x="48.0" y="586.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Migrar la VM del SYS con vMotion o similar también rompe la verificación de licencia.</text>
<text x="48.0" y="622.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0A63B8" text-anchor="start">Antes de tocar el servidor: backup afuera y licencia desactivada. Siempre.</text>
</svg>