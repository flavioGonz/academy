<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada cámara graba en el sitio o en el centro</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada cámara graba en el sitio o en el centro</text>
<rect x="48" y="140" width="420" height="360" rx="22" fill="none" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="7 7"/><rect x="66" y="126" width="94" height="28" rx="14" fill="#F7FAFD"/><text x="78.0" y="146.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">SUCURSAL</text>
<rect x="78" y="180" width="200" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(98 206.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 15 5l2 5-12 3.5z"/><path d="m17 10 3.5 1.5M9 13l1 4M6 17h8"/></g><text x="142.0" y="218.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">CAM-01</text><text x="142.0" y="241.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">alta por IP</text>
<rect x="78" y="330" width="360" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(98 356.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="142.0" y="368.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">NVR del sitio</text><text x="142.0" y="391.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">graba en el equipo</text>
<path d="M178.0 264.0C178.0 300.3,178.0 293.7,178.0 330.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="178.0" cy="264.0" r="5" fill="#0A63B8"/><circle cx="178.0" cy="330.0" r="5" fill="#0A63B8"/>
<text x="78.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">No depende del enlace al centro.</text>
<rect x="732" y="140" width="420" height="360" rx="22" fill="none" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="7 7"/><rect x="750" y="126" width="77" height="28" rx="14" fill="#F7FAFD"/><text x="762.0" y="146.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">CENTRO</text>
<rect x="762" y="176" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="782.0" y="203.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">pStor</text>
<text x="782.0" y="226.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">servicio que administra discos de un servidor</text>
<rect x="762" y="250" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="782.0" y="277.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">pStor Cluster</text>
<text x="782.0" y="300.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">varios pStor juntos</text>
<rect x="762" y="324" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="782.0" y="351.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Hybrid SAN</text>
<text x="782.0" y="374.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">equipo de almacenamiento de Hikvision</text>
<rect x="762" y="398" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="782.0" y="425.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Cloud Storage Server</text>
<text x="782.0" y="448.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">servidor de almacenamiento</text>
<path d="M468.0 220.0C600.0 220.0,600.0 220.0,732.0 220.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="468.0" cy="220.0" r="5" fill="#0A63B8"/><circle cx="732.0" cy="220.0" r="5" fill="#0A63B8"/><rect x="520.2" y="189.0" width="159.6" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="600.0" y="208.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">enlace al centro</text>
<text x="498.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">El video viaja por el enlace:</text>
<text x="498.0" y="292.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">si es chico o inestable,</text>
<text x="498.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">mejor en el sitio.</text>
<rect x="48" y="528" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="540" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="562.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Límites que deciden</tspan></text><text x="74.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Por dominio o Hik-Connect no se graba en Hybrid SAN ni en</tspan><tspan x="74.0" dy="21.6">Cloud Storage. pStor Cluster no hace grabación por</tspan><tspan x="74.0" dy="21.6">movimiento.</tspan></text>
<rect x="612" y="528" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="540" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="562.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Regla</tspan></text><text x="638.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Se decide por cámara, por escrito, antes del alta.</tspan><tspan x="638.0" dy="21.6">Cambiarla después no mueve el video viejo.</tspan></text>
</svg>