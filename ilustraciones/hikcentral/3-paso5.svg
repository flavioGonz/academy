<rect x="852" y="150" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(872 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="916.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">PC con internet</text><text x="916.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">kms.hikvision.com</text>
<path d="M348.0 175.0C600.0 175.0,600.0 175.0,852.0 175.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="481.5" y="144.0" width="237.0" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="600.0" y="163.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">ActivationRequestFile.bin</text>
<path d="M852.0 210.0C600.0 210.0,600.0 210.0,348.0 210.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="477.2" y="225.0" width="245.6" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="600.0" y="244.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">ActivationResponseFile.bin</text>
<text x="600.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="middle">en un pendrive, ida y vuelta</text>
<rect x="48" y="326" width="264" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="360" r="18" fill="#17A8D4"/><text x="80.0" y="366.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="108.0" y="367.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Generate Request File</text>
<text x="68.0" y="404.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">un solo clic: un segundo</tspan><tspan x="68.0" dy="21.6">clic invalida el primer</tspan><tspan x="68.0" dy="21.6">pedido</tspan></text>
<rect x="330" y="326" width="264" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="362" cy="360" r="18" fill="#17A8D4"/><text x="362.0" y="366.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="390.0" y="367.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Subir el pedido</text>
<text x="350.0" y="404.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="350.0" dy="0.0">en kms.hikvision.com,</tspan><tspan x="350.0" dy="21.6">sección de activación</tspan></text>
<rect x="612" y="326" width="264" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="644" cy="360" r="18" fill="#17A8D4"/><text x="644.0" y="366.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="672.0" y="367.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Bajar la respuesta</text>
<text x="632.0" y="404.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">el .bin que corresponde a</tspan><tspan x="632.0" dy="21.6">ese pedido</tspan></text>
<rect x="894" y="326" width="264" height="150" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="926" cy="360" r="18" fill="#17A8D4"/><text x="926.0" y="366.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="954.0" y="367.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Import y Activate</text>
<text x="914.0" y="404.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="914.0" dy="0.0">y cargar el email del admin</tspan></text>
<rect x="48" y="500" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Todo dentro de las 24 horas</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si pasan más de 24 horas, o importás una respuesta de otro</tspan><tspan x="74.0" dy="21.6">pedido, falla con 1105. Se genera un pedido nuevo.</tspan></text>
<rect x="612" y="500" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">La hora del SYS, en hora</tspan></text><text x="638.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con más de 24 horas de diferencia con la hora real, la</tspan><tspan x="638.0" dy="21.6">activación offline falla (Operation timeout).</tspan></text>
</svg>