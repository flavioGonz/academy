<text x="48.0" y="420.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Las marcas del medio quedan en el registro; el cálculo usa la primera y la última del día. Horas de ejemplo.</text>
<rect x="48" y="452" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="464" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="486.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Normal</tspan></text><text x="74.0" y="513.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Exige entrar y salir dentro de ventanas válidas. Sirve</tspan><tspan x="74.0" dy="21.6">cuando el horario es rígido.</tspan></text>
<rect x="612" y="452" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="464" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="486.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Man-Hour</tspan></text><text x="638.0" y="513.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Más flexible: no exige ventana de entrada y salida. El</tspan><tspan x="638.0" dy="21.6">cálculo más usado es primera entrada y última salida.</tspan></text>
