<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Los códigos de activación que más aparecen</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Los códigos de activación que más aparecen</text>
<rect x="48" y="124" width="1104" height="378" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 136a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v42h-1104z" fill="#E5F0FB"/><text x="62.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CÓDIGO</text><text x="192.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ PASÓ</text><text x="732.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ HACER</text><text x="62.0" y="210.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1103</text><text x="192.0" y="210.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">El SYS no llega al servidor de licencias, o está caído</text><text x="732.0" y="210.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Revisar internet o pasar a offline</text><path d="M60 232H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="264.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1105</text><text x="192.0" y="264.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">La respuesta no corresponde al pedido, o pasaron 24 h</text><text x="732.0" y="264.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Generar un pedido nuevo, un solo clic</text><path d="M60 286H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="318.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1108</text><text x="192.0" y="318.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Código ya usado en otro SYS</text><text x="732.0" y="318.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Desactivar primero en el servidor viejo</text><path d="M60 340H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="372.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1113</text><text x="192.0" y="372.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Expansión sin licencia base</text><text x="732.0" y="372.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Activar primero la base</text><path d="M60 394H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="426.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1114</text><text x="192.0" y="426.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Se modificó la hora del SYS</text><text x="732.0" y="426.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Volver a la hora correcta</text><path d="M60 448H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="480.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1116</text><text x="192.0" y="480.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Más recursos que los licenciados</text><text x="732.0" y="480.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Licenciar según los recursos actuales</text>
<text x="48.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">Fuente: FAQ V2.5.500. 1108 también aparece si la versión de la licencia no corresponde a la del sistema.</text>
<rect x="48" y="566" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="578" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Anotá en la ficha de la obra qué código salió y cuándo: le ahorra tiempo al próximo técnico.</tspan></text>
</svg>