<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Puerto en rojo: averiguá quién lo tiene tomado</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Puerto en rojo: averiguá quién lo tiene tomado</text>
<rect x="48" y="130" width="520" height="48" rx="10" fill="#03213C"/><text x="64.0" y="159.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">netstat -ano | findstr :80</text>
<circle cx="48" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="48.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">La última columna es el PID del proceso que escucha.</text>
<rect x="48" y="228" width="520" height="48" rx="10" fill="#03213C"/><text x="64.0" y="257.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">TCP  0.0.0.0:80  …  LISTENING  4321</text>
<rect x="632" y="130" width="520" height="48" rx="10" fill="#03213C"/><text x="648.0" y="159.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">tasklist | findstr 4321</text>
<text x="632.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Con el PID, el nombre del programa.</text>
<rect x="632" y="228" width="520" height="48" rx="10" fill="#03213C"/><text x="648.0" y="257.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">otro-programa.exe   4321 …</text>
<path d="M574.0 240.0L626.0 172.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="48.0" y="334.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Dos salidas, según lo que diga el cliente:</text>
<rect x="48" y="360" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="372" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">A. Cerrar el proceso, con autorización</tspan></text><text x="74.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si ese programa no hace falta en el servidor, lo cerrás o</tspan><tspan x="74.0" dy="21.6">lo desinstalás. Antes, pedí permiso: puede ser otro</tspan><tspan x="74.0" dy="21.6">servicio del cliente.</tspan></text>
<rect x="612" y="360" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="372" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">B. Cambiar el puerto del SYS</tspan></text><text x="638.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Cambiás el puerto del servicio en Service Manager y entrás</tspan><tspan x="638.0" dy="21.6">con el puerto en la URL.</tspan></text>
<rect x="612" y="500" width="540" height="48" rx="10" fill="#03213C"/><text x="628.0" y="530.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#9FE0C0" text-anchor="start">http://192.168.88.10:81</text>
</svg>