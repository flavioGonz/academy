<rect x="48" y="470" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="482" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La regla del chequeo</tspan></text><text x="74.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si la columna Alta por dice dominio o Hik-Connect, la</tspan><tspan x="74.0" dy="21.6">columna Graba en no puede decir Hybrid SAN ni Cloud</tspan><tspan x="74.0" dy="21.6">Storage.</tspan></text>
<rect x="612" y="470" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="482" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cómo se arregla</tspan></text><text x="638.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">O cambiás el alta a IP o ISUP, o la cámara graba en el NVR</tspan><tspan x="638.0" dy="21.6">del sitio. Por dominio, solo graba en el propio equipo.</tspan></text>
