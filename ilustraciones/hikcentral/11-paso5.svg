<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>HTTPS propio: certificado y clave en un .pem</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">HIKCENTRAL · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">HTTPS propio: certificado y clave en un .pem</text>
<rect x="48" y="150" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">certificado.crt</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">firmado por una CA</text>
<rect x="48" y="270" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 296.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/></g><text x="112.0" y="308.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">clave privada</text><text x="112.0" y="331.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">exportada en texto</text>
<rect x="436" y="136" width="400" height="208" rx="12" fill="#03213C"/><text x="452.0" y="158.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">HIKCENTRAL.PEM</text><text x="452.0" y="186.8" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">-----BEGIN CERTIFICATE-----</text><text x="452.0" y="214.8" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#9FC3E3" text-anchor="start">(contenido del .crt)</text><text x="452.0" y="242.8" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">-----END CERTIFICATE-----</text><text x="452.0" y="270.8" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">-----BEGIN PRIVATE KEY-----</text><text x="452.0" y="298.8" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#9FC3E3" text-anchor="start">(clave privada exportada)</text><text x="452.0" y="326.8" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">-----END PRIVATE KEY-----</text>
<path d="M348.0 192.0C390.0 192.0,390.0 210.0,432.0 210.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M348.0 312.0C390.0 312.0,390.0 300.0,432.0 300.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="904" y="200" width="248" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(924 226.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="968.0" y="238.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">HikCentral</text><text x="968.0" y="261.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">subir el .pem</text>
<text x="904.0" y="316.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#41627F" text-anchor="start">System &gt; Advanced &gt; Transfer</text>
<path d="M838.0 242.0C871.0 242.0,871.0 242.0,904.0 242.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="412" width="540" height="120" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="68.0" y="444.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Con el certificado embebido</text>
<text x="72.0" y="476.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">El navegador muestra &quot;No seguro&quot;.</text>
<rect x="612" y="412" width="540" height="120" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="444.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Con el .pem firmado por una CA</text>
<text x="636.0" y="476.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Sin advertencia, si los puestos confían en esa CA.</text>
<rect x="48" y="552" width="1104" height="75" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="564" width="5" height="51" rx="2.5" fill="#D2492F"/><text x="74.0" y="586.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La clave privada no se manda por correo ni se pega en conversores online con datos de un cliente: armá el .pem en una PC de</tspan><tspan x="74.0" dy="21.6">confianza. Ruta de V2.x.</tspan></text>
</svg>