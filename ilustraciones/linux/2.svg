<text x="72.0" y="412.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">rw- = 4+2 = 6</text>
<text x="300.0" y="412.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">r-- = 4</text>
