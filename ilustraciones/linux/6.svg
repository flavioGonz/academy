<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La escalera de red: el primer escalón que falla</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La escalera de red: el primer escalón que falla</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="500" width="212" height="100" rx="12" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="76" cy="530" r="16" fill="#17A8D4"/><text x="76.0" y="535.8" font-family="Familjen Grotesk" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="102.0" y="536.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Interfaz con IP</text>
<text x="64.0" y="564.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">ip -br addr</text>
<text x="64.0" y="586.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">ip route</text>
<rect x="270" y="420" width="212" height="180" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="298" cy="450" r="16" fill="#17A8D4"/><text x="298.0" y="455.8" font-family="Familjen Grotesk" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="324.0" y="456.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Gateway</text>
<text x="286.0" y="484.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">ping -c3 192.168.88.1</text>
<rect x="492" y="340" width="212" height="260" rx="12" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="520" cy="370" r="16" fill="#17A8D4"/><text x="520.0" y="375.8" font-family="Familjen Grotesk" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="546.0" y="376.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">IP pública</text>
<text x="508.0" y="404.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">ping -c3 1.1.1.1</text>
<rect x="714" y="260" width="212" height="340" rx="12" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2"/>
<circle cx="742" cy="290" r="16" fill="#17A8D4"/><text x="742.0" y="295.8" font-family="Familjen Grotesk" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="768.0" y="296.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Nombre (DNS)</text>
<text x="730.0" y="324.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">dig debian.org +short</text>
<rect x="936" y="180" width="212" height="420" rx="12" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="964" cy="210" r="16" fill="#17A8D4"/><text x="964.0" y="215.8" font-family="Familjen Grotesk" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="990.0" y="216.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Puerto y servicio</text>
<text x="952.0" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">ss -tlnp · curl -sI</text>
<text x="52.0" y="628.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="52.0" dy="0.0">Si falla: cable, DHCP o IP</tspan><tspan x="52.0" dy="20.2">fija</tspan></text>
<text x="274.0" y="628.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="274.0" dy="0.0">Si falla: VLAN, gateway</tspan><tspan x="274.0" dy="20.2">mal cargado</tspan></text>
<text x="496.0" y="628.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="496.0" dy="0.0">Si falla: ruta o salida</tspan><tspan x="496.0" dy="20.2">del router</tspan></text>
<text x="718.0" y="628.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start"><tspan x="718.0" dy="0.0">Si falla: revisá los</tspan><tspan x="718.0" dy="20.2">nameservers</tspan></text>
<text x="940.0" y="628.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="940.0" dy="0.0">Si falla: servicio caído o</tspan><tspan x="940.0" dy="20.2">filtrado</tspan></text>
<rect x="48" y="124" width="520" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="136" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Sin saltear escalones</tspan></text><text x="74.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Subí de abajo hacia arriba y anotá cada escalón. Si la IP</tspan><tspan x="74.0" dy="21.6">pública responde y el nombre no, es DNS.</tspan></text>
</svg>