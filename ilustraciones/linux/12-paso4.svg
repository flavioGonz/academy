<rect x="48" y="124" width="640" height="184" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SERVIDOR · EJEMPLO</text><text x="64.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo docker run -d -p 127.0.0.1:8081:80 nginx</text><text x="64.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo ss -tlnp | grep 8081</text><text x="64.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#5BD69B" text-anchor="start">LISTEN 127.0.0.1:8081  docker-proxy</text><text x="64.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">curl -sI 127.0.0.1:8081 | head -1</text><text x="64.0" y="288.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#5BD69B" text-anchor="start">HTTP/1.1 200 OK</text>
