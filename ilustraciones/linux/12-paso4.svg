<rect x="48" y="336" width="640" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="348" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="370.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Para los datos, un volumen: docker volume create datos-prueba y docker</tspan><tspan x="74.0" dy="21.6">volume inspect muestra su Mountpoint.</tspan></text>
<rect x="48" y="440" width="640" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="452" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">No pongas &quot;iptables&quot;: false en Docker: rompe la red de los contenedores</tspan><tspan x="74.0" dy="21.6">y deja sus puertos accesibles desde la red local.</tspan></text>
