<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Copia, archivo propio, validación y recién ahí reload</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Copia, archivo propio, validación y recién ahí reload</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="250" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="166" r="18" fill="#17A8D4"/><text x="82.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="173.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Copia</text>
<text x="68.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">sshd_config.original</text>
<text x="68.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">chmod a-w: nadie la pisa</tspan></text>
<path d="M302 223H324" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="330" y="128" width="250" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="364" cy="166" r="18" fill="#17A8D4"/><text x="364.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="173.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Cambio en .d</text>
<text x="350.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">sshd_config.d/</text>
<text x="350.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="350.0" dy="0.0">en 10-ies.conf: el</tspan><tspan x="350.0" dy="21.6">original queda intacto</tspan></text>
<path d="M584 223H606" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="612" y="128" width="250" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="646" cy="166" r="18" fill="#17A8D4"/><text x="646.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="674.0" y="173.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Validación</text>
<text x="632.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">sudo sshd -t</text>
<text x="632.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">sin salida = está bien</tspan></text>
<path d="M866 223H888" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="894" y="128" width="250" height="190" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="928" cy="166" r="18" fill="#0E8F5E"/><text x="928.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="956.0" y="173.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Recarga</text>
<text x="914.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">systemctl reload ssh</text>
<text x="914.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="914.0" dy="0.0">con otra sesión abierta</tspan></text>
<path d="M737 318V350H455V326" fill="none" stroke="#D2492F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<text x="490.0" y="372.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">error: te dice archivo y línea, corregís y volvés a validar</text>
<text x="48.0" y="424.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Cada servicio trae su validador</text>
<rect x="48" y="440" width="560" height="204" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 452a12 12 0 0 1 12 -12h536a12 12 0 0 1 12 12v22h-560z" fill="#E5F0FB"/><text x="62.0" y="462.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ CAMBIASTE</text><text x="362.0" y="462.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">VALIDÁ CON</text><text x="62.0" y="496.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">SSH</text><text x="362.0" y="496.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sudo sshd -t</text><path d="M60 508H596" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="530.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Red en Ubuntu (netplan)</text><text x="362.0" y="530.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sudo netplan generate</text><path d="M60 542H596" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="564.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Discos (/etc/fstab)</text><text x="362.0" y="564.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sudo findmnt -x</text><path d="M60 576H596" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="598.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">sudo (sudoers)</text><text x="362.0" y="598.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sudo visudo -c</text><path d="M60 610H596" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="632.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">nginx</text><text x="362.0" y="632.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sudo nginx -t</text>
<rect x="660" y="440" width="492" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="660" y="452" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="686.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="686.0" dy="0.0">Por qué un archivo .d</tspan></text><text x="686.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="686.0" dy="0.0">Tu cambio va en un archivo propio del directorio .d:</tspan><tspan x="686.0" dy="21.6">cuando el paquete se actualiza, no te lo pisa ni te</tspan><tspan x="686.0" dy="21.6">pregunta qué hacer.</tspan></text>
<rect x="660" y="568" width="492" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="660" y="580" width="5" height="51" rx="2.5" fill="#B45309"/><text x="686.0" y="602.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="686.0" dy="0.0">Un error en sshd_config con SSH como único acceso te</tspan><tspan x="686.0" dy="21.6">deja afuera.</tspan></text>
</svg>