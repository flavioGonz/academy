<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Mirá qué snippets hay antes de sumar el tuyo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Mirá qué snippets hay antes de sumar el tuyo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="640" height="134" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">ls -l /etc/ssh/sshd_config.d/</text><text x="64.0" y="208.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">-rw-r--r-- 1 root root  32 10-ies.conf</text><text x="64.0" y="238.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">-rw-r--r-- 1 root root  27 50-cloud-init.conf</text>
<rect x="716" y="124" width="436" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="716" y="136" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="742.0" y="158.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="742.0" dy="0.0">50-cloud-init.conf es un ejemplo de lo que</tspan><tspan x="742.0" dy="21.6">podés encontrar en una imagen de nube: leelo</tspan><tspan x="742.0" dy="21.6">con less antes de seguir.</tspan></text>
<text x="48.0" y="318.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Así arma sshd su configuración</text>
<rect x="48" y="340" width="640" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="78" cy="367" r="15" fill="#6E88A1"/><text x="78.0" y="372.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="106.0" y="364.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/ssh/sshd_config</text>
<text x="106.0" y="385.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">primera línea: Include sshd_config.d/*.conf</text>
<rect x="88" y="406" width="600" height="54" rx="12" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<circle cx="118" cy="433" r="15" fill="#17A8D4"/><text x="118.0" y="438.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="146.0" y="430.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">sshd_config.d/10-ies.conf</text>
<text x="146.0" y="451.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">el tuyo: número bajo, se lee primero</text>
<rect x="88" y="472" width="600" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="118" cy="499" r="15" fill="#6E88A1"/><text x="118.0" y="504.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="146.0" y="496.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">sshd_config.d/50-cloud-init.conf</text>
<text x="146.0" y="517.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">después, en orden alfabético</text>
<rect x="48" y="538" width="640" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="78" cy="565" r="15" fill="#6E88A1"/><text x="78.0" y="570.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="106.0" y="562.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">resto de /etc/ssh/sshd_config</text>
<text x="106.0" y="583.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">lo que queda del archivo principal</text>
<rect x="716" y="340" width="436" height="250" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="736.0" y="372.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">En OpenSSH gana el primer valor</text>
<text x="740.0" y="404.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="740.0" dy="0.0">Para la mayoría de las opciones, sshd se</tspan><tspan x="740.0" dy="23.0">queda con el primer valor que lee. Como el</tspan><tspan x="740.0" dy="23.0">Include está arriba, tu snippet gana sobre</tspan><tspan x="740.0" dy="23.0">el archivo principal, y 10-ies gana sobre</tspan><tspan x="740.0" dy="23.0">50-cloud-init.</tspan></text>
</svg>