<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>df dice dónde se llenó; du dice qué lo llenó</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">df dice dónde se llenó; du dice qué lo llenó</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="540" height="156" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">1 · QUÉ SISTEMA DE ARCHIVOS</text><text x="64.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">df -h</text><text x="64.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">Filesystem  Size  Used Avail Use% Mounted on</text><text x="64.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FF8A73" text-anchor="start">/dev/sda2    31G   30G  1,0G  97% /</text><text x="64.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">/dev/sdb1   492G  120G  347G  26% /srv/datos</text>
<rect x="612" y="124" width="540" height="156" rx="12" fill="#03213C"/><text x="628.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">2 · QUÉ CARPETA (DE A UN NIVEL)</text><text x="628.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="646.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo du -xh -d1 /var | sort -h | tail -3</text><text x="628.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">1,1G   /var/lib</text><text x="628.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFC861" text-anchor="start">6,8G   /var/log</text><text x="628.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">8,2G   /var</text>
<path d="M588 202.0H612" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="48.0" y="320.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Sospechosos de siempre</text>
<rect x="48" y="340" width="264" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
