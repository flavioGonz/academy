<text x="66.0" y="406.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">paquetes ya instalados</text>
<rect x="62" y="424" width="236" height="38" rx="10" fill="#03213C"/><text x="78.0" y="448.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">sudo apt-get clean</text>
<rect x="330" y="340" width="264" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="348.0" y="376.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">/var/log/journal</text>
<text x="348.0" y="406.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">el journal sin tope</text>
<rect x="344" y="424" width="236" height="38" rx="10" fill="#03213C"/><text x="360.0" y="448.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">SystemMaxUse=500M</text>
<rect x="612" y="340" width="264" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="630.0" y="376.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">/var/log</text>
<text x="630.0" y="406.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">logs de texto sin rotar</text>
<rect x="626" y="424" width="236" height="38" rx="10" fill="#03213C"/><text x="642.0" y="448.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">logrotate</text>
<rect x="894" y="340" width="264" height="140" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="912.0" y="376.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">/tmp</text>
<text x="912.0" y="406.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">en 26.04 vive en RAM</text>
<rect x="908" y="424" width="236" height="38" rx="10" fill="#03213C"/><text x="924.0" y="448.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">usar /var/tmp</text>
<rect x="48" y="512" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="524" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="546.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">df -i: si los inodos están al 100 %, sobran archivos chicos aunque haya espacio libre.</tspan></text>
