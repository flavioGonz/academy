<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>du de a un nivel, con -x para no cruzar a otro disco</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">du de a un nivel, con -x para no cruzar a otro disco</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="560" height="189" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PRIMER NIVEL · EJEMPLO</text><text x="64.0" y="177.4" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="177.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo du -xh -d1 /var | sort -h | tail</text><text x="64.0" y="206.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">180M   /var/cache</text><text x="64.0" y="235.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">1,1G   /var/lib</text><text x="64.0" y="264.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFC861" text-anchor="start">6,8G   /var/log</text><text x="64.0" y="293.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">8,2G   /var</text>
<rect x="632" y="124" width="520" height="189" rx="12" fill="#03213C"/><text x="648.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SEGUNDO NIVEL · EJEMPLO</text><text x="648.0" y="177.4" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="667.2" y="177.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo du -xh -d1 /var/log | sort -h | tail</text><text x="648.0" y="206.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">40M    /var/log/apt</text><text x="648.0" y="235.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">210M   /var/log/installer</text><text x="648.0" y="264.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FF8A73" text-anchor="start">6,5G   /var/log/journal</text><text x="648.0" y="293.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">6,8G   /var/log</text>
<path d="M608 259.4H632" stroke="#B45309" stroke-width="3" marker-end="url(#a-gray)"/>
<rect x="48" y="343" width="352" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="375.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">-x</text><text x="68.0" y="405.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">No cruza a otros discos</text><text x="68.0" y="426.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">montados adentro, como</text><text x="68.0" y="448.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">/srv/datos: suma solo este.</text>
<rect x="424" y="343" width="352" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="444.0" y="375.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">-d1 y sort -h</text><text x="444.0" y="405.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Un nivel por vez, ordenado</text><text x="444.0" y="426.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">de menor a mayor: lo más</text><text x="444.0" y="448.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">grande queda al final.</text>
<rect x="800" y="343" width="352" height="170" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="820.0" y="375.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Encontrado</text><text x="820.0" y="405.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">El journal ocupa 6,5 GB:</text><text x="820.0" y="426.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">se mide con du -sh y se le</text><text x="820.0" y="448.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">pone tope en journald.conf.d.</text>
</svg>