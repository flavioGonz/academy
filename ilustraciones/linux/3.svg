<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>update, upgrade y full-upgrade no son lo mismo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">update, upgrade y full-upgrade no son lo mismo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="352" height="268" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="68" y="144" width="312" height="44" rx="10" fill="#03213C"/><text x="84.0" y="171.9" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">apt update</text>
<text x="68.0" y="228.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Baja la lista</text>
<text x="68.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Pregunta al repositorio qué</text>
<text x="68.0" y="284.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">versiones hay. No instala</text>
<text x="68.0" y="308.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">nada.</text>
<rect x="68.0" y="347.0" width="135.3" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="135.7" y="368.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">todos los días</text>
<rect x="424" y="124" width="352" height="268" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<rect x="444" y="144" width="312" height="44" rx="10" fill="#03213C"/><text x="460.0" y="171.9" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">apt upgrade</text>
<text x="444.0" y="228.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Instala lo nuevo</text>
<text x="444.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Actualiza paquetes sin</text>
<text x="444.0" y="284.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">quitar ninguno. Es lo de</text>
<text x="444.0" y="308.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">todas las semanas.</text>
<rect x="444.0" y="347.0" width="143.2" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="515.6" y="368.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">con regularidad</text>
<rect x="800" y="124" width="352" height="268" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<rect x="820" y="144" width="312" height="44" rx="10" fill="#03213C"/><text x="836.0" y="171.9" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">apt full-upgrade</text>
<text x="820.0" y="228.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Puede quitar paquetes</text>
<text x="820.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Instala y quita lo que haga</text>
<text x="820.0" y="284.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">falta. Para el salto de</text>
<text x="820.0" y="308.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">versión mayor.</text>
<rect x="820.0" y="347.0" width="214.8" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="927.4" y="368.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">planificado y con backup</text>
<rect x="48" y="414" width="540" height="192" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="446.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">La seguridad, automática</text>
<text x="72.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">unattended-upgrades aplica solo seguridad,</text><text x="72.0" y="502.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">una vez por día. Ubuntu lo trae instalado;</text><text x="72.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">en Debian 13 se verifica y, si falta, se instala.</text>
<text x="72.0" y="572.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">Registro: /var/log/apt/history.log</text>
<rect x="612" y="414" width="540" height="192" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="446.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">El reinicio lo decidís vos</text>
<text x="636.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Automatic-Reboot viene en &quot;false&quot;.</text><text x="636.0" y="502.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Gateway o NVR desatendido: hora fija de</text><text x="636.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">madrugada. Servidor con gente de día:</text><text x="636.0" y="554.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">ventana acordada.</text>
</svg>