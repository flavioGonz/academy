<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Probá desde otra terminal, con la primera abierta</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Probá desde otra terminal, con la primera abierta</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="520" height="134" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL A · LA QUE FUNCIONA</text><text x="64.0" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">ssh tecnico@192.168.88.50</text><text x="64.0" y="208.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#5BD69B" text-anchor="start">tecnico@servidor:~$</text><text x="64.0" y="238.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#7FA6C9" text-anchor="start">(abierta: tu salida de emergencia)</text>
<rect x="632" y="124" width="520" height="224" rx="12" fill="#03213C"/><text x="648.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL B · NUEVA</text><text x="648.0" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="667.2" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">ssh -o PubkeyAuthentication=no \</text><text x="648.0" y="208.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">    tecnico@192.168.88.50</text><text x="648.0" y="238.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FF8A73" text-anchor="start">tecnico@192.168.88.50: Permission denied</text><text x="648.0" y="268.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FF8A73" text-anchor="start">(publickey).</text><text x="648.0" y="298.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="667.2" y="298.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">ssh tecnico@192.168.88.50</text><text x="648.0" y="328.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#5BD69B" text-anchor="start">tecnico@servidor:~$</text>
<rect x="632" y="372" width="520" height="130" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="652.0" y="404.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Las dos cosas que querés ver</text><text x="652.0" y="434.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Sin llave, Permission denied (publickey).</text><text x="652.0" y="455.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Con llave, entra sin pedir la clave del servidor.</text>
<rect x="48" y="282" width="520" height="160" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="314.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Si B no entra con la llave</text><text x="68.0" y="344.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Desde A: borrá el snippet, sshd -t y reload.</text><text x="68.0" y="365.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Si ya cerraste A, la salida es la consola</text><text x="68.0" y="387.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">de la VM o del hipervisor.</text>
</svg>