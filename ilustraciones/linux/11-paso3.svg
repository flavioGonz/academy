<rect x="48" y="124" width="1104" height="134" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo tar xzf /srv/backup/srv1-etc-2026-10-27.tar.gz -C /tmp etc/hostname</text><text x="64.0" y="208.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="208.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">diff /tmp/etc/hostname /etc/hostname &amp;&amp; echo &quot;restaurado OK&quot;</text><text x="64.0" y="238.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#5BD69B" text-anchor="start">restaurado OK</text>
