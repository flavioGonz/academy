<rect x="48" y="438" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="450" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="472.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Listar con tar -tzvf no prueba que se pueda restaurar: lo</tspan><tspan x="74.0" dy="21.6">prueba sacar un archivo y compararlo.</tspan></text>
<rect x="612" y="438" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="450" width="5" height="51" rx="2.5" fill="#B45309"/><text x="638.0" y="472.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Restaurar sobre / sobrescribe lo actual. La prueba se hace</tspan><tspan x="638.0" dy="21.6">siempre a otra carpeta.</tspan></text>
