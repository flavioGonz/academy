<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Reinicio a hora fija, en un archivo propio</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Reinicio a hora fija, en un archivo propio</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="640" height="126" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 136a12 12 0 0 1 12 -12h616a12 12 0 0 1 12 12v24h-640z" fill="#E5F0FB"/><text x="64.0" y="149.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/apt/apt.conf.d/52reinicio-ies</text><text x="64.0" y="192.5" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Unattended-Upgrade::Automatic-Reboot &quot;true&quot;;</text><text x="64.0" y="226.5" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Unattended-Upgrade::Automatic-Reboot-Time &quot;04:30&quot;;</text>
<rect x="48" y="270" width="640" height="156" rx="12" fill="#03213C"/><text x="64.0" y="292.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="322.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="322.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">ls /var/run/reboot-required 2&gt;/dev/null</text><text x="64.0" y="350.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">/var/run/reboot-required</text><text x="64.0" y="378.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="378.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">cat /var/run/reboot-required.pkgs</text><text x="64.0" y="406.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">linux-image-... (el kernel nuevo)</text>
<text x="48.0" y="460.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Si existe la marca, un paquete (kernel, libc) espera un reinicio para usarse.</text>
<rect x="716" y="124" width="436" height="220" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="736.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Gateway, NVR, equipo desatendido</text>
<text x="740.0" y="186.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Automatic-Reboot &quot;true&quot;</text><text x="740.0" y="214.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Automatic-Reboot-Time &quot;04:30&quot;</text>
<text x="740.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Reinicia solo si hace falta, de</text><text x="740.0" y="286.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">madrugada, sin nadie usándolo.</text>
<rect x="716" y="364" width="436" height="220" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="736.0" y="396.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Accesos, central IP, gente de día</text>
<text x="740.0" y="426.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Automatic-Reboot &quot;false&quot;</text>
<text x="740.0" y="474.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Reiniciás vos, en una ventana</text><text x="740.0" y="500.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">acordada con el cliente, mirando</text><text x="740.0" y="526.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">la marca reboot-required.</text>
</svg>