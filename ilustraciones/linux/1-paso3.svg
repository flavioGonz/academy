<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">grep -rn: archivo, línea y texto encontrado</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="1104" height="164" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="184.0" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="88.0" y="184.0" font-family="JetBrains Mono" font-size="20" font-weight="500" fill="#FFFFFF" text-anchor="start">grep -rn &quot;Port&quot; /etc/ssh 2&gt;/dev/null</text><text x="64.0" y="224.0" font-family="JetBrains Mono" font-size="20" font-weight="500" fill="#FFFFFF" text-anchor="start">/etc/ssh/sshd_config:14:#Port 22</text><text x="64.0" y="264.0" font-family="JetBrains Mono" font-size="20" font-weight="500" fill="#FFFFFF" text-anchor="start">/etc/ssh/ssh_config:41:#   Port 22</text>
