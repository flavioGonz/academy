<rect x="314.0" y="198.0" width="28.0" height="34" rx="6" fill="none" stroke="#0E8F5E" stroke-width="2.5"/>
<rect x="350.0" y="198.0" width="100.0" height="34" rx="6" fill="none" stroke="#FFC861" stroke-width="2.5"/>
<path d="M184.0 290L120 338" stroke="#17A8D4" stroke-width="1.6" fill="none"/><circle cx="184.0" cy="290" r="4" fill="#17A8D4"/><text x="126.0" y="343.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#17A8D4" text-anchor="start">archivo</text>
<path d="M328.0 290L360 338" stroke="#0E8F5E" stroke-width="1.6" fill="none"/><circle cx="328.0" cy="290" r="4" fill="#0E8F5E"/><text x="366.0" y="343.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">número de línea</text>
<path d="M400.0 290L620 338" stroke="#B45309" stroke-width="1.6" fill="none"/><circle cx="400.0" cy="290" r="4" fill="#B45309"/><text x="626.0" y="343.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="start">la línea encontrada</text>
<rect x="48" y="384" width="352" height="178" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="416.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">-r y -n</text><text x="68.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">-r recorre la carpeta entera,</text><text x="68.0" y="467.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">con sus subcarpetas.</text><text x="68.0" y="489.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">-n agrega el número de línea</text><text x="68.0" y="511.2" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">para ir directo con less.</text>
<rect x="424" y="384" width="352" height="178" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="444.0" y="416.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start"># al principio</text><text x="444.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">La línea está comentada:</text><text x="444.0" y="467.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">no cuenta. Vale el valor</text><text x="444.0" y="489.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">por defecto de SSH,</text><text x="444.0" y="511.2" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">que es el puerto 22.</text>
<rect x="800" y="384" width="352" height="178" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="820.0" y="416.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">2&gt;/dev/null</text><text x="820.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Descarta los mensajes de</text><text x="820.0" y="467.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">error, como Permission</text><text x="820.0" y="489.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">denied, y deja en pantalla</text><text x="820.0" y="511.2" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">solo lo encontrado.</text>
</svg>