<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>ss -tlnp: qué escucha y en qué dirección</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">ss -tlnp: qué escucha y en qué dirección</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="1104" height="204" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="179.2" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="84.4" y="179.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo ss -tlnp</text><text x="64.0" y="211.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#7FA6C9" text-anchor="start">State   Local Address:Port   Process</text><text x="64.0" y="243.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start">LISTEN  0.0.0.0:22             users:((&quot;sshd&quot;,...))</text><text x="64.0" y="275.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start">LISTEN  [::]:22                users:((&quot;sshd&quot;,...))</text><text x="64.0" y="307.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start">LISTEN  127.0.0.1:5432         users:((&quot;postgres&quot;,...))</text>
<rect x="142.6" y="220.2" width="108.0" height="64" rx="6" fill="none" stroke="#FFC861" stroke-width="2.5"/>
<rect x="142.6" y="284.2" width="148.79999999999998" height="31" rx="6" fill="none" stroke="#5BD69B" stroke-width="2.5"/>
<rect x="48" y="358" width="352" height="170" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="68.0" y="390.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">0.0.0.0 y [::]</text><text x="68.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Todas las interfaces, IPv4</text><text x="68.0" y="441.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">e IPv6: lo ve la red.</text><text x="68.0" y="463.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Es lo que hay que filtrar.</text>
<rect x="424" y="358" width="352" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="444.0" y="390.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">127.0.0.1</text><text x="444.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Solo el propio equipo.</text><text x="444.0" y="441.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Desde la red no llega,</text><text x="444.0" y="463.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">con o sin firewall.</text>
<rect x="800" y="358" width="352" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="820.0" y="390.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Process</text><text x="820.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Qué programa escucha.</text><text x="820.0" y="441.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Si no lo reconocés,</text><text x="820.0" y="463.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">averiguá antes de abrir.</text>
</svg>