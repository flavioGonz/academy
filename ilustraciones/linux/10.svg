<rect x="48" y="494" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="506" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">free bajo no es un problema</tspan></text><text x="74.0" y="555.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">free bajo es normal: Linux usa la RAM que sobra como caché</tspan><tspan x="74.0" dy="21.6">y la suelta apenas un programa la pide.</tspan></text>
<rect x="612" y="494" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="506" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Ojo con las alertas</tspan></text><text x="638.0" y="555.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Muchas herramientas de monitoreo alertan mirando free: un</tspan><tspan x="638.0" dy="21.6">servidor sano puede figurar en presión de memoria.</tspan></text>
