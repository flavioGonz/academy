<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Las automáticas, activas: los dos valores en &quot;1&quot;</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Las automáticas, activas: los dos valores en &quot;1&quot;</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="620" height="128" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL</text><text x="64.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo apt install unattended-upgrades</text><text x="64.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo dpkg-reconfigure -plow unattended-upgrades</text><text x="64.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">cat /etc/apt/apt.conf.d/20auto-upgrades</text>
<rect x="48" y="276" width="620" height="126" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 288a12 12 0 0 1 12 -12h596a12 12 0 0 1 12 12v24h-620z" fill="#E5F0FB"/><text x="64.0" y="301.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/apt/apt.conf.d/20auto-upgrades</text><rect x="54" y="321.0" width="608" height="32" rx="6" fill="#E3F5EC"/><text x="64.0" y="344.5" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">APT::Periodic::Update-Package-Lists &quot;1&quot;;</text><rect x="54" y="355.0" width="608" height="32" rx="6" fill="#E3F5EC"/><text x="64.0" y="378.5" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">APT::Periodic::Unattended-Upgrade &quot;1&quot;;</text>
<path d="M610 337.0L720 306" stroke="#0E8F5E" stroke-width="1.6" fill="none"/><circle cx="610" cy="337.0" r="4" fill="#0E8F5E"/><text x="726.0" y="311.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">baja las listas cada día</text>
<path d="M610 371.0L720 376" stroke="#0E8F5E" stroke-width="1.6" fill="none"/><circle cx="610" cy="371.0" r="4" fill="#0E8F5E"/><text x="726.0" y="381.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">instala la seguridad cada día</text>
<rect x="48" y="470" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">dpkg-reconfigure pregunta si querés activarlas: con Sí</tspan><tspan x="74.0" dy="21.6">escribe este archivo. En Ubuntu ya viene así.</tspan></text>
<rect x="612" y="470" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="482" width="5" height="51" rx="2.5" fill="#B45309"/><text x="638.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si un valor está en &quot;0&quot;, esa parte no corre: el equipo</tspan><tspan x="638.0" dy="21.6">queda sin parches aunque el paquete esté instalado.</tspan></text>
</svg>