<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Permisos recursivos: directorios por un lado, archivos por otro</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Permisos recursivos: directorios por un lado, archivos por otro</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="540" height="322" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">chmod -R 755 obra</text><text x="76.0" y="228.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">obra/</text><text x="560.0" y="228.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rwxr-xr-x</text><text x="100.0" y="276.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">planos/</text><text x="560.0" y="276.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rwxr-xr-x</text><text x="100.0" y="324.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">plano.txt</text><text x="560.0" y="324.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#D2492F" text-anchor="end">rwxr-xr-x</text><text x="100.0" y="372.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">fotos.zip</text><text x="560.0" y="372.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#D2492F" text-anchor="end">rwxr-xr-x</text><text x="100.0" y="420.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">notas.txt</text><text x="560.0" y="420.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#D2492F" text-anchor="end">rwxr-xr-x</text>
<rect x="612" y="124" width="540" height="322" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">find por tipo</text><text x="640.0" y="228.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">obra/</text><text x="1124.0" y="228.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rwxrws---</text><text x="664.0" y="276.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">planos/</text><text x="1124.0" y="276.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rwxrws---</text><text x="664.0" y="324.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">plano.txt</text><text x="1124.0" y="324.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rw-rw----</text><text x="664.0" y="372.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">fotos.zip</text><text x="1124.0" y="372.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rw-rw----</text><text x="664.0" y="420.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">notas.txt</text><text x="1124.0" y="420.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="end">rw-rw----</text>
<text x="76.0" y="182.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start">todo queda ejecutable</text>
<text x="640.0" y="182.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start">cada tipo con lo suyo</text>
<rect x="612" y="470" width="540" height="78" rx="12" fill="#03213C"/><text x="628.0" y="503.6" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="644.8" y="503.6" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo find /srv/obra -type d -exec chmod 2770 {} \;</text><text x="628.0" y="529.6" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="644.8" y="529.6" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo find /srv/obra -type f -exec chmod 660 {} \;</text>
<rect x="48" y="470" width="540" height="97" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="482" width="5" height="73" rx="2.5" fill="#B45309"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con -R, un solo número va a directorios y archivos por</tspan><tspan x="74.0" dy="21.6">igual: los archivos de datos quedan ejecutables. find -type</tspan><tspan x="74.0" dy="21.6">d y -type f los separa.</tspan></text>
</svg>