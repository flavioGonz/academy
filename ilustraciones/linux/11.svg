<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un backup existe cuando restauraste un archivo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un backup existe cuando restauraste un archivo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="250" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="168" r="18" fill="#17A8D4"/><text x="82.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="175.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Copiar</text>
<text x="70.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">tar czf para /etc</text><text x="70.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">rsync para datos</text><text x="70.0" y="278.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">dump para bases</text>
<path d="M302 243H324" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="330" y="128" width="250" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="364" cy="168" r="18" fill="#17A8D4"/><text x="364.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="175.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">A otro lugar</text>
<text x="352.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">otro disco u otro</text><text x="352.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">servidor: la copia no</text><text x="352.0" y="278.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">vive con el original</text>
<path d="M584 243H606" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="612" y="128" width="250" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="646" cy="168" r="18" fill="#17A8D4"/><text x="646.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="674.0" y="175.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Programar</text>
<text x="634.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">timer 02:30 con</text><text x="634.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Persistent=true,</text><text x="634.0" y="278.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">o una línea de cron</text>
<path d="M866 243H888" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="894" y="128" width="250" height="230" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="928" cy="168" r="18" fill="#0E8F5E"/><text x="928.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="956.0" y="175.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Restaurar</text>
<text x="916.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">un archivo a /tmp</text><text x="916.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y diff contra el</text><text x="916.0" y="278.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">original: recién ahí</text>
<path d="M1019 358V392H173V362" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-ok)"/>
<text x="600.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">si la restauración falla, el backup no existía: se corrige y se vuelve a probar</text>
<rect x="48" y="452" width="640" height="125" rx="12" fill="#03213C"/><text x="64.0" y="474.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="504.2" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="504.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">ls -lh /srv/backup</text><text x="64.0" y="531.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">srv1-etc-2026-10-26.tar.gz</text><text x="64.0" y="558.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">srv1-etc-2026-10-27.tar.gz</text>
<rect x="712" y="452" width="440" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="712" y="464" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="738.0" y="486.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="738.0" dy="0.0">Falcot Corp, en el Debian Handbook, guarda el</tspan><tspan x="738.0" dy="21.6">servidor de backup en otra sala, por si hay un</tspan><tspan x="738.0" dy="21.6">incendio.</tspan></text>
</svg>