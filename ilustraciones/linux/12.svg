<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Docker en cuatro piezas, y dónde publicar el puerto</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Docker en cuatro piezas, y dónde publicar el puerto</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="264" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Imagen</text>
<text x="68.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">el software empaquetado</text>
<text x="68.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">nginx</text>
<rect x="330" y="124" width="264" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="350.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Contenedor</text>
<text x="350.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">la imagen corriendo</text>
<text x="350.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">docker run -d</text>
<rect x="612" y="124" width="264" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Volumen</text>
<text x="632.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">datos que sobreviven</text>
<text x="632.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/var/lib/docker/volumes</text>
<rect x="894" y="124" width="264" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="914.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Red de Docker</text>
<text x="914.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">cómo se hablan entre ellos</text>
<text x="914.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">sin publicar nada</text>
<text x="48.0" y="318.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Publicar un puerto en el host</text>
<rect x="48" y="336" width="540" height="230" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<rect x="68" y="356" width="500" height="42" rx="10" fill="#03213C"/><text x="84.0" y="382.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">docker run -d -p 8080:80 nginx</text>
<text x="68.0" y="434.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#D2492F" text-anchor="start">0.0.0.0:8080</text>
<text x="68.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Todas las interfaces. Docker lo abre antes</text><text x="68.0" y="496.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">de que lleguen las reglas de ufw: responde</text><text x="68.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">a la red aunque ufw diga deny.</text>
<rect x="612" y="336" width="540" height="230" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<rect x="632" y="356" width="500" height="42" rx="10" fill="#03213C"/><text x="648.0" y="382.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">docker run -d -p 127.0.0.1:8081:80 nginx</text>
<text x="632.0" y="434.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#0E8F5E" text-anchor="start">127.0.0.1:8081</text>
<text x="632.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Solo el propio host. Lo público va detrás</text><text x="632.0" y="496.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">de un proxy inverso en 80 y 443, o se filtra</text><text x="632.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">en la cadena DOCKER-USER.</text>
<rect x="48" y="588" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="600" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="622.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La prueba se hace desde otra máquina: nmap -Pn -p 8080,8081 contra la IP del servidor.</tspan></text>
</svg>