<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Verificá desde otra máquina: abierto, cerrado o filtrado</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Verificá desde otra máquina: abierto, cerrado o filtrado</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="1104" height="236" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · OTRA MÁQUINA DE LA RED DE GESTIÓN · EJEMPLO</text><text x="64.0" y="179.2" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="84.4" y="179.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start">nc -zv 192.168.88.50 22</text><text x="64.0" y="211.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#5BD69B" text-anchor="start">Connection to 192.168.88.50 22 port [tcp/ssh] succeeded!</text><text x="64.0" y="243.2" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="84.4" y="243.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start">nmap -Pn -p 22,80,443 192.168.88.50</text><text x="64.0" y="275.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#5BD69B" text-anchor="start">22/tcp   open      ssh</text><text x="64.0" y="307.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FF8A73" text-anchor="start">80/tcp   filtered  http</text><text x="64.0" y="339.2" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#FF8A73" text-anchor="start">443/tcp  filtered  https</text>
<rect x="48" y="388" width="352" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="420.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">open</text><text x="68.0" y="450.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Algo escucha y el firewall</text><text x="68.0" y="471.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">deja pasar desde acá.</text>
<rect x="424" y="388" width="352" height="170" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="444.0" y="420.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">closed</text><text x="444.0" y="450.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Connection refused: llega,</text><text x="444.0" y="471.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">pero nada escucha. Pasa con</text><text x="444.0" y="493.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el puerto permitido y sin servicio.</text>
<rect x="800" y="388" width="352" height="170" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="820.0" y="420.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">filtered</text><text x="820.0" y="450.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">No hay respuesta, timeout:</text><text x="820.0" y="471.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">un DROP del firewall lo</text><text x="820.0" y="493.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">descarta en silencio.</text>
</svg>