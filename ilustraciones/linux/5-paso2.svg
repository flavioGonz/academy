<path d="M208.0 342L200 382" stroke="#D2492F" stroke-width="1.6" fill="none"/><circle cx="208.0" cy="342" r="4" fill="#D2492F"/><text x="206.0" y="387.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">está caído</text>
<rect x="48" y="416" width="352" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="448.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Loaded</text><text x="68.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Si encontró la unidad y si</text><text x="68.0" y="499.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">está habilitada (enabled).</text>
<rect x="424" y="416" width="352" height="150" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="444.0" y="448.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Active</text><text x="444.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">active (running), inactive</text><text x="444.0" y="499.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">o failed, y desde cuándo.</text>
<rect x="800" y="416" width="352" height="150" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="820.0" y="448.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">journalctl -u</text><text x="820.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">El mensaje del propio sshd:</text><text x="820.0" y="499.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">archivo, línea y opción mala.</text>
