<rect x="48" y="124" width="1104" height="218" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · CONSOLA DE LA VM · EJEMPLO</text><text x="64.0" y="177.4" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="177.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">systemctl status ssh</text><text x="64.0" y="206.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">● ssh.service - OpenBSD Secure Shell server</text><text x="64.0" y="235.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">     Loaded: loaded (/usr/lib/systemd/system/ssh.service; enabled)</text><text x="64.0" y="264.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FF8A73" text-anchor="start">     Active: failed (Result: exit-code) since mar 2026-10-27 10:12:03</text><text x="64.0" y="293.4" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="293.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo journalctl -u ssh -n 20</text><text x="64.0" y="322.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFC861" text-anchor="start">sshd[1188]: /etc/ssh/sshd_config.d/99-roto.conf line 1: unsupported option &quot;yess&quot;.</text>
<rect x="583.0" y="215.4" width="69.0" height="27" rx="5" fill="none" stroke="#5FD3F3" stroke-width="2"/>
<rect x="178.0" y="244.39999999999998" width="60.0" height="27" rx="5" fill="none" stroke="#FF8A73" stroke-width="2"/>
