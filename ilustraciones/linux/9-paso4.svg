<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un disco extra en fstab: UUID, nofail y validación</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un disco extra en fstab: UUID, nofail y validación</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="1104" height="131" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="177.4" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="177.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">lsblk -f</text><text x="64.0" y="206.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#7FA6C9" text-anchor="start">NAME   FSTYPE  UUID</text><text x="64.0" y="235.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sdb1   ext4    el UUID de tu disco: anotalo tal cual</text>
<rect x="48" y="289" width="1104" height="64" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="64.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#0E8F5E" text-anchor="start">UUID=el-uuid-que-viste</text>
<text x="284.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#0A63B8" text-anchor="start">/srv/datos</text>
<text x="396.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#0A63B8" text-anchor="start">ext4</text>
<text x="454.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">defaults,nofail,x-systemd.device-timeout=5</text>
<text x="854.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#6E88A1" text-anchor="start">0</text>
<text x="885.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#6E88A1" text-anchor="start">2</text>
<path d="M163.0 353L143.0 393" stroke="#0E8F5E" stroke-width="1.6" fill="none"/><circle cx="163.0" cy="353" r="4" fill="#0E8F5E"/><text x="149.0" y="398.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">qué disco</text>
<path d="M329.0 353L309.0 423" stroke="#0A63B8" stroke-width="1.6" fill="none"/><circle cx="329.0" cy="353" r="4" fill="#0A63B8"/><text x="315.0" y="428.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">dónde se monta</text>
<path d="M414.0 353L394.0 393" stroke="#0A63B8" stroke-width="1.6" fill="none"/><circle cx="414.0" cy="353" r="4" fill="#0A63B8"/><text x="400.0" y="398.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">tipo</text>
<path d="M643.0 353L623.0 423" stroke="#B45309" stroke-width="1.6" fill="none"/><circle cx="643.0" cy="353" r="4" fill="#B45309"/><text x="629.0" y="428.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="start">opciones</text>
<path d="M858.5 353L778.5 393" stroke="#6E88A1" stroke-width="1.6" fill="none"/><circle cx="858.5" cy="353" r="4" fill="#6E88A1"/><text x="784.5" y="398.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="start">dump</text>
<path d="M889.5 353L919.5 423" stroke="#6E88A1" stroke-width="1.6" fill="none"/><circle cx="889.5" cy="353" r="4" fill="#6E88A1"/><text x="925.5" y="428.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="start">orden de chequeo</text>
<rect x="48" y="459" width="352" height="168" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="491.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">UUID, nunca /dev/sdb1</text><text x="68.0" y="521.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Los nombres del kernel cambian</text><text x="68.0" y="542.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">según el orden en que aparecen</text><text x="68.0" y="564.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">los discos al arrancar.</text>
<rect x="424" y="459" width="352" height="168" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="444.0" y="491.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">nofail con timeout</text><text x="444.0" y="521.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Si el disco falta, arranca igual.</text><text x="444.0" y="542.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Sin el timeout, systemd lo</text><text x="444.0" y="564.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">espera 90 segundos.</text>
<rect x="800" y="459" width="352" height="168" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="820.0" y="491.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">sudo findmnt -x</text><text x="820.0" y="521.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Valida fstab antes de reiniciar:</text><text x="820.0" y="542.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">un error puede dejar el equipo</text><text x="820.0" y="564.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">en modo emergencia.</text>
</svg>