<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un timer son dos archivos: qué hacer y cuándo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un timer son dos archivos: qué hacer y cuándo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="540" height="238" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 136a12 12 0 0 1 12 -12h516a12 12 0 0 1 12 12v24h-540z" fill="#E5F0FB"/><text x="64.0" y="149.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/systemd/system/backup-etc.service</text><text x="64.0" y="189.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">[Unit]</text><text x="64.0" y="219.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Description=Backup de /etc</text><text x="64.0" y="249.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"></text><text x="64.0" y="279.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">[Service]</text><rect x="54" y="289.0" width="528" height="28" rx="6" fill="#E5F0FB"/><text x="64.0" y="309.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Type=oneshot</text><rect x="54" y="319.0" width="528" height="28" rx="6" fill="#E5F0FB"/><text x="64.0" y="339.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">ExecStart=/usr/local/bin/backup-etc.sh</text>
<rect x="612" y="124" width="540" height="358" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M612 136a12 12 0 0 1 12 -12h516a12 12 0 0 1 12 12v24h-540z" fill="#E5F0FB"/><text x="628.0" y="149.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/systemd/system/backup-etc.timer</text><text x="628.0" y="189.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">[Unit]</text><text x="628.0" y="219.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Description=Backup diario de /etc</text><text x="628.0" y="249.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"></text><text x="628.0" y="279.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">[Timer]</text><rect x="618" y="289.0" width="528" height="28" rx="6" fill="#E5F0FB"/><text x="628.0" y="309.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">OnCalendar=*-*-* 02:30:00</text><rect x="618" y="319.0" width="528" height="28" rx="6" fill="#E5F0FB"/><text x="628.0" y="339.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Persistent=true</text><rect x="618" y="349.0" width="528" height="28" rx="6" fill="#E5F0FB"/><text x="628.0" y="369.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">RandomizedDelaySec=15min</text><text x="628.0" y="399.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"></text><text x="628.0" y="429.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">[Install]</text><rect x="618" y="439.0" width="528" height="28" rx="6" fill="#E5F0FB"/><text x="628.0" y="459.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">WantedBy=timers.target</text>
<text x="48.0" y="398.0" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#6E88A1" text-anchor="start" letter-spacing="2">QUÉ</text>
<text x="48.0" y="428.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">oneshot: corre una vez y termina.</text><text x="48.0" y="454.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">ExecStart: el script de backup.</text>
<rect x="48" y="492" width="540" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="524.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Se habilita el timer</text><text x="68.0" y="554.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">sudo systemctl enable backup-etc.timer</text><text x="68.0" y="582.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">systemctl list-timers | grep backup</text><text x="68.0" y="610.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">journalctl -u backup-etc.service</text>
<circle cx="617" cy="516.7" r="4.5" fill="#17A8D4"/><text x="632.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">OnCalendar: a las 02:30 todos los días</tspan></text><circle cx="617" cy="546.3" r="4.5" fill="#0E8F5E"/><text x="632.0" y="551.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Persistent=true: si estaba apagado, corre al arrancar</tspan></text><circle cx="617" cy="575.9" r="4.5" fill="#17A8D4"/><text x="632.0" y="581.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">RandomizedDelaySec: hasta 15 min de demora al azar</tspan></text><circle cx="617" cy="605.5" r="4.5" fill="#17A8D4"/><text x="632.0" y="610.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">WantedBy=timers.target: se engancha al habilitarlo</tspan></text>
</svg>