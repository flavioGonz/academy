<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Terminar un proceso: primero se pide, después se fuerza</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Terminar un proceso: primero se pide, después se fuerza</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="560" height="254" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · EJEMPLO</text><text x="64.0" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="178.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sleep 600 &amp;</text><text x="64.0" y="208.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">[1] 12345</text><text x="64.0" y="238.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="238.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">pgrep -a sleep</text><text x="64.0" y="268.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">12345 sleep 600</text><text x="64.0" y="298.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="298.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">kill 12345</text><text x="64.0" y="328.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="328.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">pgrep -a sleep</text><text x="64.0" y="358.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#5BD69B" text-anchor="start">(nada: terminó)</text>
<text x="236.8" y="268.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFC861" text-anchor="start">&lt;- el PID para kill</text>
<text x="640.0" y="150.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">De menos a más, según quién consume</text>
<rect x="640" y="176" width="512" height="112" rx="14" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="664.0" y="216.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#0E8F5E" text-anchor="start">systemctl restart servicio</text>
<text x="664.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">Si es un servicio: systemd lo baja y lo levanta.</tspan></text>
<rect x="640" y="308" width="512" height="112" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="664.0" y="348.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#0A63B8" text-anchor="start">kill PID</text>
<text x="664.0" y="382.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">SIGTERM (15): le pide terminar; cierra y guarda.</tspan></text>
<rect x="640" y="440" width="512" height="112" rx="14" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="664.0" y="480.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#D2492F" text-anchor="start">kill -9 PID</text>
<text x="664.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">SIGKILL: el kernel lo saca; nada se guarda. Último</tspan><tspan x="664.0" dy="21.6">recurso.</tspan></text>
<rect x="48" y="440" width="560" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="452" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El &amp; deja el sleep corriendo en segundo plano y te devuelve la</tspan><tspan x="74.0" dy="21.6">terminal: así lo practicás sin riesgo.</tspan></text>
</svg>