<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>sshd -t marca el error antes de que tumbe el servicio</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">sshd -t marca el error antes de que tumbe el servicio</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="1104" height="236" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · VM DE LABORATORIO</text><text x="64.0" y="179.2" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="179.2" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">echo &quot;PasswordAuthentication yess&quot; | sudo tee -a /etc/ssh/sshd_config.d/10-ies.conf</text><text x="64.0" y="211.2" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="211.2" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo sshd -t</text><text x="64.0" y="243.2" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FF8A73" text-anchor="start">/etc/ssh/sshd_config.d/10-ies.conf line 2: unsupported option &quot;yess&quot;.</text><text x="64.0" y="275.2" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="275.2" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo sed -i &#x27;/yess/d&#x27; /etc/ssh/sshd_config.d/10-ies.conf</text><text x="64.0" y="307.2" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="83.2" y="307.2" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo sshd -t &amp;&amp; sudo systemctl reload ssh</text><text x="64.0" y="339.2" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#5BD69B" text-anchor="start">(sin salida: la configuración es válida y recargó)</text>
<rect x="61" y="221.2" width="330.4" height="30" rx="6" fill="none" stroke="#FFC861" stroke-width="2.5"/>
<rect x="399.0" y="221.2" width="63.599999999999994" height="30" rx="6" fill="none" stroke="#FFC861" stroke-width="2.5"/>
<path d="M227.2 360L140 404" stroke="#B45309" stroke-width="1.6" fill="none"/><circle cx="227.2" cy="360" r="4" fill="#B45309"/><text x="146.0" y="409.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="start">el archivo</text>
<path d="M438.4 360L440 404" stroke="#B45309" stroke-width="1.6" fill="none"/><circle cx="438.4" cy="360" r="4" fill="#B45309"/><text x="446.0" y="409.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="start">la línea</text>
<rect x="48" y="440" width="540" height="150" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="472.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Si hubieras hecho restart</text><text x="68.0" y="502.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">El servicio intenta arrancar, falla y queda caído.</text><text x="68.0" y="523.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Por SSH, nadie más entra hasta arreglarlo</text><text x="68.0" y="545.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">desde la consola.</text>
<rect x="612" y="440" width="540" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="472.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Con sshd -t primero</text><text x="632.0" y="502.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">El error aparece en pantalla y el servicio</text><text x="632.0" y="523.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sigue andando con la configuración vieja.</text><text x="632.0" y="545.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Corregís, validás otra vez y recién recargás.</text>
</svg>