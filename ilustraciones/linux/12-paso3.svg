<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>ufw dice deny, pero el 8080 responde desde la otra VM</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">ufw dice deny, pero el 8080 responde desde la otra VM</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="540" height="240" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SERVIDOR 192.168.88.50 · EJEMPLO</text><text x="64.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo docker run -d -p 8080:80 nginx</text><text x="64.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo ss -tlnp | grep 8080</text><text x="64.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FF8A73" text-anchor="start">LISTEN 0.0.0.0:8080  docker-proxy</text><text x="64.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo ufw status</text><text x="64.0" y="288.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">Status: active</text><text x="64.0" y="316.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">22/tcp  ALLOW  10.10.10.0/24</text><text x="64.0" y="344.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">(nada del 8080)</text>
<rect x="612" y="124" width="540" height="128" rx="12" fill="#03213C"/><text x="628.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">OTRA VM DE LA MISMA RED · EJEMPLO</text><text x="628.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="646.0" y="176.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">nmap -Pn -p 8080,8081 192.168.88.50</text><text x="628.0" y="204.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FF8A73" text-anchor="start">8080/tcp  open</text><text x="628.0" y="232.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">8081/tcp  filtered</text>
<rect x="612" y="276" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="288" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="310.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">El 8081 todavía no existe: más adelante, publicado en</tspan><tspan x="638.0" dy="21.6">127.0.0.1, tampoco va a aparecer abierto.</tspan></text>
<rect x="48" y="394" width="1104" height="150" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="426.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Por qué pasa</text><text x="68.0" y="456.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Docker redirige el puerto publicado en la tabla nat, antes de que el paquete llegue a la cadena input,</text><text x="68.0" y="477.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">donde ufw tiene sus reglas. Para el kernel ya no es tráfico para el host: va por forward hacia el contenedor.</text><text x="68.0" y="499.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Por eso ufw status no lo menciona, y por eso se verifica desde otra máquina.</text>
</svg>