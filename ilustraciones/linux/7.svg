ke-width="2"/><text x="1056.0" y="523.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">probar en otra</text><text x="1056.0" y="546.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">terminal</text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">La sesión que funciona no se cierra hasta que una nueva entra con la llave.</text>
