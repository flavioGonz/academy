<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Contraseña apagada en un archivo propio, y verificada</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">LINUX · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Contraseña apagada en un archivo propio, y verificada</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="560" height="172" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 136a12 12 0 0 1 12 -12h536a12 12 0 0 1 12 12v24h-560z" fill="#E5F0FB"/><text x="64.0" y="149.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/ssh/sshd_config.d/10-ies-acceso.conf</text><text x="64.0" y="195.4" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">PasswordAuthentication no</text><text x="64.0" y="233.4" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">KbdInteractiveAuthentication no</text><text x="64.0" y="271.4" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">PermitRootLogin no</text>
<rect x="48" y="320" width="560" height="156" rx="12" fill="#03213C"/><text x="64.0" y="342.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · SESIÓN ABIERTA</text><text x="64.0" y="372.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="372.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo sshd -t &amp;&amp; sudo systemctl reload ssh</text><text x="64.0" y="400.8" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#5FD3F3" text-anchor="start">$</text><text x="82.0" y="400.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">sudo sshd -T | grep -Ei &quot;passwordauth|permitroot&quot;</text><text x="64.0" y="428.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#5BD69B" text-anchor="start">permitrootlogin no</text><text x="64.0" y="456.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#5BD69B" text-anchor="start">passwordauthentication no</text>
<rect x="640" y="124" width="512" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="156.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#0A63B8" text-anchor="start">PasswordAuthentication no</text>
<text x="660.0" y="184.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">nadie entra con contraseña</text>
<rect x="640" y="220" width="512" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="252.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#0A63B8" text-anchor="start">KbdInteractiveAuthentication no</text>
<text x="660.0" y="280.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">cierra la otra puerta de clave</text>
<rect x="640" y="316" width="512" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="348.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#0A63B8" text-anchor="start">PermitRootLogin no</text>
<text x="660.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">root no entra por SSH</text>
<rect x="640" y="420" width="512" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="432" width="5" height="51" rx="2.5" fill="#B45309"/><text x="666.0" y="454.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">sshd -T muestra el valor que quedó en uso. Si dice yes,</tspan><tspan x="666.0" dy="21.6">otro snippet con número más bajo lo está fijando antes.</tspan></text>
</svg>