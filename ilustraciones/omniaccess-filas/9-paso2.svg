<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Atender la alerta: mirar, decidir, registrar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FILAS · LECCIÓN 9 · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Atender la alerta: mirar, decidir, registrar</text>
<rect x="48" y="130" width="360" height="270" rx="16" fill="#FFFFFF" stroke="#D2492F" stroke-width="3" opacity="1"/>
<rect x="48" y="130" width="360" height="44" rx="16" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="0" opacity="1"/>
<text x="70.0" y="160.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#D2492F" text-anchor="start" letter-spacing="1.2">ALERTA DE AFORO</text>
<rect x="68" y="186" width="320" height="150" rx="10" fill="#0B1A28" stroke="#0B1A28" stroke-width="0" opacity="1"/>
<rect x="227.2" y="195" width="145.6" height="30" rx="15" fill="#FCEAE6"/><text x="300.0" y="216.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">Excede umbral</text>
<text x="370.0" y="320.0" font-family="JetBrains Mono" font-size="24" font-weight="700" fill="#D2492F" text-anchor="end">9 / 8</text>
<text x="68.0" y="362.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Acción requerida: verificá en vivo</text>
<text x="68.0" y="384.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">y abrí otra caja o despejá la zona.</text>
<circle cx="48" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="500" y="200" width="260" height="80" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="3"/><text x="520.0" y="236.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Cola real?</text><text x="520.0" y="259.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">mirá el video</text>
<path d="M408.0 260.0C454.0 260.0,454.0 240.0,500.0 240.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="860" y="140" width="292" height="80" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><text x="880.0" y="176.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Sí: abrir caja</text><text x="880.0" y="199.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">o reordenar la fila</text>
<rect x="860" y="270" width="292" height="80" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/><text x="880.0" y="306.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">No: anotar</text><text x="880.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">carro, reflejo → calibrar</text>
<path d="M760.0 226.0C810.0 226.0,810.0 180.0,860.0 180.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M760.0 254.0C810.0 254.0,810.0 310.0,860.0 310.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="500" y="420" width="652" height="80" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="520.0" y="456.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Silenciar o descartar</text><text x="520.0" y="479.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">la cruz cierra el recuadro; vuelve si la fila baja y sube</text>
<rect x="48" y="430" width="420" height="72" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="442" width="5" height="48" rx="2.5" fill="#D2492F"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si llega una alerta de salud (cámara tapada, muy</tspan><tspan x="74.0" dy="20.2">clara u oscura), el número no es confiable.</tspan></text>
</svg>