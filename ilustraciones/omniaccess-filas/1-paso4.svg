xt x="702.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Monitor en Vivo · Kiosko</text><path d="M60 382H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="416.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">4 · Alerta</text><text x="282.0" y="416.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">pasa el umbral y avisa</text><text x="702.0" y="416.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Despachos · Telegram · app</text>
<rect x="48" y="470" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Dibujalo en una hoja con estas cuatro cajas. Cuando haya un reclamo, ubicá en qué paso se cortó antes de tocar nada.</tspan></text>
