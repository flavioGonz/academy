<circle cx="172" cy="281.3" r="10.5" fill="#0A63B8"/><path d="M155 315.3a17 17 0 0 1 34 0z" fill="#0A63B8"/>
<circle cx="234" cy="281.3" r="10.5" fill="#0A63B8"/><path d="M217 315.3a17 17 0 0 1 34 0z" fill="#0A63B8"/>
<circle cx="296" cy="281.3" r="10.5" fill="#0A63B8"/><path d="M279 315.3a17 17 0 0 1 34 0z" fill="#0A63B8"/>
<circle cx="358" cy="281.3" r="10.5" fill="#0A63B8"/><path d="M341 315.3a17 17 0 0 1 34 0z" fill="#0A63B8"/>
<circle cx="420" cy="281.3" r="10.5" fill="#0A63B8"/><path d="M403 315.3a17 17 0 0 1 34 0z" fill="#0A63B8"/>
