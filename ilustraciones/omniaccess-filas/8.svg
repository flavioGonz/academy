<path d="M620.0 290.0C660.0 290.0,660.0 290.0,700.0 290.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="696" y="240" width="36" height="110" rx="8" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2" opacity="1"/>
<text x="714.0" y="380.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">caja</text>
<text x="330.0" y="400.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#04223D" text-anchor="middle">L = 8 personas</text>
<rect x="780" y="130" width="372" height="300" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="800.0" y="162.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Últimos 15 minutos</text><text x="800.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">salidas (canal Salida)</text>
<text x="966.0" y="250.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#0E8F5E" text-anchor="middle">20 salidas</text>
<text x="966.0" y="300.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#41627F" text-anchor="middle">λ = 20 / 15</text>
<text x="966.0" y="330.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#41627F" text-anchor="middle">≈ 1,33 por minuto</text>
<rect x="48" y="460" width="1104" height="90" rx="16" fill="#011E38" stroke="#011E38" stroke-width="0" opacity="1"/>
<text x="600.0" y="518.0" font-family="JetBrains Mono" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">W = L ÷ λ = 8 ÷ 1,33 ≈ 6 minutos</text>
<rect x="48" y="572" width="540" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="584" width="5" height="48" rx="2.5" fill="#B45309"/><text x="74.0" y="606.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Sin salidas en 15 minutos no hay ritmo: el kiosko muestra un</tspan><tspan x="74.0" dy="20.2">guion.</tspan></text>
<rect x="612" y="572" width="540" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="584" width="5" height="48" rx="2.5" fill="#B45309"/><text x="638.0" y="606.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Vale con la fila estable; si entra más gente de la que sale, se</tspan><tspan x="638.0" dy="20.2">queda corta.</tspan></text>
