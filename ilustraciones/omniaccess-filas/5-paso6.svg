<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FILAS · LECCIÓN 5 · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Guardar en la cámara: backup, escribir, releer</text>
<rect x="72.6" y="199" width="154.8" height="30" rx="15" fill="#0A63B8"/><text x="150.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">leer la cámara</text>
<path d="M235.4 211.0C274.0 211.0,274.0 211.0,312.6 211.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="322.6" y="199" width="154.8" height="30" rx="15" fill="#17A8D4"/><text x="400.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">guardar backup</text>
<path d="M485.4 211.0C532.8 211.0,532.8 211.0,580.2 211.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="590.2" y="199" width="99.6" height="30" rx="15" fill="#0A63B8"/><text x="640.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">escribir</text>
