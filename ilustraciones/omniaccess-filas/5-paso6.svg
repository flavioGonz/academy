<rect x="450" y="340" width="400" height="120" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="470.0" y="372.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Analíticas guardadas</text><text x="470.0" y="396.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">la cámara reinicia sus contadores</text>
<rect x="880" y="340" width="272" height="120" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="900.0" y="372.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Se restaura</text><text x="900.0" y="396.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">el backup anterior</text>
<rect x="48" y="340" width="370" height="93" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="352" width="5" height="69" rx="2.5" fill="#0A63B8"/><text x="74.0" y="374.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Solo un usuario ADMIN puede guardar. Cada</tspan><tspan x="74.0" dy="20.2">backup queda en &quot;Backups de la cámara&quot;</tspan><tspan x="74.0" dy="20.2">(hasta 15).</tspan></text>
<rect x="48" y="500" width="1104" height="52" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="28" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Guardar reinicia los contadores de la cámara: hacelo con el local tranquilo y avisá al supervisor.</tspan></text>
