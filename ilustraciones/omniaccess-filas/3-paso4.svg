<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿El sondeo está vivo? Preguntale al servidor</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FILAS · LECCIÓN 3 · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿El sondeo está vivo? Preguntale al servidor</text>
<rect x="48" y="140" width="720" height="208" rx="14" fill="#03213C"/><text x="66.0" y="166.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">servidor de la fila</text><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ curl -s &quot;127.0.0.1:10001/api/queue/poll?info=1&quot;</text><text x="66.0" y="222.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9BE7C4" text-anchor="start">{ &quot;autoPolling&quot;: true,</text><text x="66.0" y="248.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  &quot;subscriptions&quot;: [ {</text><text x="66.0" y="274.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">    &quot;pullPointUrl&quot;: &quot;https://192.0.2.10/...&quot;,</text><text x="66.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">    &quot;expiresAt&quot;: &quot;…T14:05:00Z&quot;,</text><text x="66.0" y="326.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9BE7C4" text-anchor="start">    &quot;lastPull&quot;: &quot;…T14:00:31Z&quot; } ] }</text>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="800" y="140" width="352" height="99" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="800" y="152" width="5" height="75" rx="2.5" fill="#0E8F5E"/><text x="826.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">Sano</tspan></text><text x="826.0" y="200.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">autoPolling en true y un lastPull de</tspan><tspan x="826.0" dy="20.2">hace segundos: el sondeo anda.</tspan></text>
<rect x="800" y="300" width="352" height="120" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="800" y="312" width="5" height="96" rx="2.5" fill="#B45309"/><text x="826.0" y="334.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">Para revisar</tspan></text><text x="826.0" y="360.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">Sin suscripciones o lastPull viejo:</tspan><tspan x="826.0" dy="20.2">revisá red, HTTPS 443 y usuario de la</tspan><tspan x="826.0" dy="20.2">cámara.</tspan></text>
<rect x="48" y="460" width="1104" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="472" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="74.0" y="494.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Después mirá el registro de omniaccess-web: &quot;Created subscription&quot; al conectar y &quot;Aforo = N personas (Changed)&quot; cada vez que el número</tspan><tspan x="74.0" dy="20.2">cambia.</tspan></text>
</svg>