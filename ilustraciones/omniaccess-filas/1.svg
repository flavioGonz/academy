<rect x="612" y="440" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="452" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Número que no llega</tspan></text><text x="638.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si el número no llega, se revisa el camino: ONVIF, red,</tspan><tspan x="638.0" dy="21.6">suscripción, procesos del servidor.</tspan></text>
