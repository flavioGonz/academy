<rect x="650" y="260" width="502" height="79" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="650" y="272" width="5" height="55" rx="2.5" fill="#0A63B8"/><text x="676.0" y="294.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="676.0" dy="0.0">Cuándo no repite</tspan></text><text x="676.0" y="320.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="676.0" dy="0.0">Si avisó hace menos que el cooldown, aunque siga llena.</tspan></text>
<rect x="650" y="380" width="502" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="650" y="392" width="5" height="75" rx="2.5" fill="#B45309"/><text x="676.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="676.0" dy="0.0">Después</tspan></text><text x="676.0" y="440.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="676.0" dy="0.0">Al terminar la prueba, umbral real del cliente y una sola</tspan><tspan x="676.0" dy="20.2">alerta por fila.</tspan></text>
