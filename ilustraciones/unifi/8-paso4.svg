<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Repetí la caminata y leé la señal en cada punto</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Repetí la caminata y leé la señal en cada punto</text>
<rect x="80.0" y="170" width="520.0" height="44" rx="10" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<rect x="600.0" y="170" width="173.33333333333326" height="44" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<rect x="773.3333333333333" y="170" width="346.66666666666674" height="44" rx="10" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="340.0" y="198.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">-65 dBm o mejor: recomendado</text>
<text x="686.7" y="198.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">hasta el mínimo</text>
<text x="946.7" y="198.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#D2492F" text-anchor="middle">por debajo de -70</text>
<text x="80.0" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-50</text>
<text x="253.3" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-55</text>
<text x="426.7" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-60</text>
<text x="600.0" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-65</text>
<text x="773.3" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-70</text>
<text x="946.7" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-75</text>
<text x="1120.0" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">-80</text>
<text x="80.0" y="150.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Señal del celular (dBm)</text>
<circle cx="98" cy="312" r="18" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="98.0" y="318.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="134.0" y="319.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">AP 1</text>
<text x="330.0" y="319.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">sigue en el AP 1</text>
<circle cx="98" cy="374" r="18" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="98.0" y="380.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="134.0" y="381.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">AP 1 o AP 2</text>
<text x="330.0" y="381.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">zona de traspaso</text>
<circle cx="98" cy="436" r="18" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="98.0" y="442.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="134.0" y="443.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">AP 2</text>
<text x="330.0" y="443.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">ya pasó al AP 2, con -65 o mejor</text>
<circle cx="48" cy="290" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="296.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="720" y="290" width="432" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="720" y="302" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="746.0" y="324.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="746.0" dy="0.0">Si queda débil</tspan></text><text x="746.0" y="350.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="746.0" dy="0.0">Un punto por debajo de -70 dBm: candidato a un</tspan><tspan x="746.0" dy="21.6">AP más, o subí un nivel solo ese AP.</tspan></text>
<rect x="48" y="494" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="506" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Bajá la potencia AP por AP y caminando: en producción, un cambio de golpe puede dejar rincones sin cobertura. Ubiquiti trata</tspan><tspan x="74.0" dy="21.6">-70 dBm como mínimo y recomienda -65 o mejor (según WunderTech).</tspan></text>
</svg>