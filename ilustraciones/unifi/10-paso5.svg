<rect x="360" y="474" width="792" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="360" y="486" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="386.0" y="508.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="386.0" dy="0.0">Esta prueba va en cada entrega, no solo en el laboratorio. Repetila después de cada</tspan><tspan x="386.0" dy="21.6">actualización grande de Network.</tspan></text>
