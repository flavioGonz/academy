<text x="430.0" y="170.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">Navega por internet y la impresora no responde</text>
<circle cx="435" cy="204.7" r="4.5" fill="#17A8D4"/><text x="450.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="450.0" dy="0.0">Aislado: la zona Hotspot y las restricciones hacen su trabajo.</tspan></text><circle cx="435" cy="234.3" r="4.5" fill="#17A8D4"/><text x="450.0" y="239.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="450.0" dy="0.0">Probalo igual con el NAS o el NVR: http a su IP, puerto 80.</tspan></text>
