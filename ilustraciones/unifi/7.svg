<text x="870.0" y="402.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">36 a 48, un solo canal</text>
<text x="640.0" y="488.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Un canal de 80 ocupa lo que cuatro de 20.</text>
<text x="640.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Con vecinos y muchos clientes, conviene angosto.</text>
<rect x="48" y="556" width="1104" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="568" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Punto de partida en 5 GHz: 80 MHz en una casa, 40 MHz en una oficina, 20 MHz en alta densidad. El ancho se elige por clientes y</tspan><tspan x="74.0" dy="21.6">vecinos, no por lo que dice la caja.</tspan></text>
