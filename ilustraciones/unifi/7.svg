<text x="72.0" y="488.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Siempre 20 MHz y solo 1, 6 u 11.</text>
<text x="72.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Los canales del medio se pisan con dos de ellos.</text>
<rect x="612" y="124" width="540" height="410" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">5 GHz: más ancho, menos canales</text>
