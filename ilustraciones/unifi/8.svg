<circle cx="158" cy="305.0" r="32" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="158" cy="305.0" r="19.8" fill="none" stroke="#17A8D4" stroke-width="3" opacity=".9"/><circle cx="158" cy="305.0" r="5.8" fill="#DDE8F2"/><text x="158.0" y="363.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">AP 1</text>
<circle cx="478" cy="305.0" r="32" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="478" cy="305.0" r="19.8" fill="none" stroke="#17A8D4" stroke-width="3" opacity=".9"/><circle cx="478" cy="305.0" r="5.8" fill="#DDE8F2"/><text x="478.0" y="363.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">AP 2</text>
<path d="M408 367.0L188 331.0" stroke="#D2492F" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="395" y="363.0" width="26" height="44" rx="6" fill="#FFFFFF" stroke="#D2492F" stroke-width="2.5"/>
<text x="408.0" y="429.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">celular</text>
<text x="68.0" y="152.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Todo al máximo</text>
<rect x="612" y="124" width="540" height="330" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<clipPath id="s2"><rect x="612" y="160" width="540" height="290" rx="16"/></clipPath>
<g clip-path="url(#s2)"><circle cx="722" cy="305.0" r="140" fill="#0A63B8" fill-opacity="0.1" stroke="#0A63B8" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 6"/><circle cx="1042" cy="305.0" r="140" fill="#17A8D4" fill-opacity="0.1" stroke="#17A8D4" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 6"/></g>
<circle cx="722" cy="305.0" r="32" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="722" cy="305.0" r="19.8" fill="none" stroke="#17A8D4" stroke-width="3" opacity=".9"/><circle cx="722" cy="305.0" r="5.8" fill="#DDE8F2"/><text x="722.0" y="363.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">AP 1</text>
<circle cx="1042" cy="305.0" r="32" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="1042" cy="305.0" r="19.8" fill="none" stroke="#17A8D4" stroke-width="3" opacity=".9"/><circle cx="1042" cy="305.0" r="5.8" fill="#DDE8F2"/><text x="1042.0" y="363.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">AP 2</text>
<path d="M972 367.0L1032 331.0" stroke="#0E8F5E" stroke-width="3"/>
<rect x="959" y="363.0" width="26" height="44" rx="6" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/>
<text x="972.0" y="429.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">celular</text>
<text x="632.0" y="152.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Potencia baja, celdas chicas</text>
<text x="68.0" y="438.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">cada AP llega a todo el local</text>
<text x="632.0" y="438.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">celdas que apenas se solapan</text>
<rect x="48" y="474" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="486" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="508.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cliente pegajoso</tspan></text><text x="74.0" y="535.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El celular ve fuerte al AP 1 y no busca otro. El AP llega</tspan><tspan x="74.0" dy="21.6">lejos pero el celular no le contesta bien: reintentos,</tspan><tspan x="74.0" dy="21.6">velocidad baja y airtime gastado para todos.</tspan></text>
<rect x="612" y="474" width="540" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="486" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="508.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cada uno en su AP</tspan></text><text x="638.0" y="535.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Al acercarse al AP 2, el AP 1 se debilita y el celular se</tspan><tspan x="638.0" dy="21.6">pasa. Si queda un rincón débil, un AP más antes que subirle</tspan><tspan x="638.0" dy="21.6">a todos.</tspan></text>
</svg>