<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Standard o Hotspot: ¿hace falta un portal?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Standard o Hotspot: ¿hace falta un portal?</text>
<rect x="48" y="130" width="540" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="162.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Solo contraseña</text><text x="68.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">WiFi tipo Standard</text>
<circle cx="77" cy="214.4" r="4.5" fill="#17A8D4"/><text x="92.0" y="220.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">El invitado entra con la clave del WiFi, como en</tspan><tspan x="92.0" dy="23.0">cualquier red.</tspan></text><circle cx="77" cy="274.3" r="4.5" fill="#B45309"/><text x="92.0" y="279.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">La zona Hotspot trae la landing page activada:</tspan><tspan x="92.0" dy="23.0">desmarcá Show Landing Page en el Hotspot Portal.</tspan></text><circle cx="77" cy="334.2" r="4.5" fill="#17A8D4"/><text x="92.0" y="339.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Si no, aparece un portal que nadie pidió.</tspan></text>
<rect x="612" y="130" width="540" height="330" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="162.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Portal cautivo</text><text x="632.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">WiFi tipo Hotspot &gt; Captive Portal</text>
<circle cx="641" cy="214.4" r="4.5" fill="#17A8D4"/><text x="656.0" y="220.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Vouchers con vencimiento, usos y límite de velocidad.</tspan></text><circle cx="641" cy="251.3" r="4.5" fill="#17A8D4"/><text x="656.0" y="256.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Contraseña, pago con Stripe, Facebook o RADIUS.</tspan></text><circle cx="641" cy="288.3" r="4.5" fill="#17A8D4"/><text x="656.0" y="293.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Portal externo, con Pre-Authorization Allowances para</tspan><tspan x="656.0" dy="23.0">sus dominios.</tspan></text>
<circle cx="612" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="612.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="486" width="1104" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="498" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="520.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Los dos van en la red Invitados (zona Hotspot). Lo que cambia es cómo entra el invitado, no lo que puede tocar: el aislamiento</tspan><tspan x="74.0" dy="21.6">lo da la zona.</tspan></text>
</svg>