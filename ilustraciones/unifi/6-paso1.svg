<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Puerto de cámara: nativa CCTV y Block All</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Puerto de cámara: nativa CCTV y Block All</text>
<rect x="48" y="130" width="620" height="250" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 144a14 14 0 0 1 14 -14h592a14 14 0 0 1 14 14v26h-620z" fill="#E5F0FB"/><circle cx="68" cy="150" r="5" fill="#C2D4E6"/><circle cx="86" cy="150" r="5" fill="#C2D4E6"/><circle cx="104" cy="150" r="5" fill="#C2D4E6"/><text x="124.0" y="156.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UniFi Network</text><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Port Manager &gt; switch &gt; puerto de la cámara</text><text x="68.0" y="230.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Native VLAN / Network</text><text x="648.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">CCTV (VLAN 30)</text><rect x="58" y="246" width="600" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Tagged VLAN Management</text><text x="648.0" y="268.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Block All</text><text x="68.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">PoE</text><text x="648.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Power Cycle en el paso 3</text>
<text x="48.0" y="398.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Los valores van en el paso 2.</text>
<circle cx="48" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="760" y="150" width="392" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(780 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 15 5l2 5-12 3.5z"/><path d="m17 10 3.5 1.5M9 13l1 4M6 17h8"/></g><text x="824.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Cámara</text><text x="824.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">recibe su red sin etiqueta</text>
<path d="M710.0 262.0C730.0 262.0,730.0 262.0,750.0 262.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="760" y="270" width="392" height="110" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="784.0" y="312.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Toma IP de 192.168.30.0/24</text>
<text x="784.0" y="344.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y no puede pedir otra VLAN.</text>
<rect x="48" y="420" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="432" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué hace cada campo</tspan></text><text x="74.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Native VLAN dice en qué red caen las tramas sin etiqueta:</tspan><tspan x="74.0" dy="21.6">lo que manda la cámara entra a CCTV.</tspan></text>
<rect x="612" y="420" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="432" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="454.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Block All descarta cualquier trama que llegue con etiqueta</tspan><tspan x="638.0" dy="21.6">de otra VLAN. El puerto queda en una sola red.</tspan></text>
</svg>