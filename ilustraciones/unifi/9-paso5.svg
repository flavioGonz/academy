<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Lo que no tolera Fast Roaming, a su propio SSID</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Lo que no tolera Fast Roaming, a su propio SSID</text>
<circle cx="600" cy="200" r="46" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="600" cy="200" r="28.5" fill="none" stroke="#17A8D4" stroke-width="3" opacity=".9"/><circle cx="600" cy="200" r="8.3" fill="#DDE8F2"/>
<rect x="48" y="140" width="440" height="280" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">SSID principal</text><text x="68.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">red Staff</text>
<circle cx="77" cy="224.4" r="4.5" fill="#17A8D4"/><text x="92.0" y="230.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">BSS Transition: On</tspan></text><circle cx="77" cy="259.3" r="4.5" fill="#17A8D4"/><text x="92.0" y="264.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Fast Roaming: On</tspan></text><circle cx="77" cy="294.3" r="4.5" fill="#17A8D4"/><text x="92.0" y="299.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">WPA2/WPA3</tspan></text><circle cx="77" cy="329.2" r="4.5" fill="#17A8D4"/><text x="92.0" y="334.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Celulares y notebooks probados</tspan></text>
<rect x="712" y="140" width="440" height="280" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="732.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">SSID de legado</text><text x="732.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">su propia VLAN</text>
<circle cx="741" cy="224.4" r="4.5" fill="#17A8D4"/><text x="756.0" y="230.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="756.0" dy="0.0">Fast Roaming: Off</tspan></text><circle cx="741" cy="259.3" r="4.5" fill="#17A8D4"/><text x="756.0" y="264.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="756.0" dy="0.0">WPA2 (sin PMF obligatorio)</tspan></text><circle cx="741" cy="294.3" r="4.5" fill="#17A8D4"/><text x="756.0" y="299.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="756.0" dy="0.0">Lectores, impresoras, sensores</tspan></text><circle cx="741" cy="329.2" r="4.5" fill="#17A8D4"/><text x="756.0" y="334.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="756.0" dy="0.0">Sin acceso a los sistemas del staff</tspan></text>
<path d="M560.0 230.0C527.0 230.0,527.0 260.0,494.0 260.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M640.0 230.0C673.0 230.0,673.0 260.0,706.0 260.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="600.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="middle">mismo AP,</text>
<text x="600.0" y="322.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="middle">dos SSID</text>
<circle cx="712" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="712.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="450" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="462" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="484.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Así el lector viejo sigue andando y el SSID principal conserva Fast Roaming para las llamadas. El SSID de legado va en su VLAN</tspan><tspan x="74.0" dy="21.6">para que lo que no pudo subir de seguridad no llegue a los sistemas del staff.</tspan></text>
</svg>