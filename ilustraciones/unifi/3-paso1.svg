<circle cx="150" cy="220" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="150.0" y="226.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="478" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="490" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="512.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Para otra IP</tspan></text><text x="74.0" y="539.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con 10.10.10.20 sería 0x01040A0A0A14: cada número de la IP</tspan><tspan x="74.0" dy="21.6">pasa a dos dígitos hexadecimales (20 = 14).</tspan></text>
<rect x="612" y="478" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="490" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="512.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Con gateway UniFi</tspan></text><text x="638.0" y="539.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si el sitio tiene gateway UniFi, el mismo dato va en la</tspan><tspan x="638.0" dy="21.6">red, campo Option 43 Application Host Address.</tspan></text>
