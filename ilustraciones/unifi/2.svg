<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres condiciones para que un equipo adopte</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres condiciones para que un equipo adopte</text>
<circle cx="118" cy="268" r="42" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="118" cy="268" r="26.0" fill="none" stroke="#17A8D4" stroke-width="3" opacity=".9"/><circle cx="118" cy="268" r="7.6" fill="#DDE8F2"/><text x="118.0" y="336.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">AP nuevo</text><text x="118.0" y="358.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">o reseteado</text>
<rect x="222" y="140" width="248" height="256" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="258" cy="176" r="18" fill="#17A8D4"/><text x="258.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="288.0" y="174.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Libre de otro</text>
<text x="288.0" y="198.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">controlador</text>
<path d="M242 222H450" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="242.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Reset de fábrica y, si</text>
<text x="242.0" y="282.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">estaba adoptado, borrado</text>
<text x="242.0" y="308.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">del controlador viejo.</text>
<path d="M200.0 268.0C209.0 268.0,209.0 268.0,218.0 268.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="494" y="140" width="248" height="256" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="530" cy="176" r="18" fill="#17A8D4"/><text x="530.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="560.0" y="174.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Firmware</text>
<text x="560.0" y="198.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">compatible</text>
<path d="M514 222H722" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="514.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Desfase entre equipo y</text>
<text x="514.0" y="282.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">controlador: la falla</text>
<text x="514.0" y="308.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">más común (LazyAdmin).</text>
<path d="M472.0 268.0C481.0 268.0,481.0 268.0,490.0 268.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="766" y="140" width="248" height="256" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="802" cy="176" r="18" fill="#17A8D4"/><text x="802.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="832.0" y="174.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Llega al</text>
<text x="832.0" y="198.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">controlador</text>
<path d="M786 222H994" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="786.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">En L2: misma red y</text>
<text x="786.0" y="282.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">un solo servidor DHCP.</text>
<text x="786.0" y="308.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">En L3: inform (lección aparte).</text>
<path d="M744.0 268.0C753.0 268.0,753.0 268.0,762.0 268.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M1042.0 268.0C1054.0 268.0,1054.0 268.0,1066.0 268.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<circle cx="1104" cy="268" r="34" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<g transform="translate(1086 250) scale(1.5)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="1104.0" y="330.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="middle">Adopt</text>
<rect x="48" y="430" width="1104" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="442" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El orden en obra</tspan></text><text x="74.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Reset, misma red que el controlador, firmware, y recién ahí sospechás del controlador. Ese orden ahorra la primera hora de cada</tspan><tspan x="74.0" dy="21.6">obra.</tspan></text>
<rect x="48" y="548" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="560" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="582.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el equipo estaba adoptado en otro controlador, borralo primero ahí: si no, sigue buscando a su host viejo.</tspan></text>
</svg>