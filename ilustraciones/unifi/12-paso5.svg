<path d="M754.0 215.0C770.0 215.0,770.0 215.0,786.0 215.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M940.0 274.0 L940.0 346.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M786.0 405.0C770.0 405.0,770.0 405.0,754.0 405.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M450.0 405.0 L300.0 405.0 L300.0 274.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="118.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">sí: el siguiente</text>
<circle cx="110" cy="160" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="110.0" y="166.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="494" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="506" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Si empeora</tspan></text><text x="74.0" y="555.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">No: volvé lo último que tocaste. Muchas veces volver a los</tspan><tspan x="74.0" dy="21.6">valores por defecto es el primer paso (LazyAdmin).</tspan></text>
<rect x="612" y="494" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="506" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Y a veces</tspan></text><text x="638.0" y="555.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Donde se pueda tender, cable: el WiFi comparte el aire</tspan><tspan x="638.0" dy="21.6">entre todos y ninguna optimización arregla todo</tspan><tspan x="638.0" dy="21.6">(std.rocks).</tspan></text>
</svg>