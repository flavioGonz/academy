<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un cambio por vez, y si empeora, volvé atrás</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un cambio por vez, y si empeora, volvé atrás</text>
<rect x="110" y="160" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="130.0" y="206.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Mirar</text>
<text x="130.0" y="238.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">historial y Time Machine</text>
<rect x="450" y="160" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="470.0" y="206.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Escribir</text>
<text x="470.0" y="238.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">qué pasó, en tres líneas</text>
<rect x="790" y="160" width="300" height="110" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="810.0" y="206.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Un cambio</text>
<text x="810.0" y="238.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el único que vas a probar</text>
<rect x="790" y="350" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="810.0" y="396.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Probar</text>
<text x="810.0" y="428.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">caminata o el mismo cliente</text>
<rect x="450" y="350" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="470.0" y="396.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">¿Mejoró?</text>
<text x="470.0" y="428.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">comparalo con lo anotado</text>
