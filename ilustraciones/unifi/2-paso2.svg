<circle cx="966" cy="166" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(954 154)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="994.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Segundo DHCP</text>
<circle cx="955" cy="209.1" r="4.5" fill="#17A8D4"/><text x="970.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="970.0" dy="0.0">Módem o router del</tspan><tspan x="970.0" dy="20.2">cliente repartiendo</tspan><tspan x="970.0" dy="20.2">IP en la misma red.</tspan></text><circle cx="955" cy="279.8" r="4.5" fill="#17A8D4"/><text x="970.0" y="284.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="970.0" dy="0.0">El AP toma IP de otro</tspan><tspan x="970.0" dy="20.2">rango y no ve al</tspan><tspan x="970.0" dy="20.2">controlador.</tspan></text>
<rect x="930" y="400" width="222" height="72" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="930" y="412" width="5" height="48" rx="2.5" fill="#0E8F5E"/><text x="956.0" y="434.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="956.0" dy="0.0">Uno solo: el del</tspan><tspan x="956.0" dy="20.2">laboratorio.</tspan></text>
<rect x="70" y="580" width="820" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="70" y="592" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="96.0" y="614.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">En capa 2 el controlador descubre al AP sin configurar nada. Conectarlo al mismo switch que</tspan><tspan x="96.0" dy="21.6">el controlador descarta la red como sospechosa.</tspan></text>
