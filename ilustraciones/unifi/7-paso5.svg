<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>DFS: canales limpios que se dejan ante un radar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">DFS: canales limpios que se dejan ante un radar</text>
<text x="48.0" y="150.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Canales de 5 GHz (según el caso de std.rocks)</text>
<rect x="48" y="170" width="260" height="70" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="68.0" y="204.0" font-family="JetBrains Mono" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">36 a 48</text>
<text x="68.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#B45309" text-anchor="start">sin DFS</text>
<rect x="326" y="170" width="260" height="70" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="346.0" y="204.0" font-family="JetBrains Mono" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">52 a 64</text>
<text x="346.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start">DFS</text>
<rect x="604" y="170" width="480" height="70" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="624.0" y="204.0" font-family="JetBrains Mono" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">100 a 140</text>
<text x="624.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start">DFS</text>
<rect x="48" y="290" width="250" height="110" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="68.0" y="334.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">AP en canal DFS</text>
<text x="68.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">canal 64 limpio</text>
<path d="M302.0 345.0C313.0 345.0,313.0 345.0,324.0 345.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="328" y="290" width="250" height="110" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="348.0" y="334.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Aparece un radar</text>
<text x="348.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">meteorológico, militar</text>
<path d="M582.0 345.0C593.0 345.0,593.0 345.0,604.0 345.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="608" y="290" width="250" height="110" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="628.0" y="334.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">El AP deja el canal</text>
<text x="628.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">en el acto</text>
<path d="M862.0 345.0C873.0 345.0,873.0 345.0,884.0 345.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="888" y="290" width="250" height="110" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="908.0" y="334.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Clientes se cortan</text>
<text x="908.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">y reconectan</text>
<circle cx="48" cy="290" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="296.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="430" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="442" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cuándo sí</tspan></text><text x="74.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si 36 a 48 están saturados y el registro no muestra eventos</tspan><tspan x="74.0" dy="21.6">de radar, activá Extended 5 GHz Spectrum (DFS) y probá.</tspan></text>
<rect x="612" y="430" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="442" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="638.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cuándo no</tspan></text><text x="638.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Al día siguiente, AirView &gt; Radios &gt; Time Machine. Si ves</tspan><tspan x="638.0" dy="21.6">cambios de canal por radar, volvé a los canales bajos.</tspan></text>
</svg>