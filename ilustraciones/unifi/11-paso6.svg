<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Leé las notas antes del salto: el ejemplo de 11.0.97</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Leé las notas antes del salto: el ejemplo de 11.0.97</text>
<rect x="48" y="132" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Versión mínima</text>
<text x="70.0" y="200.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">UniFi OS 6.0 o superior.</text>
<text x="70.0" y="232.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">La actualización puede</text>
<text x="70.0" y="264.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">tardar hasta 20 minutos.</text>
<rect x="424" y="132" width="352" height="236" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="444.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Qué se elimina</text>
<text x="446.0" y="200.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">Soporte a USG (10.6 fue</text>
<text x="446.0" y="232.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">la última que lo tuvo).</text>
<text x="446.0" y="264.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">El Network Server: el</text>
<text x="446.0" y="296.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">reemplazo es UniFi OS Server.</text>
<text x="446.0" y="328.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">El historial de estadísticas.</text>
<rect x="800" y="132" width="352" height="236" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="820.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Qué se migra</text>
<text x="822.0" y="200.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">La base de datos, a</text>
<text x="822.0" y="232.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">PostgreSQL.</text>
<text x="822.0" y="264.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">Todos los sitios, al</text>
<text x="822.0" y="296.0" font-family="Instrument Sans" font-size="18" font-weight="400" fill="#41627F" text-anchor="start">firewall por zonas.</text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="48" y="400" width="1104" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="412" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="434.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Un cliente con USG, o con un server que todavía no está en UniFi OS 6, no puede pasar a Network 11: se entera leyendo la nota,</tspan><tspan x="74.0" dy="21.6">no el lunes. Las notas están en community.ui.com, sección Releases.</tspan></text>
</svg>