<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Entrá por SSH y leé info antes de adoptar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Entrá por SSH y leé info antes de adoptar</text>
<rect x="48" y="130" width="610" height="286" rx="14" fill="#03213C"/><text x="66.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SSH AL AP RESETEADO</text><text x="66.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3B5" text-anchor="start">$ ssh ubnt@192.168.88.20</text><text x="66.0" y="212.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  usuario y clave de fábrica: ubnt / ubnt</text><text x="66.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3B5" text-anchor="start"># info</text><text x="66.0" y="264.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start"></text><text x="66.0" y="290.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Model:       &lt;modelo de tu AP&gt;</text><text x="66.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Version:     &lt;firmware&gt;</text><text x="66.0" y="342.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">IP Address:  192.168.88.20</text><text x="66.0" y="368.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Status:      Not Adopted</text><text x="66.0" y="394.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">             (http://unifi:8080/inform)</text>
<path d="M664 285H694" stroke="#17A8D4" stroke-width="2" stroke-dasharray="4 4"/>
<text x="704.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">¿es el equipo que pensás?</text>
<path d="M664 311H694" stroke="#17A8D4" stroke-width="2" stroke-dasharray="4 4"/>
<text x="704.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">firmware: compará con el controlador</text>
<path d="M664 337H694" stroke="#17A8D4" stroke-width="2" stroke-dasharray="4 4"/>
<text x="704.0" y="342.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">¿quedó en la red del controlador?</text>
<path d="M664 363H694" stroke="#17A8D4" stroke-width="2" stroke-dasharray="4 4"/>
<text x="704.0" y="368.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">estado y URL de inform a la que apunta</text>
<rect x="48" y="470" width="610" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La IP la sacás de la lista de leases del DHCP o con WiFiman. Si ya</tspan><tspan x="74.0" dy="21.6">entrás por SSH, set-default resetea igual que el botón de 10</tspan><tspan x="74.0" dy="21.6">segundos.</tspan></text>
<rect x="700" y="470" width="452" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="700" y="482" width="5" height="78" rx="2.5" fill="#B45309"/><text x="726.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">Desfase de firmware</tspan></text><text x="726.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">El firmware que ves en Version es el primer</tspan><tspan x="726.0" dy="21.6">sospechoso si después no adopta.</tspan></text>
</svg>