<text x="454.0" y="430.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Ejemplo: gestión sin etiqueta, 20 y 30 etiquetadas.</text>
<rect x="48" y="300" width="350" height="145" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="312" width="5" height="121" rx="2.5" fill="#D2492F"/><text x="74.0" y="334.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El caso</tspan></text><text x="74.0" y="360.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Un lector de LazyAdmin tenía la VLAN</tspan><tspan x="74.0" dy="21.6">del AP etiquetada en el switch del</tspan><tspan x="74.0" dy="21.6">medio: el AP no anduvo hasta dejarla</tspan><tspan x="74.0" dy="21.6">sin etiqueta.</tspan></text>
<rect x="48" y="490" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="502" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="524.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Un switch no administrable en el camino descarta o pierde las etiquetas: con VLANs, todo lo que está entre el gateway y el AP</tspan><tspan x="74.0" dy="21.6">tiene que ser administrable y llevar las mismas VLAN.</tspan></text>
