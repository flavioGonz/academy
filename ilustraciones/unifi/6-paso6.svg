<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Probá con tu notebook en el puerto de la cámara</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Probá con tu notebook en el puerto de la cámara</text>
<rect x="48" y="130" width="420" height="110" rx="18" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="68.0" y="164.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Switch</text><rect x="208" y="180" width="100" height="46" rx="8" fill="#17A8D4" stroke="#17A8D4" stroke-width="2"/><text x="258.0" y="210.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">cámara</text>
<rect x="128" y="330" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(148 356.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="192.0" y="368.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook</text><text x="192.0" y="391.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">en lugar de la cámara</text>
<path d="M258.0 226.0 L258.0 330.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="258.0" cy="226.0" r="4.5" fill="#0A63B8"/><circle cx="258.0" cy="330.0" r="4.5" fill="#0A63B8"/>
<circle cx="296" cy="280" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="296.0" y="286.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="520" y="130" width="632" height="96" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="556" cy="178" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(544 166)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="588.0" y="170.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">Recibe 192.168.30.x</text>
<text x="588.0" y="198.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">cae en la VLAN de cámaras</text>
<rect x="520" y="244" width="632" height="96" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="556" cy="292" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(544 280)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="588.0" y="284.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#D2492F" text-anchor="start">No llega a Staff 10.10.10.0/24</text>
<text x="588.0" y="312.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">ni a las PCs ni al resto de la red</text>
<text x="48.0" y="470.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Para puertos expuestos (exterior, estacionamiento), una capa más:</text>
<rect x="48" y="492" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="504" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cámaras de terceros</tspan></text><text x="74.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Fijá la MAC de la cámara en el puerto: otro equipo</tspan><tspan x="74.0" dy="21.6">enchufado ahí no entra (lo que hace The Hook Up).</tspan></text>
<rect x="612" y="492" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="504" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cámaras UniFi</tspan></text><text x="638.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Lock Port to UniFi Device en Port Manager (Network</tspan><tspan x="638.0" dy="21.6">10.6.101, switch con firmware 7.6 o superior).</tspan></text>
</svg>