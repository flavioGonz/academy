<text x="120.0" y="184.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Backup</text>
<text x="72.0" y="228.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">dos copias fuera del equipo</text>
<rect x="424" y="132" width="340" height="124" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="462" cy="176" r="20" fill="#17A8D4"/><text x="462.0" y="183.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="496.0" y="184.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Notas de versión</text>
<text x="448.0" y="228.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">qué pide, qué saca, qué migra</text>
<rect x="800" y="132" width="340" height="124" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="838" cy="176" r="20" fill="#17A8D4"/><text x="838.0" y="183.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="872.0" y="184.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Solo Official</text>
<text x="824.0" y="228.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">ni Release Candidate ni Beta</text>
<rect x="800" y="302" width="340" height="124" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="838" cy="346" r="20" fill="#17A8D4"/><text x="838.0" y="353.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="872.0" y="354.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Esperar</text>
<text x="824.0" y="398.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">HostiFi: 2 a 3 semanas</text>
<rect x="424" y="302" width="340" height="124" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<circle cx="462" cy="346" r="20" fill="#17A8D4"/><text x="462.0" y="353.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="496.0" y="354.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Sitio piloto</text>
<text x="448.0" y="398.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">uno, con alguien atento</text>
<rect x="48" y="302" width="340" height="124" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="86" cy="346" r="20" fill="#17A8D4"/><text x="86.0" y="353.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="120.0" y="354.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">El resto</text>
<text x="72.0" y="398.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">recién ahí, por tandas</text>
