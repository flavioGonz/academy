<rect x="48" y="474" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="486" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="508.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Si igual sale mal</tspan></text><text x="74.0" y="535.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Network 10.5 y posteriores permiten revertir firmware y</tspan><tspan x="74.0" dy="21.6">aplicación, y Test and Confirm deshace un cambio si perdés</tspan><tspan x="74.0" dy="21.6">conexión.</tspan></text>
<rect x="612" y="474" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="486" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="508.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Por qué esperar</tspan></text><text x="638.0" y="535.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">HostiFi saltó la 7.5.174 por redes WiFi que no se emitían.</tspan><tspan x="638.0" dy="21.6">Esperar y mirar los foros evita estrenar la falla.</tspan></text>
</svg>