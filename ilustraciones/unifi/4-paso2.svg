<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Si la consola no aparece, revisá estas cuatro</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Si la consola no aparece, revisá estas cuatro</text>
<rect x="48" y="128" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="168" r="18" fill="#B45309"/><text x="84.0" y="174.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="116.0" y="162.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Remote Management apagado</text>
<text x="116.0" y="188.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Settings &gt; Control Plane &gt; Console</text>
<rect x="48" y="220" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="260" r="18" fill="#B45309"/><text x="84.0" y="266.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="116.0" y="254.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Salida TCP 443 u 8883 bloqueada</text>
<text x="116.0" y="280.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">firewall del sitio, de salida</text>
<rect x="48" y="312" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="352" r="18" fill="#B45309"/><text x="84.0" y="358.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="116.0" y="346.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">DNS (UDP 53) o NTP (UDP 123) bloqueados</text>
<text x="116.0" y="372.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">sin hora ni nombres no conecta</text>
<rect x="48" y="404" width="600" height="80" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="444" r="18" fill="#B45309"/><text x="84.0" y="450.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="116.0" y="438.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Entraste con otra cuenta UI</text>
<text x="116.0" y="464.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">solo ves lo que esa cuenta administra</text>
<rect x="684" y="128" width="468" height="144" rx="12" fill="#03213C"/><text x="700.0" y="150.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">DESDE UNA PC DE ESA RED</text><text x="700.0" y="177.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3B5" text-anchor="start">PS&gt; Test-NetConnection unifi.ui.com -Port 443</text><text x="700.0" y="203.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">    TcpTestSucceeded : True</text><text x="700.0" y="229.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3B5" text-anchor="start">PS&gt; Resolve-DnsName unifi.ui.com</text><text x="700.0" y="255.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">    devuelve direcciones: DNS anda</text>
<circle cx="684" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="684.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="684" y="296" width="468" height="118" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="684" y="308" width="5" height="94" rx="2.5" fill="#0A63B8"/><text x="710.0" y="330.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Si TcpTestSucceeded da False, el 443 de salida</tspan><tspan x="710.0" dy="21.6">está cerrado. El 8883 se revisa en las reglas del</tspan><tspan x="710.0" dy="21.6">firewall: TCP 443 y 8883, UDP 53 y UDP 123, de</tspan><tspan x="710.0" dy="21.6">salida.</tspan></text>
</svg>