<rect x="48" y="488" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="500" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el formulario no muestra Zone, el sitio sigue en el firewall clásico: en Settings buscá la opción de actualizar al firewall</tspan><tspan x="74.0" dy="21.6">por zonas (Policy Engine). Ese es el paso 2.</tspan></text>
