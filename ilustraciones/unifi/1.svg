<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La configuración vive en el controlador de cada sitio</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La configuración vive en el controlador de cada sitio</text>
<rect x="430" y="120" width="340" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(450 146.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="494.0" y="158.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Site Manager</text><text x="494.0" y="181.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">unifi.ui.com</text>
<rect x="800.0" y="131.0" width="214.8" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="907.4" y="152.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">la puerta, no el cerebro</text>
<text x="806.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">conecta, no guarda configuración</text>
<rect x="48" y="262" width="340" height="232" rx="22" fill="none" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="7 7"/><rect x="66" y="248" width="182" height="28" rx="14" fill="#F7FAFD"/><text x="78.0" y="268.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">Sitio A · un local</text>
<rect x="68" y="292" width="300" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(88 318.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="132.0" y="330.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Cloud Gateway</text><text x="132.0" y="353.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">UCG o UDM</text>
<text x="76.0" y="416.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">El gateway es el controlador.</text>
<text x="76.0" y="442.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Switches y AP: host = UCG.</text>
<path d="M600.0 204.0 L600.0 236.0 L348.0 236.0 L348.0 286.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/>
<rect x="430" y="262" width="340" height="232" rx="22" fill="none" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="7 7"/><rect x="448" y="248" width="235" height="28" rx="14" fill="#F7FAFD"/><text x="460.0" y="268.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">Sitio B · consola aparte</text>
<rect x="450" y="292" width="300" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(470 318.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="514.0" y="330.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">CloudKey</text><text x="514.0" y="353.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">controlador del sitio</text>
<text x="458.0" y="416.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Switches y AP del sitio:</text>
<text x="458.0" y="442.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">host = CloudKey.</text>
<path d="M600.0 204.0 L600.0 236.0 L730.0 236.0 L730.0 286.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/>
<rect x="812" y="262" width="340" height="232" rx="22" fill="none" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="7 7"/><rect x="830" y="248" width="262" height="28" rx="14" fill="#F7FAFD"/><text x="842.0" y="268.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">Sucursales · server central</text>
<rect x="832" y="292" width="300" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(852 318.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="896.0" y="330.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">UniFi OS Server</text><text x="896.0" y="353.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">VM 10.10.10.5</text>
<text x="840.0" y="416.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Gateway del sitio: UXG</text>
<text x="840.0" y="442.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">o de terceros.</text>
<path d="M600.0 204.0 L600.0 236.0 L1112.0 236.0 L1112.0 286.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/>
<rect x="48" y="520" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="532" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cae internet</tspan></text><text x="74.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si cae internet en el cliente, el sitio se sigue</tspan><tspan x="74.0" dy="21.6">gestionando en local, desde la red del sitio.</tspan></text>
<rect x="612" y="520" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="532" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cae el controlador</tspan></text><text x="638.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Los equipos siguen andando con la última configuración. Lo</tspan><tspan x="638.0" dy="21.6">que perdés es cambiar, adoptar y ver estadísticas.</tspan></text>
</svg>