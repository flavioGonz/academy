<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un equipo, un solo host: anotá quién manda</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un equipo, un solo host: anotá quién manda</text>
<text x="48.0" y="150.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Con UniFi OS Server central</text>
<rect x="48" y="168" width="530" height="152" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 180a12 12 0 0 1 12 -12h506a12 12 0 0 1 12 12v26h-530z" fill="#E5F0FB"/><text x="62.0" y="192.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">EQUIPO</text><text x="212.0" y="192.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">HOST</text><text x="62.0" y="230.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Gateway</text><text x="212.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">UXG, o uno de terceros</text><path d="M60 244H566" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Switches</text><text x="212.0" y="268.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">UniFi OS Server 10.10.10.5</text><path d="M60 282H566" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">AP</text><text x="212.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">UniFi OS Server 10.10.10.5</text>
<text x="624.0" y="150.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Con Cloud Gateway en el sitio</text>
<rect x="624" y="168" width="528" height="152" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M624 180a12 12 0 0 1 12 -12h504a12 12 0 0 1 12 12v26h-528z" fill="#E5F0FB"/><text x="638.0" y="192.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">EQUIPO</text><text x="788.0" y="192.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">HOST</text><text x="638.0" y="230.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Gateway</text><text x="788.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">UCG: es el controlador</text><path d="M636 244H1140" stroke="#DDE8F2" stroke-width="1"/><text x="638.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Switches</text><text x="788.0" y="268.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">UCG</text><path d="M636 282H1140" stroke="#DDE8F2" stroke-width="1"/><text x="638.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">AP</text><text x="788.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">UCG</text>
<circle cx="72" cy="372" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(60 360)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="104.0" y="366.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">UDM o UCG manejado por un UniFi OS Server externo</text>
<text x="104.0" y="392.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">No se puede: el gateway corre su propio Network.</text>
<circle cx="72" cy="446" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(60 434)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="104.0" y="440.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">El mismo AP en dos controladores a la vez</text>
<text x="104.0" y="466.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Un CloudKey con Protect no gestiona los equipos que ya maneja el server.</text>
<rect x="48" y="510" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="522" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">En la planilla del sitio</tspan></text><text x="74.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Escribí esta tabla antes de cotizar. Elegir mal el host obliga a migrar a los seis meses, y no clones la VM del server para</tspan><tspan x="74.0" dy="21.6">otro cliente: los clones comparten los tokens de acceso remoto de Site Manager.</tspan></text>
</svg>