<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>En el historial: roam, no desconexión</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">En el historial: roam, no desconexión</text>
<text x="48.0" y="150.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">Bien: un roam</text><rect x="48" y="170" width="500" height="50" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="298.0" y="202.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="middle">AP 1</text><rect x="548" y="170" width="604" height="50" rx="10" fill="#E0F5FA" stroke="#17A8D4" stroke-width="2"/><text x="850.0" y="202.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#17A8D4" text-anchor="middle">AP 2</text><circle cx="548" cy="195" r="14" fill="#0E8F5E" stroke="#FFFFFF" stroke-width="3"/><text x="548.0" y="252.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">roam en el borde de la celda</text>
<text x="48.0" y="310.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#D2492F" text-anchor="start">Mal: desconexión y reconexión</text><rect x="48" y="330" width="500" height="50" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="298.0" y="362.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="middle">AP 1</text><rect x="548" y="330" width="150" height="50" rx="10" fill="#FCEAE6" stroke="#D2492F" stroke-width="2" stroke-dasharray="6 5"/><text x="623.0" y="362.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#D2492F" text-anchor="middle">sin red</text><rect x="698" y="330" width="454" height="50" rx="10" fill="#E0F5FA" stroke="#17A8D4" stroke-width="2"/><text x="925.0" y="362.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#17A8D4" text-anchor="middle">AP 2</text><text x="623.0" y="412.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">hueco de cobertura o equipo que no tolera la función</text>
<text x="48.0" y="470.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">tiempo de la caminata con la llamada en curso →</text>
<circle cx="48" cy="170" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="176.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="500" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Client Devices &gt; el cliente &gt; historial de conexión y roaming (Network 10.5 en adelante). Cada paso de AP tiene que verse como</tspan><tspan x="74.0" dy="21.6">roam; si ves desconexiones, el cambio no está listo para producción.</tspan></text>
