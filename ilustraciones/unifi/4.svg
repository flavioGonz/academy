<rect x="48" y="544" width="1104" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="556" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="578.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">No hace falta abrir ningún puerto de entrada. Si un sitio no aparece: Remote Management apagado, salida 443 u 8883 bloqueada,</tspan><tspan x="74.0" dy="21.6">DNS o NTP bloqueados, o entraste con otra cuenta UI. La lista sale de UniHosted, que cita a Ubiquiti: confirmala en cada sitio.</tspan></text>
