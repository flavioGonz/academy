<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La URL de inform, pieza por pieza</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La URL de inform, pieza por pieza</text>
<rect x="60" y="140" width="150" height="66" rx="12" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="135.0" y="182.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="middle">http://</text>
<text x="135.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="middle">http, no https</text>
<rect x="224" y="140" width="330" height="66" rx="12" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="389.0" y="182.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="middle">unifi.example.com</text>
<text x="389.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="middle">nombre DNS mejor que IP</text>
<rect x="568" y="140" width="140" height="66" rx="12" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="638.0" y="182.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="middle">:8080</text>
<text x="638.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="middle">puerto 8080</text>
<rect x="722" y="140" width="150" height="66" rx="12" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="797.0" y="182.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="middle">/inform</text>
<text x="797.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="middle">termina así</text>
<circle cx="944" cy="172" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(932 160)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="974.0" y="178.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">así adopta</text>
<circle cx="80" cy="292" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(68 280)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="112.0" y="286.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">https:// o un puerto que no es 8080</text>
<text x="112.0" y="312.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Un lector de LazyAdmin dejó sus AP &quot;en el limbo&quot; así.</text>
<rect x="48" y="352" width="640" height="196" rx="12" fill="#03213C"/><text x="64.0" y="374.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PLAN B POR SSH</text><text x="64.0" y="401.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3B5" text-anchor="start">$ ssh ubnt@192.168.88.20</text><text x="64.0" y="427.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># set-inform http://unifi.example.com:8080/inform</text><text x="64.0" y="453.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># info</text><text x="64.0" y="479.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">  -&gt; pendiente en el controlador: Adopt</text><text x="64.0" y="505.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># set-inform http://unifi.example.com:8080/inform</text><text x="64.0" y="531.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">  -&gt; una vez más, para completar la asociación</text>
<circle cx="48" cy="352" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="358.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="716" y="352" width="436" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="716" y="364" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="742.0" y="386.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="742.0" dy="0.0">Por qué se repite</tspan></text><text x="742.0" y="412.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="742.0" dy="0.0">Sikich avisa que a veces hay que repetir set-</tspan><tspan x="742.0" dy="21.6">inform más de una vez para que el equipo</tspan><tspan x="742.0" dy="21.6">termine de asociarse.</tspan></text>
<rect x="716" y="500" width="436" height="97" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="716" y="512" width="5" height="73" rx="2.5" fill="#B45309"/><text x="742.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="742.0" dy="0.0">Lo que entra por SSH puede perderse tras un</tspan><tspan x="742.0" dy="21.6">reinicio: mirá el sitio después de cada</tspan><tspan x="742.0" dy="21.6">actualización.</tspan></text>
</svg>