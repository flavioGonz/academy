<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Punto de partida con varios AP: baja, media, alta</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Punto de partida con varios AP: baja, media, alta</text>
<rect x="48" y="130" width="560" height="290" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 144a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="150" r="5" fill="#C2D4E6"/><circle cx="86" cy="150" r="5" fill="#C2D4E6"/><circle cx="104" cy="150" r="5" fill="#C2D4E6"/><text x="124.0" y="156.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UniFi Network</text><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">AirView &gt; Radios</text><rect x="58" y="208" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="230.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">2.4 GHz</text><text x="588.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Low</text><text x="68.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">5 GHz</text><text x="588.0" y="268.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Medium</text><text x="68.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"></text><text x="588.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Low si hay un AP por ambiente</text><text x="68.0" y="344.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">6 GHz</text><text x="588.0" y="344.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">High</text>
<circle cx="48" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="640.0" y="154.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">2.4 GHz, baja</text>
<text x="640.0" y="182.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="640.0" dy="0.0">Atraviesa más paredes. Purple: en diseños enterprise suele</tspan><tspan x="640.0" dy="21.6">ir 3 a 6 dB por debajo de 5 GHz.</tspan></text>
<text x="640.0" y="261.2" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">5 GHz, entre baja y media</text>
<text x="640.0" y="289.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="640.0" dy="0.0">Media si un AP cubre varios ambientes; baja si hay uno por</tspan><tspan x="640.0" dy="21.6">ambiente.</tspan></text>
<text x="640.0" y="368.4" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">6 GHz, alta</text>
<text x="640.0" y="396.4" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="640.0" dy="0.0">Alcanza menos que las otras dos: arranca alta.</tspan></text>
<rect x="48" y="450" width="560" height="81" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="462" width="5" height="57" rx="2.5" fill="#B45309"/><text x="74.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La excepción</tspan></text><text x="74.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con un solo AP, potencia alta: no hay otro AP al que pasarse.</tspan></text>
<rect x="640" y="450" width="512" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="640" y="462" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="666.0" y="484.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Son puntos de partida (WunderTech, LazyAdmin,</tspan><tspan x="666.0" dy="21.6">std.rocks). Se ajustan AP por AP, caminando.</tspan></text>
</svg>