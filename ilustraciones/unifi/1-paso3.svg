<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">UNIFI · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Entrá a la dirección que te da el instalador</text>
<rect x="48" y="150" width="250" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">navegador</text>
<rect x="48" y="400" width="300" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(68 426.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="112.0" y="438.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">VM Ubuntu 24.04</text><text x="112.0" y="461.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">UniFi OS Server</text>
<path d="M173.0 234.0C173.0 325.3,173.0 308.7,173.0 400.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="173.0" cy="234.0" r="5" fill="#0A63B8"/><circle cx="173.0" cy="400.0" r="5" fill="#0A63B8"/><rect x="140.5" y="298.0" width="65.0" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="173.0" y="317.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">https</text>
<text x="48.0" y="520.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">IP de ejemplo de la VM: 10.10.10.5</text>
<text x="48.0" y="546.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">2 vCPU · 2 GB RAM · 10 GB libres</text>
<rect x="420" y="128" width="732" height="108" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="462" cy="182" r="20" fill="#17A8D4"/><text x="462.0" y="189.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">a</text>
<text x="500.0" y="170.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Leé la dirección al final</text>
<text x="500.0" y="200.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">https, IP de la VM y el puerto</text>
<text x="500.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">que indica el instalador</text>
<rect x="420" y="256" width="732" height="108" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="462" cy="310" r="20" fill="#17A8D4"/><text x="462.0" y="317.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">b</text>
<text x="500.0" y="298.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Creá el admin local</text>
<text x="500.0" y="328.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">usuario y contraseña propios,</text>
<text x="500.0" y="350.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">anotados en la ficha</text>
<rect x="420" y="384" width="732" height="108" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="462" cy="438" r="20" fill="#0E8F5E"/><text x="462.0" y="445.0" font-family="Familjen Grotesk" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">c</text>
<text x="500.0" y="426.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Entrá a UniFi Network</text>
<text x="500.0" y="456.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y anotá dos versiones:</text>
<text x="500.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">UniFi OS y Network</text>
<circle cx="420" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="420.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="420" y="520" width="732" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="420" y="532" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="446.0" y="554.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="446.0" dy="0.0">Network 11 pide UniFi OS 6.0 o superior. Por eso se anotan las dos versiones: la</tspan><tspan x="446.0" dy="21.6">de UniFi OS dice hasta dónde puede subir Network.</tspan></text>
</svg>