<rect x="48" y="528" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="540" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="562.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué pasa sin mayoría</tspan></text><text x="74.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Sin quórum, /etc/pve queda de solo lectura: no se crean ni</tspan><tspan x="74.0" dy="21.6">arrancan VMs, y la HA no conmuta.</tspan></text>
<rect x="612" y="528" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="540" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="562.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">La red del clúster</tspan></text><text x="638.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Corosync: menos de 5 ms, red física propia y un segundo</tspan><tspan x="638.0" dy="21.6">enlace. El QDevice va por TCP y puede estar en otra sede.</tspan></text>
