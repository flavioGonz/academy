<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La cuenta del ARC: 2 GiB más 1 GiB por TiB de pool</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La cuenta del ARC: 2 GiB más 1 GiB por TiB de pool</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="80.0" y="132.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Ejemplo: pool ZFS de 4 TiB</text>
<rect x="48" y="168" width="320" height="120" rx="16" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="208.0" y="226.0" font-family="Familjen Grotesk" font-size="34" font-weight="700" fill="#0A63B8" text-anchor="middle">2 GiB</text>
<text x="208.0" y="262.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="middle">base</text>
<text x="406.0" y="238.0" font-family="Familjen Grotesk" font-size="36" font-weight="600" fill="#6E88A1" text-anchor="middle">+</text>
<rect x="428" y="168" width="320" height="120" rx="16" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="588.0" y="226.0" font-family="Familjen Grotesk" font-size="34" font-weight="700" fill="#0A63B8" text-anchor="middle">4 GiB</text>
<text x="588.0" y="262.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="middle">1 por TiB</text>
<text x="786.0" y="238.0" font-family="Familjen Grotesk" font-size="36" font-weight="600" fill="#6E88A1" text-anchor="middle">=</text>
<rect x="808" y="168" width="320" height="120" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="968.0" y="226.0" font-family="Familjen Grotesk" font-size="34" font-weight="700" fill="#0E8F5E" text-anchor="middle">6 GiB</text>
<text x="968.0" y="262.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="middle">límite sugerido</text>
<text x="48.0" y="334.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">En bytes, como lo pide el módulo: 6 × 1024³ = 6442450944</text>
<rect x="48" y="352" width="640" height="152" rx="12" fill="#03213C"/><text x="64.0" y="374.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">LO QUE TENDRÍAS QUE VER CON ESE LÍMITE</text><text x="64.0" y="402.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># cat /sys/module/zfs/parameters/zfs_arc_max</text><text x="64.0" y="430.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">6442450944</text><text x="64.0" y="458.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># cat /etc/modprobe.d/zfs.conf</text><text x="64.0" y="486.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FE0B0" text-anchor="start">options zfs zfs_arc_max=6442450944</text>
<rect x="720" y="352" width="432" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="720" y="364" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="746.0" y="386.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="746.0" dy="0.0">Qué trae de fábrica</tspan></text><text x="746.0" y="412.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="746.0" dy="0.0">Desde la 8.1, el instalador lo deja en el 10 %</tspan><tspan x="746.0" dy="21.6">de la RAM con tope de 16 GiB. Compará ese</tspan><tspan x="746.0" dy="21.6">valor con tu cuenta.</tspan></text>
<rect x="720" y="490" width="432" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="720" y="502" width="5" height="51" rx="2.5" fill="#B45309"/><text x="746.0" y="524.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="746.0" dy="0.0">Bajarlo en un servidor en producción hace que</tspan><tspan x="746.0" dy="21.6">el disco rinda menos. Cambialo con cuidado.</tspan></text>
</svg>