<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Una VM bien armada: cuatro elecciones al crearla</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Una VM bien armada: cuatro elecciones al crearla</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="122" width="560" height="330" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 136a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="142" r="5" fill="#C2D4E6"/><circle cx="86" cy="142" r="5" fill="#C2D4E6"/><circle cx="104" cy="142" r="5" fill="#C2D4E6"/><text x="124.0" y="148.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">VM 100 · Hardware y Options</text><text x="68.0" y="192.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Processors · Type</text><text x="588.0" y="192.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">x86-64-v2-AES</text><text x="68.0" y="230.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">SCSI Controller</text><text x="588.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">VirtIO SCSI single</text><text x="68.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Hard Disk (scsi0)</text><text x="588.0" y="268.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">iothread=1</text><text x="68.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Network Device (net0)</text><text x="588.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">virtio, bridge=vmbr0</text><text x="68.0" y="344.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">QEMU Guest Agent</text><text x="588.0" y="344.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Enabled</text><text x="68.0" y="382.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">CD/DVD (ide2)</text><text x="588.0" y="382.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">virtio-win.iso</text>
<circle cx="690" cy="144" r="18" fill="#17A8D4"/><text x="690.0" y="150.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="720.0" y="150.0" font-family="Instrument Sans" font-size="17" font-weight="700" fill="#04223D" text-anchor="start">Disco en VirtIO SCSI single con IO Thread</text>
<text x="720.0" y="176.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="720.0" dy="0.0">Es lo que la guía recomienda para rendimiento. IDE solo</tspan><tspan x="720.0" dy="20.2">para sistemas muy viejos.</tspan></text>
<circle cx="690" cy="236" r="18" fill="#17A8D4"/><text x="690.0" y="242.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="720.0" y="242.0" font-family="Instrument Sans" font-size="17" font-weight="700" fill="#04223D" text-anchor="start">Placa de red VirtIO</text>
<text x="720.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="720.0" dy="0.0">Paravirtual: el invitado sabe que es virtual y no emula</tspan><tspan x="720.0" dy="20.2">una placa vieja.</tspan></text>
<circle cx="690" cy="328" r="18" fill="#17A8D4"/><text x="690.0" y="334.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="720.0" y="334.0" font-family="Instrument Sans" font-size="17" font-weight="700" fill="#04223D" text-anchor="start">Guest agent activado y adentro</text>
<text x="720.0" y="360.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="720.0" dy="0.0">Apagado limpio y backups con el sistema de archivos</tspan><tspan x="720.0" dy="20.2">congelado.</tspan></text>
<circle cx="690" cy="420" r="18" fill="#B45309"/><text x="690.0" y="426.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="720.0" y="426.0" font-family="Instrument Sans" font-size="17" font-weight="700" fill="#04223D" text-anchor="start">CPU host, solo si no vas a migrar</text>
<text x="720.0" y="452.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="720.0" dy="0.0">Con migración en vivo, el modelo de la generación más</tspan><tspan x="720.0" dy="20.2">vieja del clúster.</tspan></text>
<circle cx="632" cy="230" r="13" fill="#17A8D4"/><text x="632.0" y="235.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="632" cy="268" r="13" fill="#17A8D4"/><text x="632.0" y="273.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="632" cy="306" r="13" fill="#17A8D4"/><text x="632.0" y="311.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="632" cy="344" r="13" fill="#17A8D4"/><text x="632.0" y="349.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="632" cy="192" r="13" fill="#B45309"/><text x="632.0" y="197.4" font-family="Familjen Grotesk" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="494" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="506" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Windows</tspan></text><text x="74.0" y="555.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Los drivers no vienen en Windows: van desde el ISO virtio-win, en la versión que la wiki de Proxmox marca sin problemas</tspan><tspan x="74.0" dy="21.6">conocidos (0.1.271 a septiembre de 2026), no la última a ciegas.</tspan></text>
</svg>