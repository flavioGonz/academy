<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>pveum: un usuario y un rol sobre el árbol de permisos</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">pveum: un usuario y un rol sobre el árbol de permisos</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="80" y="124" width="640" height="136" rx="12" fill="#03213C"/><text x="96.0" y="158.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">pveum user add tecnico@pve --comment &quot;Técnico de soporte&quot;</text><text x="96.0" y="186.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">pveum passwd tecnico@pve</text><text x="96.0" y="214.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FE0B0" text-anchor="start">pveum acl modify / --user tecnico@pve --role PVEAuditor</text><text x="96.0" y="242.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">pveum user permissions tecnico@pve</text>
<rect x="760" y="124" width="392" height="240" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="784.0" y="160.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#6E88A1" text-anchor="start">Árbol de permisos</text>
<text x="800.0" y="202.0" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#0A63B8" text-anchor="start">/</text>
<text x="830.0" y="242.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">/nodes</text>
<text x="830.0" y="282.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">/vms</text>
<text x="830.0" y="322.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">/storage</text>
<path d="M808 206 V322" stroke="#C2D4E6" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="823.0" y="182.0" width="114.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="880.0" y="203.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">PVEAuditor</text>
<text x="784.0" y="352.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Asignado en /, se hereda hacia abajo.</text>
<text x="80.0" y="420.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Lo que puede hacer tecnico@pve:</text>
<circle cx="104" cy="464" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(92 452)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="134.0" y="470.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">ver nodos, VMs y almacenamiento</text>
<circle cx="104" cy="516" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(92 504)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="134.0" y="522.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">ver estado y configuración</text>
<circle cx="644" cy="464" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(632 452)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="674.0" y="470.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">prender, apagar o borrar VMs</text>
<circle cx="644" cy="516" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(632 504)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="674.0" y="522.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">cambiar la configuración</text>
<rect x="80" y="566" width="1072" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="80" y="578" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="106.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="106.0" dy="0.0">Realm pve: contraseñas propias de Proxmox, lo más cómodo en instalaciones chicas. pam es para usuarios del sistema Linux.</tspan></text>
</svg>