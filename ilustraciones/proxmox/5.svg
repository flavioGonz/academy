<rect x="48" y="468" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="480" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="502.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué plantilla</tspan></text><text x="74.0" y="529.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Instalar desde ISO lleva unos veinte minutos; clonar una</tspan><tspan x="74.0" dy="21.6">plantilla, menos de uno. Y todas quedan iguales.</tspan></text>
<rect x="612" y="468" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="480" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="502.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Full o linked</tspan></text><text x="638.0" y="529.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Un linked clone depende de la plantilla: si la plantilla se</tspan><tspan x="638.0" dy="21.6">borra, se rompe. Para producción, full clone.</tspan></text>
