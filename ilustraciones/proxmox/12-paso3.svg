<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un lock que quedó: mirá antes de destrabar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un lock que quedó: mirá antes de destrabar</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="80" y="124" width="560" height="180" rx="12" fill="#03213C"/><text x="96.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">EJEMPLO</text><text x="96.0" y="174.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># grep -l &#x27;^lock:&#x27; /etc/pve/qemu-server/*.conf</text><text x="96.0" y="202.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFD38A" text-anchor="start">/etc/pve/qemu-server/100.conf</text><text x="96.0" y="230.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"></text><text x="96.0" y="258.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># grep &#x27;^lock:&#x27; /etc/pve/qemu-server/100.conf</text><text x="96.0" y="286.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFD38A" text-anchor="start">lock: backup</text>
<rect x="680" y="124" width="472" height="200" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="704.0" y="160.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Quién pone un lock</text>
<circle cx="712" cy="189" r="4.5" fill="#17A8D4"/>
<text x="728.0" y="194.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">un backup en curso</text>
<circle cx="712" cy="225" r="4.5" fill="#17A8D4"/>
<text x="728.0" y="230.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">un snapshot</text>
<circle cx="712" cy="261" r="4.5" fill="#17A8D4"/>
<text x="728.0" y="266.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">una migración</text>
<text x="704.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Si se corta la luz a mitad, queda puesto.</text>
<text x="80.0" y="372.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Antes de destrabar, confirmá:</text>
<circle cx="104" cy="414" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(92 402)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="134.0" y="420.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">no hay una tarea corriendo sobre la VM 100 (Tasks del nodo)</text>
<circle cx="104" cy="464" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(92 452)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="134.0" y="470.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">no hay un backup ni una migración en curso</text>
<path d="M760 440 H812" stroke="#0E8F5E" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="820" y="418" width="260" height="46" rx="10" fill="#03213C"/><text x="836.0" y="447.3" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#7FE0B0" text-anchor="start">qm unlock 100</text>
<rect x="80" y="530" width="1072" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="80" y="542" width="5" height="51" rx="2.5" fill="#B45309"/><text x="106.0" y="564.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="106.0" dy="0.0">Destrabar con un backup corriendo puede dejar la VM o el backup a medias. El lock está para protegerte: sacalo solo cuando</tspan><tspan x="106.0" dy="21.6">sabés por qué quedó.</tspan></text>
</svg>