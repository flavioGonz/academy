<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>pct create: qué define cada opción</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">pct create: qué define cada opción</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="80" y="132" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="161.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">300</text>
<path d="M558 155 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="161.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">el CTID, como el VMID de una VM</text>
<rect x="80" y="192" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="221.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">local:vztmpl/&lt;plantilla&gt;</text>
<path d="M558 215 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="221.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">la plantilla Debian que bajaste con pveam</text>
<rect x="80" y="252" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="281.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">--hostname ct-prueba</text>
<path d="M558 275 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="281.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">nombre del contenedor</text>
<rect x="80" y="312" width="470" height="46" rx="10" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="98.0" y="341.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">--unprivileged 1</text>
<path d="M558 335 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="341.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">no privilegiado: el default y lo seguro</text>
<rect x="80" y="372" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="401.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">--memory 512</text>
<path d="M558 395 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="401.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">MB de RAM</text>
<rect x="80" y="432" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="461.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">--rootfs local-lvm:8</text>
<path d="M558 455 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="461.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">disco raíz de 8 GB en local-lvm</text>
<rect x="80" y="492" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="521.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">--net0 name=eth0,bridge=vmbr0,ip=dhcp</text>
<path d="M558 515 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="521.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">placa eth0 en vmbr0, IP por DHCP</text>
<rect x="80" y="552" width="470" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="2"/>
<text x="98.0" y="581.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D9E9F8" text-anchor="start">--password &#x27;…&#x27;</text>
<path d="M558 575 H596" stroke="#17A8D4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<text x="608.0" y="581.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">clave de root de ejemplo: cambiala</text>
<text x="80.0" y="630.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">Después: pct start 300 y pct enter 300 para entrar.</text>
</svg>