<text x="636.0" y="390.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">El thin pool data: discos de VM y contenedores. Un disco</tspan><tspan x="636.0" dy="21.6">de 32 GB con 3 GB escritos ocupa 3 GB.</tspan></text>
<text x="48.0" y="482.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">En un host instalado con ZFS vas a ver local-zfs (zfspool) en lugar de local-lvm.</text>
