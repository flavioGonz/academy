<text x="72.0" y="390.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Un directorio: guarda archivos. ISO, plantillas de</tspan><tspan x="72.0" dy="21.6">contenedor y backups de vzdump en /var/lib/vz.</tspan></text>
