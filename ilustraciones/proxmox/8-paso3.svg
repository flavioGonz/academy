<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Usuario, token y permiso: escribir sí, borrar no</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Usuario, token y permiso: escribir sí, borrar no</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="80" y="140" width="320" height="130" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="100.0" y="176.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#6E88A1" text-anchor="start">Usuario</text>
<text x="100.0" y="212.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">backup@pbs</text>
<text x="100.0" y="246.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">user create</text>
<path d="M404 205 H434" stroke="#0A63B8" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="440" y="140" width="320" height="130" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="460.0" y="176.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#6E88A1" text-anchor="start">Token</text>
<text x="460.0" y="212.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">backup@pbs!pve</text>
<text x="460.0" y="246.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">user generate-token</text>
<path d="M764 205 H794" stroke="#0A63B8" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="140" width="320" height="130" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="820.0" y="176.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#9FC3E3" text-anchor="start">Permiso</text>
<text x="820.0" y="212.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">DatastoreBackup</text>
<text x="820.0" y="246.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">acl update</text>
<text x="800.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="start">sobre /datastore/main</text>
<text x="80.0" y="300.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="start">Los tres con proxmox-backup-manager, en el PBS</text>
<text x="48.0" y="352.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Lo que puede hacer Proxmox VE con ese token:</text>
<circle cx="72" cy="400" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(60 388)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="102.0" y="406.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">crear backups nuevos</text>
<circle cx="72" cy="452" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(60 440)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="102.0" y="458.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">leerlos para restaurar</text>
<circle cx="492" cy="400" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(480 388)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="522.0" y="406.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">borrar backups</text>
<circle cx="492" cy="452" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(480 440)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="522.0" y="458.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start">cambiar la retención</text>
<rect x="48" y="500" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El secreto</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">PBS muestra el secreto del token una sola vez. Guardalo en</tspan><tspan x="74.0" dy="21.6">el gestor de contraseñas apenas lo generás.</tspan></text>
<rect x="612" y="500" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="512" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Por qué no root</tspan></text><text x="638.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Hay guías que conectan con root@pam. Funciona, pero un host</tspan><tspan x="638.0" dy="21.6">tomado podría borrar todo el datastore.</tspan></text>
</svg>