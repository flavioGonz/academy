<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>disarm-ha: el fencing pasa de armed a disarmed</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">disarm-ha: el fencing pasa de armed a disarmed</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="48" y="150" width="340" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="72.0" y="196.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#0E8F5E" text-anchor="start">armed</text>
<text x="72.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">los watchdogs están abiertos: un</tspan><tspan x="72.0" dy="21.6">nodo sin quórum se reinicia</tspan></text>
<path d="M392 235 H420" stroke="#6E88A1" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gray)"/>
<rect x="424" y="150" width="340" height="170" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="448.0" y="196.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">disarming</text>
<text x="448.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="448.0" dy="0.0">congela los servicios y espera que</tspan><tspan x="448.0" dy="21.6">cada nodo suelte su watchdog</tspan></text>
<path d="M768 235 H796" stroke="#6E88A1" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gray)"/>
<rect x="800" y="150" width="340" height="170" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="824.0" y="196.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#D2492F" text-anchor="start">disarmed</text>
<text x="824.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="824.0" dy="0.0">sin fencing ni failover: la HA no</tspan><tspan x="824.0" dy="21.6">protege nada</tspan></text>
<text x="48.0" y="452.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Lo ves en la línea de fencing de:</text>
<rect x="340" y="424" width="260" height="40" rx="10" fill="#03213C"/><text x="356.0" y="449.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">ha-manager status</text>
<path d="M808 324 V378 H210 V330" stroke="#0E8F5E" stroke-width="3" stroke-dasharray="8 6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="510.0" y="404.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#0E8F5E" text-anchor="middle">para volver: ha-manager crm-command arm-ha</text>
<rect x="48" y="500" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">freeze o ignore</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">freeze deja los servicios como están; ignore los saca del</tspan><tspan x="74.0" dy="21.6">control de la HA para moverlos a mano.</tspan></text>
<rect x="612" y="500" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Ventana corta</tspan></text><text x="638.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Mientras está desarmada, una falla real no se recupera</tspan><tspan x="638.0" dy="21.6">sola. La ventana, lo más corta posible.</tspan></text>
</svg>