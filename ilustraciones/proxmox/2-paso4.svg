<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>bridge vlan show: qué VLAN lleva cada puerto</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">bridge vlan show: qué VLAN lleva cada puerto</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="124" width="560" height="220" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SALIDA DE EJEMPLO · VM 100 CON TAG 10</text><text x="64.0" y="176.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start"># bridge vlan show</text><text x="64.0" y="206.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">port        vlan-id</text><text x="64.0" y="236.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">eno1        1 PVID Egress Untagged</text><text x="64.0" y="266.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">            2-4094</text><text x="64.0" y="296.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">vmbr0       1 PVID Egress Untagged</text><text x="64.0" y="326.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#7FE0B0" text-anchor="start">tap100i0    10 PVID Egress Untagged</text>
<text x="48.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">tap100i0 es la placa net0 de la VM 100: tap&lt;VMID&gt;i&lt;placa&gt;.</text>
<rect x="640" y="140" width="512" height="104" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="174.0" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#0A63B8" text-anchor="start">eno1 · 2-4094</text>
<text x="660.0" y="204.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">la placa física lleva todas las VLAN etiquetadas hacia</tspan><tspan x="660.0" dy="21.6">el switch (trunk).</tspan></text>
<rect x="640" y="260" width="512" height="104" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="294.0" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#0E8F5E" text-anchor="start">tap100i0 · 10 PVID</text>
<text x="660.0" y="324.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">lo que sale de la VM entra a la VLAN 10; la VM no ve</tspan><tspan x="660.0" dy="21.6">tags.</tspan></text>
<rect x="640" y="380" width="512" height="104" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="414.0" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#0A63B8" text-anchor="start">Egress Untagged</text>
<text x="660.0" y="444.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">al entregarle a la VM, el bridge saca la etiqueta.</tspan></text>
<rect x="48" y="408" width="560" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="420" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="442.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué buscar</tspan></text><text x="74.0" y="468.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si tap100i0 no aparece, la VM está apagada. Si aparece con 1</tspan><tspan x="74.0" dy="21.6">en vez de 10, el tag no quedó en la placa.</tspan></text>
</svg>