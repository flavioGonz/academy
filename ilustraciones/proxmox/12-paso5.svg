<text x="672.0" y="178.0" font-family="JetBrains Mono" font-size="21" font-weight="700" fill="#0E8F5E" text-anchor="start">/etc/sysctl.d/</text>
<text x="672.0" y="206.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#41627F" text-anchor="start">un archivo por tema: NN-nombre.conf</text>
<rect x="672" y="226" width="456" height="108" rx="12" fill="#03213C"/><text x="688.0" y="260.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start"># /etc/sysctl.d/90-ies.conf</text><text x="688.0" y="288.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">net.ipv4.ip_forward=1</text><text x="688.0" y="316.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">vm.swappiness=10</text>
<text x="80.0" y="438.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Para ver qué hay en el viejo, sin comentarios ni líneas vacías:</text>
<rect x="80" y="454" width="720" height="40" rx="10" fill="#03213C"/><text x="96.0" y="479.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">cat /etc/sysctl.conf | grep -v &#x27;^#&#x27; | grep .</text>
<rect x="80" y="532" width="1072" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="80" y="544" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="106.0" y="566.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="106.0" dy="0.0">Los valores de arriba son un ejemplo de formato, no una recomendación: mové los que encuentres en el host.</tspan></text>
