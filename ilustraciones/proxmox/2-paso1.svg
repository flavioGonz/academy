<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tildá VLAN aware en vmbr0 y aplicá la configuración</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tildá VLAN aware en vmbr0 y aplicá la configuración</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="124" width="520" height="330" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 138a14 14 0 0 1 14 -14h492a14 14 0 0 1 14 14v26h-520z" fill="#E5F0FB"/><circle cx="68" cy="144" r="5" fill="#C2D4E6"/><circle cx="86" cy="144" r="5" fill="#C2D4E6"/><circle cx="104" cy="144" r="5" fill="#C2D4E6"/><text x="124.0" y="150.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Edit: Linux Bridge</text><text x="66.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Node → System → Network → vmbr0</text><text x="68.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Name</text><text x="548.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">vmbr0</text><text x="68.0" y="262.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">IPv4/CIDR</text><text x="548.0" y="262.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">10.10.10.2/24</text><text x="68.0" y="300.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Gateway (IPv4)</text><text x="548.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">10.10.10.1</text><text x="68.0" y="338.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Bridge ports</text><text x="548.0" y="338.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">eno1</text><rect x="58" y="354" width="500" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="376.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">VLAN aware</text><text x="548.0" y="376.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">tildado</text>
<rect x="640" y="140" width="512" height="92" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="660.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">La GUI escribe primero en</text>
<text x="660.0" y="206.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">/etc/network/interfaces.new</text>
<path d="M896 236L896 282" stroke="#17A8D4" stroke-width="3" fill="none" marker-end="url(#a-cyan)"/>
<rect x="720" y="282" width="352" height="48" rx="24" fill="#17A8D4" stroke="#17A8D4" stroke-width="2"/>
<text x="896.0" y="313.0" font-family="Instrument Sans" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Apply Configuration</text>
<path d="M896 334L896 378" stroke="#17A8D4" stroke-width="3" fill="none" marker-end="url(#a-cyan)"/>
<rect x="640" y="378" width="512" height="76" rx="14" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="660.0" y="410.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Recién ahí pasa a</text>
<text x="660.0" y="438.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">/etc/network/interfaces</text>
<rect x="48" y="486" width="520" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="498" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="520.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué en dos tiempos</tspan></text><text x="74.0" y="547.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Editado a mano, se aplica con ifreload -a. Así, un error</tspan><tspan x="74.0" dy="21.6">a medio aplicar no te deja el nodo sin red.</tspan></text>
<rect x="640" y="486" width="512" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="498" width="5" height="78" rx="2.5" fill="#B45309"/><text x="666.0" y="520.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">Ojo con la gestión</tspan></text><text x="666.0" y="547.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Si la IP de gestión pasa a una VLAN tagueada, al aplicar</tspan><tspan x="666.0" dy="21.6">desde lejos se corta. Hacelo con consola local o IPMI.</tspan></text>
</svg>