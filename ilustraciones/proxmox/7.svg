<rect x="48" y="124" width="520" height="330" rx="18" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Disco del host · local-lvm</text>
<rect x="72" y="186" width="470" height="70" rx="12" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/><g transform="translate(84 208.0) scale(1.05)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="118.0" y="218.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">VM 100</text><text x="118.0" y="240.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">su disco, en producción</text>
<rect x="72" y="270" width="470" height="70" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><g transform="translate(84 292.0) scale(1.05)" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="118.0" y="302.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Snapshot de la VM 100</text><text x="118.0" y="324.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">mismo disco, mismo pool</text>
<rect x="72" y="362" width="470" height="70" rx="12" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="96.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="700" fill="#D2492F" text-anchor="start">Si este disco muere, se pierden</text>
<text x="96.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">la VM y su snapshot juntos.</text>
<path d="M568 230 H644" stroke="#0A63B8" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="567.0" y="194.0" width="78.0" height="28" rx="14.0" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="606.0" y="214.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">vzdump</text>
<rect x="652" y="124" width="500" height="210" rx="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="676.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#0E8F5E" text-anchor="start">Otro almacenamiento</text>
<text x="676.0" y="192.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">local, NFS o Proxmox Backup Server</text>
<rect x="676" y="212" width="452" height="40" rx="10" fill="#03213C"/><text x="692.0" y="237.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">vzdump-qemu-100-&lt;fecha&gt;.vma.zst</text>
<text x="676.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Copia completa: configuración y discos.</text>
<text x="676.0" y="314.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">Sobrevive si el disco de la VM muere.</text>
<path d="M902 334 V372" stroke="#0E8F5E" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="652" y="380" width="500" height="74" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<text x="676.0" y="412.0" font-family="Instrument Sans" font-size="17" font-weight="700" fill="#04223D" text-anchor="start">Restore de prueba a la VM 900</text>
<text x="676.0" y="436.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">nunca encima de la VM 100</text>
<rect x="48" y="480" width="520" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="492" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Para qué sí sirve el snapshot</tspan></text><text x="74.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Sirve para deshacer un cambio: antes de actualizar, un</tspan><tspan x="74.0" dy="21.6">snapshot; si sale mal, rollback en minutos.</tspan></text>
<rect x="612" y="480" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="492" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cuándo cuenta un backup</tspan></text><text x="638.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Un backup cuenta cuando lo restauraste en una VM nueva y</tspan><tspan x="638.0" dy="21.6">arrancó. Anotá cuánto tardó.</tspan></text>
</svg>