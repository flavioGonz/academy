<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Clon full, cloud-init y la VM nace con su IP</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Clon full, cloud-init y la VM nace con su IP</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="48" y="124" width="300" height="130" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="68.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Plantilla 9000</text>
<text x="68.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">debian13-tpl</text>
<path d="M348 189 H420" stroke="#0A63B8" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="340.0" y="138.0" width="96.0" height="28" rx="14.0" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="388.0" y="158.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">--full 1</text>
<rect x="428" y="124" width="300" height="130" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="448.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">VM 201 · prueba-ci</text>
<text x="448.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">copia independiente</text>
<text x="448.0" y="216.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">qm resize 201 scsi0 +10G</text>
<rect x="48" y="284" width="680" height="124" rx="12" fill="#03213C"/><text x="64.0" y="306.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">LO QUE VA AL CD DE CLOUD-INIT</text><text x="64.0" y="334.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">qm set 201 --ciuser tecnico</text><text x="64.0" y="362.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">  --sshkeys /root/.ssh/id_ed25519.pub</text><text x="64.0" y="390.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">  --ipconfig0 ip=10.10.10.201/24,gw=10.10.10.1</text>
<path d="M728 340 H800" stroke="#17A8D4" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cyan)"/>
<rect x="808" y="124" width="344" height="300" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="828.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#0E8F5E" text-anchor="start">Primer arranque</text>
<circle cx="846" cy="206" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(834 194)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="876.0" y="212.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">crea el usuario tecnico</text>
<circle cx="846" cy="252" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(834 240)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="876.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">copia la clave SSH</text>
<circle cx="846" cy="298" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(834 286)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="876.0" y="304.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">pone 10.10.10.201/24</text>
<circle cx="846" cy="344" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(834 332)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="876.0" y="350.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">y el gateway 10.10.10.1</text>
<text x="48.0" y="470.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Mirá el arranque en xterm.js y entrá:</text>
<rect x="48" y="486" width="420" height="40" rx="10" fill="#03213C"/><text x="64.0" y="511.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">ssh tecnico@10.10.10.201</text>
<rect x="500" y="456" width="652" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="500" y="468" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="526.0" y="490.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="526.0" dy="0.0">Si cambiás algo de cloud-init después del primer arranque, regenerá el CD</tspan><tspan x="526.0" dy="21.6">con qm cloudinit update 201. Claves SSH mejor que contraseña: la</tspan><tspan x="526.0" dy="21.6">contraseña queda guardada en los datos de cloud-init.</tspan></text>
</svg>