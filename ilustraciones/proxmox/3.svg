<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>LVM-thin o ZFS: decidí con lo que tiene el servidor</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PROXMOX VE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">LVM-thin o ZFS: decidí con lo que tiene el servidor</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="122" width="540" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="164.0" font-family="Familjen Grotesk" font-size="26" font-weight="600" fill="#04223D" text-anchor="start">LVM-thin</text>
<text x="72.0" y="192.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">local-lvm · instalar con ext4 o xfs</text>
<path d="M68 210H568" stroke="#DDE8F2" stroke-width="1.5"/>
<circle cx="90" cy="244" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(78 232)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="120.0" y="250.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Simple y rápido</text>
<circle cx="90" cy="288" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(78 276)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="120.0" y="294.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Snapshots y linked clones</text>
<circle cx="90" cy="332" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(78 320)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="120.0" y="338.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Ocupa solo lo escrito</text>
<circle cx="90" cy="376" r="18" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="90.0" y="382.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">!</text><text x="120.0" y="382.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Sin integridad ni RAID propio</text>
<text x="72.0" y="424.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start"><tspan x="72.0" dy="0.0">Va bien con RAID por hardware, SSD de consumo o poca RAM.</tspan></text>
<rect x="612" y="122" width="540" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="636.0" y="164.0" font-family="Familjen Grotesk" font-size="26" font-weight="600" fill="#04223D" text-anchor="start">ZFS</text>
<text x="636.0" y="192.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">local-zfs · instalar con ZFS</text>
<path d="M632 210H1132" stroke="#DDE8F2" stroke-width="1.5"/>
<circle cx="654" cy="244" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(642 232)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="684.0" y="250.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Detecta y corrige corrupción</text>
<circle cx="654" cy="288" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(642 276)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="684.0" y="294.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Compresión y snapshots</text>
<circle cx="654" cy="332" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(642 320)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="684.0" y="338.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">RAID por software y replicación</text>
<circle cx="654" cy="376" r="18" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="654.0" y="382.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">!</text><text x="684.0" y="382.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Pide RAM, ECC y discos directos</text>
<text x="636.0" y="424.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start"><tspan x="636.0" dy="0.0">Va bien con HBA (o modo IT), SSD con PLP y RAM de sobra.</tspan></text>
<rect x="48" y="476" width="1104" height="74" rx="14" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="88" cy="513" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(76 501)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="120.0" y="506.0" font-family="Instrument Sans" font-size="19" font-weight="700" fill="#D2492F" text-anchor="start">Nunca ZFS encima de una controladora RAID por hardware con caché</text>
<text x="120.0" y="532.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">ZFS necesita ver cada disco: con la RAID en el medio pierde lo que lo hace confiable.</text>
<rect x="48" y="570" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="582" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="604.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Es lo más caro de cambiar después: se elige en el instalador, antes de la primera VM.</tspan></text>
</svg>