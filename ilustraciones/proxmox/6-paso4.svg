<text x="672.0" y="326.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Host Proxmox</text>
<text x="672.0" y="372.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">uid 100000</text>
<text x="672.0" y="402.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#9FC3E3" text-anchor="start">un usuario sin privilegios</text>
<text x="672.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#7FE0B0" text-anchor="start">no puede tocar archivos del host</text>
<rect x="48" y="534" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="546" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="568.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En el host, pct config 300 | grep unprivileged tiene que mostrar unprivileged: 1. En un contenedor privilegiado, el root de</tspan><tspan x="74.0" dy="21.6">adentro sería el root del host.</tspan></text>
</svg>