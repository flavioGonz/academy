<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">cat /proc/self/uid_map: el root de adentro no es root</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="124" width="560" height="108" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">ADENTRO DEL CT 300</text><text x="64.0" y="178.4" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#D9E9F8" text-anchor="start"># cat /proc/self/uid_map</text><text x="64.0" y="212.4" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#7FE0B0" text-anchor="start">         0     100000      65536</text>
<text x="640.0" y="152.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="start">0</text>
<text x="740.0" y="152.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">uid adentro del contenedor</text>
<text x="640.0" y="186.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="start">100000</text>
<text x="740.0" y="186.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">el uid que le corresponde en el host</text>
<text x="640.0" y="220.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0E8F5E" text-anchor="start">65536</text>
<text x="740.0" y="220.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">cuántos uid se mapean en fila</text>
<rect x="48" y="290" width="500" height="220" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="72.0" y="326.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#0E8F5E" text-anchor="start">Contenedor 300</text>
<text x="72.0" y="372.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#04223D" text-anchor="start">root</text>
<text x="72.0" y="402.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">uid 0</text>
<text x="72.0" y="470.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">uid 1 → 100001 … uid 65535 → 165535</text>
