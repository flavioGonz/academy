<rect x="760" y="280" width="340" height="110" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2"/>
<text x="780.0" y="318.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#17A8D4" text-anchor="start">Debian 10.10.10.13</text>
<text x="780.0" y="346.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">corosync-qnetd</text>
<text x="780.0" y="370.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">no corre VMs: solo vota</text>
