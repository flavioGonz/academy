<text x="120.0" y="520.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">En los dos nodos: corosync-qdevice. En pve1:</text>
<rect x="120" y="536" width="460" height="40" rx="10" fill="#03213C"/><text x="136.0" y="561.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">pvecm qdevice setup 10.10.10.13</text>
<rect x="640" y="470" width="512" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="640" y="482" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="666.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">El QDevice no exige la latencia de corosync: puede estar</tspan><tspan x="666.0" dy="21.6">en otra sede. Se recomienda en clústeres pares, no en</tspan><tspan x="666.0" dy="21.6">impares.</tspan></text>
