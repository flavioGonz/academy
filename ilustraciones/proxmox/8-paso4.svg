.0" y="376.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">main</text><text x="68.0" y="414.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Fingerprint</text><text x="628.0" y="414.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">AA:BB:… del dashboard</text>
<rect x="684" y="140" width="468" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="684" y="152" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="710.0" y="174.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Username lleva el token completo: usuario, ! y</tspan><tspan x="710.0" dy="21.6">nombre del token.</tspan></text>
<rect x="684" y="256" width="468" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="684" y="268" width="5" height="51" rx="2.5" fill="#B45309"/><text x="710.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">En Password va el secreto que PBS mostró una vez,</tspan><tspan x="710.0" dy="21.6">no la clave del usuario.</tspan></text>
<rect x="684" y="372" width="468" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="684" y="384" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="710.0" y="406.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">El fingerprint se copia del dashboard del PBS (web</tspan><tspan x="710.0" dy="21.6">en el puerto 8007).</tspan></text>
<text x="48.0" y="520.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Después lanzá un backup de prueba y mirá en PBS, Content, que aparezca.</text>
