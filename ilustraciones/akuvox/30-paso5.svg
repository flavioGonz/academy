<rect x="530" y="560" width="620" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="530" y="572" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="556.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="556.0" dy="0.0">RSAC-C1-R8: 8 relés, 8 salidas y 8 entradas; hasta 3 por monitor,</tspan><tspan x="556.0" dy="21.6">dirección por DIP.</tspan></text>
