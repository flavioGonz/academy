<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Pasá una tarjeta y mirá llegar las líneas</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · LECCIÓN 17 · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Pasá una tarjeta y mirá llegar las líneas</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}</style>
<rect x="48" y="130" width="760" height="182" rx="14" fill="#03213C"/><text x="66.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PC DE LABORATORIO · 192.168.88.10</text><text x="66.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ python3 -m http.server 8000 --bind 192.168.88.10</text><text x="66.0" y="212.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start">Serving HTTP on 192.168.88.10 port 8000 ...</text><text x="66.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FD6F2" text-anchor="start">192.168.88.21 - - [...] &quot;GET /validcard=... HTTP/1.1&quot; 404 -</text><text x="66.0" y="264.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FD6F2" text-anchor="start">192.168.88.21 - - [...] &quot;GET /relaytrigger=1 HTTP/1.1&quot; 404 -</text><text x="66.0" y="290.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FD6F2" text-anchor="start">192.168.88.21 - - [...] &quot;GET /relayclose=0 HTTP/1.1&quot; 404 -</text>
<path d="M1000.0 232.0C911.0 232.0,911.0 232.0,822.0 232.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="1012.0" y="238.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">tarjeta válida</text>
<path d="M1000.0 258.0C911.0 258.0,911.0 258.0,822.0 258.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="1012.0" y="264.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">el relé A abre</text>
<path d="M1000.0 284.0C911.0 284.0,911.0 284.0,822.0 284.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="1012.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">el relé A cierra</text>
<rect x="48" y="340" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="352" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="374.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">404 es normal</tspan></text><text x="74.0" y="400.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El 404 no importa: el servidor no tiene esa página, pero la</tspan><tspan x="74.0" dy="21.6">línea demuestra que el portero avisó.</tspan></text>
<rect x="612" y="340" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="352" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="374.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Paso 4: sumá mac=$mac:ip=$ip:model=$model a una URL y</tspan><tspan x="638.0" dy="21.6">fijate que llegan los datos del equipo.</tspan></text>
<rect x="48" y="470" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="482" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">$card_sn y $code viajan dentro de la URL: el servidor va en la VLAN de porteros y no deja esos logs a la vista.</tspan></text>
</svg>