<rect x="48" y="140" width="420" height="200" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 154a14 14 0 0 1 14 -14h392a14 14 0 0 1 14 14v26h-420z" fill="#E5F0FB"/><circle cx="68" cy="160" r="5" fill="#C2D4E6"/><circle cx="86" cy="160" r="5" fill="#C2D4E6"/><circle cx="104" cy="160" r="5" fill="#C2D4E6"/><text x="124.0" y="166.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Web del portero</text><text x="66.0" y="206.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Status &gt; Basic &gt; Product Information</text><rect x="58" y="218" width="400" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="240.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Firmware</text><text x="448.0" y="240.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">29.30.10.x</text>
<text x="68.0" y="300.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#B45309" text-anchor="start">tercer bloque: 10</text>
<text x="68.0" y="324.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">10 o más = rama de alta seguridad</text>
<rect x="520" y="140" width="632" height="136" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<rect x="520" y="154" width="6" height="108" rx="3" fill="#0A63B8"/>
<text x="546.0" y="178.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Tercer bloque menor a 10</text>
<text x="546.0" y="202.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">rama sin alta seguridad</text>
<rect x="546" y="220" width="586" height="40" rx="10" fill="#03213C"/><text x="562.0" y="245.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">/fcgi/do (formato viejo)</text>
