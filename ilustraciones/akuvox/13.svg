<rect x="520" y="300" width="632" height="136" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<rect x="520" y="314" width="6" height="108" rx="3" fill="#0E8F5E"/>
<text x="546.0" y="338.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">10 o más · High Security Mode encendido</text>
<text x="546.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">encendido de fábrica en el E18</text>
<rect x="546" y="380" width="586" height="40" rx="10" fill="#03213C"/><text x="562.0" y="405.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">solo /fcgi/OpenDoor</text>
<path d="M470.0 236.0 L492.0 236.0 L492.0 368.0 L512.0 368.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/>
<rect x="520" y="460" width="632" height="136" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<rect x="520" y="474" width="6" height="108" rx="3" fill="#B45309"/>
<text x="546.0" y="498.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">10 o más · High Security Mode apagado</text>
<text x="546.0" y="522.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Security &gt; Basic &gt; High Security Mode</text>
<rect x="546" y="540" width="586" height="40" rx="10" fill="#03213C"/><text x="562.0" y="565.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">/fcgi/OpenDoor y también /fcgi/do</text>
<path d="M470.0 236.0 L492.0 236.0 L492.0 528.0 L512.0 528.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/>
<rect x="48" y="380" width="420" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="392" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="414.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">DoorNum=1 dispara el relé A y DoorNum=2 el</tspan><tspan x="74.0" dy="21.6">relé B, en cualquier formato.</tspan></text>
<rect x="48" y="500" width="420" height="93" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="69" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Apagar la alta seguridad para usar la URL vieja</tspan><tspan x="74.0" dy="20.2">funciona, pero Akuvox recomienda el formato</tspan><tspan x="74.0" dy="20.2">nuevo.</tspan></text>
