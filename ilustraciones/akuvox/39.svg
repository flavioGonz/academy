<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El pedido sale de la ficha del modelo exacto</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El pedido sale de la ficha del modelo exacto</text>
<rect x="70" y="170" width="150" height="260" rx="20" fill="#26323F" stroke="#011E38" stroke-width="2"/><circle cx="145" cy="204" r="13" fill="#0B1A28" stroke="#5B6F84" stroke-width="2"/><circle cx="145" cy="204" r="5" fill="#17A8D4"/><rect x="92" y="232" width="106" height="92" rx="8" fill="#0B1A28" stroke="#5B6F84"/><circle cx="145" cy="366" r="22" fill="#3A4A5C" stroke="#17A8D4" stroke-width="2"/><text x="145.0" y="460.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="middle">Portero</text><text x="145.0" y="482.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">ej. R29C</text>
<rect x="300" y="140" width="400" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="320.0" y="180.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="320.0" dy="0.0">Frente</tspan></text><text x="320.0" y="211.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="320.0" dy="0.0">Versión exacta: R29S, R29C, R29C-L o</tspan><tspan x="320.0" dy="21.6">R29C-T.</tspan></text>
<rect x="730" y="140" width="400" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="750.0" y="180.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="750.0" dy="0.0">Montaje</tspan></text><text x="750.0" y="211.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="750.0" dy="0.0">Caja o soporte de embutir o de superficie</tspan><tspan x="750.0" dy="21.6">del modelo.</tspan></text>
<rect x="300" y="300" width="400" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="320.0" y="340.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="320.0" dy="0.0">Cubierta de lluvia</tspan></text><text x="320.0" y="371.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="320.0" dy="0.0">La del modelo y su color (R29: negro o</tspan><tspan x="320.0" dy="21.6">plata).</tspan></text>
<rect x="730" y="300" width="400" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="750.0" y="340.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="750.0" dy="0.0">Alimentación</tspan></text><text x="750.0" y="371.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="750.0" dy="0.0">PoE del tipo que pide, o la fuente de la</tspan><tspan x="750.0" dy="21.6">tabla.</tspan></text>
<rect x="300" y="460" width="400" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="320.0" y="500.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="320.0" dy="0.0">Cerradura</tspan></text><text x="320.0" y="531.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="320.0" dy="0.0">Desde el portero si su salida alcanza; si</tspan><tspan x="320.0" dy="21.6">no, fuente propia.</tspan></text>
<rect x="730" y="460" width="400" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="750.0" y="500.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="750.0" dy="0.0">Módulos</tspan></text><text x="750.0" y="531.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="750.0" dy="0.0">SR01, lector o Bkey, si la obra los pide.</tspan></text>
<text x="300.0" y="640.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">R29C-L (con LTE) lleva su propio soporte y no admite PoE.</text>
</svg>