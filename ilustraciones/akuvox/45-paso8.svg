t-weight="400" fill="#41627F" text-anchor="start">grupo + Priority of Call</text><path d="M72 278H1128" stroke="#DDE8F2" stroke-width="1"/><text x="74.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">R20K</text><text x="264.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">teclado</text><text x="394.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Intercom &gt; Basic &gt; Speed Dial</text><text x="804.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Manager Dial</text><path d="M72 328H1128" stroke="#DDE8F2" stroke-width="1"/><text x="74.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">E12, R20A, E13</text><text x="264.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">un botón</text><text x="394.0" y="358.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Intercom &gt; Basic &gt; Manager Dial</text><text x="804.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Call Type: Sequence o Group</text><path d="M72 378H1128" stroke="#DDE8F2" stroke-width="1"/><text x="74.0" y="408.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">R20B</text><text x="264.0" y="408.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">botones</text><text x="394.0" y="408.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">un número por pulsador</text><text x="804.0" y="408.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Manager Dial por pulsador</text>
<rect x="60" y="448" width="530" height="93" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="60" y="460" width="5" height="69" rx="2.5" fill="#0A63B8"/><text x="86.0" y="482.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">Grupo de los táctiles: Directory &gt; User &gt; Group. Rechazo y</tspan><tspan x="86.0" dy="20.2">tiempo: Intercom &gt; Basic &gt; Sequence Call y Group Call (X915:</tspan><tspan x="86.0" dy="20.2">Only Group Call Allowed).</tspan></text>
<rect x="630" y="448" width="530" height="93" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="630" y="460" width="5" height="69" rx="2.5" fill="#0A63B8"/><text x="656.0" y="482.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">E12: Direct IP está en Intercom &gt; Call Feature. R20B y R20K</tspan><tspan x="656.0" dy="20.2">suman teclas con el módulo de Device &gt; Extension Unit</tspan><tspan x="656.0" dy="20.2">(320.30.10.116 o más).</tspan></text>
<rect x="60" y="572" width="1100" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="60" y="584" width="5" height="48" rx="2.5" fill="#B45309"/><text x="86.0" y="606.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">Con SmartPlus, los números los carga el residente en la app: Group Call Number(Local) queda vacío y en el E12 la secuencia local no</tspan><tspan x="86.0" dy="20.2">aparece.</tspan></text>
