<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Ponele usuario y clave propios al RTSP</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Ponele usuario y clave propios al RTSP</text>
<rect x="48" y="140" width="560" height="290" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 154a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="160" r="5" fill="#C2D4E6"/><circle cx="86" cy="160" r="5" fill="#C2D4E6"/><circle cx="104" cy="160" r="5" fill="#C2D4E6"/><text x="124.0" y="166.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Web del portero</text><text x="66.0" y="206.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Surveillance &gt; RTSP &gt; RTSP Basic</text><text x="68.0" y="240.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">RTSP Authorization</text><text x="588.0" y="240.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">activada</text><rect x="58" y="256" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="278.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Authorization Mode</text><text x="588.0" y="278.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Digest</text><text x="68.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Username</text><text x="588.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">nvr-lab</text><text x="68.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Password</text><text x="588.0" y="354.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ejemplo-Rtsp-2026</text>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="650" y="140" width="502" height="182" rx="14" fill="#03213C"/><text x="668.0" y="166.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PC DE LABORATORIO</text><text x="668.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start"># antes (paso 1): entra cualquiera</text><text x="668.0" y="222.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">ffprobe &quot;rtsp://192.168.88.21/live/ch00_1&quot;</text><text x="668.0" y="248.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start"># después (paso 3): con credencial</text><text x="668.0" y="274.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">ffprobe &quot;rtsp://nvr-lab:…@192.168.88.21/live/ch00_1&quot;</text><text x="668.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start"># … = Ejemplo-Rtsp-2026</text>
<rect x="48" y="470" width="560" height="99" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="482" width="5" height="75" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué Digest</tspan></text><text x="74.0" y="531.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Digest no manda la clave en claro por la red: el NVR prueba que la</tspan><tspan x="74.0" dy="20.2">conoce sin mostrarla.</tspan></text>
<rect x="650" y="470" width="502" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="650" y="482" width="5" height="48" rx="2.5" fill="#B45309"/><text x="676.0" y="504.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="676.0" dy="0.0">Si un monitor mira este portero por RTSP, cargale el mismo</tspan><tspan x="676.0" dy="20.2">usuario en Device &gt; Monitor (paso 7).</tspan></text>
</svg>