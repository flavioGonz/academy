<text x="70.0" y="400.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Los dos traen 1 RS485 y 1 entrada de timbre.</text>
<rect x="70" y="440" width="520" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="70" y="452" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="96.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="96.0" dy="0.0">X937</tspan></text><text x="96.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Pide PoE+ 802.3at en el puerto del switch. En un puerto</tspan><tspan x="96.0" dy="21.6">802.3af no hay energía suficiente: switch PoE+ o fuente</tspan><tspan x="96.0" dy="21.6">de 12 V 2 A.</tspan></text>
<rect x="640" y="440" width="500" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="452" width="5" height="100" rx="2.5" fill="#B45309"/><text x="666.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">X933</tspan></text><text x="666.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Sus relés aguantan hasta 24 V 1 A. Un portón, una</tspan><tspan x="666.0" dy="21.6">cerradura de más consumo o cualquier cosa de más de 24</tspan><tspan x="666.0" dy="21.6">V o 1 A va con relé auxiliar.</tspan></text>
