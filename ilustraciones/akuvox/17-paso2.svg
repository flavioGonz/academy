<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cargá una URL por evento en Action URL</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · LECCIÓN 17 · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cargá una URL por evento en Action URL</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}</style>
<rect x="48" y="128" width="1104" height="296" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 142a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v26h-1104z" fill="#E5F0FB"/><circle cx="68" cy="148" r="5" fill="#C2D4E6"/><circle cx="86" cy="148" r="5" fill="#C2D4E6"/><circle cx="104" cy="148" r="5" fill="#C2D4E6"/><text x="124.0" y="154.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Portero · web</text><text x="66.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Device Management &gt; Setting &gt; Action URL</text><text x="68.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Action URL</text><text x="1132.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Enabled ✓</text><text x="68.0" y="266.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Relay A Triggered</text><text x="1132.0" y="266.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">http://&lt;IP_SERVIDOR&gt;:8000/relaytrigger=$relay1status</text><text x="68.0" y="304.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Relay A Closed</text><text x="1132.0" y="304.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">http://&lt;IP_SERVIDOR&gt;:8000/relayclose=$relay1status</text><text x="68.0" y="342.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Valid Card Entered</text><text x="1132.0" y="342.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">http://&lt;IP_SERVIDOR&gt;:8000/validcard=$card_sn</text><rect x="58" y="358" width="1084" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="380.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Setup Completed</text><text x="1132.0" y="380.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">(vacío)</text>
<circle cx="1152" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="1152.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48.0" y="462.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Variables que el equipo completa:</text>
<rect x="48" y="476" width="530" height="180" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 488a12 12 0 0 1 12 -12h506a12 12 0 0 1 12 12v24h-530z" fill="#E5F0FB"/><text x="62.0" y="499.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">VARIABLE</text><text x="292.0" y="499.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ TRAE</text><text x="62.0" y="535.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">$relay1status</text><text x="292.0" y="535.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">1 abierto · 0 cerrado</text><path d="M60 548H566" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="571.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">$card_sn</text><text x="292.0" y="571.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">número de la tarjeta</text><path d="M60 584H566" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="607.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">$code</text><text x="292.0" y="607.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">código ingresado</text><path d="M60 620H566" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="643.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">$mac  $ip  $model</text><text x="292.0" y="643.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">quién avisa</text>
<rect x="640" y="476" width="512" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="488" width="5" height="75" rx="2.5" fill="#B45309"/><text x="666.0" y="510.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">Atención</tspan></text><text x="666.0" y="537.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Setup Completed (arranque) no lo controla el interruptor de</tspan><tspan x="666.0" dy="20.2">Action URL: si no lo usás, el campo queda vacío.</tspan></text>
<rect x="640" y="590" width="512" height="52" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="640" y="602" width="5" height="28" rx="2.5" fill="#0A63B8"/><text x="666.0" y="624.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">El menú es el del R20A; los eventos cambian por modelo.</tspan></text>
</svg>