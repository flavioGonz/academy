<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El bloque A del firmware dice qué equipo es</text>
<rect x="40" y="140" width="750" height="400" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M40 152a12 12 0 0 1 12 -12h726a12 12 0 0 1 12 12v38h-750z" fill="#E5F0FB"/><text x="54.0" y="170.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">BLOQUE A</text><text x="224.0" y="170.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MODELO</text><text x="444.0" y="170.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">TIPO</text><text x="54.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">111.</text><text x="224.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">E11</text><text x="444.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">portero</text><path d="M52 240H778" stroke="#DDE8F2" stroke-width="1"/><text x="54.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">120.</text><text x="224.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">E20</text><text x="444.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">portero (no se integra con EC33)</text><path d="M52 290H778" stroke="#DDE8F2" stroke-width="1"/><text x="54.0" y="320.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">27.</text><text x="224.0" y="320.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">R27</text><text x="444.0" y="320.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">portero</text><path d="M52 340H778" stroke="#DDE8F2" stroke-width="1"/><text x="54.0" y="370.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">83.</text><text x="224.0" y="370.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">IT83</text><text x="444.0" y="370.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">monitor</text><path d="M52 390H778" stroke="#DDE8F2" stroke-width="1"/><text x="54.0" y="420.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">115.</text><text x="224.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">C315</text><text x="444.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">monitor</text><path d="M52 440H778" stroke="#DDE8F2" stroke-width="1"/><text x="54.0" y="470.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">310.</text><text x="224.0" y="470.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">C310</text><text x="444.0" y="470.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">monitor</text><path d="M52 490H778" stroke="#DDE8F2" stroke-width="1"/><text x="54.0" y="520.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">92.</text><text x="224.0" y="520.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">A092 / A094</text><text x="444.0" y="520.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">control de acceso</text>
<rect x="830" y="140" width="330" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="830" y="152" width="5" height="100" rx="2.5" fill="#B45309"/><text x="856.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="856.0" dy="0.0">Ojo con el 92.</tspan></text><text x="856.0" y="200.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="856.0" dy="0.0">El 92. es compartido: A092 (viejo)</tspan><tspan x="856.0" dy="21.6">y A094 (vigente). Confirmá con la</tspan><tspan x="856.0" dy="21.6">etiqueta o la web.</tspan></text>
<rect x="830" y="330" width="330" height="145" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="830" y="342" width="5" height="121" rx="2.5" fill="#0A63B8"/><text x="856.0" y="364.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="856.0" dy="0.0">Y el bloque C</tspan></text><text x="856.0" y="390.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="856.0" dy="0.0">Si el C es 10 o más, el equipo</tspan><tspan x="856.0" dy="21.6">está en la rama de alta seguridad.</tspan><tspan x="856.0" dy="21.6">Si es menor, el HTTP viejo puede</tspan><tspan x="856.0" dy="21.6">seguir activo.</tspan></text>
</svg>