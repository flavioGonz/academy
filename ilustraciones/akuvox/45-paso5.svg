<rect x="60" y="488" width="520" height="72" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="60" y="500" width="5" height="48" rx="2.5" fill="#0E8F5E"/><text x="86.0" y="522.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">Con Call Next, si el living rechaza, suena la cocina</tspan><tspan x="86.0" dy="20.2">enseguida.</tspan></text>
<rect x="60" y="566" width="520" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="60" y="578" width="5" height="48" rx="2.5" fill="#B45309"/><text x="86.0" y="600.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">Con Do Not Call Next, el rechazo del living corta ahí: la</tspan><tspan x="86.0" dy="20.2">cocina no suena.</tspan></text>
<rect x="1020" y="140" width="150" height="133" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="1020" y="152" width="5" height="109" rx="2.5" fill="#0A63B8"/><text x="1046.0" y="174.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="1046.0" dy="0.0">La prioridad</tspan><tspan x="1046.0" dy="20.2">aparece solo</tspan><tspan x="1046.0" dy="20.2">con un grupo</tspan><tspan x="1046.0" dy="20.2">creado por</tspan><tspan x="1046.0" dy="20.2">vos.</tspan></text>
