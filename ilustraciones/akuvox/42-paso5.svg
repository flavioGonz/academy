<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El presupuesto: lo que se compra y lo que vence</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · LECCIÓN 42 · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El presupuesto: lo que se compra y lo que vence</text>
<rect x="48" y="140" width="520" height="236" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Una vez: equipos e instalación</text>
<circle cx="81" cy="204.4" r="4.5" fill="#0E8F5E"/><text x="96.0" y="210.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Portero y monitores</tspan></text><circle cx="81" cy="241.3" r="4.5" fill="#0E8F5E"/><text x="96.0" y="246.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Fuente o PoE, cableado</tspan></text><circle cx="81" cy="278.3" r="4.5" fill="#0E8F5E"/><text x="96.0" y="283.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Mano de obra y configuración</tspan></text><circle cx="81" cy="315.2" r="4.5" fill="#0E8F5E"/><text x="96.0" y="320.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Anda en la LAN sin licencia</tspan></text>
<rect x="612" y="140" width="540" height="236" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Recurrente: nube SmartPlus</text>
<circle cx="645" cy="204.4" r="4.5" fill="#B45309"/><text x="660.0" y="210.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Servicios de la planilla (paso 3)</tspan></text><circle cx="645" cy="241.3" r="4.5" fill="#B45309"/><text x="660.0" y="246.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Período y fecha de vencimiento</tspan></text><circle cx="645" cy="278.3" r="4.5" fill="#B45309"/><text x="660.0" y="283.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Renovación: automática cada 30 días o manual</tspan></text><circle cx="645" cy="315.2" r="4.5" fill="#B45309"/><text x="660.0" y="320.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Paga el distribuidor o el instalador habilitado</tspan></text>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="414" width="1104" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="426" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="448.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que conviene dejar escrito en la entrega</tspan></text><text x="74.0" y="474.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si no se renueva: la app deja de llamar (la FAQ de la app manda a revisar la cuenta activa y paga). Portero, monitor, PIN y</tspan><tspan x="74.0" dy="21.6">tarjeta siguen en la red local. Los números salen de la cotización escrita del distribuidor, nunca de un precio leído en</tspan><tspan x="74.0" dy="21.6">internet.</tspan></text>
</svg>