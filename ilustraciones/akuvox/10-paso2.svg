<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Mirá qué cuenta usa SmartPlus y cuál la central</text>
<rect x="48" y="150" width="530" height="190" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 164a14 14 0 0 1 14 -14h502a14 14 0 0 1 14 14v26h-530z" fill="#E5F0FB"/><circle cx="68" cy="170" r="5" fill="#C2D4E6"/><circle cx="86" cy="170" r="5" fill="#C2D4E6"/><circle cx="104" cy="170" r="5" fill="#C2D4E6"/><text x="124.0" y="176.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Account &gt; Basic · Account 1</text><rect x="58" y="198" width="510" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Uso</text><text x="558.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">SmartPlus (nube)</text><text x="68.0" y="258.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Register Name</text><text x="558.0" y="258.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">número SIP de SmartPlus</text><text x="68.0" y="296.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Estado</text><text x="558.0" y="296.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">registrada en la nube</text>
<rect x="622" y="150" width="530" height="190" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M622 164a14 14 0 0 1 14 -14h502a14 14 0 0 1 14 14v26h-530z" fill="#E5F0FB"/><circle cx="642" cy="170" r="5" fill="#C2D4E6"/><circle cx="660" cy="170" r="5" fill="#C2D4E6"/><circle cx="678" cy="170" r="5" fill="#C2D4E6"/><text x="698.0" y="176.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Account &gt; Basic · Account 2</text><rect x="632" y="198" width="510" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="642.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Uso</text><text x="1132.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">central local</text><text x="642.0" y="258.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Register Name</text><text x="1132.0" y="258.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">201</text><text x="642.0" y="296.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Server Address</text><text x="1132.0" y="296.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">192.168.88.10</text>
<circle cx="48" cy="150" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="156.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="380" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="392" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Dos cuentas, dos caminos</tspan></text><text x="74.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con SmartPlus activo, la cuenta 1 queda tomada por la nube. La central del edificio va en la cuenta 2 y sigue registrada aunque</tspan><tspan x="74.0" dy="21.6">internet se caiga.</tspan></text>
