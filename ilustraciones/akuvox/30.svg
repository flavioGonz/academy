<rect x="830" y="140" width="320" height="145" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="830" y="152" width="5" height="121" rx="2.5" fill="#B45309"/><text x="856.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="856.0" dy="0.0">S562: ojo con la carga</tspan></text><text x="856.0" y="200.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="856.0" dy="0.0">Es el único con relé de 1 A: un</tspan><tspan x="856.0" dy="21.6">portón o una cerradura que pida</tspan><tspan x="856.0" dy="21.6">más va con relé auxiliar o fuente</tspan><tspan x="856.0" dy="21.6">propia.</tspan></text>
<rect x="830" y="330" width="320" height="145" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="830" y="342" width="5" height="121" rx="2.5" fill="#0A63B8"/><text x="856.0" y="364.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="856.0" dy="0.0">S560</tspan></text><text x="856.0" y="390.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="856.0" dy="0.0">El de auricular: no tiene RS485,</tspan><tspan x="856.0" dy="21.6">relé ni entrada de timbre. No se</tspan><tspan x="856.0" dy="21.6">vende para abrir ni para</tspan><tspan x="856.0" dy="21.6">domótica.</tspan></text>
<text x="48.0" y="580.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Datos: tablas de interfaces y de carga de relé de Akuvox. Del S565 no se afirman tamaño ni sistema.</text>
