<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Cuánta corriente da cada salida de 12 V?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Cuánta corriente da cada salida de 12 V?</text>
<text x="60.0" y="183.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">A094 · 4 salidas</text><rect x="440" y="160" width="560" height="34" rx="8" fill="#E5F0FB"/><rect x="440" y="160" width="560.0" height="34" rx="8" fill="#0A63B8"/><text x="1012.0" y="183.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">800 mA</text>
<text x="60.0" y="257.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">A095 con fuente 12 V 5 A</text><rect x="440" y="234" width="560" height="34" rx="8" fill="#E5F0FB"/><rect x="440" y="234" width="350.0" height="34" rx="8" fill="#0A63B8"/><text x="802.0" y="257.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">500 mA</text>
<text x="60.0" y="331.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">A095 PoE+ · 4 lectores o menos</text>
<rect x="440" y="308" width="560" height="34" rx="8" fill="#E5F0FB"/>
<rect x="440" y="308" width="280.0" height="34" rx="8" fill="#17A8D4" opacity=".35"/>
<rect x="440" y="308" width="140.0" height="34" rx="8" fill="#17A8D4"/>
<text x="732.0" y="331.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">0,2 a 0,4 A</text>
<text x="60.0" y="405.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">A095 PoE+ · 8 lectores</text><rect x="440" y="382" width="560" height="34" rx="8" fill="#E5F0FB"/><rect x="440" y="382" width="140.0" height="34" rx="8" fill="#B45309"/><text x="592.0" y="405.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">0,2 A</text>
<text x="440.0" y="470.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">corriente máxima por salida de 12 V</text>
<rect x="60" y="500" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="60" y="512" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="86.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="86.0" dy="0.0">Cómo se usa</tspan></text><text x="86.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">Por puerta: consumo del lector + consumo de la cerradura.</tspan><tspan x="86.0" dy="21.6">Si pasa el valor de su salida, la cerradura va con fuente</tspan><tspan x="86.0" dy="21.6">propia (paso 3).</tspan></text>
<rect x="640" y="500" width="500" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="666.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">Ojo</tspan></text><text x="666.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">A094: su entrada de 100 a 240 VAC 1,5 A alimenta las 4</tspan><tspan x="666.0" dy="21.6">salidas a la vez.</tspan></text>
</svg>