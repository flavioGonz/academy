<text x="444.0" y="342.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">del portero → Security Relay A</text>
<rect x="470" y="400" width="640" height="140" rx="16" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="494.0" y="432.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Modo de conexión → qué habilitás en el portero</text>
