<text x="494.0" y="518.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Bornes exactos: video de cableado de Akuvox.</text>
<rect x="48" y="584" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="596" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="618.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El E12 no tiene RS485: su conexión especial al SR01 es la que Akuvox no recomienda por seguridad.</tspan></text>
