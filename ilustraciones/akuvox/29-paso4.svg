<rect x="40" y="470" width="560" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="40" y="482" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="66.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="66.0" dy="0.0">Cómo se prueba</tspan></text><text x="66.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="66.0" dy="0.0">Probá los dos casos: apretá y atendé en el 200; después apretá</tspan><tspan x="66.0" dy="21.6">y no atiendas. Si a los 20 s no suena el respaldo, el punto de</tspan><tspan x="66.0" dy="21.6">emergencia no está terminado.</tspan></text>
