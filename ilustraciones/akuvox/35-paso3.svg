<rect x="60" y="560" width="1080" height="54" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="60" y="572" width="5" height="30" rx="2.5" fill="#0E8F5E"/><text x="86.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">El relé de la controladora solo abre y cierra el circuito: la corriente de la cerradura sale de su fuente.</tspan></text>
