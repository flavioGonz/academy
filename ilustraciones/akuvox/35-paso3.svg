<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Si la puerta no entra, la cerradura va aparte</text>
<text x="60.0" y="160.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">El lector sigue en la salida de 12 V de la controladora</text>
