<text x="48.0" y="628.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Paso 4: SB con el SR01 por RS485.  Paso 5: sin SR01, DoorNum=2 sobre el relé B con un portón o lámpara de banco.</text>
