<text x="60.0" y="505.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Cierra cualquiera de los dos: el relé marca el piso</text>
<text x="60.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">aunque nadie apriete el botón.</text>
