<text x="650.0" y="505.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">El botón funciona solo mientras el relé está</text>
<text x="650.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">cerrado: después de validar la credencial.</text>
<rect x="40" y="580" width="1120" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="40" y="592" width="5" height="30" rx="2.5" fill="#B45309"/><text x="66.0" y="614.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="66.0" dy="0.0">En el ascensor real lo cablea o lo autoriza la empresa de mantenimiento del ascensor.</tspan></text>
