<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · LECCIÓN 13 · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Habilitá Open Relay via HTTP con usuario propio</text>
<rect x="48" y="140" width="620" height="300" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 154a14 14 0 0 1 14 -14h592a14 14 0 0 1 14 14v26h-620z" fill="#E5F0FB"/><circle cx="68" cy="160" r="5" fill="#C2D4E6"/><circle cx="86" cy="160" r="5" fill="#C2D4E6"/><circle cx="104" cy="160" r="5" fill="#C2D4E6"/><text x="124.0" y="166.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Web del portero</text><text x="66.0" y="206.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Intercom &gt; Relay (R29) · Access Control &gt; Relay (E18)</text><text x="68.0" y="240.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Open Relay via HTTP</text><text x="648.0" y="240.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Enabled</text><text x="68.0" y="278.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Username</text><text x="648.0" y="278.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">abre-lab</text><text x="68.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Password</text><text x="648.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ejemplo-Http-2026</text><rect x="58" y="332" width="600" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Session Check</text><text x="648.0" y="354.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">apagado</text>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="710" y="140" width="442" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="710" y="152" width="5" height="100" rx="2.5" fill="#B45309"/><text x="736.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="736.0" dy="0.0">Session Check apagado</tspan></text><text x="736.0" y="200.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="736.0" dy="0.0">Akuvox avisa que con Session Check activado la</tspan><tspan x="736.0" dy="21.6">apertura puede fallar. Dejalo apagado y tocá</tspan><tspan x="736.0" dy="21.6">Submit.</tspan></text>
<rect x="710" y="320" width="442" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="710" y="332" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="736.0" y="354.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="736.0" dy="0.0">Por qué no el admin</tspan></text><text x="736.0" y="380.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="736.0" dy="0.0">Usuario y clave solo para abrir: si se filtran,</tspan><tspan x="736.0" dy="21.6">no dan acceso a la web del equipo.</tspan></text>
<rect x="48" y="480" width="620" height="75" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="492" width="5" height="51" rx="2.5" fill="#D2492F"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Probalo con una lámpara o una cerradura de banco, no con la puerta de</tspan><tspan x="74.0" dy="21.6">un cliente en uso.</tspan></text>
