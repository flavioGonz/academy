<rect x="48" y="500" width="340" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">No todas tienen pantalla ni</tspan><tspan x="74.0" dy="21.6">teclado: por eso cada familia tiene</tspan><tspan x="74.0" dy="21.6">su método.</tspan></text>
