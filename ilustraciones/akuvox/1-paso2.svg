<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada familia te da la IP a su manera</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada familia te da la IP a su manera</text>
<rect x="48" y="140" width="830" height="280" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 152a12 12 0 0 1 12 -12h806a12 12 0 0 1 12 12v44h-830z" fill="#E5F0FB"/><text x="62.0" y="173.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MODELO</text><text x="332.0" y="173.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CÓMO PEDIRLE LA IP</text><rect x="52" y="199" width="822" height="50" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="229.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">R20A · E12 · E13 · X910</text><text x="332.0" y="229.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">mantener el botón de llamada ~5 s: la dice en voz alta</text><path d="M60 252H866" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="285.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">R20K · R25K</text><text x="332.0" y="285.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">marcar *3258* en el teclado</text><path d="M60 308H866" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="341.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">E16 · E18</text><text x="332.0" y="341.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">mantener la pantalla ~5 s, PIN de sistema</text><path d="M60 364H866" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="397.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">R29 · X915</text><text x="332.0" y="397.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">marcar 9999, luego 3888, System Info</text>
<rect x="990" y="150" width="150" height="260" rx="20" fill="#26323F" stroke="#011E38" stroke-width="2"/><circle cx="1065" cy="184" r="13" fill="#0B1A28" stroke="#5B6F84" stroke-width="2"/><circle cx="1065" cy="184" r="5" fill="#17A8D4"/><rect x="1020" y="222" width="90" height="60" rx="8" fill="#3A4A5C"/><circle cx="1065" cy="346" r="22" fill="#3A4A5C" stroke="#17A8D4" stroke-width="2"/><text x="1065.0" y="440.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="middle">R20A</text><text x="1065.0" y="462.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">botón ~5 s</text>
<text x="1065.0" y="500.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">lo dice en voz alta</text>
<rect x="985.8" y="515.0" width="158.4" height="29" rx="14.5" fill="#FFFFFF" stroke="#17A8D4" stroke-width="1.5"/><text x="1065.0" y="536.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#17A8D4" text-anchor="middle">“192.168.88.X”</text>
<rect x="48" y="450" width="830" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="462" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Ojo con el E16</tspan></text><text x="74.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">PIN de sistema del E16: admin hasta el firmware 216.30.10.121; Admin321 en las versiones</tspan><tspan x="74.0" dy="21.6">nuevas. Si uno no entra, probá el otro antes de resetear.</tspan></text>
</svg>