<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Equipo viejo en la pared: identificar, asegurar, reemplazar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Equipo viejo en la pared: identificar, asegurar, reemplazar</text>
<rect x="40" y="150" width="350" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="74" cy="184" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="74.0" y="190.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="102.0" y="190.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="102.0" dy="0.0">Identificar</tspan></text><text x="60.0" y="221.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="60.0" dy="0.0">Sacá la IP y leé el firmware A.B.C.D.</tspan><tspan x="60.0" dy="21.6">El bloque A dice el modelo; un C de</tspan><tspan x="60.0" dy="21.6">10 o más, alta seguridad.</tspan></text>
<rect x="425" y="150" width="350" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="459" cy="184" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="459.0" y="190.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="487.0" y="190.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="487.0" dy="0.0">Asegurar</tspan></text><text x="445.0" y="221.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="445.0" dy="0.0">Mientras siga instalado: firmware al</tspan><tspan x="445.0" dy="21.6">día, clave propia y VLAN de porteros,</tspan><tspan x="445.0" dy="21.6">sin puertos abiertos a internet.</tspan></text>
<rect x="810" y="150" width="350" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><circle cx="844" cy="184" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="844.0" y="190.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="872.0" y="190.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="872.0" dy="0.0">Reemplazar</tspan></text><text x="830.0" y="221.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="830.0" dy="0.0">Buscá en el menú vigente un equipo</tspan><tspan x="830.0" dy="21.6">del mismo tipo y verificá</tspan><tspan x="830.0" dy="21.6">credenciales y alimentación.</tspan></text>
<path d="M392.0 230.0C407.5 230.0,407.5 230.0,423.0 230.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M777.0 230.0C792.5 230.0,792.5 230.0,808.0 230.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="40.0" y="375.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Parque que sigue en las paredes (en tablas de Akuvox, no en el menú de octubre de 2026):</text>
<rect x="40.0" y="400" width="53.6" height="30" rx="15" fill="#E5F0FB"/><text x="66.8" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">E11</text><rect x="103.6" y="400" width="53.6" height="30" rx="15" fill="#E5F0FB"/><text x="130.4" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">R27</text><rect x="167.2" y="400" width="53.6" height="30" rx="15" fill="#E5F0FB"/><text x="194.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">R26</text><rect x="230.8" y="400" width="62.8" height="30" rx="15" fill="#E5F0FB"/><text x="262.2" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">DB01</text><rect x="303.6" y="400" width="53.6" height="30" rx="15" fill="#E5F0FB"/><text x="330.4" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">E20</text><rect x="367.2" y="400" width="62.8" height="30" rx="15" fill="#E5F0FB"/><text x="398.6" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">C315</text><rect x="440.0" y="400" width="62.8" height="30" rx="15" fill="#E5F0FB"/><text x="471.4" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">C310</text><rect x="512.8" y="400" width="62.8" height="30" rx="15" fill="#E5F0FB"/><text x="544.2" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">IT83</text><rect x="585.6" y="400" width="62.8" height="30" rx="15" fill="#E5F0FB"/><text x="617.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">A092</text>
<rect x="40" y="470" width="1120" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="40" y="482" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="66.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="66.0" dy="0.0">Primero el E11</tspan></text><text x="66.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="66.0" dy="0.0">El E11 es el modelo de las 13 vulnerabilidades publicadas por Claroty en marzo de 2023: si sigue en una pared, va primero en la</tspan><tspan x="66.0" dy="21.6">lista de revisión.</tspan></text>
</svg>