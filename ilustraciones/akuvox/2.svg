<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Qué dice el número de firmware?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Qué dice el número de firmware?</text>
<rect x="289" y="150" width="622" height="110" rx="20" fill="#03213C"/>
<text x="319.2" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#0A63B8" text-anchor="start">216</text>
<text x="448.8" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#7FA6C9" text-anchor="start">.</text>
<text x="492.0" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#17A8D4" text-anchor="start">30</text>
<text x="578.4" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#7FA6C9" text-anchor="start">.</text>
<text x="621.6" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#B45309" text-anchor="start">10</text>
<text x="708.0" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#7FA6C9" text-anchor="start">.</text>
<text x="751.2" y="230.0" font-family="JetBrains Mono" font-size="72" font-weight="600" fill="#0E8F5E" text-anchor="start">121</text>
<path d="M384 266V300H181V340" fill="none" stroke="#0A63B8" stroke-width="3"/>
<rect x="48" y="340" width="266" height="130" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="68.0" y="374.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start" letter-spacing="1.5">A · MODELO</text>
<text x="68.0" y="410.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">216 = E16 V2</text>
<text x="68.0" y="442.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">29 = R29 · 915 = X915</text>
<path d="M535 266V300H463V340" fill="none" stroke="#17A8D4" stroke-width="3"/>
<rect x="330" y="340" width="266" height="130" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2.5"/>
<text x="350.0" y="374.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#17A8D4" text-anchor="start" letter-spacing="1.5">B · OEM</text>
<text x="350.0" y="410.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">30 = logo Akuvox</text>
<text x="350.0" y="442.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">31 = sin logo</text>
<path d="M665 266V300H745V340" fill="none" stroke="#B45309" stroke-width="3"/>
<rect x="612" y="340" width="266" height="130" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/>
<text x="632.0" y="374.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#B45309" text-anchor="start" letter-spacing="1.5">C · RAMA</text>
<text x="632.0" y="410.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">10 o más</text>
<text x="632.0" y="442.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">rama con alta seguridad</text>
<path d="M816 266V300H1027V340" fill="none" stroke="#0E8F5E" stroke-width="3"/>
<rect x="894" y="340" width="266" height="130" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/>
<text x="914.0" y="374.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="start" letter-spacing="1.5">D · VERSIÓN</text>
<text x="914.0" y="410.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">mayor = más nueva</text>
<text x="914.0" y="442.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">mismo modelo, OEM y rama</text>
<rect x="48" y="500" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El número no alcanza solo</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Varios modelos tienen dos o tres versiones de hardware y cada una lleva su archivo de firmware. Antes de bajar nada: modelo,</tspan><tspan x="74.0" dy="21.6">hardware y rama.</tspan></text>
</svg>