<rect x="60" y="140" width="360" height="140" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="60" y="152" width="5" height="116" rx="2.5" fill="#0A63B8"/><text x="86.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="86.0" dy="0.0">Contacto seco</tspan></text><text x="86.0" y="200.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">El relé solo cierra un contacto</tspan><tspan x="86.0" dy="20.2">(30 V 2 A en E16 y R20): la corriente la</tspan><tspan x="86.0" dy="20.2">pone la fuente de la cerradura, nunca el</tspan><tspan x="86.0" dy="20.2">portero.</tspan></text>
<rect x="800" y="140" width="350" height="120" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="800" y="152" width="5" height="96" rx="2.5" fill="#B45309"/><text x="826.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">Electroimán o bobina</tspan></text><text x="826.0" y="200.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">El diodo frena el pico de tensión que</tspan><tspan x="826.0" dy="20.2">larga la bobina al cortarse: cuida el</tspan><tspan x="826.0" dy="20.2">contacto del relé.</tspan></text>
