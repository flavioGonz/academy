<path d="M240 360H814" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="530.0" y="350.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">REGISTER con clave (mal)</text>
