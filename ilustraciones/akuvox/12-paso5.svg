<rect x="725" y="130" width="190" height="62" rx="12" fill="#011E38"/><text x="820.0" y="157.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Central</text><text x="820.0" y="179.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">Asterisk / FreePBX</text><path d="M820 192V440" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M240 240H814" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="530.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">REGISTER</text>
