<rect x="910.0" y="399" width="228.4" height="30" rx="15" fill="#FCEAE6"/><text x="1024.2" y="420.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">Failed to authenticate</text>
<text x="910.0" y="380.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">log de la central:</text>
