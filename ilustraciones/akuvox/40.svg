<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Mapa del software: nube y celular, o PC y local</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Mapa del software: nube y celular, o PC y local</text>
<rect x="40" y="150" width="540" height="340" rx="22" fill="none" stroke="#17A8D4" stroke-width="2" stroke-dasharray="7 7"/><rect x="58" y="136" width="147" height="28" rx="14" fill="#F7FAFD"/><text x="70.0" y="156.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#17A8D4" text-anchor="start">nube y celular</text>
<rect x="70" y="190" width="480" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="90.0" y="230.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="90.0" dy="0.0">SmartPlus App</tspan></text><text x="90.0" y="261.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="90.0" dy="0.0">Residente: ve, habla, abre y da llaves virtuales.</tspan><tspan x="90.0" dy="21.6">Trabaja con la nube de Akuvox.</tspan></text>
<rect x="70" y="335" width="480" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="90.0" y="375.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="90.0" dy="0.0">My MobileKey</tspan></text><text x="90.0" y="406.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="90.0" dy="0.0">Credencial Bluetooth con AES256: abre acercando la</tspan><tspan x="90.0" dy="21.6">mano o con un botón. Se integra con ACMS.</tspan></text>
<rect x="620" y="150" width="540" height="340" rx="22" fill="none" stroke="#0A63B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="638" y="136" width="191" height="28" rx="14" fill="#F7FAFD"/><text x="650.0" y="156.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start">PC o servidor local</text>
<rect x="650" y="190" width="230" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="670.0" y="230.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="670.0" dy="0.0">ACMS</tspan></text><text x="670.0" y="261.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="670.0" dy="0.0">Acceso en PC para</tspan><tspan x="670.0" dy="21.6">pymes.</tspan></text>
<rect x="900" y="190" width="230" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="920.0" y="230.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="920.0" dy="0.0">ACMS Pro</tspan></text><text x="920.0" y="261.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="920.0" dy="0.0">Empresa: estado de</tspan><tspan x="920.0" dy="21.6">puertas, grupos,</tspan><tspan x="920.0" dy="21.6">varios puestos.</tspan></text>
<rect x="650" y="335" width="480" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="670.0" y="375.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="670.0" dy="0.0">SDMC</tspan></text><text x="670.0" y="406.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="670.0" dy="0.0">Gestión local de comunidades: despliegue por lotes,</tspan><tspan x="670.0" dy="21.6">video, acceso y mensajes.</tspan></text>
<rect x="40" y="520" width="1120" height="110" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="60.0" y="560.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="60.0" dy="0.0">Installer Kit Tool</tspan></text><text x="60.0" y="591.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start"><tspan x="60.0" dy="0.0">Sobre hardware S563W con PoE y Wi-Fi: junta la red de los equipos y sube el proyecto a la nube.</tspan></text>
</svg>