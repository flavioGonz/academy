<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Conectá el E21 a PoE y escuchá su IP</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">AKUVOX · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Conectá el E21 a PoE y escuchá su IP</text>
<rect x="330" y="140" width="366" height="170" rx="20" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="350.0" y="178.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">Switch PoE</text><text x="350.0" y="202.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">puerto 802.3af</text><rect x="350" y="232" width="74" height="54" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="370" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="387.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">1</text><rect x="434" y="232" width="74" height="54" rx="8" fill="#17A8D4" stroke="#17A8D4" stroke-width="2"/><rect x="454" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="471.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><rect x="518" y="232" width="74" height="54" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="538" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="555.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">3</text><rect x="602" y="232" width="74" height="54" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="622" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="639.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="80" y="300" width="150" height="260" rx="20" fill="#26323F" stroke="#011E38" stroke-width="2"/><circle cx="155" cy="334" r="13" fill="#0B1A28" stroke="#5B6F84" stroke-width="2"/><circle cx="155" cy="334" r="5" fill="#17A8D4"/><rect x="110" y="372" width="90" height="60" rx="8" fill="#3A4A5C"/><circle cx="155" cy="496" r="22" fill="#3A4A5C" stroke="#17A8D4" stroke-width="2"/><text x="155.0" y="590.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="middle">E21</text><text x="155.0" y="612.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">PoE 802.3af o 12 V 1 A</text>
<path d="M230.0 370.0 L471.0 370.0 L471.0 310.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230.0" cy="370.0" r="5" fill="#0A63B8"/><circle cx="471.0" cy="310.0" r="5" fill="#0A63B8"/><rect x="267.4" y="337.0" width="125.2" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="330.0" y="356.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">cable de red</text>
<circle cx="505.0" cy="338" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="505.0" y="344.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="155" cy="496" r="34" fill="none" stroke="#17A8D4" stroke-width="3" stroke-dasharray="5 6"/>
<rect x="270" y="470" width="330" height="64" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/><path d="M271 488 L254 500 L271 504" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2" stroke-linejoin="round"/><path d="M272 489 L272 503" stroke="#FFFFFF" stroke-width="3"/><text x="286.0" y="496.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="286.0" dy="0.0">Mantené el pulsador 5 s: el E21</tspan><tspan x="286.0" dy="20.8">dice su IP en voz alta.</tspan></text>
<rect x="270.0" y="579" width="320.0" height="30" rx="15" fill="#E5F0FB"/><text x="430.0" y="600.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">anotala: la vas a usar en el paso 2</text>
<rect x="760" y="150" width="390" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="760" y="162" width="5" height="100" rx="2.5" fill="#B45309"/><text x="786.0" y="184.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="786.0" dy="0.0">Si es un E20S</tspan></text><text x="786.0" y="210.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="786.0" dy="0.0">El E20S no anuncia la IP. Alimentalo,</tspan><tspan x="786.0" dy="21.6">dejá que tome IP por DHCP y buscala con</tspan><tspan x="786.0" dy="21.6">IP Scanner o en la tabla del DHCP.</tspan></text>
<rect x="760" y="360" width="390" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="760" y="372" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="786.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="786.0" dy="0.0">Alimentación</tspan></text><text x="786.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="786.0" dy="0.0">El E21 no da 12 V para una cerradura. Si</tspan><tspan x="786.0" dy="21.6">maneja una, la cerradura lleva su propia</tspan><tspan x="786.0" dy="21.6">fuente.</tspan></text>
</svg>