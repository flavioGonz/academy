<rect x="700" y="380" width="450" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="700" y="392" width="5" height="78" rx="2.5" fill="#B45309"/><text x="726.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">La etiqueta no es la versión</tspan></text><text x="726.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">En el R20A la etiqueta engaña: si dudás, mandá</tspan><tspan x="726.0" dy="21.6">lo que dice la web, no lo que dice el sticker.</tspan></text>
