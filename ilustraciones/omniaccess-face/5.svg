<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres cosas distintas: grupo, copia y horario</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres cosas distintas: grupo, copia y horario</text>
<rect x="48" y="130" width="328" height="330" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<text x="68.0" y="168.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">1 · Grupo de Acceso</text>
<text x="68.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">en OmniAccess</text>
<rect x="64" y="214" width="296" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="64" y="226" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="90.0" y="248.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="90.0" dy="0.0">Personas × equipos = quién</tspan><tspan x="90.0" dy="21.6">pasa por dónde. Documenta el</tspan><tspan x="90.0" dy="21.6">permiso y se ve en la ficha.</tspan></text>
<text x="68.0" y="440.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">Gestión → Grupos de Acceso</text>
<rect x="436" y="130" width="328" height="330" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<text x="456.0" y="168.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">2 · La copia</text>
<text x="456.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">en OmniAccess → terminal</text>
<rect x="452" y="214" width="296" height="118" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="452" y="226" width="5" height="94" rx="2.5" fill="#0E8F5E"/><text x="478.0" y="248.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="478.0" dy="0.0">&quot;A qué equipos se manda&quot; copia</tspan><tspan x="478.0" dy="21.6">la cara a la memoria del</tspan><tspan x="478.0" dy="21.6">terminal. Sin copia no</tspan><tspan x="478.0" dy="21.6">reconoce.</tspan></text>
<text x="456.0" y="440.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">Ficha → Terminales de rostro</text>
<rect x="824" y="130" width="328" height="330" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<text x="844.0" y="168.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">3 · El horario</text>
<text x="844.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">en el terminal</text>
<rect x="840" y="214" width="296" height="118" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="840" y="226" width="5" height="94" rx="2.5" fill="#B45309"/><text x="866.0" y="248.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="866.0" dy="0.0">OmniAccess manda a cada</tspan><tspan x="866.0" dy="21.6">persona con el horario</tspan><tspan x="866.0" dy="21.6">&quot;siempre&quot;. El horario por</tspan><tspan x="866.0" dy="21.6">persona se pone en el equipo.</tspan></text>
<text x="844.0" y="440.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">Web del terminal (curso Akuvox)</text>
<path d="M378.0 300.0C406.0 300.0,406.0 300.0,434.0 300.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M766.0 300.0C794.0 300.0,794.0 300.0,822.0 300.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="490" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="502" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="524.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que hace y lo que no hace OmniAccess</tspan></text><text x="74.0" y="551.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En esta versión el grupo no copia nada solo y no hay pantalla de horarios para Face. Si reenviás la ficha, revisá que el</tspan><tspan x="74.0" dy="21.6">horario siga en el terminal.</tspan></text>
</svg>