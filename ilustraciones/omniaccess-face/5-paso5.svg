<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Reenviá la ficha y mirá si el horario sigue</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 5 · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Reenviá la ficha y mirá si el horario sigue</text>
<rect x="48" y="150" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/>
<text x="68.0" y="196.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Horario manual en el terminal</text>
<text x="68.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Ana · L a V 8:00 a 17:00</text>
<path d="M392.0 210.0C408.0 210.0,408.0 210.0,424.0 210.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="428" y="150" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="448.0" y="196.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Cambio en la ficha y reenvío</text>
<text x="448.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">OmniAccess actualiza a Ana en el equipo</text>
<path d="M772.0 210.0C788.0 210.0,788.0 210.0,804.0 210.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="808" y="150" width="340" height="120" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="2.5"/>
<text x="828.0" y="196.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Horario después del reenvío</text>
<text x="828.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">puede volver a &quot;siempre&quot; (1001)</text>
<circle cx="48" cy="150" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="156.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="310" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="322" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="344.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué hacer</tspan></text><text x="74.0" y="370.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Después de cada reenvío, abrí la web del terminal y</tspan><tspan x="74.0" dy="21.6">confirmá el horario de esa persona.</tspan></text>
<rect x="612" y="310" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="322" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="344.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Para el que viene después</tspan></text><text x="638.0" y="370.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Anotá en la ficha de la obra quién tiene horario en el</tspan><tspan x="638.0" dy="21.6">terminal y quién lo cargó.</tspan></text>
</svg>