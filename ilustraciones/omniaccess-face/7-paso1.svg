<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Leé el texto antes de sacar la foto</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 7 · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Leé el texto antes de sacar la foto</text>
<rect x="48" y="130" width="700" height="300" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<g transform="translate(72 150) scale(1.4)" fill="none" stroke="#0A63B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g>
<text x="120.0" y="172.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Reconocimiento facial · Barrio Ejemplo</text>
<text x="72.0" y="220.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Barrio Ejemplo usa reconocimiento facial en la portería peatonal. Su foto</tspan><tspan x="72.0" dy="23.0">se guarda en el sistema de control de acceso y en el terminal, solo para</tspan><tspan x="72.0" dy="23.0">abrir esta puerta y registrar los ingresos. Puede pedir la baja y el</tspan><tspan x="72.0" dy="23.0">borrado en la administración. Si no acepta, puede entrar con tarjeta o</tspan><tspan x="72.0" dy="23.0">por portería.</tspan></text>
<text x="72.0" y="400.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">Leído por: ____________   Fecha: ________   Acepta: Sí / No</text>
<circle cx="748" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="748.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="790" y="140" width="362" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="790" y="152" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="816.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Qué tiene que decir</tspan></text><text x="816.0" y="200.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Para qué se usa, quién lo guarda, cómo</tspan><tspan x="816.0" dy="21.6">pedir la baja y qué alternativa hay.</tspan></text>
<rect x="790" y="300" width="362" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="790" y="312" width="5" height="51" rx="2.5" fill="#B45309"/><text x="816.0" y="334.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Borrador de laboratorio: el texto real</tspan><tspan x="816.0" dy="21.6">lo define la administración del lugar.</tspan></text>
</svg>