<rect x="84" y="312" width="520" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="84" y="324" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="110.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="110.0" dy="0.0">Bien: el servidor encontró el equipo por su MAC. En</tspan><tspan x="110.0" dy="21.6">Dispositivos se prende el ícono Push (azul).</tspan></text>
<rect x="632" y="312" width="520" height="75" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="632" y="324" width="5" height="51" rx="2.5" fill="#D2492F"/><text x="658.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="658.0" dy="0.0">Mal: la MAC del aviso no es la cargada en la ficha del</tspan><tspan x="658.0" dy="21.6">equipo. Corregí el Hardware ID (MAC).</tspan></text>
<rect x="84" y="420" width="1068" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="84" y="432" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="110.0" y="454.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="110.0" dy="0.0">Ruta: Configuración → Sistema → Webhooks → fuente Akuvox. Ahí se ven todos los avisos que llegan al puerto 10000, con sus</tspan><tspan x="110.0" dy="21.6">parámetros.</tspan></text>
