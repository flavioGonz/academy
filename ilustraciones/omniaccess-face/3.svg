<rect x="672" y="290" width="330" height="93" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="672" y="302" width="5" height="69" rx="2.5" fill="#B45309"/><text x="698.0" y="324.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="698.0" dy="0.0">Busca el equipo por la MAC. Si no</tspan><tspan x="698.0" dy="20.2">coincide, prueba por IP; si tampoco,</tspan><tspan x="698.0" dy="20.2">el evento se descarta.</tspan></text>
<rect x="40" y="584" width="600" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="40" y="596" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="66.0" y="618.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="66.0" dy="0.0">La Action URL no lleva la imagen: sin camino de vuelta al terminal, hay</tspan><tspan x="66.0" dy="20.2">evento sin foto.</tspan></text>
