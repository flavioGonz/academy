<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 10 · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La ficha del evento te dice en qué capa estás</text>
<rect x="48" y="140" width="1104" height="80" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<rect x="64" y="148" width="64" height="64" rx="8" fill="#D9E6F2" stroke="#C2D4E6" stroke-width="1.5"/><ellipse cx="96.0" cy="174.9" rx="10.9" ry="13.4" fill="#8BA3BA"/><path d="M75.5 212.0a20.5 16.6 0 0 1 41.0 0z" fill="#8BA3BA"/>
<text x="148.0" y="174.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Nombre correcto + Autorizado</text>
<text x="148.0" y="200.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">vinculado: todo bien</text>
<circle cx="1110" cy="180" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(1098 168)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<rect x="48" y="236" width="1104" height="80" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<rect x="64" y="244" width="64" height="64" rx="8" fill="#D9E6F2" stroke="#C2D4E6" stroke-width="1.5"/><ellipse cx="96.0" cy="270.9" rx="10.9" ry="13.4" fill="#8BA3BA"/><path d="M75.5 308.0a20.5 16.6 0 0 1 41.0 0z" fill="#8BA3BA"/>
<text x="148.0" y="270.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Nombre correcto + No registrado</text>
<text x="148.0" y="296.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">capa 3: el terminal reconoció; OmniAccess no halló la ficha</text>
<rect x="48" y="332" width="1104" height="80" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="2"/>
<rect x="64" y="340" width="64" height="64" rx="8" fill="#D9E6F2" stroke="#C2D4E6" stroke-width="1.5"/><ellipse cx="96.0" cy="366.9" rx="10.9" ry="13.4" fill="#8BA3BA"/><path d="M75.5 404.0a20.5 16.6 0 0 1 41.0 0z" fill="#8BA3BA"/>
<text x="148.0" y="366.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">&quot;Desconocido&quot;</text>
<text x="148.0" y="392.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">capa 4: el terminal no reconoció la cara</text>
<circle cx="1110" cy="372" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(1098 360)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="48" y="440" width="1104" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="452" width="5" height="75" rx="2.5" fill="#B45309"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué aparece No registrado</tspan></text><text x="74.0" y="500.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con Akuvox, OmniAccess vincula buscando una credencial de rostro con el nombre que manda el terminal. En la versión revisada, las</tspan><tspan x="74.0" dy="20.2">fichas creadas desde Usuarios &amp; Residentes no la crean: con Lista Blanca el evento queda Denegado aunque la puerta abrió.</tspan></text>
</svg>