00:5E:00:53:21</text><text x="68.0" y="388.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Usuario Manager</text><text x="728.0" y="388.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">usuario de API</text><text x="68.0" y="426.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">API Password</text><text x="728.0" y="426.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">••••••••</text><text x="68.0" y="464.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Sentido del Flujo</text><text x="728.0" y="464.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">ENTRADA (Ingreso)</text><text x="68.0" y="502.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Ubicación Física</text><text x="728.0" y="502.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Portería peatonal</text>
<circle cx="748" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="748.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="790" y="140" width="362" height="140" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="790" y="152" width="5" height="116" rx="2.5" fill="#B45309"/><text x="816.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Hardware ID (MAC)</tspan></text><text x="816.0" y="200.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Con la MAC, el servidor sabe qué equipo</tspan><tspan x="816.0" dy="20.2">avisa. Escribila como la muestra la web</tspan><tspan x="816.0" dy="20.2">del terminal; el servidor ignora dos</tspan><tspan x="816.0" dy="20.2">puntos y guiones.</tspan></text>
<rect x="790" y="330" width="362" height="140" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="790" y="342" width="5" height="116" rx="2.5" fill="#0A63B8"/><text x="816.0" y="364.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Usuario y API Password</tspan></text><text x="816.0" y="390.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Con el usuario y la clave de la API,</tspan><tspan x="816.0" dy="20.2">OmniAccess cuenta caras y tarjetas,</tspan><tspan x="816.0" dy="20.2">busca la foto de cada evento y acciona</tspan><tspan x="816.0" dy="20.2">el relé.</tspan></text>
<rect x="790" y="500" width="362" height="99" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="790" y="512" width="5" height="75" rx="2.5" fill="#0E8F5E"/><text x="816.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Sentido del Flujo</tspan></text><text x="816.0" y="561.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Entrada o Salida decide en qué columna</tspan><tspan x="816.0" dy="20.2">del Monitor Facial cae cada evento.</tspan></text>
