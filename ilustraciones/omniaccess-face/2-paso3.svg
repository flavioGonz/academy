<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Probá con la más baja, la más alta y tres distancias</text>
<rect x="48" y="140" width="770" height="184" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 152a12 12 0 0 1 12 -12h746a12 12 0 0 1 12 12v34h-770z" fill="#E5F0FB"/><text x="62.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PRUEBA</text><text x="322.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">30 CM</text><text x="492.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">50 CM</text><text x="662.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">1 M</text><text x="62.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Persona más baja</text><text x="322.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><text x="492.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><text x="662.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><path d="M60 232H806" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="260.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Persona más alta</text><text x="322.0" y="260.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><text x="492.0" y="260.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><text x="662.0" y="260.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><path d="M60 278H806" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Con sol de la tarde</text><text x="322.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><text x="492.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text><text x="662.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">¿reconoce?</text>
