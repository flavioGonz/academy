<rect x="48" y="360" width="520" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="372" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué mirar</tspan></text><text x="74.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Anotá desde qué distancia dispara. Si la más alta tiene</tspan><tspan x="74.0" dy="21.6">que agacharse, el equipo está bajo; si la más baja tiene</tspan><tspan x="74.0" dy="21.6">que estirarse, está alto.</tspan></text>
<rect x="600" y="360" width="552" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="600" y="372" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="626.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="626.0" dy="0.0">Regla</tspan></text><text x="626.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="626.0" dy="0.0">Si solo falla a cierta hora, es la luz. Corregí la luz antes</tspan><tspan x="626.0" dy="21.6">de tocar el umbral del terminal.</tspan></text>
