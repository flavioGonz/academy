<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Bajar el umbral reparte el error, no lo arregla</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 10 · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Bajar el umbral reparte el error, no lo arregla</text>
<path d="M90 150V510H710" fill="none" stroke="#6E88A1" stroke-width="2"/>
<text x="400.0" y="550.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">umbral del terminal  →  más exigente</text>
<text x="76.0" y="160.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="end">errores</text>
<path d="M90 170C290 270,420 450,710 496" fill="none" stroke="#D2492F" stroke-width="4"/>
<path d="M90 496C380 470,510 390,710 180" fill="none" stroke="#0A63B8" stroke-width="4"/>
<text x="120.0" y="180.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">falsas aceptaciones (abre a un parecido)</text>
<text x="700.0" y="172.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="end">falsos rechazos (no abre a quien está)</text>
<path d="M420 180V510" stroke="#0E8F5E" stroke-width="2" stroke-dasharray="6 6"/>
<text x="426.0" y="490.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">punto de trabajo</text>
<circle cx="750" cy="150" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="750.0" y="156.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="790" y="190" width="362" height="120" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="790" y="202" width="5" height="96" rx="2.5" fill="#0A63B8"/><text x="816.0" y="224.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Lo que dicen las fuentes</tspan></text><text x="816.0" y="250.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Subirlo baja falsas aceptaciones y sube</tspan><tspan x="816.0" dy="20.2">falsos rechazos (Hikvision, AWS, NIST).</tspan><tspan x="816.0" dy="20.2">No hay un valor universal.</tspan></text>
<rect x="790" y="360" width="362" height="140" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="790" y="372" width="5" height="116" rx="2.5" fill="#B45309"/><text x="816.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Antes de tocarlo</tspan></text><text x="816.0" y="420.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Primero luz y foto de alta. Probá con</tspan><tspan x="816.0" dy="20.2">varias personas distintas: NIST encontró</tspan><tspan x="816.0" dy="20.2">diferencias según el grupo en la mayoría</tspan><tspan x="816.0" dy="20.2">de los algoritmos.</tspan></text>
</svg>