<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Abrí el Denegado y leé qué te dice la ficha</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 6 · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Abrí el Denegado y leé qué te dice la ficha</text>
<rect x="48" y="140" width="1050" height="208" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 152a12 12 0 0 1 12 -12h1026a12 12 0 0 1 12 12v40h-1050z" fill="#E5F0FB"/><text x="62.0" y="171.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">LA FICHA MUESTRA</text><text x="342.0" y="171.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ SIGNIFICA</text><text x="812.0" y="171.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ HACE EL GUARDIA</text><text x="62.0" y="223.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Nombre + Autorizado</text><text x="342.0" y="223.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">reconocido y vinculado a su ficha</text><text x="812.0" y="223.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">nada: todo bien</text><rect x="52" y="247" width="1042" height="46" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="275.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Nombre + No registrado</text><text x="342.0" y="275.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el terminal reconoció; OmniAccess no halló la ficha</text><text x="812.0" y="275.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">anotar para el técnico</text><path d="M60 296H1086" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="327.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">&quot;Desconocido&quot; en ámbar</text><text x="342.0" y="327.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el terminal no reconoció la cara</text><text x="812.0" y="327.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">atender en persona</text>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="380" width="540" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="392" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="74.0" y="414.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Mirá si la foto es la captura de la puerta o la del alta:</tspan><tspan x="74.0" dy="21.6">si el servidor no pudo traer la captura, muestra la de la</tspan><tspan x="74.0" dy="21.6">ficha.</tspan></text>
<rect x="612" y="380" width="540" height="97" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="392" width="5" height="73" rx="2.5" fill="#B45309"/><text x="638.0" y="414.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si el guardia vio que la puerta abrió y la ficha dice No</tspan><tspan x="638.0" dy="21.6">registrado, no es un intruso: es un vínculo que falta</tspan><tspan x="638.0" dy="21.6">(lección 10).</tspan></text>
</svg>