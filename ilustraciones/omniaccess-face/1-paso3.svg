<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Qué hace cada opción del Modo Face</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS FACE · LECCIÓN 1 · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Qué hace cada opción del Modo Face</text>
<rect x="48" y="128" width="620" height="214" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 142a14 14 0 0 1 14 -14h592a14 14 0 0 1 14 14v26h-620z" fill="#E5F0FB"/><circle cx="68" cy="148" r="5" fill="#C2D4E6"/><circle cx="86" cy="148" r="5" fill="#C2D4E6"/><circle cx="104" cy="148" r="5" fill="#C2D4E6"/><text x="124.0" y="154.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">OmniAccess · Configuración</text><text x="66.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Modos → Modos (LPR / Face / Cola) → Modo Face</text><text x="68.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Lista Negra</text><text x="648.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">identificado → DENEGADO</text><rect x="58" y="244" width="600" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="266.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Lista Blanca</text><text x="648.0" y="266.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">identificado → PERMITIDO</text><text x="68.0" y="304.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Aprendizaje</text><text x="648.0" y="304.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">deshabilitado</text>
<circle cx="668" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="668.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="48" y="380" width="780" height="160" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 392a12 12 0 0 1 12 -12h756a12 12 0 0 1 12 12v28h-780z" fill="#E5F0FB"/><text x="62.0" y="405.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">OPCIÓN</text><text x="252.0" y="405.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">REGISTRO EN OMNIACCESS</text><text x="582.0" y="405.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PUERTA</text><text x="62.0" y="445.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Lista Blanca</text><text x="252.0" y="445.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">permitido si encuentra la ficha</text><text x="582.0" y="445.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">la decide el terminal</text><path d="M60 460H816" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="485.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Lista Negra</text><text x="252.0" y="485.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">denegado si encuentra la ficha</text><text x="582.0" y="485.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">la decide el terminal</text><path d="M60 500H816" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="525.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Aprendizaje</text><text x="252.0" y="525.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">no disponible</text><text x="582.0" y="525.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">la decide el terminal</text>
<rect x="860" y="128" width="292" height="145" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="860" y="140" width="5" height="121" rx="2.5" fill="#B45309"/><text x="886.0" y="162.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="886.0" dy="0.0">Atención</tspan></text><text x="886.0" y="188.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="886.0" dy="0.0">Activar un modo recarga la</tspan><tspan x="886.0" dy="21.6">interfaz de todos los</tspan><tspan x="886.0" dy="21.6">puestos. En producción, avisá</tspan><tspan x="886.0" dy="21.6">antes.</tspan></text>
<rect x="860" y="300" width="292" height="97" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="860" y="312" width="5" height="73" rx="2.5" fill="#0E8F5E"/><text x="886.0" y="334.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="886.0" dy="0.0">La columna Puerta no cambia</tspan><tspan x="886.0" dy="21.6">con ninguna opción: ese es el</tspan><tspan x="886.0" dy="21.6">punto de la lección.</tspan></text>
</svg>