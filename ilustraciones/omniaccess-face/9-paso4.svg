<rect x="48" y="370" width="700" height="168" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 382a12 12 0 0 1 12 -12h676a12 12 0 0 1 12 12v30h-700z" fill="#E5F0FB"/><text x="62.0" y="396.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">VALOR</text><text x="182.0" y="396.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ PASA</text><text x="62.0" y="438.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">0</text><text x="182.0" y="438.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">no se borra nada: crece sin límite</text><path d="M60 454H736" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="480.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">30</text><text x="182.0" y="480.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">a los 30 días se borran capturas y fotos de alta</text><path d="M60 496H736" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="522.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">365</text><text x="182.0" y="522.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">un año de capturas; las fotos de alta viejas también se van</text>
<rect x="790" y="140" width="362" height="145" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="790" y="152" width="5" height="121" rx="2.5" fill="#B45309"/><text x="816.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Decidir con el responsable</tspan></text><text x="816.0" y="200.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Antes de poner un número, acordá con</tspan><tspan x="816.0" dy="21.6">la administración cuánto se guardan</tspan><tspan x="816.0" dy="21.6">las capturas y cómo se resguardan las</tspan><tspan x="816.0" dy="21.6">fotos de alta.</tspan></text>
<rect x="790" y="360" width="362" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="790" y="372" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="816.0" y="394.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Por debajo es una regla de vencimiento</tspan><tspan x="816.0" dy="21.6">de MinIO: borra objetos a N días de</tspan><tspan x="816.0" dy="21.6">creados.</tspan></text>
