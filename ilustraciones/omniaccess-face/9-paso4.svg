<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Revisá la retención del Bucket FACE</text>
<rect x="48" y="128" width="700" height="180" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 142a14 14 0 0 1 14 -14h672a14 14 0 0 1 14 14v26h-700z" fill="#E5F0FB"/><circle cx="68" cy="148" r="5" fill="#C2D4E6"/><circle cx="86" cy="148" r="5" fill="#C2D4E6"/><circle cx="104" cy="148" r="5" fill="#C2D4E6"/><text x="124.0" y="154.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">OmniAccess · Configuración → Sistema → Almacenamiento</text><text x="68.0" y="198.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Bucket FACE</text><text x="728.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">face</text><rect x="58" y="214" width="680" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="236.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Días de retención antes de borrar</text><text x="728.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">0 = nunca</text>
