<rect x="48" y="460" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="472" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="494.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Los eventos traídos así llevan SINCRO_HW en el detalle. La</tspan><tspan x="74.0" dy="21.6">sincronización existe para terminales Akuvox.</tspan></text>
<rect x="612" y="460" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="472" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="494.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Retención</tspan></text><text x="638.0" y="521.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La regla de días se aplica a todo el bucket: con 30 días,</tspan><tspan x="638.0" dy="21.6">también se borran las fotos de alta de más de 30 días.</tspan></text>
