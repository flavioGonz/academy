<text x="68.0" y="204.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Nueva visita + foto + terminal</text>
<path d="M300.0 186.0L328.0 186.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="136" width="250" height="100" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<text x="350.0" y="176.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Uso</text>
<text x="350.0" y="204.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">hasta la fecha anotada</text>
<path d="M582.0 186.0L610.0 186.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
