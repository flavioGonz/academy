<text x="632.0" y="204.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Memoria Flash → eliminar</text>
<path d="M864.0 186.0L892.0 186.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="136" width="250" height="100" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/>
<text x="914.0" y="176.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">2 · Ficha</text>
<text x="914.0" y="204.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">decidir: conservar o borrar</text>
<rect x="48" y="280" width="1104" height="184" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 292a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v34h-1104z" fill="#E5F0FB"/><text x="62.0" y="308.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">ACCIÓN</text><text x="362.0" y="308.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">LA CARA EN EL TERMINAL</text><text x="642.0" y="308.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">LA FOTO GUARDADA</text><text x="852.0" y="308.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">LOS EVENTOS DEL HISTORIAL</text><rect x="52" y="329" width="1096" height="40" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Eliminar en Memoria Flash</text><text x="362.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">se borra: deja de abrir</text><text x="642.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">queda</text><text x="852.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">quedan</text><path d="M60 372H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="400.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Borrar la ficha</text><text x="362.0" y="400.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">queda: sigue abriendo</text><text x="642.0" y="400.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">queda</text><text x="852.0" y="400.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">se borran con la ficha</text><path d="M60 418H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Cambiar el Modo Face</text><text x="362.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">queda: sigue abriendo</text><text x="642.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">queda</text><text x="852.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">cambia cómo se registran</text>
<rect x="48" y="480" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="492" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Bloqueo real</tspan></text><text x="74.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Bloquear a alguien en Face es sacarlo de la memoria del</tspan><tspan x="74.0" dy="21.6">terminal y probar que no abre.</tspan></text>
<rect x="612" y="480" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="492" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Antes de borrar la ficha</tspan></text><text x="638.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si la administración necesita conservar el historial de esa</tspan><tspan x="638.0" dy="21.6">persona, dejá la ficha sin terminales marcados en lugar de</tspan><tspan x="638.0" dy="21.6">borrarla.</tspan></text>
