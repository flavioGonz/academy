<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Tiene Tools y cuánto puede crecer su disco?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Tiene Tools y cuánto puede crecer su disco?</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="162" width="560" height="130" rx="14" fill="#03213C"/><text x="66.0" y="188.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SSH AL HOST · VMID 1</text><text x="66.0" y="218.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3F7" text-anchor="start">$ vim-cmd vmsvc/get.guest 1 | grep -i tools</text><text x="66.0" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  toolsRunningStatus = &quot;guestToolsRunning&quot;</text><text x="66.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  toolsVersionStatus = &quot;guestToolsCurrent&quot;</text>
<rect x="208.0" y="305.0" width="240.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="328.0" y="326.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">Tools corriendo y al día</text>
<rect x="48" y="356" width="560" height="156" rx="14" fill="#03213C"/><text x="66.0" y="382.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SSH AL HOST · VALORES DE EJEMPLO</text><text x="66.0" y="412.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3F7" text-anchor="start">$ ls -lh …/vm-prueba/*-flat.vmdk</text><text x="66.0" y="438.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  100G  vm-prueba-flat.vmdk</text><text x="66.0" y="464.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3F7" text-anchor="start">$ du -h …/vm-prueba/*-flat.vmdk</text><text x="66.0" y="490.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  18G   vm-prueba-flat.vmdk</text>
<text x="650.0" y="186.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba-flat.vmdk (thin)</text>
<rect x="650" y="206" width="500" height="50" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="650" y="206" width="90" height="50" rx="10" fill="#0A63B8" stroke="#0A63B8" stroke-width="0"/>
<rect x="740" y="206" width="410" height="50" rx="10" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="660.0" y="288.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">du -h: 18G ocupados</text>
<text x="1150.0" y="288.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#B45309" text-anchor="end">puede crecer 82G más</text>
<text x="650.0" y="316.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">ls -lh: 100G provisionados</text>
<rect x="650" y="352" width="502" height="116" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="670.0" y="384.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Sumalo por datastore</text>
<text x="670.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="670.0" dy="0.0">Lo que todavía pueden crecer todas las VMs thin, contra</tspan><tspan x="670.0" dy="21.6">el libre que muestra esxcli storage filesystem list.</tspan></text>
<rect x="650" y="492" width="502" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="650" y="504" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="676.0" y="526.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="676.0" dy="0.0">Si la suma supera el libre, estás sobreasignado:</tspan><tspan x="676.0" dy="21.6">vigilalo o pasá a thick lo crítico.</tspan></text>
</svg>