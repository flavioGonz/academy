<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Si no arranca: el controlador de disco</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="164" width="540" height="340" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="196.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Linux</text><rect x="72" y="220" width="492" height="74" rx="12" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.8"/><text x="92.0" y="252.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="92.0" dy="0.0">Arrancá con el disco en VirtIO SCSI</tspan></text><path d="M318.0 296.0C318.0 307.0,318.0 305.0,318.0 316.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="72" y="318" width="492" height="74" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="1.8"/><text x="92.0" y="350.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="92.0" dy="0.0">¿No bootea? Probá el disco en SATA</tspan></text><path d="M318.0 394.0C318.0 405.0,318.0 403.0,318.0 414.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="72" y="416" width="492" height="74" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.8"/><text x="92.0" y="448.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="92.0" dy="0.0">Reconfigurá la IP si la placa cambió de nombre e</tspan><tspan x="92.0" dy="21.6">instalá el agente QEMU</tspan></text>
<rect x="612" y="164" width="540" height="340" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="196.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Windows</text><rect x="636" y="220" width="492" height="74" rx="12" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.8"/><text x="656.0" y="252.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="656.0" dy="0.0">Arrancá con el disco en SATA</tspan></text><path d="M882.0 296.0C882.0 307.0,882.0 305.0,882.0 316.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="636" y="318" width="492" height="74" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="1.8"/><text x="656.0" y="350.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="656.0" dy="0.0">Instalá los drivers VirtIO desde adentro</tspan></text><path d="M882.0 394.0C882.0 405.0,882.0 403.0,882.0 414.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="636" y="416" width="492" height="74" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.8"/><text x="656.0" y="448.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="656.0" dy="0.0">Cambiá a VirtIO, reconfigurá la IP e instalá el agente</tspan><tspan x="656.0" dy="21.6">QEMU</tspan></text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">Verificá desde la consola de la VM: ip a y ping -c 3 192.168.88.1 (paso 5).</text>
