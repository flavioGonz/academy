<g transform="translate(330 300) scale(0.9)" fill="none" stroke="#6E88A1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g>
<rect x="48" y="380" width="352" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="420.0" font-family="Familjen Grotesk" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">2 o 3</text>
<text x="68.0" y="452.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">por VM en la práctica (32 es el tope</tspan><tspan x="68.0" dy="20.2">técnico)</tspan></text>
<rect x="424" y="380" width="352" height="110" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="444.0" y="420.0" font-family="Familjen Grotesk" font-size="22" font-weight="700" fill="#B45309" text-anchor="start">72 h</text>
<text x="444.0" y="452.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="444.0" dy="0.0">como máximo; mejor borrarlo apenas</tspan><tspan x="444.0" dy="20.2">validás</tspan></text>
<rect x="800" y="380" width="352" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="820.0" y="420.0" font-family="Familjen Grotesk" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">fecha en el nombre</text>
<text x="820.0" y="452.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="820.0" dy="0.0">borrar-2026-10-30-antes-update</tspan></text>
<rect x="48" y="514" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="526" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="548.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué no es backup</tspan></text><text x="74.0" y="575.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si se pierde o se rompe el disco base, el delta solo no</tspan><tspan x="74.0" dy="21.6">restaura nada.</tspan></text>
<rect x="612" y="514" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="526" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="548.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Dos cosas que no</tspan></text><text x="638.0" y="575.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">No agrandes un disco con snapshots vivos ni canceles una</tspan><tspan x="638.0" dy="21.6">consolidación en curso.</tspan></text>
</svg>