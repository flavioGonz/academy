<text x="850.0" y="194.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="850.0" dy="0.0">Cancelás o seguís con la</tspan><tspan x="850.0" dy="21.6">instalación en un disco</tspan><tspan x="850.0" dy="21.6">persistente (paso 4).</tspan></text>
<rect x="830" y="370" width="322" height="180" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="850.0" y="402.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Avisa algo no soportado</text>
<text x="850.0" y="436.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="850.0" dy="0.0">El instalador lo advierte: frenás,</tspan><tspan x="850.0" dy="21.6">revisás la Compatibility Guide y</tspan><tspan x="850.0" dy="21.6">no instalás en un cliente.</tspan></text>
<rect x="48" y="500" width="712" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Así chequeás compatibilidad sin tocar los discos del servidor: nada se escribe</tspan><tspan x="74.0" dy="21.6">hasta que confirmás la instalación.</tspan></text>
