<text x="1012.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="middle">2 CPU, 8 vCPU por VM</text>
<rect x="48" y="546" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="558" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="580.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cómo se cobra</tspan></text><text x="74.0" y="607.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Por núcleo físico, con un mínimo de 16 núcleos por CPU.</tspan><tspan x="74.0" dy="21.6">vCenter viene incluido en la suscripción.</tspan></text>
<rect x="612" y="546" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="558" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="580.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Fecha para la ficha</tspan></text><text x="638.0" y="607.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">vSphere 8 (ESXi y vCenter) pierde soporte general el 11 de</tspan><tspan x="638.0" dy="21.6">octubre de 2027.</tspan></text>
