<text x="72.0" y="246.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">vCenter</text>
<text x="452.0" y="246.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">incluido</text>
