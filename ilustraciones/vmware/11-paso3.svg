<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Dónde buscar errores: /var/run/log del host</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Dónde buscar errores: /var/run/log del host</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="48" y="170" width="520" height="72" rx="8" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.8"/><path d="M62 180h12l6 6v46h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="90.0" y="189.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">/var/run/log/vmkernel.log</text><text x="90.0" y="207.0" font-family="Instrument Sans" font-size="13.5" font-weight="400" fill="#6E88A1" text-anchor="start">el núcleo: discos, rutas, red, drivers</text>
<rect x="473.0" y="193.0" width="87.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="516.5" y="214.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">primero</text>
<rect x="48" y="262" width="520" height="72" rx="8" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.8"/><path d="M62 272h12l6 6v46h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="90.0" y="281.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">/var/run/log/vmkwarning.log</text><text x="90.0" y="299.0" font-family="Instrument Sans" font-size="13.5" font-weight="400" fill="#6E88A1" text-anchor="start">solo las advertencias del núcleo</text>
<rect x="473.0" y="285.0" width="87.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="516.5" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">segundo</text>
<rect x="48" y="354" width="520" height="72" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M62 364h12l6 6v46h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="90.0" y="373.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">/var/run/log/hostd.log</text><text x="90.0" y="391.0" font-family="Instrument Sans" font-size="13.5" font-weight="400" fill="#6E88A1" text-anchor="start">el agente del host (Host Client, tareas)</text>
<rect x="419.0" y="377.0" width="141.0" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="489.5" y="398.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">si hace falta</text>
<rect x="612" y="170" width="540" height="130" rx="14" fill="#03213C"/><text x="630.0" y="196.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SSH AL HOST</text><text x="630.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3F7" text-anchor="start">$ grep -i -E &quot;error|fail|lost&quot; \</text><text x="630.0" y="252.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3F7" text-anchor="start">    /var/run/log/vmkernel.log | tail -n 30</text><text x="630.0" y="278.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FE3F7" text-anchor="start">$ tail -n 50 /var/run/log/vmkwarning.log</text>
<rect x="612" y="340" width="540" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="352" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="638.0" y="374.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">En vCenter el equivalente es vpxd. En el host, estos tres.</tspan></text>
<rect x="48" y="460" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="472" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="494.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Ojo con los reinicios</tspan></text><text x="74.0" y="521.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el host arranca de SD o USB, estos logs viven en memoria y se pierden al reiniciar: otro motivo para un disco de arranque</tspan><tspan x="74.0" dy="21.6">persistente.</tspan></text>
</svg>