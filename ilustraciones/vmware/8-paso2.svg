<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Clonar Read-only y sumar un solo privilegio</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Clonar Read-only y sumar un solo privilegio</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="80.0" y="146.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">Administration &gt; Access Control &gt; Roles</text>
<rect x="48" y="176" width="420" height="250" rx="16" fill="#FFFFFF" stroke="#6E88A1" stroke-width="2"/><text x="68.0" y="208.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Read-only</text>
<text x="68.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Ver el inventario y su configuración, sin</tspan><tspan x="68.0" dy="21.6">cambiar nada.</tspan></text>
<rect x="68.0" y="299.0" width="150.0" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="143.0" y="320.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">rol de fábrica</text>
<path d="M470.0 300.0C515.0 300.0,515.0 300.0,560.0 300.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="482.5" y="265.0" width="65.0" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="515.0" y="284.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">Clone</text>
<rect x="564" y="176" width="588" height="250" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="584.0" y="208.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Soporte-Lectura</text>
<text x="586.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">todo lo de Read-only</text>
<text x="586.0" y="274.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">+ un privilegio:</text>
<rect x="586" y="290" width="544" height="46" rx="10" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<text x="604.0" y="320.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">Virtual machine &gt; Interaction &gt; Console interaction</text>
<text x="586.0" y="380.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">puede abrir la consola de una VM</text>
<text x="586.0" y="404.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">no puede apagar, borrar ni cambiar hardware</text>
<rect x="48" y="456" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="468" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="490.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué clonar</tspan></text><text x="74.0" y="517.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Se clona en vez de editar: los roles de fábrica quedan</tspan><tspan x="74.0" dy="21.6">intactos y se sabe qué cambiaste.</tspan></text>
<rect x="612" y="456" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="468" width="5" height="51" rx="2.5" fill="#B45309"/><text x="638.0" y="490.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Cada privilegio que sumás es algo más que ese usuario puede</tspan><tspan x="638.0" dy="21.6">romper: de a uno y con motivo.</tspan></text>
</svg>