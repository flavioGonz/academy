<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>vMotion, HA y DRS: qué hace cada uno</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">vMotion, HA y DRS: qué hace cada uno</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="300" y="124" width="268" height="96" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="320.0" y="162.0" font-family="Familjen Grotesk" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">vMotion</text>
<text x="320.0" y="190.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="320.0" dy="0.0">mueve una VM encendida a otro</tspan><tspan x="320.0" dy="20.2">host</tspan></text>
<rect x="584" y="124" width="268" height="96" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="604.0" y="162.0" font-family="Familjen Grotesk" font-size="22" font-weight="700" fill="#B45309" text-anchor="start">HA</text>
<text x="604.0" y="190.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="604.0" dy="0.0">reinicia en otro host las VMs</tspan><tspan x="604.0" dy="20.2">de un host caído</tspan></text>
<rect x="868" y="124" width="268" height="96" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="888.0" y="162.0" font-family="Familjen Grotesk" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">DRS</text>
<text x="888.0" y="190.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="888.0" dy="0.0">reparte la carga de CPU y</tspan><tspan x="888.0" dy="20.2">memoria</tspan></text>
<rect x="48" y="244" width="1104" height="88" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="294.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿Corta el servicio?</text>
<text x="320.0" y="282.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start"><tspan x="320.0" dy="0.0">no: copia memoria y estado</tspan><tspan x="320.0" dy="21.6">en vivo</tspan></text>
<text x="604.0" y="282.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#D2492F" text-anchor="start"><tspan x="604.0" dy="0.0">sí: minutos, lo que tarda en</tspan><tspan x="604.0" dy="21.6">arrancar</tspan></text>
<text x="888.0" y="282.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start"><tspan x="888.0" dy="0.0">no: usa vMotion para mover</tspan></text>
<rect x="48" y="344" width="1104" height="88" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿Necesita vCenter?</text>
<text x="320.0" y="382.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="320.0" dy="0.0">sí, para lanzarla</tspan></text>
<text x="604.0" y="382.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="604.0" dy="0.0">no para actuar: anda con</tspan><tspan x="604.0" dy="21.6">vCenter caído</tspan></text>
<text x="888.0" y="382.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="888.0" dy="0.0">sí, siempre</tspan></text>
<rect x="48" y="444" width="1104" height="88" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="494.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿Qué pide?</text>
<text x="320.0" y="482.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="320.0" dy="0.0">almacenamiento compartido y</tspan><tspan x="320.0" dy="21.6">vmk de vMotion</tspan></text>
<text x="604.0" y="482.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="604.0" dy="0.0">capacidad libre en los otros</tspan><tspan x="604.0" dy="21.6">hosts</tspan></text>
<text x="888.0" y="482.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="888.0" dy="0.0">empezar en manual o parcial</tspan></text>
<rect x="48" y="556" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="568" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Licencia</tspan></text><text x="74.0" y="617.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Crear el clúster es libre. Activar HA o DRS depende de la</tspan><tspan x="74.0" dy="21.6">licencia del cliente.</tspan></text>
<rect x="612" y="556" width="540" height="81" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="568" width="5" height="57" rx="2.5" fill="#B45309"/><text x="638.0" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cómo decirlo</tspan></text><text x="638.0" y="617.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Al cliente: &quot;HA reinicia en otro host&quot;. Nunca &quot;no se cae&quot;.</tspan></text>
</svg>