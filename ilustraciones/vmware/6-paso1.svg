<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Mirá el delta en el datastore y que no quede nada</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Mirá el delta en el datastore y que no quede nada</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="170" width="352" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="202.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Antes</text>
<text x="68.0" y="226.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">ls -lh …/vm-prueba/</text>
<rect x="68" y="244" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M82 254h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="110.0" y="271.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba.vmx</text>
<rect x="68" y="300" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M82 310h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="110.0" y="327.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba.vmdk</text>
<rect x="68" y="356" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M82 366h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="110.0" y="383.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba-flat.vmdk</text>
<path d="M402.0 330.0C412.0 330.0,412.0 330.0,422.0 330.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="170" width="352" height="330" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="444.0" y="202.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Con el snapshot</text>
<text x="444.0" y="226.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">ls -lh …/vm-prueba/</text>
<rect x="444" y="244" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M458 254h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="486.0" y="271.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba.vmx</text>
<rect x="444" y="300" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M458 310h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="486.0" y="327.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba.vmdk</text>
<rect x="444" y="356" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M458 366h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="486.0" y="383.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba-flat.vmdk</text>
<rect x="444" y="412" width="312" height="44" rx="8" fill="#FFF4DE" stroke="#B45309" stroke-width="1.8"/><path d="M458 422h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="486.0" y="439.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba-000001.vmdk</text>
<text x="444.0" y="480.0" font-family="JetBrains Mono" font-size="13.5" font-weight="600" fill="#0A63B8" text-anchor="start">snapshot.create 1 &quot;borrar-2026-10-30…&quot;</text>
<path d="M778.0 330.0C788.0 330.0,788.0 330.0,798.0 330.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="170" width="352" height="330" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="820.0" y="202.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Después de removeall</text>
<text x="820.0" y="226.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">ls -lh …/vm-prueba/</text>
<rect x="820" y="244" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M834 254h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="862.0" y="271.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba.vmx</text>
<rect x="820" y="300" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M834 310h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="862.0" y="327.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba.vmdk</text>
<rect x="820" y="356" width="312" height="44" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.8"/><path d="M834 366h12l6 6v18h-18z" fill="none" stroke="#6E88A1" stroke-width="1.6"/><text x="862.0" y="383.0" font-family="JetBrains Mono" font-size="14.5" font-weight="600" fill="#04223D" text-anchor="start">vm-prueba-flat.vmdk</text>
<text x="820.0" y="480.0" font-family="JetBrains Mono" font-size="13.5" font-weight="600" fill="#0A63B8" text-anchor="start">snapshot.removeall 1</text>
<rect x="48" y="524" width="700" height="40" rx="10" fill="#03213C"/><text x="64.0" y="549.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">find /vmfs/volumes/datastore1/ -name &quot;*-0000*.vmdk&quot;</text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Al final no tiene que devolver nada: ni deltas de tu prueba ni de backups fallidos.</text>
<rect x="780" y="524" width="372" height="93" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="780" y="536" width="5" height="69" rx="2.5" fill="#B45309"/><text x="806.0" y="558.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="806.0" dy="0.0">Un snapshot que dejó un backup puede no</tspan><tspan x="806.0" dy="20.2">verse en el Snapshot Manager: por eso el</tspan><tspan x="806.0" dy="20.2">find.</tspan></text>
</svg>