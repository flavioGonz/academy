<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Lifecycle Manager en cuatro pasos, con backup antes</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Lifecycle Manager en cuatro pasos, con backup antes</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="1104" height="86" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<g transform="translate(70 152) scale(1.3)" fill="none" stroke="#D2492F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g>
<text x="118.0" y="164.0" font-family="Familjen Grotesk" font-size="20" font-weight="700" fill="#D2492F" text-anchor="start">Antes de todo: backup</text>
<text x="118.0" y="192.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">del vCenter, de la configuración del host y de las VMs críticas · Compatibility Guide de la versión destino</text>
<rect x="48" y="250" width="252" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="290" r="20" fill="#0A63B8"/><text x="84.0" y="296.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="114.0" y="297.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Check Compliance</text>
<text x="68.0" y="350.0" font-family="Instrument Sans" font-size="15.5" font-weight="400" fill="#41627F" text-anchor="start">compara el host con la imagen</text>
<text x="68.0" y="376.0" font-family="Instrument Sans" font-size="15.5" font-weight="600" fill="#0E8F5E" text-anchor="start">no cambia nada</text>
<path d="M302.0 345.0C315.0 345.0,315.0 345.0,328.0 345.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="250" width="252" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="366" cy="290" r="20" fill="#0A63B8"/><text x="366.0" y="296.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="396.0" y="297.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Run Pre-check</text>
<text x="350.0" y="350.0" font-family="Instrument Sans" font-size="15.5" font-weight="400" fill="#41627F" text-anchor="start">revisa que se pueda aplicar</text>
<text x="350.0" y="376.0" font-family="Instrument Sans" font-size="15.5" font-weight="600" fill="#0E8F5E" text-anchor="start">no cambia nada</text>
<path d="M584.0 345.0C597.0 345.0,597.0 345.0,610.0 345.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="250" width="252" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="648" cy="290" r="20" fill="#0A63B8"/><text x="648.0" y="296.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="678.0" y="297.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Stage</text>
<text x="632.0" y="350.0" font-family="Instrument Sans" font-size="15.5" font-weight="400" fill="#41627F" text-anchor="start">baja los paquetes al host</text>
<text x="632.0" y="376.0" font-family="Instrument Sans" font-size="15.5" font-weight="400" fill="#41627F" text-anchor="start">todavía sin aplicar</text>
<path d="M866.0 345.0C879.0 345.0,879.0 345.0,892.0 345.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="250" width="252" height="190" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<circle cx="930" cy="290" r="20" fill="#B45309"/><text x="930.0" y="296.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="960.0" y="297.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Remediate</text>
<text x="914.0" y="350.0" font-family="Instrument Sans" font-size="15.5" font-weight="400" fill="#41627F" text-anchor="start">modo mantenimiento, aplica</text>
<text x="914.0" y="376.0" font-family="Instrument Sans" font-size="15.5" font-weight="400" fill="#41627F" text-anchor="start">y reinicia</text>
<text x="332.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">Con el staging hecho, el host pasa menos tiempo en mantenimiento.</text>
<rect x="48" y="500" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Dónde está</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">vLCM vive dentro de vCenter: Cluster &gt; Updates &gt; Image. En</tspan><tspan x="74.0" dy="21.6">vSphere 9 se retiran las baselines y queda el modelo de</tspan><tspan x="74.0" dy="21.6">imágenes.</tspan></text>
<rect x="612" y="500" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Vuelta atrás</tspan></text><text x="638.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Rollback de 8 a 7 solo si no se tocaron los bootbanks. Por</tspan><tspan x="638.0" dy="21.6">eso el backup del arranque va primero.</tspan></text>
</svg>