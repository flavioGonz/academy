<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Dos formas de datastore: VMFS y NFS</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Dos formas de datastore: VMFS y NFS</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="540" height="470" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">VMFS: el host formatea el disco</text><rect x="78" y="180" width="220" height="70" rx="12" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="98.0" y="222.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Host ESXi</text><rect x="338" y="180" width="220" height="70" rx="12" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="358.0" y="222.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Host ESXi</text><path d="M188.0 252.0C228.0 252.0,228.0 318.0,268.0 318.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><path d="M448.0 252.0C408.0 252.0,408.0 318.0,368.0 318.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="205.2" y="283.0" width="225.6" height="27" rx="13.5" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="318.0" y="302.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">SAN, iSCSI o disco local</text><rect x="118" y="324" width="400" height="60" rx="12" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="318.0" y="351.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="middle">VMFS, lo arma ESXi</text><text x="318.0" y="373.0" font-family="Instrument Sans" font-size="14" font-weight="400" fill="#6E88A1" text-anchor="middle">maneja el sistema de archivos</text><path d="M208 414V490A110.0 14 0 0 0 428 490V414" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><ellipse cx="318.0" cy="414" rx="110.0" ry="14" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2.5"/><text x="318.0" y="462.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">disco o LUN</text><text x="318.0" y="484.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="middle">por bloques</text><text x="78.0" y="540.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Adentro, una carpeta por VM:</text><text x="78.0" y="566.0" font-family="JetBrains Mono" font-size="14.5" font-weight="500" fill="#04223D" text-anchor="start">.vmx (configuración) · .vmdk y -flat.vmdk (disco)</text>
<rect x="612" y="124" width="540" height="470" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">NFS: el NAS ya tiene el sistema</text><rect x="642" y="180" width="220" height="70" rx="12" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="662.0" y="222.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Host ESXi</text><rect x="902" y="180" width="220" height="70" rx="12" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="922.0" y="222.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Host ESXi</text><path d="M752.0 252.0C792.0 252.0,792.0 318.0,832.0 318.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><path d="M1012.0 252.0C972.0 252.0,972.0 318.0,932.0 318.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="777.6" y="283.0" width="208.8" height="27" rx="13.5" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="882.0" y="302.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">NFS 3 o 4.1 por un vmk</text><rect x="682" y="324" width="400" height="60" rx="12" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="882.0" y="351.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="middle">el NAS (su propio sistema)</text><text x="882.0" y="373.0" font-family="Instrument Sans" font-size="14" font-weight="400" fill="#6E88A1" text-anchor="middle">maneja el sistema de archivos</text><path d="M772 414V490A110.0 14 0 0 0 992 490V414" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><ellipse cx="882.0" cy="414" rx="110.0" ry="14" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2.5"/><text x="882.0" y="462.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">export NFS</text><text x="882.0" y="484.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="middle">por archivos</text><text x="642.0" y="540.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Adentro, una carpeta por VM:</text><text x="642.0" y="566.0" font-family="JetBrains Mono" font-size="14.5" font-weight="500" fill="#04223D" text-anchor="start">.vmx (configuración) · .vmdk y -flat.vmdk (disco)</text>
<text x="48.0" y="628.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Si el datastore es compartido (LUN o NFS), varios hosts ven las mismas VMs: eso habilita vMotion y HA.</text>
</svg>