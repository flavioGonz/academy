<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Por dónde viaja el backup: NBD, HotAdd o SAN</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Por dónde viaja el backup: NBD, HotAdd o SAN</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="560" height="300" rx="18" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="68.0" y="158.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Host ESXi</text><text x="68.0" y="182.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">con la VM a respaldar</text>
<rect x="72" y="196" width="220" height="64" rx="12" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="86" y="210" width="26" height="20" rx="3" fill="none" stroke="#17A8D4" stroke-width="2"/><path d="M93 236h12" stroke="#17A8D4" stroke-width="2"/><text x="122.0" y="225.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">srv-video</text><text x="122.0" y="245.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="start">VM a respaldar</text>
<rect x="420" y="140" width="164" height="46" rx="10" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="502.0" y="169.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">vmk0 gestión</text>
<rect x="340" y="210" width="244" height="64" rx="12" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="354" y="224" width="26" height="20" rx="3" fill="none" stroke="#17A8D4" stroke-width="2"/><path d="M361 250h12" stroke="#17A8D4" stroke-width="2"/><text x="390.0" y="239.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Proxy virtual</text><text x="390.0" y="259.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="start">monta el disco</text>
<path d="M300 314V390A142.0 14 0 0 0 584 390V314" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><ellipse cx="442.0" cy="314" rx="142.0" ry="14" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2.5"/><text x="442.0" y="362.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">datastore (LUN)</text><text x="442.0" y="384.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="middle">disco de srv-video</text>
<rect x="700" y="140" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(720 166.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="764.0" y="178.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Repositorio</text><text x="764.0" y="201.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">servidor de backup</text>
<rect x="700" y="330" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(720 356.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="764.0" y="368.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Proxy físico</text><text x="764.0" y="391.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">ve la LUN en la SAN</text>
<path d="M584.0 160.0C641.0 160.0,641.0 160.0,698.0 160.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="617.1" y="127.0" width="47.8" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="641.0" y="146.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">NBD</text>
<path d="M584.0 242.0C641.0 242.0,641.0 206.0,698.0 206.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/><rect x="604.2" y="229.0" width="73.6" height="28" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="1.5"/><text x="641.0" y="248.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="middle">HotAdd</text>
<path d="M584.0 370.0C641.0 370.0,641.0 372.0,698.0 372.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="617.1" y="338.0" width="47.8" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="641.0" y="357.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">SAN</text>
<path d="M830.0 330.0C830.0 272.8,830.0 283.2,830.0 226.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48.0" y="451.0" width="51.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="73.5" y="472.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">NBD</text>
<text x="160.0" y="472.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">el más simple; en 1 GbE puede ir lento (10 a 20 MB/s según una guía vieja de Veeam)</text>
<rect x="48.0" y="501.0" width="78.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="87.0" y="522.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">HotAdd</text>
<text x="160.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">un proxy virtual en el mismo host monta el disco; no anda con discos IDE</text>
<rect x="48.0" y="551.0" width="51.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="73.5" y="572.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">SAN</text>
<text x="160.0" y="572.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">un proxy físico lee la LUN directo, sin pasar por el host</text>
<rect x="990" y="124" width="162" height="93" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="990" y="136" width="5" height="69" rx="2.5" fill="#0A63B8"/><text x="1016.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="1016.0" dy="0.0">Todos usan la</tspan><tspan x="1016.0" dy="20.2">API de vSphere</tspan><tspan x="1016.0" dy="20.2">(VADP).</tspan></text>
<rect x="990" y="286" width="162" height="113" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="990" y="298" width="5" height="89" rx="2.5" fill="#D2492F"/><text x="1016.0" y="320.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="1016.0" dy="0.0">ESXi gratuito:</tspan><tspan x="1016.0" dy="20.2">sin VADP. Solo</tspan><tspan x="1016.0" dy="20.2">agente adentro</tspan><tspan x="1016.0" dy="20.2">de la VM.</tspan></text>
</svg>