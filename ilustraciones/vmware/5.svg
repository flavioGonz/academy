<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres formatos de disco y lo que cada uno arriesga</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres formatos de disco y lo que cada uno arriesga</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Thick lazy zeroed</text>
<text x="68.0" y="182.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">reserva todo al crear;</text>
<text x="68.0" y="206.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">pone en cero al primer uso</text>
<text x="68.0" y="252.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1">en el datastore</text>
<rect x="68" y="266" width="312" height="46" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="68" y="266" width="312.0" height="46" rx="8" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/>
<rect x="68" y="266" width="109.19999999999999" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="0"/>
<text x="68.0" y="336.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#0A63B8" text-anchor="start">datos de la VM</text>
<text x="380.0" y="336.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="end">reservado</text>
<text x="68.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="68.0" dy="0.0">El espacio queda apartado: no te</tspan><tspan x="68.0" dy="21.6">sorprende.</tspan></text>
<rect x="424" y="124" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="444.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Thick eager zeroed</text>
<text x="444.0" y="182.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">reserva y pone en cero</text>
<text x="444.0" y="206.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">todo al crear (tarda más)</text>
<text x="444.0" y="252.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1">en el datastore</text>
<rect x="444" y="266" width="312" height="46" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="444" y="266" width="312.0" height="46" rx="8" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/>
<rect x="444" y="266" width="109.19999999999999" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="0"/>
<rect x="444" y="266" width="312.0" height="46" rx="8" fill="none" stroke="#17A8D4" stroke-width="3" stroke-dasharray="6 4"/>
<text x="444.0" y="336.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#0A63B8" text-anchor="start">datos de la VM</text>
<text x="756.0" y="336.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="end">reservado</text>
<text x="444.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="444.0" dy="0.0">El que pide Fault Tolerance.</tspan></text>
<rect x="800" y="124" width="352" height="300" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="820.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Thin</text>
<text x="820.0" y="182.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">crece a demanda,</text>
<text x="820.0" y="206.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">hasta su tamaño máximo</text>
<text x="820.0" y="252.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1">en el datastore</text>
<rect x="820" y="266" width="312" height="46" rx="8" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="820" y="266" width="109.19999999999999" height="46" rx="8" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/>
<rect x="820" y="266" width="109.19999999999999" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="0"/>
<rect x="820" y="266" width="109.19999999999999" height="46" rx="8" fill="none" stroke="#17A8D4" stroke-width="3" stroke-dasharray="6 4"/>
<text x="820.0" y="336.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#0A63B8" text-anchor="start">datos de la VM</text>
<text x="1132.0" y="336.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="end">libre para otros</text>
<text x="820.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="start"><tspan x="820.0" dy="0.0">Si llena el datastore, la VM se</tspan><tspan x="820.0" dy="21.6">detiene.</tspan></text>
<rect x="48" y="446" width="540" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="478.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Appliance del fabricante (.ova)</text>
<text x="68.0" y="506.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Entra por Deploy OVF Template, que crea la VM con su</tspan><tspan x="68.0" dy="21.6">hardware. Copiar el .ova al datastore no lo instala.</tspan></text>
<rect x="612" y="446" width="540" height="160" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="478.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">VMware Tools, siempre</text>
<circle cx="637" cy="500.7" r="4.5" fill="#0E8F5E"/><text x="652.0" y="506.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">driver de balloon para la memoria</tspan></text><circle cx="637" cy="530.3" r="4.5" fill="#0E8F5E"/><text x="652.0" y="535.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">snapshots con quiesce</tspan></text><circle cx="637" cy="559.9" r="4.5" fill="#0E8F5E"/><text x="652.0" y="565.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">latido que mira HA</tspan></text>
</svg>