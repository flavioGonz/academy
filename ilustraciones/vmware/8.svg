<text x="660.0" y="392.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">La llave maestra: va al gestor de contraseñas de la</tspan><tspan x="660.0" dy="21.6">empresa y no se usa para el día a día.</tspan></text>
<rect x="48" y="522" width="540" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="534" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="556.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Cada técnico con su usuario: cada cambio queda a nombre de</tspan><tspan x="74.0" dy="21.6">quien lo hizo.</tspan></text>
<rect x="612" y="522" width="540" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="534" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="638.0" y="556.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">En vSphere 8 el tamaño Tiny de la VCSA pide 14 GB de RAM.</tspan></text>
