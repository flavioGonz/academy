<rect x="48" y="330" width="560" height="170" rx="18" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="68.0" y="364.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">vCenter (VCSA)</text><text x="68.0" y="388.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">appliance · gestiona varios hosts</text>
