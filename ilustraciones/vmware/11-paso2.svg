<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un minuto de esxtop guardado en un CSV</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un minuto de esxtop guardado en un CSV</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="168" width="1104" height="50" rx="10" fill="#03213C"/><text x="64.0" y="198.4" font-family="JetBrains Mono" font-size="15.5" font-weight="500" fill="#D9E9F8" text-anchor="start">esxtop -b -a -d 5 -n 12 &gt; /vmfs/volumes/datastore1/esxtop-$(hostname)-$(date +%Y%m%d-%H%M).csv</text>
<rect x="48" y="250" width="208" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="290.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">-b</text>
<text x="68.0" y="330.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">modo batch</text>
<text x="68.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">escribe en vez de mostrar</text>
<rect x="272" y="250" width="208" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="292.0" y="290.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">-a</text>
<text x="292.0" y="330.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">todos los contadores</text>
<text x="292.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">no solo los visibles</text>
<rect x="496" y="250" width="208" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="516.0" y="290.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">-d 5</text>
<text x="516.0" y="330.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">cada 5 segundos</text>
<text x="516.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">una muestra</text>
<rect x="720" y="250" width="208" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="740.0" y="290.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">-n 12</text>
<text x="740.0" y="330.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">12 muestras</text>
<text x="740.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">12 × 5 s = 1 minuto</text>
<rect x="944" y="250" width="208" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="964.0" y="290.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">&gt; …csv</text>
<text x="964.0" y="330.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">al datastore</text>
<text x="964.0" y="358.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">con host, fecha y hora</text>
<text x="48.0" y="448.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">12 muestras, una cada 5 segundos</text>
