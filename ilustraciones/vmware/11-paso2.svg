<rect x="48" y="528" width="1104" height="54" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="540" width="5" height="30" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="562.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ese CSV es la prueba: se abre después con calma y se compara con el de un día normal (paso 4, la línea base).</tspan></text>
