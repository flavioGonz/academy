<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Renovar o migrar? Tres preguntas con números</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">VMWARE</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Renovar o migrar? Tres preguntas con números</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="352" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="86" cy="164" r="20" fill="#0A63B8"/><text x="86.0" y="170.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="118.0" y="171.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Núcleos</text>
<text x="70.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="70.0" dy="0.0">físicos contra licenciables: ¿cuánto</tspan><tspan x="70.0" dy="21.6">pagás de más por el mínimo de 16?</tspan></text>
<rect x="424" y="124" width="352" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="462" cy="164" r="20" fill="#0A63B8"/><text x="462.0" y="170.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="494.0" y="171.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Funciones</text>
<text x="446.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="446.0" dy="0.0">¿usa de verdad vSAN, NSX o DRS, o</tspan><tspan x="446.0" dy="21.6">solo el hipervisor?</tspan></text>
<rect x="800" y="124" width="352" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="838" cy="164" r="20" fill="#0A63B8"/><text x="838.0" y="170.5" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="870.0" y="171.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Piloto</text>
<text x="822.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="822.0" dy="0.0">un host no crítico, 2 o 3 VMs, backup</tspan><tspan x="822.0" dy="21.6">y restauración probados</tspan></text>
<rect x="48" y="312" width="540" height="190" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="344.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Renovar tiene sentido si…</text>
<circle cx="73" cy="366.7" r="4.5" fill="#0E8F5E"/><text x="88.0" y="372.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">la relación físicos y licenciables está cerca de 1 a 1</tspan></text><circle cx="73" cy="396.3" r="4.5" fill="#0E8F5E"/><text x="88.0" y="401.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">se usa el stack: vSAN, NSX, DRS</tspan></text><circle cx="73" cy="425.9" r="4.5" fill="#0E8F5E"/><text x="88.0" y="431.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">hay apps certificadas solo para vSphere</tspan></text>
<rect x="612" y="312" width="540" height="190" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="344.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Conviene cotizar alternativa si…</text>
<circle cx="637" cy="366.7" r="4.5" fill="#B45309"/><text x="652.0" y="372.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">son 2 a 10 hosts con CPUs de menos de 16 núcleos</tspan></text><circle cx="637" cy="396.3" r="4.5" fill="#B45309"/><text x="652.0" y="401.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">solo se usa el hipervisor</tspan></text><circle cx="637" cy="425.9" r="4.5" fill="#B45309"/><text x="652.0" y="431.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">el costo subió y no hay funciones nuevas que lo paguen</tspan></text>
<rect x="48" y="526" width="1104" height="104" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="76.0" y="568.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Ninguna migración arranca sin:</text>
<rect x="400.0" y="549.0" width="78.0" height="29" rx="14.5" fill="#17A8D4" stroke="#FFFFFF" stroke-width="1.5"/><text x="439.0" y="570.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">piloto</text>
<rect x="630.0" y="549.0" width="177.0" height="29" rx="14.5" fill="#17A8D4" stroke="#FFFFFF" stroke-width="1.5"/><text x="718.5" y="570.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">backup verificado</text>
<rect x="860.0" y="549.0" width="132.0" height="29" rx="14.5" fill="#17A8D4" stroke="#FFFFFF" stroke-width="1.5"/><text x="926.0" y="570.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">vuelta atrás</text>
<text x="76.0" y="604.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">Broadcom recomienda VCF 9 o VVF 9; Introserv y Redress dicen que en clientes chicos la cuenta suele no cerrar.</text>
</svg>