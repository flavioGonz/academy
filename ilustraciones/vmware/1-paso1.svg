<rect x="800" y="474" width="352" height="97" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="800" y="486" width="5" height="73" rx="2.5" fill="#B45309"/><text x="826.0" y="508.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">Si dice gratuito, no prometas</tspan><tspan x="826.0" dy="21.6">vCenter, vMotion, HA ni backup por</tspan><tspan x="826.0" dy="21.6">API.</tspan></text>
