<rect x="648" y="360" width="280" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(668 386.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="712.0" y="398.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Hora</text><text x="712.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Sincronizar hora</text>
<rect x="48" y="480" width="540" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="492" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Dahua: Verificar suscripción tiene que decir «Suscripción</tspan><tspan x="74.0" dy="20.2">activa». «NVR no accesible» es red o credenciales del NVR.</tspan></text>
<rect x="612" y="480" width="540" height="72" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="492" width="5" height="48" rx="2.5" fill="#D2492F"/><text x="638.0" y="514.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">No resetees la cámara para probar: se pierden la regla, el</tspan><tspan x="638.0" dy="20.2">horario y el servidor de alarma.</tspan></text>
