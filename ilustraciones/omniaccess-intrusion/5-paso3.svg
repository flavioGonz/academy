<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS INTRUSIÓN · LECCIÓN 5 · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La PC de la pared abre el enlace en modo kiosco</text>
<rect x="48" y="150" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">PC de la pared</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Chrome en kiosco</text>
<path d="M352.0 192.0C391.0 192.0,391.0 192.0,430.0 192.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="434" y="150" width="300" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(454 176.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g><text x="498.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Vista Intrusión</text><text x="498.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">/monitor/intrusion</text>
<path d="M738.0 192.0C777.0 192.0,777.0 192.0,816.0 192.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="820" y="150" width="332" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(840 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></g><text x="884.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Suena</text><text x="884.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Repetir hasta que se acepte</text>
<rect x="48" y="280" width="1104" height="104" rx="14" fill="#03213C"/><text x="66.0" y="306.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">ACCESO DIRECTO EN INICIO</text><text x="66.0" y="336.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">chrome.exe --kiosk --autoplay-policy=no-user-gesture-required</text><text x="66.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#8FE3B5" text-anchor="start">  &quot;https://&lt;servidor&gt;/monitor/intrusion?pantalla=&lt;token&gt;&quot;</text>
<rect x="48" y="400" width="540" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="412" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="74.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué esas opciones</tspan></text><text x="74.0" y="460.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">--kiosk abre a pantalla completa y --autoplay-policy deja sonar</tspan><tspan x="74.0" dy="20.2">sin el primer toque.</tspan></text>
<rect x="612" y="400" width="540" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="412" width="5" height="75" rx="2.5" fill="#B45309"/><text x="638.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Sin kiosco</tspan></text><text x="638.0" y="460.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Sin kiosco también anda: la pantalla pide un toque para</tspan><tspan x="638.0" dy="20.2">habilitar sonido y pantalla completa.</tspan></text>
<rect x="48" y="540" width="1104" height="52" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="552" width="5" height="28" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El enlace es de solo lectura: la pared muestra la alarma; se decide desde el panel o con una sesión con permiso.</tspan></text>
</svg>