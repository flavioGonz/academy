sona</text><text x="892.0" y="351.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">calibrador</text><path d="M60 374H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="407.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Árbol o arbustos</text><text x="422.0" y="407.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Zona más chica, línea lejos; sensibilidad 40</text><text x="892.0" y="407.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">calibrador</text>
