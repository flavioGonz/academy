<circle cx="82" cy="184" r="18" fill="#17A8D4"/>
<text x="82.0" y="190.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="192.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Alta</text>
<text x="70.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="70.0" dy="0.0">Dispositivos → Agregar →</tspan><tspan x="70.0" dy="21.6">Cámara de intrusión, o</tspan><tspan x="70.0" dy="21.6">Importar cámaras</tspan><tspan x="70.0" dy="21.6">(clasificar) desde el NVR</tspan></text>
<path d="M310.0 260.0C318.0 260.0,318.0 260.0,326.0 260.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="150" width="258" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="364" cy="184" r="18" fill="#17A8D4"/>
<text x="364.0" y="190.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="192.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Servidor de alarma</text>
<text x="352.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="352.0" dy="0.0">Campana del canal →</tspan><tspan x="352.0" dy="21.6">Configurar OmniAccess como</tspan><tspan x="352.0" dy="21.6">alarma → Probar reporte</tspan></text>
<path d="M592.0 260.0C600.0 260.0,600.0 260.0,608.0 260.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="150" width="258" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="646" cy="184" r="18" fill="#17A8D4"/>
<text x="646.0" y="190.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="674.0" y="192.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Vinculación</text>
<text x="634.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="634.0" dy="0.0">En la regla de la cámara:</tspan><tspan x="634.0" dy="21.6">Notificar al centro de</tspan><tspan x="634.0" dy="21.6">vigilancia</tspan></text>
<path d="M874.0 260.0C882.0 260.0,882.0 260.0,890.0 260.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="150" width="258" height="220" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="928" cy="184" r="18" fill="#0E8F5E"/>
<text x="928.0" y="190.0" font-family="Familjen Grotesk" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="956.0" y="192.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Cruzar la línea</text>
<text x="916.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="916.0" dy="0.0">El canal se pone rojo y la</tspan><tspan x="916.0" dy="21.6">tarjeta llega con foto</tspan></text>
<rect x="48" y="430" width="560" height="170" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 444a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="450" r="5" fill="#C2D4E6"/><circle cx="86" cy="450" r="5" fill="#C2D4E6"/><circle cx="104" cy="450" r="5" fill="#C2D4E6"/><text x="124.0" y="456.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Lo que escribe en la cámara · ISAPI httpHosts</text><rect x="58" y="478" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="500.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Host 1</text><text x="588.0" y="500.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">192.0.2.10:10000</text><text x="68.0" y="538.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">URL</text><text x="588.0" y="538.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">/api/webhooks/hikvision</text><text x="68.0" y="576.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Formato · Auth</text><text x="588.0" y="576.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">XML · ninguna</text>
<rect x="640" y="430" width="512" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="442" width="5" height="75" rx="2.5" fill="#B45309"/><text x="666.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">El test no alcanza</tspan></text><text x="666.0" y="490.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Probar reporte puede no confirmar: varias cámaras no</tspan><tspan x="666.0" dy="20.2">implementan el test. La prueba que vale es el paso 4.</tspan></text>
