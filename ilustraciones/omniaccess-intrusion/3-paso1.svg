<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Importá del NVR y elegí qué es cada canal</text>
<rect x="48" y="150" width="1104" height="260" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 162a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v40h-1104z" fill="#E5F0FB"/><text x="62.0" y="181.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CANAL</text><text x="182.0" y="181.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">NOMBRE EN EL NVR</text><text x="582.0" y="181.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MARCA</text><text x="802.0" y="181.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">ROL</text><text x="62.0" y="233.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">D1</text><text x="182.0" y="233.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Acceso Principal Entrada</text><text x="582.0" y="233.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">HIKVISION</text><text x="802.0" y="233.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">LPR · entrada</text><rect x="52" y="257" width="1096" height="46" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="285.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">D5</text><text x="182.0" y="285.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Perímetro Norte 12</text><text x="582.0" y="285.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">HIKVISION</text><text x="802.0" y="285.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">intrusión</text><path d="M60 306H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="337.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">D6</text><text x="182.0" y="337.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Perímetro Sur 07</text><text x="582.0" y="337.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">DAHUA</text><text x="802.0" y="337.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">intrusión</text><path d="M60 358H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="389.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">D9</text><text x="182.0" y="389.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Quincho interior</text><text x="582.0" y="389.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">HIKVISION</text><text x="802.0" y="389.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">omitir</text>
<rect x="48" y="440" width="540" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="452" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La sugerencia sale del nombre</tspan></text><text x="74.0" y="500.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el nombre habla de matrícula, patente, entrada, salida,</tspan><tspan x="74.0" dy="20.2">acceso o barrera, sugiere LPR; si no, cámara del perímetro.</tspan></text>
<rect x="612" y="440" width="540" height="120" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="452" width="5" height="96" rx="2.5" fill="#B45309"/><text x="638.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Ojo con la clave</tspan></text><text x="638.0" y="500.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Las creadas así toman usuario y clave del NVR. Si la cámara</tspan><tspan x="638.0" dy="20.2">tiene otra clave, corregila en Editar: sin ella no hay foto</tspan><tspan x="638.0" dy="20.2">propia.</tspan></text>
</svg>