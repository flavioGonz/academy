<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Dos horarios con el mismo nombre</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS INTRUSIÓN · LECCIÓN 4 · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Dos horarios con el mismo nombre</text>
<rect x="48" y="150" width="532" height="250" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Horario de armado en la cámara</text>
<circle cx="77" cy="228.7" r="4.5" fill="#0E8F5E"/><text x="92.0" y="235.0" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Decide si la cámara avisa</tspan></text><circle cx="77" cy="272.4" r="4.5" fill="#B45309"/><text x="92.0" y="278.6" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Fuera de horario: no llega nada</tspan></text><circle cx="77" cy="316.0" r="4.5" fill="#17A8D4"/><text x="92.0" y="322.3" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Se cambia en la web de la cámara</tspan></text>
<rect x="620" y="150" width="532" height="250" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="640.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Horario en el Mapa</text>
<circle cx="649" cy="228.7" r="4.5" fill="#B45309"/><text x="664.0" y="235.0" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">Solo calla el mapa: no suena ni titila</tspan></text><circle cx="649" cy="272.4" r="4.5" fill="#0E8F5E"/><text x="664.0" y="278.6" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">La detección llega igual al monitor</tspan></text><circle cx="649" cy="316.0" r="4.5" fill="#0E8F5E"/><text x="664.0" y="322.3" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">Queda en el historial</tspan></text><circle cx="649" cy="359.7" r="4.5" fill="#17A8D4"/><text x="664.0" y="365.9" font-family="Instrument Sans" font-size="19" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="664.0" dy="0.0">Sin horario = siempre armada</tspan></text>
<rect x="48" y="430" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="442" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Para que el mapa no calle lo que la cámara avisa: Mapa → Editar mapa → Cruces de línea → Horario → Quitar.</tspan></text>
</svg>