<rect x="610" y="490" width="542" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="610" y="502" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="636.0" y="524.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">Por WhatsApp sale el clip que manda el operador desde la</tspan><tspan x="636.0" dy="20.2">grabación, no la alarma automática.</tspan></text>
