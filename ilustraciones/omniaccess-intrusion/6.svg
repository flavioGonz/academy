<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>De «detectada» a «resuelta», con una decisión</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS INTRUSIÓN · LECCIÓN 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">De «detectada» a «resuelta», con una decisión</text>
<rect x="48" y="260" width="250" height="84" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="296.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Detectada</text><text x="68.0" y="322.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">canal rojo · sin confirmar</text>
<rect x="470" y="150" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#6E88A1" stroke-width="2"/><text x="490.0" y="186.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Archivada como falsa</text><text x="490.0" y="212.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">queda en el registro</text>
<rect x="470" y="370" width="300" height="84" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="490.0" y="406.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">En atención</text><text x="490.0" y="432.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">borde animado en el canal</text>
<rect x="902" y="370" width="250" height="84" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="922.0" y="406.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Resuelta</text><text x="922.0" y="432.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">fue real y se atendió</text>
<path d="M298.0 290.0 L380.0 290.0 L380.0 192.0 L462.0 192.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="309.8" y="226.0" width="140.5" height="27" rx="13.5" fill="#FFFFFF" stroke="#41627F" stroke-width="1.5"/><text x="380.0" y="245.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#41627F" text-anchor="middle">Falsa alarma · F</text>
<path d="M298.0 316.0 L380.0 316.0 L380.0 412.0 L462.0 412.0" fill="none" stroke="#D2492F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-alert)"/>
<rect x="302.5" y="341.0" width="155.0" height="27" rx="13.5" fill="#FFFFFF" stroke="#D2492F" stroke-width="1.5"/><text x="380.0" y="360.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">Confirmar real · A</text>
<path d="M776.0 412.0C835.0 412.0,835.0 412.0,894.0 412.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="793.9" y="379.0" width="82.2" height="27" rx="13.5" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="1.5"/><text x="835.0" y="398.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="middle">Resolver</text>
<path d="M620.0 370.0 L620.0 242.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/>
<text x="632.0" y="312.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">Era falsa alarma</text>
<rect x="48" y="500" width="640" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Aceptar abre la ficha del evento. La decisión vale para todas las</tspan><tspan x="74.0" dy="20.2">detecciones sin aceptar de esa cámara de las últimas 6 horas.</tspan></text>
<rect x="720" y="500" width="432" height="72" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="720" y="512" width="5" height="48" rx="2.5" fill="#0E8F5E"/><text x="746.0" y="534.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="746.0" dy="0.0">Teclas en la ficha: ← → recorren eventos, A o</tspan><tspan x="746.0" dy="20.2">Enter real, F falsa, Esc cierra.</tspan></text>
</svg>