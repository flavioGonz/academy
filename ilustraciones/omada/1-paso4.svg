<text x="352.0" y="166.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">OC220</text>
<text x="352.0" y="210.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#0A63B8" text-anchor="start">hasta 40 equipos</text>
<rect x="612" y="124" width="258" height="112" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="634.0" y="166.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">OC300</text>
<text x="634.0" y="210.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#0A63B8" text-anchor="start">hasta 160 equipos</text>
