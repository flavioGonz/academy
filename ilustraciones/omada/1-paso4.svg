<rect x="150" y="386" width="286.0" height="34" rx="10" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="694.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">22 de 40: entra y queda margen</text>
