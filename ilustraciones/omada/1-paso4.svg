<rect x="48" y="470" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="482" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cifras viejas y máximas</tspan></text><text x="74.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Una reseña de 2022 citaba el OC200 hasta 100 equipos. La</tspan><tspan x="74.0" dy="21.6">tabla oficial actual recomienda 25: se dimensiona por esa.</tspan></text>
<rect x="612" y="470" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="482" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Otras cifras de la tabla oficial</tspan></text><text x="638.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Software propio: recomendado hasta 10.000. ER7212PC V2: 22</tspan><tspan x="638.0" dy="21.6">switches y EAP. Fusion: 30 equipos según el modelo.</tspan></text>
