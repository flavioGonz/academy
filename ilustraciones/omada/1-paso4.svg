<rect x="150" y="312" width="457.6" height="34" rx="10" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="694.0" y="336.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#B45309" text-anchor="start">22 de 25: entra, pero sin lugar para crecer</text>
