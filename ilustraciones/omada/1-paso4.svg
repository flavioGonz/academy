<text x="70.0" y="166.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">OC200</text>
<text x="70.0" y="210.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#0A63B8" text-anchor="start">hasta 25 equipos</text>
