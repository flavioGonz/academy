<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Así encuentra el EAP al controlador en su subred</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Así encuentra el EAP al controlador en su subred</text>
<rect x="75.0" y="124" width="190" height="62" rx="12" fill="#011E38"/><text x="170.0" y="151.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">EAP</text><text x="170.0" y="173.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">de fábrica, por DHCP</text><path d="M170 186V560" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="515.0" y="124" width="190" height="62" rx="12" fill="#011E38"/><text x="610.0" y="151.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Controlador</text><text x="610.0" y="173.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">misma VLAN y subred</text><path d="M610 186V560" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M170 246H604" stroke="#6E88A1" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-gray)"/><text x="390.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">broadcast a UDP 29810</text>
<path d="M610 312H176" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="390.0" y="302.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">responde por el mismo puerto</text>
<rect x="526.0" y="351.0" width="168.0" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="610.0" y="372.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">Devices: Pending</text>
<rect x="314.5" y="351.0" width="191.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="410.0" y="372.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">el técnico toca Adopt</text>
<path d="M610 436H176" stroke="#0E8F5E" stroke-width="3" marker-end="url(#a-ok)"/><text x="390.0" y="426.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">configuración y Device Account</text>
<rect x="557.5" y="479.0" width="105.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="610.0" y="500.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">Connected</text>
<rect x="70.5" y="479.0" width="198.9" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="170.0" y="500.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">GUI local: ya no manda</text>
<rect x="784" y="124" width="368" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="784" y="136" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="810.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="810.0" dy="0.0">Misma VLAN</tspan></text><text x="810.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="810.0" dy="0.0">El broadcast no cruza routers. EAP y</tspan><tspan x="810.0" dy="21.6">controlador tienen que compartir VLAN</tspan><tspan x="810.0" dy="21.6">y subred.</tspan></text>
<rect x="784" y="276" width="368" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="784" y="288" width="5" height="100" rx="2.5" fill="#B45309"/><text x="810.0" y="310.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="810.0" dy="0.0">No aparece en Pending</tspan></text><text x="810.0" y="336.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="810.0" dy="0.0">Primero la VLAN: tags en todos los</tspan><tspan x="810.0" dy="21.6">puertos hasta el DHCP. Después loops,</tspan><tspan x="810.0" dy="21.6">ping y firewall.</tspan></text>
<rect x="784" y="428" width="368" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="784" y="440" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="810.0" y="462.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="810.0" dy="0.0">Equipo usado</tspan></text><text x="810.0" y="488.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="810.0" dy="0.0">Reset de fábrica antes de adoptar.</tspan><tspan x="810.0" dy="21.6">Adoptado, obedece al controlador y no</tspan><tspan x="810.0" dy="21.6">a su web local.</tspan></text>
</svg>