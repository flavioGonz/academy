<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Antes de instalar, mirá si la CPU tiene AVX</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Antes de instalar, mirá si la CPU tiene AVX</text>
<rect x="48" y="128" width="1104" height="78" rx="14" fill="#03213C"/><text x="66.0" y="154.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">VM LINUX</text><text x="66.0" y="184.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ grep -o -m1 avx /proc/cpuinfo || echo &quot;SIN AVX: usar mbentley/omada-controller:5&quot;</text>
<circle cx="48" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="236" width="540" height="190" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="268.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Imprime avx</text>
<text x="72.0" y="304.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Imagen mbentley/omada-controller:6.2</text><text x="72.0" y="334.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Controlador 6.x con su MongoDB.</text><text x="72.0" y="364.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Seguí con el compose del paso 2.</text>
<rect x="612" y="236" width="540" height="190" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="268.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Imprime SIN AVX</text>
<text x="636.0" y="304.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Imagen :5, la rama 5 del controlador,</text><text x="636.0" y="334.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">o una mini PC Intel de 6.ª generación</text><text x="636.0" y="364.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">o más nueva.</text>
<rect x="48" y="450" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="462" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué importa</tspan></text><text x="74.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El controlador 6.x usa un MongoDB que pide la instrucción</tspan><tspan x="74.0" dy="21.6">AVX. Una Raspberry Pi 4 o un NAS viejo no la tienen y el</tspan><tspan x="74.0" dy="21.6">contenedor no arranca.</tspan></text>
<rect x="612" y="450" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="462" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Memoria</tspan></text><text x="638.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Al arrancar usa unos 1,9 GB de RAM, según LazyAdmin:</tspan><tspan x="638.0" dy="21.6">conviene dejarle 4 GB libres en la VM.</tspan></text>
</svg>