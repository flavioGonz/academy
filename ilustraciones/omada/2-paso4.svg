<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">En el asistente: cuenta local y región real</text>
<rect x="48" y="124" width="520" height="40" rx="10" fill="#03213C"/><text x="64.0" y="149.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">https://&lt;IP-de-la-VM&gt;:8043</text>
<text x="48.0" y="192.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Entrá cuando el log muestre la versión (1 a 2 minutos).</text>
<rect x="48" y="216" width="520" height="176" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 230a14 14 0 0 1 14 -14h492a14 14 0 0 1 14 14v26h-520z" fill="#E5F0FB"/><circle cx="68" cy="236" r="5" fill="#C2D4E6"/><circle cx="86" cy="236" r="5" fill="#C2D4E6"/><circle cx="104" cy="236" r="5" fill="#C2D4E6"/><text x="124.0" y="242.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Omada Controller · asistente</text><rect x="58" y="264" width="500" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="286.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Cuenta</text><text x="548.0" y="286.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Create a Local Account</text><text x="68.0" y="324.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Región</text><text x="548.0" y="324.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Uruguay</text><text x="68.0" y="362.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Zona horaria</text><text x="548.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">America/Montevideo</text>
<circle cx="48" cy="216" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="222.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="612" y="124" width="540" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="136" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cuenta local</tspan></text><text x="638.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">El controlador no depende de la nube de TP-Link. El acceso</tspan><tspan x="638.0" dy="21.6">remoto con TP-Link ID se puede sumar después, si hace</tspan><tspan x="638.0" dy="21.6">falta.</tspan></text>
<rect x="612" y="276" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="288" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="310.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Región</tspan></text><text x="638.0" y="336.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La región define qué canales y qué potencia son legales.</tspan><tspan x="638.0" dy="21.6">Elegí el país donde están los AP, no el que viene marcado.</tspan></text>
<rect x="612" y="428" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="440" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="462.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Prueba final (paso 5)</tspan></text><text x="638.0" y="488.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Cerrado el asistente, el EAP de la misma subred tiene que</tspan><tspan x="638.0" dy="21.6">aparecer en Devices como Pending.</tspan></text>
</svg>