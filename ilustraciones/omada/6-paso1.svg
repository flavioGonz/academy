<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Creá la red: interfaz, VLAN y DHCP en un formulario</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Creá la red: interfaz, VLAN y DHCP en un formulario</text>
<rect x="48" y="124" width="600" height="290" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 138a14 14 0 0 1 14 -14h572a14 14 0 0 1 14 14v26h-600z" fill="#E5F0FB"/><circle cx="68" cy="144" r="5" fill="#C2D4E6"/><circle cx="86" cy="144" r="5" fill="#C2D4E6"/><circle cx="104" cy="144" r="5" fill="#C2D4E6"/><text x="124.0" y="150.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Omada · sitio</text><text x="66.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Network Config &gt; Network Settings &gt; LAN &gt; Add</text><text x="68.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Name</text><text x="628.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">CCTV</text><rect x="58" y="240" width="580" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="262.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">VLAN</text><text x="628.0" y="262.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">20</text><text x="68.0" y="300.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Gateway/Subnet</text><text x="628.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">10.10.20.1/24</text><text x="68.0" y="338.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">DHCP Server</text><text x="628.0" y="338.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">activado</text><text x="68.0" y="376.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Rango</text><text x="628.0" y="376.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">10.10.20.100 - 10.10.20.200</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="684" y="124" width="468" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="684" y="136" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="710.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="710.0" dy="0.0">Perfil automático</tspan></text><text x="710.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Al crear la red, el controlador crea su perfil de</tspan><tspan x="710.0" dy="21.6">puerto, CCTV, listo para asignar en el paso 3.</tspan></text>
<rect x="684" y="266" width="468" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="684" y="278" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="710.0" y="300.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="710.0" dy="0.0">Con router de terceros</tspan></text><text x="710.0" y="326.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Si la VLAN la rutea otro equipo, la red se crea</tspan><tspan x="710.0" dy="21.6">con DHCP Server Device en None: la interfaz y el</tspan><tspan x="710.0" dy="21.6">DHCP los da ese router.</tspan></text>
<rect x="684" y="430" width="468" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="684" y="442" width="5" height="100" rx="2.5" fill="#B45309"/><text x="710.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="710.0" dy="0.0">Red de gestión</tspan></text><text x="710.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">La red por defecto queda como VLAN de gestión de</tspan><tspan x="710.0" dy="21.6">los equipos Omada. Moverla es engorroso: conviene</tspan><tspan x="710.0" dy="21.6">dejarla así.</tspan></text>
</svg>