<rect x="48" y="414" width="352" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="426" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="448.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Corta el servicio</tspan></text><text x="74.0" y="474.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Mientras escanea, los clientes se</tspan><tspan x="74.0" dy="21.6">quedan sin internet varios minutos.</tspan><tspan x="74.0" dy="21.6">En horario de trabajo, nunca.</tspan></text>
