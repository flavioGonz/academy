<rect x="441.2" y="311.0" width="397.7" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="640.0" y="332.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">con la dirección, el EAP llama directo: Pending</text>
<rect x="48" y="370" width="352" height="168" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="408" r="18" fill="#17A8D4"/><text x="84.0" y="414.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="114.0" y="415.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Discovery Utility</text>
<text x="74.0" y="452.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Programa en una PC de la</text><text x="74.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">subred del equipo.</text><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Batch Setting con la IP.</text>
<rect x="424" y="370" width="352" height="168" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="460" cy="408" r="18" fill="#17A8D4"/><text x="460.0" y="414.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="490.0" y="415.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Inform URL</text>
<text x="450.0" y="452.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">En la web del equipo:</text><text x="450.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">System Tools &gt;</text><text x="450.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Controller Settings.</text>
<rect x="800" y="370" width="352" height="168" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="836" cy="408" r="18" fill="#17A8D4"/><text x="836.0" y="414.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="866.0" y="415.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">DHCP option 138</text>
<text x="826.0" y="452.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">El DHCP entrega la IP</text><text x="826.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">del controlador. Actúa</text><text x="826.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">cuando el equipo renueva.</text>
<rect x="48" y="558" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="570" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="592.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En Omada Central va la Site URL que copiás en Global View &gt;</tspan><tspan x="74.0" dy="21.6">Dashboard, no una IP.</tspan></text>
<rect x="612" y="558" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="570" width="5" height="51" rx="2.5" fill="#B45309"/><text x="638.0" y="592.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con Docker Desktop (Windows o macOS), el camino práctico es</tspan><tspan x="638.0" dy="21.6">la Inform URL.</tspan></text>
