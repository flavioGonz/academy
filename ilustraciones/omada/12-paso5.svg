<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Migrar en orden: Forget recién al final</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Migrar en orden: Forget recién al final</text>
<rect x="48" y="128" width="254" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="166" r="18" fill="#17A8D4"/><text x="82.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="173.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Exportar</text>
<text x="72.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Global View &gt;</text>
<text x="72.0" y="246.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Settings &gt; Migration</text>
<path d="M306.0 203.0C316.0 203.0,316.0 203.0,326.0 203.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="128" width="254" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="364" cy="166" r="18" fill="#17A8D4"/><text x="364.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="173.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Importar</text>
<text x="354.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">en el destino, misma</text>
<text x="354.0" y="246.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Major.Minor.Patch</text>
<path d="M588.0 203.0C598.0 203.0,598.0 203.0,608.0 203.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="128" width="254" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="646" cy="166" r="18" fill="#17A8D4"/><text x="646.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="674.0" y="173.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Migrar equipos</text>
<text x="636.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">con la IP o la</text>
<text x="636.0" y="246.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Inform URL nueva</text>
<path d="M870.0 203.0C880.0 203.0,880.0 203.0,890.0 203.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="128" width="254" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="928" cy="166" r="18" fill="#17A8D4"/><text x="928.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="956.0" y="173.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Forget</text>
<text x="918.0" y="220.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">en el viejo, cuando</text>
<text x="918.0" y="246.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">todos estén Connected</text>
<circle cx="48" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="310" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="322" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="344.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Saltear el paso 2</tspan></text><text x="74.0" y="370.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Desde la 5.15.24, si salteás la importación y pasás directo</tspan><tspan x="74.0" dy="21.6">a migrar equipos, el destino no los adopta solo.</tspan></text>
<rect x="612" y="310" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="322" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="344.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Misma versión</tspan></text><text x="638.0" y="370.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Desde la 5.13.11.41 solo se importa un archivo de la misma</tspan><tspan x="638.0" dy="21.6">Major.Minor.Patch, por ejemplo 5.13.11.</tspan></text>
<rect x="48" y="450" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="462" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">ER7212PC</tspan></text><text x="74.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El backup de un ER7212PC solo vuelve a otro ER7212PC: no se</tspan><tspan x="74.0" dy="21.6">cruza con software, OC ni Central.</tspan></text>
<rect x="612" y="450" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="462" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Hacia la nube</tspan></text><text x="638.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Pasar de un controlador local a la nube deja los equipos</tspan><tspan x="638.0" dy="21.6">Unactivated hasta asignarles licencia.</tspan></text>
</svg>