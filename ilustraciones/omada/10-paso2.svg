<rect x="612" y="480" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="492" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Certificado</tspan></text><text x="638.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con HTTPS Redirection conviene un certificado propio. El</tspan><tspan x="638.0" dy="21.6">controlador lo pide en un único archivo .pfx, con</tspan><tspan x="638.0" dy="21.6">certificado y clave juntos.</tspan></text>
