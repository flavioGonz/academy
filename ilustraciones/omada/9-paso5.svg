<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Caminá con ping continuo y contá los cortes</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Caminá con ping continuo y contá los cortes</text>
<rect x="48" y="124" width="600" height="208" rx="14" fill="#03213C"/><text x="66.0" y="150.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">NOTEBOOK · ILUSTRATIVO</text><text x="66.0" y="180.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">C:\&gt; ping -t 192.168.88.1</text><text x="66.0" y="206.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Respuesta desde 192.168.88.1: tiempo=3ms</text><text x="66.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Respuesta desde 192.168.88.1: tiempo=4ms</text><text x="66.0" y="258.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#F4A592" text-anchor="start">Tiempo de espera agotado para esta solicitud.</text><text x="66.0" y="284.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Respuesta desde 192.168.88.1: tiempo=5ms</text><text x="66.0" y="310.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">Respuesta desde 192.168.88.1: tiempo=3ms</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="368" width="600" height="138" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 380a12 12 0 0 1 12 -12h576a12 12 0 0 1 12 12v34h-600z" fill="#E5F0FB"/><text x="62.0" y="396.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PRUEBA</text><text x="362.0" y="396.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CORTES</text><text x="502.0" y="396.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">AP AL FINAL</text><text x="62.0" y="442.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Fast Roaming (k y v)</text><text x="362.0" y="442.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">____</text><text x="502.0" y="442.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">____</text><path d="M60 460H636" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="488.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">+ 802.11r en el SSID</text><text x="362.0" y="488.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">____</text><text x="502.0" y="488.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">____</text>
<rect x="684" y="124" width="468" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="684" y="136" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="710.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="710.0" dy="0.0">Qué anotar</tspan></text><text x="710.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Cada línea de Tiempo de espera agotado es un</tspan><tspan x="710.0" dy="21.6">corte. Al volver, mirá en Clients a qué EAP quedó</tspan><tspan x="710.0" dy="21.6">asociada la notebook.</tspan></text>
<rect x="684" y="290" width="468" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="684" y="302" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="710.0" y="324.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="710.0" dy="0.0">Después, con 802.11r</tspan></text><text x="710.0" y="350.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Paso 6: activá 802.11r en Edit SSID &gt; Advanced</tspan><tspan x="710.0" dy="21.6">Settings y repetí el mismo recorrido.</tspan></text>
<rect x="684" y="432" width="468" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="684" y="444" width="5" height="78" rx="2.5" fill="#B45309"/><text x="710.0" y="466.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="710.0" dy="0.0">Si algo se corta</tspan></text><text x="710.0" y="492.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Si algún equipo pierde internet al cambiar de EAP</tspan><tspan x="710.0" dy="21.6">con 802.11r, dejalo apagado en ese SSID.</tspan></text>
</svg>