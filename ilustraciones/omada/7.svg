<rect x="612" y="532" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="544" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="566.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Con ACL</tspan></text><text x="638.0" y="593.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con la regla en el gateway, Invitados sale a internet y no</tspan><tspan x="638.0" dy="21.6">llega ni a la oficina ni a las cámaras.</tspan></text>
