<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada línea del compose evita un problema</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada línea del compose evita un problema</text>
<rect x="48" y="124" width="640" height="370" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">/opt/omada/docker-compose.yml</text><text x="64.0" y="176.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">services:</text><text x="64.0" y="206.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">  omada-controller:</text><text x="64.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">    image: mbentley/omada-controller:6.2</text><text x="64.0" y="266.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">    network_mode: host</text><text x="64.0" y="296.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">    restart: unless-stopped</text><text x="64.0" y="326.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">    stop_grace_period: 60s</text><text x="64.0" y="356.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">    environment:</text><text x="64.0" y="386.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">      - TZ=America/Montevideo</text><text x="64.0" y="416.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">    volumes:</text><text x="64.0" y="446.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">      - omada-data:/opt/tplink/EAPController/data</text><text x="64.0" y="476.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">      - omada-logs:/opt/tplink/EAPController/logs</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<path d="M690 261H716" stroke="#17A8D4" stroke-width="2"/>
<rect x="724.0" y="245.0" width="310.2" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="879.1" y="266.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">El broadcast de descubrimiento llega</text>
<path d="M690 291H716" stroke="#17A8D4" stroke-width="2"/>
<rect x="724.0" y="275.0" width="294.3" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="871.1" y="296.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">Vuelve solo después de un reinicio</text>
<path d="M690 321H716" stroke="#17A8D4" stroke-width="2"/>
<rect x="724.0" y="305.0" width="270.5" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="859.2" y="326.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">MongoDB cierra limpio al apagar</text>
<path d="M690 381H716" stroke="#17A8D4" stroke-width="2"/>
<rect x="724.0" y="365.0" width="326.1" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="887.0" y="386.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">Hora correcta en logs y programaciones</text>
<path d="M690 441H716" stroke="#17A8D4" stroke-width="2"/>
<rect x="724.0" y="425.0" width="262.5" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="855.2" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">Acá vive toda la configuración</text>
<rect x="48" y="530" width="1104" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="542" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="564.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Actualizar sin perder nada</tspan></text><text x="74.0" y="591.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Para actualizar: docker compose pull &amp;&amp; docker compose up -d. Nunca docker compose down -v: borra los volúmenes con toda la</tspan><tspan x="74.0" dy="21.6">configuración.</tspan></text>
</svg>