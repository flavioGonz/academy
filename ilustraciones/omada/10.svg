<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El portal: el huésped entra con un código</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El portal: el huésped entra con un código</text>
<rect x="55.0" y="120" width="190" height="62" rx="12" fill="#011E38"/><text x="150.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Celular</text><text x="150.0" y="169.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">huésped</text><path d="M150 182V496" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="355.0" y="120" width="190" height="62" rx="12" fill="#011E38"/><text x="450.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">EAP</text><text x="450.0" y="169.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">SSID Huespedes-Lab</text><path d="M450 182V496" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="655.0" y="120" width="190" height="62" rx="12" fill="#011E38"/><text x="750.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Controlador</text><text x="750.0" y="169.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">corriendo</text><path d="M750 182V496" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="965.0" y="120" width="170" height="48" rx="12" fill="#011E38"/><text x="1050.0" y="150.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Internet</text><path d="M1050 168V496" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M150 222H444" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="300.0" y="212.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">se conecta al SSID</text>
<path d="M150 272H418" stroke="#D2492F" stroke-width="3" marker-end="url(#a-alert)"/><text x="287.0" y="262.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">pide una web: queda retenida</text>
<circle cx="450" cy="272" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(438 260)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<path d="M450 322H156" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="300.0" y="312.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">lo manda a la página del portal</text>
<path d="M150 372H744" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="450.0" y="362.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">ingresa el voucher (HTTPS 8843)</text>
<path d="M750 422H456" stroke="#0E8F5E" stroke-width="3" marker-end="url(#a-ok)"/><text x="600.0" y="412.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">valida el código y habilita al cliente</text>
<path d="M150 472H1044" stroke="#0E8F5E" stroke-width="3" marker-end="url(#a-ok)"/><text x="600.0" y="462.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">navega hasta que vence el voucher</text>
<rect x="48" y="524" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="536" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="558.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Sin controlador no hay portal</tspan></text><text x="74.0" y="585.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el controlador está apagado, los clientes nuevos no</tspan><tspan x="74.0" dy="21.6">pueden autenticarse. En la nube, además, hace falta la</tspan><tspan x="74.0" dy="21.6">licencia vigente.</tspan></text>
<rect x="612" y="524" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="536" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="558.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Por eso</tspan></text><text x="638.0" y="585.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Hotelería: controlador dedicado, backup al día y prueba con</tspan><tspan x="638.0" dy="21.6">un celular después de cada upgrade grande.</tspan></text>
</svg>