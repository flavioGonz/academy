<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Access Control: qué pasa sin autenticar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Access Control: qué pasa sin autenticar</text>
<rect x="48" y="124" width="540" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Pre-Authentication Access</text>
<rect x="72" y="190" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(92 216.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g><text x="136.0" y="228.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Celular</text><text x="136.0" y="251.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">sin autenticar</text>
<text x="328.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Llega a la URL o</text><text x="328.0" y="248.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">subred de la lista</text>
<circle cx="96" cy="330" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(84 318)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="128.0" y="336.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">La web del cliente, antes del portal</text>
<circle cx="96" cy="380" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(84 368)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="128.0" y="386.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">El resto de internet, hasta autenticar</text>
<rect x="612" y="124" width="540" height="330" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Authentication-Free Client</text>
<rect x="636" y="190" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(656 216.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="700.0" y="228.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Equipo de prueba</text><text x="700.0" y="251.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">por MAC o IP</text>
<text x="920.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">No ve el</text><text x="920.0" y="248.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">portal</text>
<circle cx="660" cy="330" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(648 318)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="692.0" y="336.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Navega directo, sin código</text>
<text x="636.0" y="386.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">Sirve para equipos puntuales que tienen</text>
<text x="636.0" y="412.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#6E88A1" text-anchor="start">que navegar sin pasar por el portal.</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="480" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="492" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En el laboratorio: la URL del sitio del cliente en Pre-Authentication Access, y la MAC de un equipo de prueba en</tspan><tspan x="74.0" dy="21.6">Authentication-Free Client.</tspan></text>
</svg>