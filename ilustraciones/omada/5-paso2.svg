<text x="72.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start">Rol: Viewer</text><text x="72.0" y="440.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Sitios: solo Sucursal</text><text x="72.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Clave de ejemplo: Visor-Lab-2026</text>
