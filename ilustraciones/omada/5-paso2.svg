<rect x="48" y="124" width="1104" height="192" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 136a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v36h-1104z" fill="#E5F0FB"/><text x="62.0" y="153.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">ROL</text><text x="312.0" y="153.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PARA QUIÉN</text><text x="512.0" y="153.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ PUEDE</text><text x="62.0" y="201.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Main Administrator</text><text x="312.0" y="201.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">La empresa</text><text x="512.0" y="201.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Todo en su vista</text><path d="M60 220H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="249.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Administrator</text><text x="312.0" y="249.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Cada técnico</text><text x="512.0" y="249.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Casi todo; no migra clientes ni hace backups automáticos</text><rect x="52" y="271" width="1096" height="42" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="297.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Viewer</text><text x="312.0" y="297.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">El cliente</text><text x="512.0" y="297.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Mirar estado y ajustes, sin cambiar</text>
