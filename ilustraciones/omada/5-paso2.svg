<rect x="612" y="490" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="502" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="524.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Dos niveles en MSP</tspan></text><text x="638.0" y="551.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con MSP hay dos niveles: rol MSP para la vista MSP y rol</tspan><tspan x="638.0" dy="21.6">Customer para la vista Global y la del sitio.</tspan></text>
