<rect x="648" y="470" width="504" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="648" y="482" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="674.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="674.0" dy="0.0">Las ACL se leen de arriba hacia abajo: la regla más</tspan><tspan x="674.0" dy="21.6">específica va arriba.</tspan></text>
<rect x="48" y="492" width="560" height="75" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="504" width="5" height="51" rx="2.5" fill="#D2492F"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Una ACL mal ordenada en producción puede cortar las cámaras o</tspan><tspan x="74.0" dy="21.6">el propio controlador: primero en laboratorio.</tspan></text>
