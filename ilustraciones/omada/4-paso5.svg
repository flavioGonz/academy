<path d="M824.0 200.0C860.0 200.0,860.0 200.0,896.0 200.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="312" width="1104" height="46" rx="10" fill="#03213C"/><text x="64.0" y="340.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">TCP+UDP  29810-29817  -&gt;  192.168.88.10  29810-29817   (mismo puerto origen y destino)</text>
<circle cx="48" cy="312" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="318.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="48" y="390" width="352" height="145" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="402" width="5" height="121" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="424.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Mismo puerto</tspan></text><text x="74.0" y="450.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En descubrimiento, adopción y</tspan><tspan x="74.0" dy="21.6">gestión, origen y destino iguales.</tspan><tspan x="74.0" dy="21.6">Desde la 5.9, solo web y portal</tspan><tspan x="74.0" dy="21.6">admiten otro puerto de origen.</tspan></text>
<rect x="424" y="390" width="352" height="145" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="424" y="402" width="5" height="121" rx="2.5" fill="#0A63B8"/><text x="450.0" y="424.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="450.0" dy="0.0">El 29817</tspan></text><text x="450.0" y="450.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="450.0" dy="0.0">En el controlador 6 se sumó el TCP</tspan><tspan x="450.0" dy="21.6">29817, para los datos de monitoreo.</tspan><tspan x="450.0" dy="21.6">Tiene que estar abierto para que</tspan><tspan x="450.0" dy="21.6">equipo y controlador se hablen bien.</tspan></text>
<rect x="800" y="390" width="352" height="145" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="800" y="402" width="5" height="121" rx="2.5" fill="#D2492F"/><text x="826.0" y="424.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">Mejor por VPN</tspan></text><text x="826.0" y="450.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">Exponer la gestión a internet abre el</tspan><tspan x="826.0" dy="21.6">controlador al mundo. Si podés, túnel</tspan><tspan x="826.0" dy="21.6">VPN entre sedes y option 138 por</tspan><tspan x="826.0" dy="21.6">adentro.</tspan></text>
<text x="48.0" y="584.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Dos controladores detrás de una IP: uno pasa a 29820-29827 y web 18043, con el puerto en la Inform URL.</text>
</svg>