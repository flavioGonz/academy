<rect x="240" y="158" width="200" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(260 184.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="304.0" y="206.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Internet</text>
<rect x="540" y="158" width="280" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="560.0" y="196.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Router de la central</text><text x="560.0" y="219.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">port forwarding</text>
<rect x="900" y="158" width="252" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(920 184.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="964.0" y="196.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Controlador</text><text x="964.0" y="219.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">192.168.88.10</text>
