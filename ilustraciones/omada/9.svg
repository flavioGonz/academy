<text x="792.0" y="200.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">SSID idéntico: nombre, seguridad,</text>
<text x="792.0" y="226.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">cifrado y clave</text>
<circle cx="760" cy="260" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(748 248)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="792.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Los dos EAP en el mismo sitio</text>
<circle cx="760" cy="300" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(748 288)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="792.0" y="306.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Fast Roaming (k y v) encendido</text>
<circle cx="760" cy="340" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(748 328)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="792.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">802.11r solo si los clientes</text>
<text x="792.0" y="372.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">lo soportan, probado</text>
<circle cx="760" cy="406" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(748 394)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="792.0" y="412.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Sin Lock to AP en el cliente</text>
<circle cx="760" cy="446" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(748 434)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="792.0" y="452.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">EAP no tan juntos: si no, el</text>
<text x="792.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">cliente nunca suelta al primero</text>
