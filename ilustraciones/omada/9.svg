<g transform="translate(130 470) scale(1.4)" fill="none" stroke="#04223D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g>
<text x="260.0" y="512.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">el celular camina de un EAP al otro</text>
<rect x="48.0" y="533.0" width="87.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="91.5" y="554.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">802.11k</text>
<text x="160.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">le pasa la lista de vecinos</text>
<rect x="48.0" y="569.0" width="87.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="91.5" y="590.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">802.11v</text>
<text x="160.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">le sugiere un EAP mejor</text>
<rect x="48.0" y="605.0" width="87.0" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="91.5" y="626.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">802.11r</text>
<text x="160.0" y="625.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">claves por adelantado: con prueba</text>
<rect x="724" y="124" width="428" height="500" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="744.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Para que haya roaming</text>
