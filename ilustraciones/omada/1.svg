<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres familias: elegí por dónde corre el servicio</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres familias: elegí por dónde corre el servicio</text>
<rect x="48" y="124" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Local</text>
<rect x="68" y="186" width="312" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(88 212.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="132.0" y="224.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">OC200 a OC400</text><text x="132.0" y="247.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">o Software propio</text>
<text x="72.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">El servicio corre en tu red.</text><text x="72.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Sin internet, se sigue gestionando.</text><text x="72.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Host, backups y versiones: tuyos.</text>
<rect x="424" y="124" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="444.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">En la nube</text>
<rect x="444" y="186" width="312" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(464 212.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="508.0" y="224.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Omada Central</text><text x="508.0" y="247.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Essentials o Standard</text>
<text x="448.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Essentials: gratis y sin MSP.</text><text x="448.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Standard: una licencia por equipo.</text><text x="448.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Sin internet, no hay gestión.</text>
<rect x="800" y="124" width="352" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="820.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Gateway integrado</text>
<rect x="820" y="186" width="312" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(840 212.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="884.0" y="224.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Fusion · ER7212PC</text><text x="884.0" y="247.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">router y controlador</text>
<text x="824.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">El controlador vive en el router.</text><text x="824.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">ER7212PC V2: hasta 22 SW y EAP.</text><text x="824.0" y="376.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Fusion: un sistema, sin multisitio.</text>
<rect x="48" y="448" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="460" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="482.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Licencia vencida en Central Standard</tspan></text><text x="74.0" y="508.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La red sigue con la última configuración, pero se apagan</tspan><tspan x="74.0" dy="21.6">Portal, Fast Roaming y Schedule hasta renovar.</tspan></text>
<rect x="612" y="448" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="460" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="482.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cloud Access no es controlador en la nube</tspan></text><text x="638.0" y="508.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Es una puerta remota. El servicio, la configuración y los</tspan><tspan x="638.0" dy="21.6">logs siguen en tu OC, tu servidor o tu gateway.</tspan></text>
<text x="48.0" y="628.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Capacidad recomendada: OC200 25 equipos · OC220 40 · OC300 160 · OC400 500</text>
</svg>