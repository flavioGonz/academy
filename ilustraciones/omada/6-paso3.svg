<rect x="552" y="124" width="600" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="552" y="136" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="578.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="578.0" dy="0.0">Paso 2</tspan></text><text x="578.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="578.0" dy="0.0">Verificá que el uplink al gateway siga en All (trunk): así la VLAN</tspan><tspan x="578.0" dy="21.6">20 sube tagueada.</tspan></text>
<rect x="552" y="234" width="600" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="552" y="246" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="578.0" y="268.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="578.0" dy="0.0">Cuidado</tspan></text><text x="578.0" y="294.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="578.0" dy="0.0">No cambies el perfil del puerto por donde el switch habla con el</tspan><tspan x="578.0" dy="21.6">controlador: lo podés dejar sin gestión.</tspan></text>
<rect x="48" y="516" width="520" height="40" rx="10" fill="#03213C"/><text x="64.0" y="541.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">ipconfig /renew</text>
<rect x="48" y="568" width="520" height="40" rx="10" fill="#03213C"/><text x="64.0" y="593.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">ipconfig | findstr IPv4   -&gt;  10.10.20.x</text>
<rect x="612" y="516" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="528" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="550.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Prueba (paso 4)</tspan></text><text x="638.0" y="577.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Notebook en el puerto 5: si muestra 10.10.20.x, las tres</tspan><tspan x="638.0" dy="21.6">patas están bien.</tspan></text>
