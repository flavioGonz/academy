<text x="636.0" y="364.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Central:  10.10.10.0/24</text><text x="636.0" y="394.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Sucursal: 10.10.20.0/24</text>
<text x="636.0" y="438.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Cada destino tiene un solo lugar:</text><text x="636.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">lo local se queda, lo otro va al túnel.</text>
