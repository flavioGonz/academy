<text x="72.0" y="438.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Un paquete a 192.168.0.20, ¿va a la LAN</text><text x="72.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">propia o al túnel? El router no puede saber.</text>
