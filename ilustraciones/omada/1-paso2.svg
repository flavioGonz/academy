<rect x="48" y="192" width="1104" height="264" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 204a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v32h-1104z" fill="#E5F0FB"/><text x="62.0" y="219.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">SI LA OBRA PIDE</text><text x="492.0" y="219.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MIRÁ</text><text x="62.0" y="263.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Gestionar sin internet</text><text x="492.0" y="263.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">OC, Software propio o gateway integrado</text><path d="M60 280H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="307.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Varios clientes con MSP</text><text x="492.0" y="307.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Software propio o Central Standard</text><path d="M60 324H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="351.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Nadie que mantenga un servidor</text><text x="492.0" y="351.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">OC, Central o Fusion / ER7212PC</text><path d="M60 368H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="395.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Cero costo de licencias</text><text x="492.0" y="395.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">OC, Software, Essentials o gateway integrado</text><path d="M60 412H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="439.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Todo en una caja, local chico</text><text x="492.0" y="439.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">ER7212PC (V2: 22 SW y EAP, 2 gateways)</text>
<rect x="48" y="470" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El MSP achica la lista</tspan></text><text x="74.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Essentials no tiene modo MSP, y los OC tampoco, según la</tspan><tspan x="74.0" dy="21.6">tabla oficial. Para una cadena con varios clientes,</tspan><tspan x="74.0" dy="21.6">Software propio o Central Standard.</tspan></text>
<rect x="612" y="470" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="482" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Licencias con dueño</tspan></text><text x="638.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si elegís Central Standard, anotá cuántas licencias, desde</tspan><tspan x="638.0" dy="21.6">cuándo corren y quién las renueva: corren desde que se</tspan><tspan x="638.0" dy="21.6">activan.</tspan></text>
