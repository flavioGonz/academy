<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Qué mirar según lo que pide cada obra</text>
<rect x="48" y="124" width="1104" height="40" rx="10" fill="#03213C"/><text x="64.0" y="149.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">Obra | Equipos | ¿Sin internet? | ¿Portal? | ¿MSP? | Controlador | Licencias/año</text>
