<rect x="48" y="526" width="1104" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="538" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="560.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Recién ahí, potencia</tspan></text><text x="74.0" y="587.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Más potencia no es mejor: con EAP a menos de 12 m, bajala. El ejemplo oficial va de 28 a 25 dBm y prueba; 3 dB menos es la</tspan><tspan x="74.0" dy="21.6">mitad de la potencia, y la celda se achica sin dejar huecos.</tspan></text>
