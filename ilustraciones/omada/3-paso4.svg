<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Leé el mensaje antes de resetear</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Leé el mensaje antes de resetear</text>
<rect x="48" y="128" width="1104" height="276" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 140a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v34h-1104z" fill="#E5F0FB"/><text x="62.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MENSAJE</text><text x="482.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ REVISAR</text><text x="62.0" y="202.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">username or password is incorrect</text><text x="482.0" y="202.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Clave de la web local, o Device Account del otro controlador</text><path d="M60 220H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="248.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">does not respond to adopt commands</text><text x="482.0" y="248.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Tags de VLAN hasta el DHCP, loops, ping, firewall</text><path d="M60 266H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="294.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Failed to link to uplink AP</text><text x="482.0" y="294.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Mesh: distancia u obstáculos, u otro uplink</text><path d="M60 312H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="340.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">This device does not exist</text><text x="482.0" y="340.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Refrescá el navegador y volvé a revisar</text><path d="M60 358H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="386.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Switch sin botón de reset</text><text x="482.0" y="386.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Consola a 38400 baudios y BootUtil</text>
<circle cx="48" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="430" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="442" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Managed by Others</tspan></text><text x="74.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el equipo estuvo en otro controlador, la clave está en</tspan><tspan x="74.0" dy="21.6">Settings &gt; Site &gt; Device Account de ese controlador.</tspan></text>
<rect x="612" y="430" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="442" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Sin respuesta</tspan></text><text x="638.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con el controlador software, mirá también el firewall o el</tspan><tspan x="638.0" dy="21.6">antivirus de la PC: tienen que dejar pasar el 29810 y del</tspan><tspan x="638.0" dy="21.6">29811 al 29816.</tspan></text>
</svg>