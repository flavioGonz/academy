<rect x="552.0" y="303.0" width="87.6" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="595.8" y="324.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">responde</text>
<circle cx="720" cy="316" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(708 304)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="752.0" y="323.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">es su propio gateway</text>
<rect x="48" y="366" width="470" height="52" rx="10" fill="#03213C"/><text x="64.0" y="397.9" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">ping 192.168.88.1</text>
<rect x="552.0" y="379.0" width="111.5" height="29" rx="14.5" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="607.7" y="400.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">no responde</text>
<circle cx="720" cy="392" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(708 380)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="752.0" y="399.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">la oficina quedó aislada</text>
<rect x="48" y="442" width="470" height="52" rx="10" fill="#03213C"/><text x="64.0" y="473.9" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">ping 1.1.1.1</text>
<rect x="552.0" y="455.0" width="87.6" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="595.8" y="476.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">responde</text>
<circle cx="720" cy="468" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(708 456)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="752.0" y="475.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">sale a internet</text>
<rect x="612" y="132" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="144" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="166.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Si la oficina responde</tspan></text><text x="638.0" y="192.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si 192.168.88.1 responde, el deny está debajo de un permit</tspan><tspan x="638.0" dy="21.6">general: subilo (paso 5).</tspan></text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Lo esperado es justo eso: el gateway propio sí, la red interna no, internet sí.</text>
