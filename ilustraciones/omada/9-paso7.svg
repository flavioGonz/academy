<rect x="772" y="124" width="380" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="792.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Límites del mesh</text>
<text x="796.0" y="196.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Hasta 3 saltos.</text><text x="796.0" y="226.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Hasta 4 downlinks por uplink.</text><text x="796.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Uplink entre -40 y -62 dBm.</text><text x="796.0" y="286.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">EAP225-Outdoor: 50 a 60</text><text x="796.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">clientes en toda la red mesh.</text>
<rect x="772" y="374" width="380" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="772" y="386" width="5" height="78" rx="2.5" fill="#B45309"/><text x="798.0" y="408.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="798.0" dy="0.0">Antes de armarlo</tspan></text><text x="798.0" y="434.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="798.0" dy="0.0">Un EAP que se manejó por su web local</tspan><tspan x="798.0" dy="21.6">tiene el mesh apagado hasta un reset.</tspan></text>
<rect x="48" y="556" width="700" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="568" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Mucha gente en un lugar: cable. El mesh lleva señal donde no llega el cable;</tspan><tspan x="74.0" dy="21.6">no suma clientes.</tspan></text>
<rect x="772" y="506" width="380" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="772" y="518" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="798.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="798.0" dy="0.0">Auto Failover viene apagado y necesita</tspan><tspan x="798.0" dy="21.6">el controlador corriendo.</tspan></text>
