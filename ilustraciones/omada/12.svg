<text x="210.0" y="282.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">backup-5.x.cfg</text>
<rect x="680" y="140" width="360" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(700 166.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="744.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Controlador 6.x</text>
<rect x="720" y="252" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<g transform="translate(734 262) scale(1.0)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></g>
<text x="770.0" y="282.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">backup-6.x.cfg</text>
<path d="M484.0 182.0C580.0 182.0,580.0 182.0,676.0 182.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="580.0" y="166.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">de a una versión mayor</text>
<path d="M860 300V352H300V306" fill="none" stroke="#D2492F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<rect x="436.8" y="339.0" width="286.4" height="29" rx="14.5" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="580.0" y="360.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">backup de 6.x en un 5.x: no entra</text>
<circle cx="800" cy="352" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(788 340)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="120.0" y="420.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Volver atrás es reinstalar:</text>
<text x="120.0" y="450.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">desinstalar sin guardar datos, instalar la versión vieja</text><text x="120.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y restaurar el backup de esa misma versión.</text>
<rect x="48" y="510" width="352" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="522" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Fuera del equipo</tspan></text><text x="74.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Programado y guardado fuera del</tspan><tspan x="74.0" dy="21.6">controlador: si muere el host, el</tspan><tspan x="74.0" dy="21.6">backup sigue.</tspan></text>
<rect x="424" y="510" width="352" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="424" y="522" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="450.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="450.0" dy="0.0">Saltos de a uno</tspan></text><text x="450.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="450.0" dy="0.0">De 5.x a 6.x sin saltear, verificando</tspan><tspan x="450.0" dy="21.6">que arranque limpio en cada paso.</tspan></text>
<rect x="800" y="510" width="352" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="800" y="522" width="5" height="78" rx="2.5" fill="#B45309"/><text x="826.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">Canales</tspan></text><text x="826.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">Beta y Release Candidate, solo en</tspan><tspan x="826.0" dy="21.6">laboratorio. En producción, estable.</tspan></text>
</svg>