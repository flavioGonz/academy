<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Option 138: la IP del controlador, byte por byte</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Option 138: la IP del controlador, byte por byte</text>
<rect x="48" y="124" width="1104" height="44" rx="10" fill="#03213C"/><text x="64.0" y="151.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">/ip dhcp-server option add name=omada138 code=138 value=0xC0A8580A</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="150" y="206" width="140" height="86" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="3"/>
<text x="220.0" y="262.0" font-family="JetBrains Mono" font-size="34" font-weight="600" fill="#04223D" text-anchor="middle">C0</text>
<text x="220.0" y="326.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#0A63B8" text-anchor="middle">192</text>
<rect x="330" y="206" width="140" height="86" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="3"/>
<text x="400.0" y="262.0" font-family="JetBrains Mono" font-size="34" font-weight="600" fill="#04223D" text-anchor="middle">A8</text>
<text x="400.0" y="326.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#0A63B8" text-anchor="middle">168</text>
<rect x="510" y="206" width="140" height="86" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="3"/>
<text x="580.0" y="262.0" font-family="JetBrains Mono" font-size="34" font-weight="600" fill="#04223D" text-anchor="middle">58</text>
<text x="580.0" y="326.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#0A63B8" text-anchor="middle">88</text>
<rect x="690" y="206" width="140" height="86" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="3"/>
<text x="760.0" y="262.0" font-family="JetBrains Mono" font-size="34" font-weight="600" fill="#04223D" text-anchor="middle">0A</text>
<text x="760.0" y="326.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#0A63B8" text-anchor="middle">10</text>
<path d="M160 346v12H820v-12" fill="none" stroke="#0A63B8" stroke-width="2"/>
<text x="430.0" y="388.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="middle">192.168.88.10, la IP del controlador</text>
<text x="430.0" y="414.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">un byte por octeto, en hexadecimal</text>
<rect x="860" y="206" width="292" height="145" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="860" y="218" width="5" height="121" rx="2.5" fill="#0E8F5E"/><text x="886.0" y="240.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="886.0" dy="0.0">Con gateway Omada</tspan></text><text x="886.0" y="266.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="886.0" dy="0.0">En el gateway Omada no hace</tspan><tspan x="886.0" dy="21.6">falta el hex: Advanced DHCP</tspan><tspan x="886.0" dy="21.6">Options, Option 138 =</tspan><tspan x="886.0" dy="21.6">192.168.88.10.</tspan></text>
<rect x="48" y="450" width="1104" height="44" rx="10" fill="#03213C"/><text x="64.0" y="477.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">/ip dhcp-server network set [find address=&quot;10.10.10.0/24&quot;] dhcp-option=omada138</text>
<rect x="48" y="520" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="532" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Recién al renovar</tspan></text><text x="74.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La opción se entrega con la próxima concesión. Un EAP que ya tenía IP no se entera hasta renovar: por eso el paso 2 es</tspan><tspan x="74.0" dy="21.6">desconectarlo y volver a conectarlo.</tspan></text>
</svg>