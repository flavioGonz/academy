<rect x="48" y="492" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="504" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué Manual</tspan></text><text x="74.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Auto IPsec pide IP pública en la WAN. Con un NAT adelante,</tspan><tspan x="74.0" dy="21.6">el túnel va como Manual IPsec, con Local ID y Remote ID de</tspan><tspan x="74.0" dy="21.6">tipo Name.</tspan></text>
<rect x="612" y="492" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="504" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Verificación</tspan></text><text x="638.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Network Config &gt; VPN Status &gt; Site-to-Site VPN &gt; IPsec: si</tspan><tspan x="638.0" dy="21.6">aparecen las entradas, el túnel está arriba.</tspan></text>
