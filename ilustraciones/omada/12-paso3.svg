<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>En Docker, también el volumen, con el contenedor parado</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMADA · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">En Docker, también el volumen, con el contenedor parado</text>
<rect x="48" y="124" width="1104" height="142" rx="12" fill="#03213C"/><text x="64.0" y="146.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">VM LINUX</text><text x="64.0" y="178.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">cd /opt/omada &amp;&amp; docker compose stop</text><text x="64.0" y="212.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">sudo tar czf ~/omada-data-$(date +%F).tar.gz -C /var/lib/docker/volumes/omada_omada-data/_data .</text><text x="64.0" y="246.4" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">docker compose start</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="48" y="300" width="352" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="338" r="18" fill="#17A8D4"/><text x="82.0" y="344.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="345.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Parar</text>
<text x="72.0" y="384.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">MongoDB cierra limpio y no se copia a</tspan><tspan x="72.0" dy="21.6">mitad de escritura</tspan></text>
<rect x="424" y="300" width="352" height="130" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="458" cy="338" r="18" fill="#17A8D4"/><text x="458.0" y="344.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="486.0" y="345.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Copiar</text>
<text x="448.0" y="384.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="448.0" dy="0.0">el volumen omada-data entero, en un</tspan><tspan x="448.0" dy="21.6">.tar.gz con fecha</tspan></text>
<rect x="800" y="300" width="352" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="834" cy="338" r="18" fill="#17A8D4"/><text x="834.0" y="344.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="862.0" y="345.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Arrancar</text>
<text x="824.0" y="384.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="824.0" dy="0.0">el controlador vuelve en 1 a 2</tspan><tspan x="824.0" dy="21.6">minutos</tspan></text>
<rect x="48" y="456" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="468" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="490.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué te salva</tspan></text><text x="74.0" y="517.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ese .tar.gz más el docker-compose.yml alcanzan para rearmar</tspan><tspan x="74.0" dy="21.6">el controlador en otro host.</tspan></text>
<rect x="612" y="456" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="468" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="638.0" y="490.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Lo que te hunde</tspan></text><text x="638.0" y="517.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Nunca docker compose down -v: borra los volúmenes con toda</tspan><tspan x="638.0" dy="21.6">la configuración.</tspan></text>
</svg>