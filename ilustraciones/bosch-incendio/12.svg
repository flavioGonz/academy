<text x="900.0" y="352.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="900.0" dy="0.0">El panel trae 3 teclas</tspan><tspan x="900.0" dy="20.2">programables. Una (o un horario)</tspan><tspan x="900.0" dy="20.2">puede pasar de día a noche o a</tspan><tspan x="900.0" dy="20.2">la sensibilidad alternativa.</tspan></text>
