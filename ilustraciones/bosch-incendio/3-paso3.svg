<text x="550.0" y="140.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">unidades</text>
<rect x="700" y="150" width="452" height="184" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M700 162a12 12 0 0 1 12 -12h428a12 12 0 0 1 12 12v34h-452z" fill="#E5F0FB"/><text x="714.0" y="178.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PERILLAS</text><text x="854.0" y="178.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MODO</text><text x="714.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">0 0 0</text><text x="854.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">automático, de fábrica, sin T-tap</text><rect x="704" y="245" width="444" height="40" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="714.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">001 a 254</text><text x="854.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">manual, permite T-tap</text><path d="M712 288H1140" stroke="#DDE8F2" stroke-width="1"/><text x="714.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">CL 0 0</text><text x="854.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">modo classic</text>
<rect x="700" y="360" width="452" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="700" y="372" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="726.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">Antes de girar</tspan></text><text x="726.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">Se cambian con el lazo desenergizado. Después, en</tspan><tspan x="726.0" dy="21.6">la configuración del lazo en RPS se marca T-tap y</tspan><tspan x="726.0" dy="21.6">se vuelve a autodetectar.</tspan></text>
<rect x="700" y="500" width="452" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="700" y="512" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="726.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">Dos errores típicos</tspan></text><text x="726.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">Más de 254 no está permitido, y en un mismo lazo</tspan><tspan x="726.0" dy="21.6">no se mezcla automático con manual: con manual,</tspan><tspan x="726.0" dy="21.6">todos del 1 al 254.</tspan></text>
