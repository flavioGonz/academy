<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Proyecto y manual no coinciden: parás y consultás</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Proyecto y manual no coinciden: parás y consultás</text>
<rect x="48" y="136" width="340" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="168.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Proyecto firmado</text><text x="68.0" y="198.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Subsuelo: ramal (clase B)</text><text x="68.0" y="219.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">firmado por el técnico registrado</text>
<rect x="48" y="280" width="340" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="312.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Manual Bosch</text><text x="68.0" y="342.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Recomienda lazo siempre</text><text x="68.0" y="363.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">que se pueda</text>
<rect x="470" y="226" width="220" height="84" rx="42" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="580.0" y="262.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle">¿Coinciden?</text>
<text x="580.0" y="288.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">ejemplo de obra</text>
<path d="M390.0 196.0C432.0 196.0,432.0 252.0,474.0 252.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M390.0 340.0C432.0 340.0,432.0 286.0,474.0 286.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M690.0 230.0C745.0 230.0,745.0 170.0,800.0 170.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M690.0 306.0C745.0 306.0,745.0 380.0,800.0 380.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<rect x="810" y="120" width="342" height="110" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="830.0" y="152.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Sí: seguís instalando</text>
<text x="830.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">con el proyecto como guía</text>
<rect x="810" y="300" width="342" height="200" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="830.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">No: parás</text>
<circle cx="835" cy="364.7" r="4.5" fill="#D2492F"/><text x="850.0" y="370.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="850.0" dy="0.0">Anotás la diferencia en la ficha</tspan></text><circle cx="835" cy="396.3" r="4.5" fill="#D2492F"/><text x="850.0" y="401.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="850.0" dy="0.0">Consultás al técnico registrado</tspan></text><circle cx="835" cy="427.9" r="4.5" fill="#D2492F"/><text x="850.0" y="433.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="850.0" dy="0.0">Él decide y lo deja por escrito</tspan></text>
<rect x="48" y="440" width="700" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="452" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué no se decide en obra</tspan></text><text x="74.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Cambiar ubicación, cantidad o tipo de dispositivos respecto de lo certificado</tspan><tspan x="74.0" dy="21.6">queda bajo responsabilidad de quien lo cambia; el decreto pide informar al</tspan><tspan x="74.0" dy="21.6">técnico registrado.</tspan></text>
</svg>