<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada salida real, con su forma de aislarla</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada salida real, con su forma de aislarla</text>
<rect x="48" y="136" width="1104" height="364" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 148a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v40h-1104z" fill="#E5F0FB"/><text x="62.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">SALIDA</text><text x="392.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CÓMO SE AÍSLA</text><text x="832.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUIÉN</text><text x="62.0" y="219.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Transmisión al monitoreo</text><text x="392.0" y="219.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">deshabilitar en el panel y avisar</text><text x="832.0" y="219.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vos, con el operador</text><path d="M60 240H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="271.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Sirenas (si corresponde)</text><text x="392.0" y="271.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">deshabilitar en el panel</text><text x="832.0" y="271.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vos</text><path d="M60 292H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="323.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Retención de puertas</text><text x="392.0" y="323.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">deshabilitar la salida</text><text x="832.0" y="323.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vos</text><path d="M60 344H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="375.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Ventilación</text><text x="392.0" y="375.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">deshabilitar la salida</text><text x="832.0" y="375.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vos</text><path d="M60 396H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="427.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Ascensores</text><text x="392.0" y="427.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">deshabilitar la salida</text><text x="832.0" y="427.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vos</text><rect x="52" y="451" width="1096" height="46" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="479.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Extinción por gas</text><text x="392.0" y="479.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">central de extinción bloqueada</text><text x="832.0" y="479.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">su empresa</text>
<rect x="48" y="520" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="532" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Extinción, siempre aparte</tspan></text><text x="74.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con gas, la prueba se coordina con la empresa de extinción</tspan><tspan x="74.0" dy="21.6">y con su central bloqueada: anotá nombre y hora en la hoja.</tspan></text>
<rect x="612" y="520" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="532" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Lista completa</tspan></text><text x="638.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La lista sale de la obra real: si hay una salida que no</tspan><tspan x="638.0" dy="21.6">sabés cómo aislar, eso se resuelve antes de probar.</tspan></text>
</svg>