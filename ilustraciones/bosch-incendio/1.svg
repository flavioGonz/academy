<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Qué central tenés adelante?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Qué central tenés adelante?</text>
<text x="48.0" y="140.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">GENERACIÓN AVENAR (VIGENTE)</text>
<rect x="48" y="156" width="356" height="150" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="70.0" y="194.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">AVENAR panel 2000</text>
<text x="70.0" y="228.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">6 módulos, hasta 4 lazos</text>
<text x="70.0" y="253.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">viene como kit en gabinete</text>
<rect x="420" y="156" width="356" height="150" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="442.0" y="194.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">AVENAR panel 8000</text>
<text x="442.0" y="228.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">46 módulos, hasta 32 lazos</text>
<text x="442.0" y="253.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">módulos en riel, ampliable</text>
<rect x="792" y="156" width="356" height="150" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="814.0" y="194.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">AVENAR keypad 8000</text>
<text x="814.0" y="228.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">FPE-8000-FMR</text>
<text x="814.0" y="253.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">opera a distancia o hace de</text>
<text x="814.0" y="278.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#C9DDF0" text-anchor="start">controlador redundante del 8000</text>
<text x="48.0" y="346.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">GENERACIÓN ANTERIOR (FPA)</text>
<rect x="48" y="362" width="356" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="70.0" y="400.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">FPA-5000</text>
<text x="70.0" y="432.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">red de hasta 32 paneles y teclados</text>
<text x="70.0" y="457.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">modular, controladores MPC</text>
<rect x="420" y="362" width="356" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="442.0" y="400.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">FPA-1200</text>
<text x="442.0" y="432.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">1 panel y hasta 3 teclados remotos</text>
<text x="442.0" y="457.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">sin controlador redundante</text>
<rect x="792" y="362" width="356" height="120" rx="16" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="814.0" y="400.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#0A63B8" text-anchor="start">Todos hablan LSN</text>
<text x="814.0" y="432.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">el lazo y los detectores</text>
<text x="814.0" y="457.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">son la misma tecnología</text>
<rect x="48" y="510" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="522" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Licencia: no se cambia</tspan></text><text x="74.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Standard o premium, grabada en el controlador. Premium suma</tspan><tspan x="74.0" dy="21.6">BMS, UGM, voz y, en el 2000, la red.</tspan></text>
<rect x="612" y="510" width="536" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="522" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Firmware: depende de la red</tspan></text><text x="638.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">4.x solo en redes 100 % AVENAR (vigente 4.8.1). Con un FPA</tspan><tspan x="638.0" dy="21.6">en la red, todos en el mismo 3.x.</tspan></text>
</svg>