<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La cuenta con 600 m, 60 elementos y 0,5 mA</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La cuenta con 600 m, 60 elementos y 0,5 mA</text>
<rect x="48" y="130" width="700" height="210" rx="12" fill="#03213C"/><text x="64.0" y="152.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PLANILLA</text><text x="64.0" y="184.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">R_cable = 2 x 600 x 0,0178 / 0,503  = 42,5 ohm</text><text x="64.0" y="218.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">R_equip = 60 x 0,35                 = 21,0 ohm</text><text x="64.0" y="252.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">I_total = 60 x 0,0005 + 0,012 + 0,018 = 0,060 A</text><text x="64.0" y="286.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">Caída   = 0,060 x (42,5 + 21,0)      =  3,8 V</text><text x="64.0" y="320.4" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#7FE0B0" text-anchor="start">Queda   = 30 - 3,8                    = 26,2 V</text>
<rect x="800" y="150" width="150" height="74" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/><text x="875.0" y="194.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#0E8F5E" text-anchor="middle">26,2 V</text><text x="875.0" y="216.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="middle">al final del lazo</text>
<circle cx="980" cy="187" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(968 175)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="1008.0" y="194.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">más de 15 V</text>
<rect x="800" y="260" width="352" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="820.0" y="292.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">De dónde sale cada número</text><text x="820.0" y="322.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">2 x L: el par va y vuelve</text><text x="820.0" y="343.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">0,35 ohm por elemento improved</text><text x="820.0" y="365.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">0,012 A transmisión + 0,018 A destello</text>
<rect x="48" y="360" width="700" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="372" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Para qué sirve</tspan></text><text x="74.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La planilla es la cuenta de banco del manual, siempre pesimista. Sirve para</tspan><tspan x="74.0" dy="21.6">ver si un lazo está en el límite antes de tirar cable; el cálculo de la obra</tspan><tspan x="74.0" dy="21.6">se hace en Safety Systems Designer.</tspan></text>
<rect x="48" y="500" width="700" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que viene</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con 2 mA por elemento (paso 3) la misma cuenta deja unos 20,5 V: el margen se</tspan><tspan x="74.0" dy="21.6">achica rápido.</tspan></text>
</svg>