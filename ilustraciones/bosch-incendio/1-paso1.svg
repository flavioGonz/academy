" y="366.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">FPE-8000-FMR</text><text x="844.0" y="366.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">AVENAR keypad 8000</text>
