<rect x="48" y="384" width="560" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="396" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="418.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que no tiene arreglo en obra</tspan></text><text x="74.0" y="444.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La licencia viene grabada: según el manual, no se puede</tspan><tspan x="74.0" dy="21.6">modificar, revocar ni transportar. Si la obra necesita BMS o</tspan><tspan x="74.0" dy="21.6">red y el panel es standard, no se arregla con un código.</tspan></text>
<rect x="640" y="384" width="512" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="640" y="396" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="666.0" y="418.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">Qué agrega premium</tspan></text><text x="666.0" y="444.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Premium: interfaces a BMS (BIS, OPC, FSI), panel</tspan><tspan x="666.0" dy="21.6">jerárquico UGM-2040 y evacuación por voz. En el 2000,</tspan><tspan x="666.0" dy="21.6">además, trabajar en red.</tspan></text>
