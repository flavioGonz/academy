<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El valor óptico dice cuándo cambiar el detector</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · MANTENIMIENTO</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El valor óptico dice cuándo cambiar el detector</text>
<text x="80.0" y="180.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">VALOR ÓPTICO DEL FAP-425 (LECTURA DE DIAGNÓSTICO) · TRAMOS, NO A ESCALA</text>
<rect x="80" y="200" width="204" height="70" rx="8" fill="#0E8F5E" fill-opacity="0.45"/>
<text x="182.0" y="242.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 a 170</text>
<text x="182.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">nuevo</text>
<rect x="288" y="200" width="204" height="70" rx="8" fill="#0E8F5E" fill-opacity="0.85"/>
<text x="390.0" y="242.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">hasta 350</text>
<text x="390.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">normal</text>
<rect x="496" y="200" width="204" height="70" rx="8" fill="#B45309" fill-opacity="0.85"/>
<text x="598.0" y="242.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">350 a 450</text>
<text x="598.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">cambiar pronto</text>
<rect x="704" y="200" width="204" height="70" rx="8" fill="#D2492F" fill-opacity="0.85"/>
<text x="806.0" y="242.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">450 a 510</text>
<text x="806.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#D2492F" text-anchor="middle">cambiar ya</text>
<rect x="912" y="200" width="204" height="70" rx="8" fill="#2B2B2B" fill-opacity="0.85"/>
<text x="1014.0" y="242.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">más de 511</text>
<text x="1014.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="middle">sensor desactivado</text>
<path d="M808.0 380V316" stroke="#D2492F" stroke-width="2.5" marker-end="url(#a-alert)"/>
<rect x="608.0" y="380" width="400" height="80" rx="12" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/>
<text x="626.0" y="412.0" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#D2492F" text-anchor="start">Ejemplo: 470</text>
<text x="626.0" y="440.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">cambiar ya, en esa misma visita</text>
<rect x="48" y="500" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué hacer con el número</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Arriba de 450, el detector se reemplaza en la visita o se deja documentado como pendiente urgente al cliente. La contaminación</tspan><tspan x="74.0" dy="21.6">se informa como avería, no como falsa alarma.</tspan></text>
</svg>