<rect x="48" y="530" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="542" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="564.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Los puntos se cuentan por entrada</tspan></text><text x="74.0" y="591.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Cada entrada programada para dar alarma consume un punto de</tspan><tspan x="74.0" dy="21.6">alarma del panel, aunque viva en un módulo.</tspan></text>
<rect x="612" y="530" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="542" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="564.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Silenciar es a mano</tspan></text><text x="638.0" y="591.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">En EN 54-2, silenciar o reponer avisadores es acción</tspan><tspan x="638.0" dy="21.6">manual: un temporizador de duración solo vale para señales</tspan><tspan x="638.0" dy="21.6">que no son EN 54.</tspan></text>
<text x="48.0" y="440.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Las zonas convencionales del FLM-420/4-CON</text>
<text x="48.0" y="462.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">terminan en una resistencia o un módulo de</text>
<text x="48.0" y="484.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">fin de línea: así el panel ve un cable cortado.</text>
