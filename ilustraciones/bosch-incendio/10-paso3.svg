<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Grupos lógicos separados, sin pisarse</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Grupos lógicos separados, sin pisarse</text>
<rect x="48" y="140" width="700" height="68" rx="12" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/>
<rect x="48" y="140" width="14" height="68" rx="6" fill="#0A63B8" stroke="#0A63B8" stroke-width="0"/>
<text x="82.0" y="182.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#0A63B8" text-anchor="start">Grupo 3</text>
<text x="300.0" y="182.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">sub 1 a 20</text>
<text x="450.0" y="182.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">detectores piso 3</text>
<rect x="48" y="224" width="700" height="68" rx="12" fill="#FFFFFF" stroke="#D2492F" stroke-width="2.5"/>
<rect x="48" y="224" width="14" height="68" rx="6" fill="#D2492F" stroke="#D2492F" stroke-width="0"/>
<text x="82.0" y="266.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#D2492F" text-anchor="start">Grupo 30</text>
<text x="300.0" y="266.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">sub 1 a 4</text>
<text x="450.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">pulsadores piso 3</text>
<rect x="48" y="308" width="700" height="68" rx="12" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2.5"/>
<rect x="48" y="308" width="14" height="68" rx="6" fill="#17A8D4" stroke="#17A8D4" stroke-width="0"/>
<text x="82.0" y="350.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#17A8D4" text-anchor="start">Grupo 300</text>
<text x="300.0" y="350.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start"></text>
<text x="450.0" y="350.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">entradas técnicas (flujo, presión)</text>
<rect x="48" y="392" width="700" height="68" rx="12" fill="#FFFFFF" stroke="#6E88A1" stroke-width="2.5"/>
<rect x="48" y="392" width="14" height="68" rx="6" fill="#6E88A1" stroke="#6E88A1" stroke-width="0"/>
<text x="82.0" y="434.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#6E88A1" text-anchor="start">Grupo propio</text>
<text x="300.0" y="434.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start"></text>
<text x="450.0" y="434.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">teclas de función</text>
<rect x="790" y="140" width="362" height="190" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="810.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Lo que RPS puede no avisar</text>
<text x="812.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="812.0" dy="0.0">Si una tecla de función y un grupo de</tspan><tspan x="812.0" dy="21.6">entradas comparten dirección, RPS</tspan><tspan x="812.0" dy="21.6">puede no avisar. Por eso las teclas</tspan><tspan x="812.0" dy="21.6">van en un grupo propio.</tspan></text>
<rect x="790" y="350" width="362" height="136" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="810.0" y="382.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Lo que RPS te ahorra</text>
<text x="812.0" y="420.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="812.0" dy="0.0">Copiar y pegar detectores les da la</tspan><tspan x="812.0" dy="21.6">siguiente subdirección del mismo</tspan><tspan x="812.0" dy="21.6">grupo.</tspan></text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Números del ejemplo del laboratorio. Lo que importa: ninguna dirección lógica repetida.</text>
</svg>