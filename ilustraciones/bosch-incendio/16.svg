<rect x="48" y="572" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="584" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="606.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que no está registrado no se hizo</tspan></text><text x="74.0" y="633.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En Uruguay el propietario mantiene y una empresa registrada hace el mantenimiento; las frecuencias las fija el proyecto. NFPA</tspan><tspan x="74.0" dy="21.6">72 se usa como referencia.</tspan></text>
