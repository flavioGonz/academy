<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Marcá los que quedaron de fábrica sin que nadie decida</text>
<rect x="48" y="140" width="1104" height="216" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 152a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v42h-1104z" fill="#E5F0FB"/><text x="62.0" y="172.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">DIR.</text><text x="152.0" y="172.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MODELO</text><text x="372.0" y="172.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">LUGAR (MODO)</text><text x="632.0" y="172.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">¿ELEGIDO?</text><text x="802.0" y="172.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">AMBIENTE REAL</text><rect x="52" y="197" width="1096" height="48" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">3.1</text><text x="152.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">FAP-425-OT-R</text><text x="372.0" y="226.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Oficina (modo día)</text><text x="632.0" y="226.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">de fábrica</text><text x="802.0" y="226.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">cocina de piso</text><path d="M60 248H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="280.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">3.2</text><text x="152.0" y="280.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">FAP-425-DOTC-R</text><text x="372.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Oficina (fumadores)</text><text x="632.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">de fábrica</text><text x="802.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sala de espera</text><path d="M60 302H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="334.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">3.3</text><text x="152.0" y="334.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">FAP-425-O-R</text><text x="372.0" y="334.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">sensibilidad media</text><text x="632.0" y="334.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">elegido</text><text x="802.0" y="334.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">oficina</text>
<rect x="1000" y="196" width="140" height="40" rx="10" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="1070.0" y="222.0" font-family="Instrument Sans" font-size="15" font-weight="700" fill="#D2492F" text-anchor="middle">no coincide</text>
<rect x="48" y="380" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="392" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué buscás</tspan></text><text x="74.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Que esté de fábrica no es un error en sí: el problema es</tspan><tspan x="74.0" dy="21.6">que nadie lo decidió. Cuando el ambiente real no se parece</tspan><tspan x="74.0" dy="21.6">al lugar programado, va a la lista.</tspan></text>
<rect x="612" y="380" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="392" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Cómo reconocerlos</tspan></text><text x="638.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Valores de fábrica según la guía: OT y DOT en oficina modo</tspan><tspan x="638.0" dy="21.6">día, DOTC en oficina con fumadores, ópticos en sensibilidad</tspan><tspan x="638.0" dy="21.6">media, térmico en A2R.</tspan></text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Filas 3.2 y 3.3 de ejemplo para practicar. Trabajá sobre una copia, nunca sobre la del panel en servicio.</text>
</svg>