<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Elegí en dos pasos y dejá escrito el porqué</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Elegí en dos pasos y dejá escrito el porqué</text>
<rect x="48" y="130" width="352" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="168" r="18" fill="#0A63B8"/><text x="84.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="114.0" y="175.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Riesgo de fuego</text>
<circle cx="77" cy="216.7" r="4.5" fill="#17A8D4"/><text x="92.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">fuego latente, con humo</tspan></text><circle cx="77" cy="248.3" r="4.5" fill="#17A8D4"/><text x="92.0" y="253.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">fuego rápido, con llama</tspan></text><circle cx="77" cy="279.9" r="4.5" fill="#17A8D4"/><text x="92.0" y="285.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">combustión con poco humo</tspan></text>
<path d="M402.0 240.0C412.0 240.0,412.0 240.0,422.0 240.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="130" width="352" height="220" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<circle cx="460" cy="168" r="18" fill="#B45309"/><text x="460.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="490.0" y="175.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Lo que no es fuego</text>
<circle cx="453" cy="216.7" r="4.5" fill="#17A8D4"/><text x="468.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="468.0" dy="0.0">vapor de ducha o cocina</tspan></text><circle cx="453" cy="248.3" r="4.5" fill="#17A8D4"/><text x="468.0" y="253.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="468.0" dy="0.0">polvo</tspan></text><circle cx="453" cy="279.9" r="4.5" fill="#17A8D4"/><text x="468.0" y="285.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="468.0" dy="0.0">aerosoles</tspan></text>
<path d="M778.0 240.0C788.0 240.0,788.0 240.0,798.0 240.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="130" width="352" height="220" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="836" cy="168" r="18" fill="#0E8F5E"/><text x="836.0" y="174.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="866.0" y="175.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Modelo y porqué</text>
<circle cx="829" cy="216.7" r="4.5" fill="#17A8D4"/><text x="844.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="844.0" dy="0.0">el detector que ve ese fuego</tspan></text><circle cx="829" cy="248.3" r="4.5" fill="#17A8D4"/><text x="844.0" y="253.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="844.0" dy="0.0">y no confunde ese fenómeno</tspan></text><circle cx="829" cy="279.9" r="4.5" fill="#17A8D4"/><text x="844.0" y="285.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="844.0" dy="0.0">queda escrito en la tabla</tspan></text>
<text x="48.0" y="392.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">EJEMPLO DEL LABORATORIO</text>
<rect x="48" y="404" width="1104" height="92" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 416a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v34h-1104z" fill="#E5F0FB"/><text x="62.0" y="432.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">AMBIENTE</text><text x="262.0" y="432.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">RIESGO</text><text x="472.0" y="432.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">ENGAÑOSO</text><text x="652.0" y="432.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">DETECTOR</text><text x="852.0" y="432.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PORQUÉ</text><text x="62.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Habitación hotel</text><text x="262.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">latente (tapizados)</text><text x="472.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vapor, aerosol</text><text x="652.0" y="478.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">FAP-425-DOTC-R</text><text x="852.0" y="478.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">CO rechaza vapor</text>
<rect x="48" y="520" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="532" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Serie vieja</tspan></text><text x="74.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El firmware 4.8 es el último que soporta la serie 400</tspan><tspan x="74.0" dy="21.6">(O400, OT400, OC410, OTC410, T400): relevá antes de</tspan><tspan x="74.0" dy="21.6">actualizar.</tspan></text>
<rect x="612" y="520" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="532" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Ojo con los nombres</tspan></text><text x="638.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La línea vigente es AVENAR detector 4000, con nueve</tspan><tspan x="638.0" dy="21.6">variantes. Un &quot;AVENAR detector 5000&quot; no aparece en las</tspan><tspan x="638.0" dy="21.6">fuentes de Bosch.</tspan></text>
</svg>