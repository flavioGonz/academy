<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres lugares, el mismo número de nodo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres lugares, el mismo número de nodo</text>
<rect x="48" y="140" width="352" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">En el panel</text>
<text x="68.0" y="230.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0E8F5E" text-anchor="start">PNA 2</text>
<text x="68.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">número de nodo físico cargado en el panel</text>
<text x="412.0" y="232.0" font-family="JetBrains Mono" font-size="34" font-weight="700" fill="#0E8F5E" text-anchor="middle">=</text>
<rect x="424" y="140" width="352" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="444.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">En la IP</text>
<text x="444.0" y="230.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0E8F5E" text-anchor="start">192.168.1.2</text>
<text x="444.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el último octeto es el nodo</text>
<text x="788.0" y="232.0" font-family="JetBrains Mono" font-size="34" font-weight="700" fill="#0E8F5E" text-anchor="middle">=</text>
<rect x="800" y="140" width="352" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="820.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">En RPS</text>
<text x="820.0" y="230.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0E8F5E" text-anchor="start">Nodo 2</text>
<text x="820.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el mismo número en la configuración</text>
<rect x="48" y="340" width="1104" height="150" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="372.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Lo que no tiene que pasar</text>
<text x="72.0" y="410.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#D2492F" text-anchor="start">PNA 3</text>
<text x="250.0" y="410.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#D2492F" text-anchor="start">192.168.1.2</text>
<text x="560.0" y="410.0" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#D2492F" text-anchor="start">Nodo 2</text>
<text x="72.0" y="456.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Un número que no coincide es un panel que no aparece en la red o que choca con otro.</text>
<rect x="48" y="516" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="528" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="550.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Datos del ejemplo del laboratorio</tspan></text><text x="74.0" y="577.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Gateway por defecto del ejemplo: 192.168.1.254. Multicast: 239.192.0.1. Licencia premium en cada panel que tenga que verse en</tspan><tspan x="74.0" dy="21.6">el BMS.</tspan></text>
</svg>