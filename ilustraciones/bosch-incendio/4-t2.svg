<text x="282.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="start">Zona entre dos aisladores: un corto adentro la tira entera</text>
<rect x="48" y="548" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="560" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="582.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué no aísla</tspan></text><text x="74.0" y="609.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El elemento conectado solo a b1 toma corriente pero no la</tspan><tspan x="74.0" dy="21.6">deja pasar por su aislador: no corta nada si hay un corto.</tspan></text>
<rect x="612" y="548" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="560" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="638.0" y="582.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Y además</tspan></text><text x="638.0" y="609.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Las mallas dentro de un lazo o un ramal están prohibidas, y</tspan><tspan x="638.0" dy="21.6">la autoridad puede limitar cuántos elementos caen por una</tspan><tspan x="638.0" dy="21.6">falla.</tspan></text>
