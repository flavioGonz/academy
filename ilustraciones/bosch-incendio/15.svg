<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cómo se prueba cada detector, y cuánto esperar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cómo se prueba cada detector, y cuánto esperar</text>
<rect x="48" y="130" width="540" height="210" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Modo revisión</text>
<text x="68.0" y="194.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">óptico con aerosol</text>
<rect x="454.0" y="145.0" width="114.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="511.0" y="166.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">hasta 10 s</text>
<text x="68.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">El detector se prepara solo para la prueba</tspan><tspan x="68.0" dy="21.6">al pasar la zona a revisión.</tspan></text>
<circle cx="508" cy="262" r="30" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2.5"/><circle cx="508" cy="262" r="19.2" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/><circle cx="508" cy="262" r="5.1" fill="#C2D4E6"/>
<path d="M474 298H542L534 344H482Z" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2.5"/><path d="M508 344V322" stroke="#0A63B8" stroke-width="6" stroke-linecap="round"/>
<rect x="612" y="130" width="540" height="210" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="162.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Walk test secuencial</text>
<text x="632.0" y="194.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">multisensor, un sensor por vez</text>
<rect x="1018.0" y="145.0" width="114.0" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="1075.0" y="166.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">hasta 20 s</text>
<text x="632.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Aerosol, calor y, en el DOTC, gas de CO de</tspan><tspan x="632.0" dy="21.6">0,5 a 1 s.</tspan></text>
<circle cx="1072" cy="262" r="30" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2.5"/><circle cx="1072" cy="262" r="19.2" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/><circle cx="1072" cy="262" r="5.1" fill="#C2D4E6"/>
<path d="M1038 298H1106L1098 344H1046Z" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2.5"/><path d="M1072 344V322" stroke="#0A63B8" stroke-width="6" stroke-linecap="round"/>
<rect x="48" y="360" width="540" height="210" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="392.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#0E8F5E" text-anchor="start">Walk test simultáneo</text>
<text x="68.0" y="424.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">herramienta multiestímulo</text>
<rect x="436.0" y="375.0" width="132.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="502.0" y="396.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">todos o nada</text>
<text x="68.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">La alarma aparece solo si dispararon todos</tspan><tspan x="68.0" dy="21.6">los sensores.</tspan></text>
<circle cx="508" cy="492" r="30" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2.5"/><circle cx="508" cy="492" r="19.2" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/><circle cx="508" cy="492" r="5.1" fill="#C2D4E6"/>
<path d="M474 528H542L534 574H482Z" fill="#E5F0FB" stroke="#0E8F5E" stroke-width="2.5"/><path d="M508 574V552" stroke="#0E8F5E" stroke-width="6" stroke-linecap="round"/>
<rect x="612" y="360" width="540" height="210" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="392.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#B45309" text-anchor="start">Fuera de revisión</text>
<text x="632.0" y="424.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">con dependencia de 2 detectores</text>
<rect x="1009.0" y="375.0" width="123.0" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="1070.5" y="396.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">hasta 1 min</text>
<text x="632.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Aerosol en ráfagas: 1 s, esperás 30 s, otra</tspan><tspan x="632.0" dy="21.6">ráfaga.</tspan></text>
<circle cx="1072" cy="492" r="30" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2.5"/><circle cx="1072" cy="492" r="19.2" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/><circle cx="1072" cy="492" r="5.1" fill="#C2D4E6"/>
<path d="M1038 528H1106L1098 574H1046Z" fill="#E5F0FB" stroke="#B45309" stroke-width="2.5"/><path d="M1072 574V552" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
<text x="48.0" y="625.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">El cabezal queda arriba del detector hasta que dispare. Cada prueba se anota con método, segundos, resultado y hora.</text>
</svg>