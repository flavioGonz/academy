<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Consistencia: errores, advertencias y pistas</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Consistencia: errores, advertencias y pistas</text>
<rect x="48" y="140" width="352" height="170" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="172.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#D2492F" text-anchor="start">Errores</text>
<circle cx="77" cy="208.4" r="4.5" fill="#D2492F"/><text x="92.0" y="214.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Se corrigen antes de descargar</tspan></text><circle cx="77" cy="241.3" r="4.5" fill="#D2492F"/><text x="92.0" y="246.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Regla de obra: consistencia sin</tspan><tspan x="92.0" dy="23.0">errores</tspan></text>
<rect x="424" y="140" width="352" height="170" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="444.0" y="172.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#B45309" text-anchor="start">Advertencias</text>
<circle cx="453" cy="208.4" r="4.5" fill="#B45309"/><text x="468.0" y="214.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="468.0" dy="0.0">Se leen una por una</tspan></text><circle cx="453" cy="241.3" r="4.5" fill="#B45309"/><text x="468.0" y="246.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="468.0" dy="0.0">Se decide y se anota por qué</tspan><tspan x="468.0" dy="23.0">queda así</tspan></text>
<rect x="800" y="140" width="352" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="820.0" y="172.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Pistas</text>
<circle cx="829" cy="208.4" r="4.5" fill="#17A8D4"/><text x="844.0" y="214.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="844.0" dy="0.0">Novedad de RPS 5.15.27</tspan></text><circle cx="829" cy="241.3" r="4.5" fill="#17A8D4"/><text x="844.0" y="246.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="844.0" dy="0.0">Ayudan a ubicar qué corregir</tspan></text>
<rect x="48" y="344" width="700" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="356" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="378.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Paso 3: anotá todo</tspan></text><text x="74.0" y="404.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Copiá cada error, advertencia y pista tal cual aparece, con el elemento al que</tspan><tspan x="74.0" dy="21.6">se refiere. Esa lista es tu registro de qué corregiste antes de descargar.</tspan></text>
<rect x="780" y="344" width="372" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="780" y="356" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="806.0" y="378.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="806.0" dy="0.0">Paso 4</tspan></text><text x="806.0" y="404.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="806.0" dy="0.0">Guardá y exportá la configuración con</tspan><tspan x="806.0" dy="21.6">la fecha en el nombre del archivo.</tspan></text>
</svg>