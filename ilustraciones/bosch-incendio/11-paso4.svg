<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Anotá qué modo correspondería según la guía</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Anotá qué modo correspondería según la guía</text>
<rect x="48" y="150" width="470" height="180" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Hoy: Oficina (modo día)</text><text x="68.0" y="212.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">FAP-425-OT-R en la cocina del piso</text><text x="68.0" y="235.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Térmico: baja (B) · Óptico: media</text><text x="68.0" y="258.4" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">el vapor y el humo de cocina</text><text x="68.0" y="281.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">le llegan al óptico</text>
<path d="M530.0 240.0C595.0 240.0,595.0 240.0,660.0 240.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="682" y="150" width="470" height="180" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="702.0" y="182.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Propuesta: Cocina en operación</text><text x="702.0" y="212.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Cocina/casino/restaurante en operación</text><text x="702.0" y="235.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">el OT queda solo con térmico máximo</text><text x="702.0" y="258.4" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">(B); el óptico no participa</text><text x="702.0" y="281.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">se acuerda con el proyecto</text>
<rect x="48" y="370" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="382" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="404.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Es una propuesta, no un cambio</tspan></text><text x="74.0" y="430.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Cambiar el modo cambia la respuesta al fuego: el OT en modo cocina deja de ver humo. Se acuerda con el proyecto, se deja</tspan><tspan x="74.0" dy="21.6">escrito y se prueba después del cambio.</tspan></text>
</svg>