<text x="636.0" y="536.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">Se pierde todo lo que queda detrás de la falla.</text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Cada elemento LSN trae aislador entre b1 y b2: ante un corte o un corto, el panel parte el lazo en dos.</text>
<text x="48.0" y="630.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">La clase la decide el proyecto: Bosch recomienda lazo siempre que se pueda.</text>
