<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Datos del laboratorio, no una captura de RPS: los nombres de los campos en pantalla pueden variar según la versión.</text>
