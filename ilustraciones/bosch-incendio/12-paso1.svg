<rect x="48" y="136" width="1104" height="336" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 148a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v44h-1104z" fill="#E5F0FB"/><text x="62.0" y="169.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">EVENTO</text><text x="292.0" y="169.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MODO DÍA</text><text x="732.0" y="169.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">MODO NOCHE</text><text x="62.0" y="225.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1 detector</text><text x="292.0" y="225.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">prealarma, personal investiga 3 min</text><text x="732.0" y="225.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">alarma general + transmisión</text><path d="M60 248H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="281.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">2 detectores</text><text x="292.0" y="281.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"></text><text x="732.0" y="281.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"></text><rect x="52" y="307" width="1096" height="50" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="337.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">1 pulsador</text><text x="292.0" y="337.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">alarma general inmediata</text><text x="732.0" y="337.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">alarma general inmediata</text><path d="M60 360H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="393.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Falla de red</text><text x="292.0" y="393.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"></text><text x="732.0" y="393.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"></text><path d="M60 416H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="449.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Cambio día/noche</text><text x="292.0" y="449.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">tecla de función / horario: ____</text><text x="732.0" y="449.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"></text>
<text x="48.0" y="500.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Las filas completas son el ejemplo del laboratorio; las vacías las completás vos.</text>
<rect x="48" y="530" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="542" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="564.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Topes de referencia</tspan></text><text x="74.0" y="591.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">BS 5839-1 limita la alarma demorada a 6 minutos y un</tspan><tspan x="74.0" dy="21.6">pulsador la anula. La IT-11 de 2010 admite preseñal de</tspan><tspan x="74.0" dy="21.6">hasta 2 minutos en locales concurridos.</tspan></text>
<rect x="612" y="530" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="542" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="564.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Paso 3</tspan></text><text x="638.0" y="591.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Lo que pongas en la tabla todavía no vale: la valida el</tspan><tspan x="638.0" dy="21.6">técnico registrado antes de programarla.</tspan></text>
