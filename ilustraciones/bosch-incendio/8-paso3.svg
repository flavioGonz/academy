<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Medí cada batería y probá red y batería por separado</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Medí cada batería y probá red y batería por separado</text>
<rect x="80" y="180" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#41627F" stroke-width="2.5"/><rect x="96" y="171" width="18" height="9" rx="2" fill="#41627F" stroke="#41627F" stroke-width="0"/><rect x="196" y="171" width="18" height="9" rx="2" fill="#D2492F" stroke="#D2492F" stroke-width="0"/><text x="155.0" y="227.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#04223D" text-anchor="middle">B1 12 V</text>
<rect x="290" y="180" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#41627F" stroke-width="2.5"/><rect x="306" y="171" width="18" height="9" rx="2" fill="#41627F" stroke="#41627F" stroke-width="0"/><rect x="406" y="171" width="18" height="9" rx="2" fill="#D2492F" stroke="#D2492F" stroke-width="0"/><text x="365.0" y="227.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#04223D" text-anchor="middle">B2 12 V</text>
<path d="M230 220H290" stroke="#41627F" stroke-width="3"/>
<text x="260.0" y="310.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#41627F" text-anchor="middle">en serie: 24 a 28,2 V</text>
<rect x="80" y="340" width="360" height="76" rx="14" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="260.0" y="374.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#0E8F5E" text-anchor="middle">cada una: 12,0 a 14,1 V</text>
<text x="260.0" y="400.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="middle">rango de la puesta en marcha</text>
<rect x="520" y="140" width="632" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="540.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Prueba 1: falta de red</text>
<text x="544.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Cortás la alimentación de red: el panel sigue con baterías</text>
<text x="544.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y tiene que avisar la falla de red.</text>
<rect x="520" y="300" width="632" height="160" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="540.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Prueba 2: falta de batería</text>
<text x="544.0" y="370.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Con red presente, desconectás las baterías.</text>
<text x="544.0" y="400.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="start">El aviso de batería puede demorar hasta 15 minutos:</text>
<text x="544.0" y="428.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">esperá antes de dar la prueba por fallida.</text>
<rect x="48" y="490" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="502" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="524.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Y la batería, con carga</tspan></text><text x="74.0" y="551.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Medir tensión no alcanza: la práctica que cita Security Sales es probar con carga, fechar por fabricación y contar con una vida</tspan><tspan x="74.0" dy="21.6">típica de 3 a 5 años.</tspan></text>
</svg>