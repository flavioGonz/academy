<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Zonas de energía: si cae una, la otra sigue</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">BOSCH INCENDIO</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Zonas de energía: si cae una, la otra sigue</text>
<rect x="56" y="130" width="624" height="196" rx="18" fill="none" stroke="#0E8F5E" stroke-width="2.5" stroke-dasharray="8 6"/><text x="70.0" y="156.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="start">ZONA DE ENERGÍA 1</text><rect x="70" y="170" width="590" height="12" rx="6" fill="#C9D6E3" stroke="#C9D6E3" stroke-width="0"/><rect x="70" y="188" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/><text x="140.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">FPE-8000-BCM</text><text x="140.0" y="254.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#B45309" text-anchor="middle">baterías</text><rect x="220" y="188" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2.5"/><text x="290.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">ENO 0000 B</text><text x="290.0" y="254.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="middle">alto consumo</text><rect x="370" y="188" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2.5"/><text x="440.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">NZM 0002 A</text><text x="440.0" y="254.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="middle">alto consumo</text><rect x="520" y="188" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><text x="590.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">LSN 1500 A</text><text x="590.0" y="254.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#0A63B8" text-anchor="middle">lazo</text>
<rect x="56" y="360" width="474" height="196" rx="18" fill="none" stroke="#17A8D4" stroke-width="2.5" stroke-dasharray="8 6"/><text x="70.0" y="386.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#17A8D4" text-anchor="start">ZONA DE ENERGÍA 2</text><rect x="70" y="400" width="440" height="12" rx="6" fill="#C9D6E3" stroke="#C9D6E3" stroke-width="0"/><rect x="70" y="418" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/><text x="140.0" y="458.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">FPE-8000-BCM</text><text x="140.0" y="484.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#B45309" text-anchor="middle">baterías</text><rect x="220" y="418" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><text x="290.0" y="458.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">LSN 1500 A</text><text x="290.0" y="484.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#0A63B8" text-anchor="middle">lazo</text><rect x="370" y="418" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><text x="440.0" y="458.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">LSN 1500 A</text><text x="440.0" y="484.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#0A63B8" text-anchor="middle">lazo</text>
<text x="56.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Cada FPE-8000-BCM tiene sus baterías: si falla uno, o sus baterías,</text>
<text x="56.0" y="626.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">las otras zonas siguen funcionando.</text>
<rect x="560" y="360" width="34" height="30" rx="6" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/>
<path d="M566 366l22 18M588 366l-22 18" stroke="#D2492F" stroke-width="3"/>
<text x="604.0" y="382.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">cable rojo entre rieles quitado: zonas separadas</text>
<rect x="760" y="130" width="392" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="780.0" y="162.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Orden en el riel</text><text x="780.0" y="192.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Al lado del BCM, primero los de alto</text><text x="780.0" y="213.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">consumo o sensibles a la tensión:</text><text x="780.0" y="235.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">ENO 0000 B, CZM 0004 A, NZM 0002 A,</text><text x="780.0" y="257.2" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">RML 0008 A, IOS 0020 A, RMH 0002 A</text>
<rect x="760" y="440" width="392" height="180" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="780.0" y="472.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Obra nueva desde el 02/05/2026</text><text x="780.0" y="502.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">FPE-8000-BCM, sin mezclar con BCM-0000-B</text><text x="780.0" y="523.8" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">firmware 4.7.0 o más · RPS 5.14.17 o más</text><text x="780.0" y="545.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">SSD 3.6 o más para planificar</text>
</svg>