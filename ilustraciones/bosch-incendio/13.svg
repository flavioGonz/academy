<text x="78.0" y="438.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">192.168.1.4</text>
<text x="78.0" y="460.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">nodo 4</text>
<text x="395.0" y="196.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">anillo Ethernet, RSTP</text>
<text x="60.0" y="524.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Switches y conversores dentro de los gabinetes · puertos 25001 a 25008</text>
<rect x="860" y="360" width="292" height="112" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<text x="880.0" y="396.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Red del cliente (BMS)</text>
<text x="880.0" y="424.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">otra subred</text>
<text x="880.0" y="448.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">solo a través del servidor OPC</text>
<path d="M175 472V492H830V430H860" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="860" y="150" width="292" height="150" rx="14" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="880.0" y="186.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#B45309" text-anchor="start">Acceso remoto</text>
<text x="880.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="880.0" dy="0.0">Solo por el gateway seguro de</tspan><tspan x="880.0" dy="20.2">Bosch, con IPsec (UDP 500 y</tspan><tspan x="880.0" dy="20.2">4500) y subredes separadas.</tspan></text>
<text x="48.0" y="590.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">En cada controlador: puertos 1 y 2 para la red de paneles, 3 para BMS, UGM o voz, 4 para servicios remotos.</text>
<text x="48.0" y="622.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">Hasta 32 nodos: paneles, teclados y servidores OPC, FSI, BACnet o UGM.</text>
</svg>