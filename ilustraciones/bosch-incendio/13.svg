<rect x="500" y="160" width="230" height="92" rx="14" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="518.0" y="192.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">Panel torre B</text><text x="518.0" y="218.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#17A8D4" text-anchor="start">192.168.1.2</text><text x="518.0" y="240.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#9FC3E3" text-anchor="start">PNA 2</text>
