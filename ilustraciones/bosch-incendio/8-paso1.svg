<rect x="48" y="130" width="1104" height="108" rx="12" fill="#03213C"/><text x="64.0" y="152.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">DATOS: I REPOSO 0,6 A · I ALARMA 2,5 A</text><text x="64.0" y="184.4" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">Variante A (guía NFPA 72): (0,6 x 24 + 2,5 x 5/60)  x 1,20 = 17,5 Ah</text><text x="64.0" y="218.4" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#D9E9F8" text-anchor="start">Variante B (más exigente): (0,6 x 30 + 2,5 x 15/60) x 1,25 = 23,3 Ah</text>
<text x="280.0" y="328.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="end">Variante A</text>
