<text x="326.0" y="514.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">alarma: chica en Ah, pero es la que tiene que funcionar al final</text>
<rect x="48" y="548" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="560" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="582.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Después de la cuenta</tspan></text><text x="74.0" y="609.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Redondeá hacia arriba a una capacidad comercial y anotá cuál variante pide el proyecto firmado. Al montar las baterías,</tspan><tspan x="74.0" dy="21.6">rotulalas con su fecha de fabricación.</tspan></text>
