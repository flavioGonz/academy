<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La ficha de la obra, antes de tocar una sección</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La ficha de la obra, antes de tocar una sección</text>
<rect x="48" y="124" width="640" height="420" rx="18" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="160.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="2">FICHA DE LA OBRA</text>
<text x="72.0" y="222.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Modelo (placa)</text>
<rect x="330" y="200" width="330" height="38" rx="8" fill="#F7FAFD" stroke="#C2D4E6" stroke-width="2"/>
<text x="346.0" y="225.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">SP6000+</text>
<text x="72.0" y="284.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Versión ([980])</text>
<rect x="330" y="262" width="330" height="38" rx="8" fill="#F7FAFD" stroke="#C2D4E6" stroke-width="2"/>
<text x="346.0" y="287.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">_ _ _ _</text>
<text x="72.0" y="346.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Teclados</text>
<rect x="330" y="324" width="330" height="38" rx="8" fill="#F7FAFD" stroke="#C2D4E6" stroke-width="2"/>
<text x="346.0" y="349.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">K32LCD+ × 1</text>
<text x="72.0" y="408.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Comunicación</text>
<rect x="330" y="386" width="330" height="38" rx="8" fill="#F7FAFD" stroke="#C2D4E6" stroke-width="2"/>
<text x="346.0" y="411.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">IP150 · IP180 · PCS</text>
<text x="72.0" y="470.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">StayD</text>
<rect x="330" y="448" width="330" height="38" rx="8" fill="#F7FAFD" stroke="#C2D4E6" stroke-width="2"/>
<text x="346.0" y="473.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">sí / no</text>
<text x="72.0" y="524.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Valores de ejemplo: completá con lo que ves en la obra.</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="720" y="124" width="432" height="200" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="756" cy="166" r="18" fill="#D2492F"/><text x="756.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="788.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#D2492F" text-anchor="start">¿SP4000 o SP65?</text>
<text x="744.0" y="212.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="744.0" dy="0.0">Marcala en rojo en la ficha. Su reseteo es</tspan><tspan x="744.0" dy="21.6">distinto al del resto de SP y MG: se ve en la</tspan><tspan x="744.0" dy="21.6">lección de llaves de la central.</tspan></text>
<rect x="720" y="352" width="432" height="145" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="720" y="364" width="5" height="121" rx="2.5" fill="#0A63B8"/><text x="746.0" y="386.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="746.0" dy="0.0">Por qué anotar todo esto</tspan></text><text x="746.0" y="412.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="746.0" dy="0.0">El modelo y la versión de [980] te dicen qué</tspan><tspan x="746.0" dy="21.6">manual abrir. Con StayD activo no se entra a</tspan><tspan x="746.0" dy="21.6">programación, y los módulos definen cómo</tspan><tspan x="746.0" dy="21.6">reporta.</tspan></text>
</svg>