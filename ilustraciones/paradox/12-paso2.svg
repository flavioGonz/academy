<rect x="48" y="490" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="502" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="524.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Después entrás con el código de PC (paso 3) y anotás en la ficha los días de suscripción, la fecha de renovación y quién paga</tspan><tspan x="74.0" dy="21.6">(pasos 4 y 6).</tspan></text>
