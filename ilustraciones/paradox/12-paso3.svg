<text x="90.0" y="320.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Es el mismo código de PC de BabyWare. En MG y SP, cada 0 se escribe A.</text>
<rect x="48" y="370" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="382" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="404.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Si no entra</tspan></text><text x="74.0" y="430.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el código no entra, revisá los ceros antes que nada:</tspan><tspan x="74.0" dy="21.6">cada uno va como A.</tspan></text>
<rect x="612" y="370" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="382" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="404.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Misma llave</tspan></text><text x="638.0" y="430.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Es la misma llave que protege BabyWare: si quedó de</tspan><tspan x="638.0" dy="21.6">fábrica, también la app queda abierta.</tspan></text>
