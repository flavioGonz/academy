<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">BabyWare entra con dos llaves propias</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="150" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">BabyWare</text>
<rect x="470" y="140" width="300" height="220" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="490.0" y="176.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Central</text><text x="490.0" y="200.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">SP+ o MG</text>
<path d="M308.0 192.0C389.0 192.0,389.0 192.0,470.0 192.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="308.0" cy="192.0" r="5" fill="#0A63B8"/><circle cx="470.0" cy="192.0" r="5" fill="#0A63B8"/><rect x="317.8" y="161.0" width="142.4" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="389.0" y="180.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">307USB · serie</text>
<rect x="48" y="300" width="260" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 326.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="112.0" y="338.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Remoto</text><text x="112.0" y="361.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">por módulo IP o PCS</text>
<path d="M308.0 342.0C389.0 342.0,389.0 300.0,470.0 300.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/><rect x="343.6" y="290.0" width="90.8" height="28" rx="14" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="389.0" y="309.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="middle">internet</text>
<rect x="490" y="230" width="260" height="112" rx="12" fill="#0B3A66" stroke="#0B3A66" stroke-width="2"/>
<text x="510.0" y="262.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">[910]  ID de panel</text>
<text x="510.0" y="290.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">[911]  contraseña de PC</text>
<text x="510.0" y="324.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">hexadecimales</text>
<rect x="820" y="140" width="332" height="220" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="840.0" y="172.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Si no coinciden</text>
<text x="840.0" y="200.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="840.0" dy="0.0">BabyWare no conecta: la cuenta en</tspan><tspan x="840.0" dy="21.6">la PC tiene que tener el mismo ID</tspan><tspan x="840.0" dy="21.6">de panel y la misma contraseña de</tspan><tspan x="840.0" dy="21.6">PC que la central.</tspan></text>
<rect x="48" y="400" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="412" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Las llaves sobreviven al reseteo</tspan></text><text x="74.0" y="460.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El reseteo por botón vuelve todo a fábrica salvo el ID de</tspan><tspan x="74.0" dy="21.6">panel y la contraseña de PC. Quien las conoce, entra aunque</tspan><tspan x="74.0" dy="21.6">la central se resetee.</tspan></text>
<rect x="612" y="400" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="412" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Una conexión por vez</tspan></text><text x="638.0" y="460.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">El módulo IP atiende una conexión a la vez, según usuarios</tspan><tspan x="638.0" dy="21.6">de un foro de domótica: una sesión de BabyWare abierta deja</tspan><tspan x="638.0" dy="21.6">afuera a la app o a una integración.</tspan></text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#41627F" text-anchor="start">BabyWare también es la copia de la central: leés toda la programación antes de cambiar nada.</text>
</svg>