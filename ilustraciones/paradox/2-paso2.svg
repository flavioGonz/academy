<rect x="48" y="400" width="470" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="412" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Respetá la serigrafía</tspan></text><text x="74.0" y="460.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Rojo es + y negro es −: es la alimentación que sale</tspan><tspan x="74.0" dy="21.6">del auxiliar. Los dos hilos de datos van borne a</tspan><tspan x="74.0" dy="21.6">borne con el mismo nombre que dice la serigrafía.</tspan></text>
<rect x="48" y="556" width="470" height="93" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="568" width="5" height="69" rx="2.5" fill="#B45309"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Los nombres de los bornes de datos cambian según el</tspan><tspan x="74.0" dy="20.2">modelo: el dibujo es genérico. Conectás sin energía y</tspan><tspan x="74.0" dy="20.2">recién después energizás.</tspan></text>
