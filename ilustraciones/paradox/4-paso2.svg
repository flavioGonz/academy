<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Sumá el auxiliar antes de energizar</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Sumá el auxiliar antes de energizar</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<text x="60.0" y="150.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Ejemplo con la tabla de consumos máximos de la guía SP+</text>
<rect x="60.0" y="180" width="215.0" height="64" fill="#0A63B8" stroke="#FFFFFF" stroke-width="2"/>
<text x="167.5" y="208.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">K32LCD+ × 2</text>
<text x="167.5" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">172 mA</text>
<rect x="275.0" y="180" width="412.5" height="64" fill="#17A8D4" stroke="#FFFFFF" stroke-width="2"/>
<text x="481.2" y="208.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">TM70 + zumbador</text>
<text x="481.2" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">330 mA</text>
<rect x="687.5" y="180" width="38.8" height="64" fill="#6E88A1" stroke="#FFFFFF" stroke-width="2"/>
<rect x="726.2" y="180" width="125.0" height="64" fill="#002F58" stroke="#FFFFFF" stroke-width="2"/>
<text x="788.8" y="208.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">IP150+</text>
<text x="788.8" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">100 mA</text>
<text x="781.2" y="272.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">ZX8 31</text>
<rect x="851.2" y="180" width="83.8" height="64" fill="#FFF4DE" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M935.0 160V300" stroke="#D2492F" stroke-width="3"/>
<text x="943.0" y="176.0" font-family="JetBrains Mono" font-size="16" font-weight="700" fill="#D2492F" text-anchor="start">700 mA</text>
<text x="943.0" y="196.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start">SP5500+</text>
<text x="60.0" y="330.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Suma sin detectores: 633 mA. Quedan 67 mA para 6 detectores: unos 11 mA cada uno.</text>
<circle cx="44" cy="180" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="44.0" y="186.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="370" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="382" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="404.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Si te pasás</tspan></text><text x="74.0" y="430.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si los detectores consumen más de lo que queda, parte de</tspan><tspan x="74.0" dy="21.6">las cargas va a una fuente auxiliar aparte. Lo que alimenta</tspan><tspan x="74.0" dy="21.6">una fuente externa no cuenta en el AUX.</tspan></text>
<rect x="612" y="370" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="382" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="404.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Mirá tu central</tspan></text><text x="638.0" y="430.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Cada placa tiene su máximo de auxiliar: la guía lista</tspan><tspan x="638.0" dy="21.6">1000 mA para la SP6000+ y 1500 mA para la SP7000+. Los</tspan><tspan x="638.0" dy="21.6">sensores, de la hoja de su fabricante.</tspan></text>
<text x="48.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Las PGM alimentadas del AUX y los teclados con zumbador también entran en la cuenta.</text>
</svg>