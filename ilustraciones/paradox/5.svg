<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">ENTER, código, sección y dato: tres formas de dato</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="133" width="86.0" height="42" rx="9" fill="#C2D4E6"/><rect x="48" y="130" width="86.0" height="42" rx="9" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><text x="91.0" y="158.2" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#04223D" text-anchor="middle">ENTER</text><text x="148.0" y="157.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#6E88A1" text-anchor="start">+</text><rect x="172.0" y="130" width="73.6" height="42" rx="9" fill="#03213C"/><text x="208.8" y="158.2" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#D9E9F8" text-anchor="middle">0000</text><text x="259.6" y="157.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#6E88A1" text-anchor="start">+</text><rect x="283.6" y="133" width="61.2" height="42" rx="9" fill="#C2D4E6"/><rect x="283.6" y="130" width="61.2" height="42" rx="9" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><text x="314.2" y="158.2" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#04223D" text-anchor="middle">710</text><text x="358.8" y="157.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#6E88A1" text-anchor="start">+</text><rect x="382.8" y="130" width="61.2" height="42" rx="9" fill="#03213C"/><text x="413.4" y="158.2" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#D9E9F8" text-anchor="middle">045</text>
<text x="90.0" y="200.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">entrar</text>
<text x="208.0" y="222.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">código de instalador</text>
<text x="314.0" y="200.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">sección, 3 dígitos</text>
<text x="413.0" y="222.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">dato</text>
<rect x="48" y="236" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="268.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Decimal</text>
<text x="68.0" y="292.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">000 a 255</text>
<text x="68.0" y="328.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Tiempos y cantidades. [710] = 045:</tspan><tspan x="68.0" dy="21.6">retardo de entrada de 45 s.</tspan></text>
<rect x="424" y="236" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="444.0" y="268.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Hexadecimal</text>
<text x="444.0" y="292.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">la tecla 0 vale A</text>
<text x="444.0" y="328.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="444.0" dy="0.0">ID, abonados y contraseñas. B a F van</tspan><tspan x="444.0" dy="21.6">con teclas de función.</tspan></text>
<rect x="800" y="236" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="820.0" y="268.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Opciones 1 a 8</text>
<text x="820.0" y="292.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">cada tecla prende o apaga</text>
<text x="820.0" y="328.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="820.0" dy="0.0">Opción encendida = tecla iluminada.</tspan><tspan x="820.0" dy="21.6">ENTER guarda.</tspan></text>
