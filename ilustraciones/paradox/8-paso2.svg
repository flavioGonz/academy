<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Luz de falla de AC: se prende con un evento, se apaga con otro</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Luz de falla de AC: se prende con un evento, se apaga con otro</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<path d="M80 300H1120" stroke="#6E88A1" stroke-width="3" marker-end="url(#a-gray)"/>
<circle cx="110" cy="300" r="9" fill="#41627F"/>
<text x="110.0" y="252.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Corte de red</text>
<text x="110.0" y="276.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">TBL 2.2 ya se ve</text>
<circle cx="420" cy="300" r="9" fill="#B45309"/>
<text x="420.0" y="252.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Pasa el retardo [839]</text>
<text x="420.0" y="276.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#B45309" text-anchor="middle">15 min de fábrica · 1 en el banco</text>
<circle cx="720" cy="300" r="9" fill="#41627F"/>
<text x="720.0" y="252.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Vuelve la red</text>
<text x="720.0" y="276.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="middle">falla restaurada</text>
<rect x="420" y="330" width="300" height="44" rx="10" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="570.0" y="358.0" font-family="Instrument Sans" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">PGM2 encendida: luz prendida</text>
<rect x="110" y="330" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="260.0" y="358.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#6E88A1" text-anchor="middle">luz apagada</text>
<rect x="730" y="330" width="390" height="44" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="925.0" y="358.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="middle">luz apagada, sola</text>
<rect x="48" y="140" width="520" height="40" rx="10" fill="#03213C"/><text x="64.0" y="165.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">[222] 44 01 99   activación: nueva falla, AC</text>
<rect x="612" y="140" width="540" height="40" rx="10" fill="#03213C"/><text x="628.0" y="165.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">[223] 45 01 99   desactivación: AC restaurada</text>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="420" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="432" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Sin temporizador</tspan></text><text x="74.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con [282] en 000, la PGM2 no tiene tiempo: queda prendida</tspan><tspan x="74.0" dy="21.6">hasta el evento de desactivación.</tspan></text>
<rect x="612" y="420" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="432" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">El retardo, de vuelta</tspan></text><text x="638.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Bajá [839] a 001 solo para probar. Al terminar, devolvelo</tspan><tspan x="638.0" dy="21.6">al valor acordado con la empresa de monitoreo (paso 5).</tspan></text>
</svg>