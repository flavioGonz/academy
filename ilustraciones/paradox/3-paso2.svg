<rect x="353.4" y="273.0" width="133.2" height="27" rx="13.5" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="420.0" y="292.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">cable de zona</text>
<rect x="48" y="446" width="540" height="145" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="458" width="5" height="121" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="480.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué en el extremo</tspan></text><text x="74.0" y="506.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Así el cable entero queda vigilado: un corto en cualquier</tspan><tspan x="74.0" dy="21.6">punto del recorrido le saca la resistencia a la central. Si</tspan><tspan x="74.0" dy="21.6">la resistencia queda en la bornera, el cable no está</tspan><tspan x="74.0" dy="21.6">supervisado.</tspan></text>
<rect x="612" y="446" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="458" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="480.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Antes de cablear</tspan></text><text x="638.0" y="506.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Medí la resistencia con el tester antes de usarla (paso 1).</tspan><tspan x="638.0" dy="21.6">La guía muestra este y otros dibujos en la figura Single</tspan><tspan x="638.0" dy="21.6">Zone Input Connections.</tspan></text>
