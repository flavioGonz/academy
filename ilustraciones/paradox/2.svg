<text x="960.0" y="192.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start">SP+</text><text x="960.0" y="216.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">hasta 15 módulos</text><text x="960.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">76 m por módulo</text><text x="960.0" y="264.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">230 m en total</text><text x="960.0" y="288.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"></text><text x="960.0" y="312.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start">EVOHD+</text><text x="960.0" y="336.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">hasta 254 módulos</text><text x="960.0" y="360.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">914 m en total</text>
<rect x="48" y="470" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Alimenta y comunica</tspan></text><text x="74.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Rojo (+) y negro (−) llevan la alimentación del auxiliar;</tspan><tspan x="74.0" dy="21.6">los otros dos hilos, los datos. Cada módulo suma consumo al</tspan><tspan x="74.0" dy="21.6">AUX.</tspan></text>
<rect x="612" y="470" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="482" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">De a grupos</tspan></text><text x="638.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Sin energía, se suma un grupo chico; se energiza y se mira</tspan><tspan x="638.0" dy="21.6">TBL. Una falla nueva es del grupo que acabás de sumar.</tspan></text>
<text x="48.0" y="640.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Cifras de las guías SP+ y EVOHD+. En EVO, la sección [4000] lista los módulos que la central ve.</text>
