<text x="820.0" y="428.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="820.0" dy="0.0">Falla: TBL grupo 5, tamper y cableado</tspan></text>
<rect x="48" y="498" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="510" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="532.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Sin EOL, el corto es invisible</tspan></text><text x="74.0" y="559.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Sin resistencia, un corto se ve igual que una zona cerrada:</tspan><tspan x="74.0" dy="21.6">alguien puentea el cable y la central nunca se entera.</tspan></text>
<rect x="612" y="498" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="510" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="532.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Paradox: 1 kΩ</tspan></text><text x="638.0" y="559.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">En Paradox la EOL es de 1 kΩ y se activa para toda la</tspan><tspan x="638.0" dy="21.6">central en [706] opción 2. Los 5,6 kΩ de otras marcas no</tspan><tspan x="638.0" dy="21.6">aplican.</tspan></text>
