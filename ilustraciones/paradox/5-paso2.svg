<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Las tres llaves de la central, el primer día</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Las tres llaves de la central, el primer día</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="124" width="352" height="360" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="168.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">[397]</text>
<text x="72.0" y="198.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Código de instalador</text>
<text x="72.0" y="244.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">FÁBRICA</text>
<rect x="72.0" y="256.0" width="67.2" height="32" rx="16.0" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="105.6" y="280.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#D2492F" text-anchor="middle">0000</text>
<text x="72.0" y="324.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">QUEDA</text>
<text x="72.0" y="352.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">uno propio de la obra</text>
<text x="72.0" y="394.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">4 o 6 dígitos. Ni 0000, ni 1234, ni</tspan><tspan x="72.0" dy="20.2">una fecha.</tspan></text>
<rect x="424" y="124" width="352" height="360" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="424" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="448.0" y="168.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">[399]</text>
<text x="448.0" y="198.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Maestro del sistema</text>
<text x="448.0" y="244.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">FÁBRICA</text>
<rect x="448.0" y="256.0" width="67.2" height="32" rx="16.0" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="481.6" y="280.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#D2492F" text-anchor="middle">1234</text>
<text x="448.0" y="324.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">QUEDA</text>
<text x="448.0" y="352.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">uno propio del cliente</text>
<text x="448.0" y="394.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="448.0" dy="0.0">No se puede borrar, solo cambiar.</tspan></text>
<rect x="800" y="124" width="352" height="360" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="800" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="800.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="824.0" y="168.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="start">[398]</text>
<text x="824.0" y="198.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Mantenimiento</text>
<text x="824.0" y="244.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">FÁBRICA</text>
<rect x="824.0" y="256.0" width="78.0" height="32" rx="16.0" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="863.0" y="280.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#6E88A1" text-anchor="middle">vacío</text>
<text x="824.0" y="324.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">QUEDA</text>
<text x="824.0" y="352.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">solo si hace falta</text>
<text x="824.0" y="394.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="824.0" dy="0.0">Programa casi todo, menos comunicación</tspan><tspan x="824.0" dy="20.2">([815] a [817], [910], [911], [918] a</tspan><tspan x="824.0" dy="20.2">[949]) y códigos.</tspan></text>
<rect x="48" y="513" width="76.7" height="39" rx="9" fill="#C2D4E6"/><rect x="48" y="510" width="76.7" height="39" rx="9" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><text x="86.3" y="535.6" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">ENTER</text><text x="138.7" y="535.5" font-family="JetBrains Mono" font-size="19" font-weight="600" fill="#6E88A1" text-anchor="start">+</text><rect x="162.7" y="510" width="66.2" height="39" rx="9" fill="#03213C"/><text x="195.8" y="535.6" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#D9E9F8" text-anchor="middle">0000</text><text x="242.9" y="535.5" font-family="JetBrains Mono" font-size="19" font-weight="600" fill="#6E88A1" text-anchor="start">+</text><rect x="266.86" y="513" width="55.6" height="39" rx="9" fill="#C2D4E6"/><rect x="266.86" y="510" width="55.6" height="39" rx="9" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><text x="294.7" y="535.6" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">397</text><text x="336.5" y="535.5" font-family="JetBrains Mono" font-size="19" font-weight="600" fill="#6E88A1" text-anchor="start">+</text><text x="360.5" y="534.5" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">código nuevo</text>
<rect x="612" y="504" width="540" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="516" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="538.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Anotá los códigos en la ficha del sistema de gestión, nunca</tspan><tspan x="638.0" dy="21.6">en el gabinete (paso 5).</tspan></text>
</svg>