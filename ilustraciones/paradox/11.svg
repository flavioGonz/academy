<text x="880.0" y="392.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el módulo se reporta cada</text>
<text x="880.0" y="416.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">tanto: si calla, avisa</text>
<rect x="48" y="462" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="474" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="496.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Contact ID por IP</tspan></text><text x="74.0" y="523.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Formato en [810]: 4 = Contact ID, 5 = SIA. Por IP o GPRS,</tspan><tspan x="74.0" dy="21.6">SIA no va: IP180 e IP150M reportan solo Contact ID.</tspan></text>
<rect x="612" y="462" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="474" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="496.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Lo que da la receptora</tspan></text><text x="638.0" y="523.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La receptora te da abonado, IP y puerto, contraseña (solo</tspan><tspan x="638.0" dy="21.6">legado) y perfil de supervisión. Pediles los reales.</tspan></text>
