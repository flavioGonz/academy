<text x="48.0" y="576.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">(*) La guía SP+ dice que BabyWare obliga a cambiarlas; otros manuales siguen citando 0000.</text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">La del IP150, en firmware viejo.</text>
<rect x="780" y="124" width="372" height="145" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="780" y="136" width="5" height="121" rx="2.5" fill="#D2492F"/><text x="806.0" y="158.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="806.0" dy="0.0">Por qué todas</tspan></text><text x="806.0" y="184.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="806.0" dy="0.0">Todos esos valores están en manuales</tspan><tspan x="806.0" dy="21.6">públicos. Una central que sale de obra</tspan><tspan x="806.0" dy="21.6">con uno solo de fábrica se abre con un</tspan><tspan x="806.0" dy="21.6">cable y una lista.</tspan></text>
<rect x="780" y="300" width="372" height="145" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="780" y="312" width="5" height="121" rx="2.5" fill="#0A63B8"/><text x="806.0" y="334.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="806.0" dy="0.0">Y dos protecciones</tspan></text><text x="806.0" y="360.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="806.0" dy="0.0">Bloqueo de teclado ([717] intentos,</tspan><tspan x="806.0" dy="21.6">[716] minutos) y bloqueo de instalador</tspan><tspan x="806.0" dy="21.6">([395] = 147, solo si está en el</tspan><tspan x="806.0" dy="21.6">contrato).</tspan></text>
<rect x="780" y="456" width="372" height="97" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="780" y="468" width="5" height="73" rx="2.5" fill="#0E8F5E"/><text x="806.0" y="490.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="806.0" dy="0.0">La ficha con las llaves nuevas va al</tspan><tspan x="806.0" dy="21.6">sistema de gestión, nunca dentro del</tspan><tspan x="806.0" dy="21.6">gabinete.</tspan></text>
