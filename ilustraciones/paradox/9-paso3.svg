<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Misma llave en la central y en la cuenta</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Misma llave en la central y en la cuenta</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="130" width="500" height="210" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 144a14 14 0 0 1 14 -14h472a14 14 0 0 1 14 14v26h-500z" fill="#E5F0FB"/><circle cx="68" cy="150" r="5" fill="#C2D4E6"/><circle cx="86" cy="150" r="5" fill="#C2D4E6"/><circle cx="104" cy="150" r="5" fill="#C2D4E6"/><text x="124.0" y="156.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Central (paso 2)</text><text x="68.0" y="200.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">[910] ID de panel</text><text x="528.0" y="200.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">1A2B</text><text x="68.0" y="238.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">[911] Contraseña de PC</text><text x="528.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">3C4D</text>
<rect x="652" y="130" width="500" height="250" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M652 144a14 14 0 0 1 14 -14h472a14 14 0 0 1 14 14v26h-500z" fill="#E5F0FB"/><circle cx="672" cy="150" r="5" fill="#C2D4E6"/><circle cx="690" cy="150" r="5" fill="#C2D4E6"/><circle cx="708" cy="150" r="5" fill="#C2D4E6"/><text x="728.0" y="156.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">BabyWare · cuenta nueva (paso 3)</text><text x="672.0" y="200.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">ID de panel</text><text x="1132.0" y="200.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">1A2B</text><text x="672.0" y="238.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Contraseña de PC</text><text x="1132.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">3C4D</text><text x="672.0" y="276.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Conexión</text><text x="1132.0" y="276.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">directa · COM del 307USB</text>
<path d="M556.0 206.0C600.0 206.0,600.0 206.0,644.0 206.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M556.0 244.0C600.0 244.0,600.0 244.0,644.0 244.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="600.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="700" fill="#0E8F5E" text-anchor="middle">iguales</text>
<circle cx="48" cy="130" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="136.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48.0" y="412.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Valores de ejemplo: usá los tuyos. En la central se cargan en hexadecimal (la tecla 0 vale A).</text>
<rect x="48" y="440" width="352" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="478" r="18" fill="#17A8D4"/><text x="82.0" y="484.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="110.0" y="484.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Conectá y leé todo</text>
<text x="72.0" y="524.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">recepción completa de la programación</tspan></text>
<rect x="424" y="440" width="352" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="458" cy="478" r="18" fill="#17A8D4"/><text x="458.0" y="484.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="486.0" y="484.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Guardá la cuenta</text>
<text x="448.0" y="524.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="448.0" dy="0.0">nombre de la obra y fecha: tu copia</tspan></text>
<rect x="800" y="440" width="352" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="834" cy="478" r="18" fill="#17A8D4"/><text x="834.0" y="484.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="862.0" y="484.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Anotá las llaves</text>
<text x="824.0" y="524.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="824.0" dy="0.0">ID y contraseña en la ficha de la</tspan><tspan x="824.0" dy="21.6">obra</tspan></text>
<text x="48.0" y="610.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Según la guía SP+, BabyWare obliga a cambiar 0000 en la primera conexión; otros manuales siguen citando 0000.</text>
</svg>