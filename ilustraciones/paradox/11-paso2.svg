<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Receptor IP 1: IP de a tres dígitos, perfil y registro</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Receptor IP 1: IP de a tres dígitos, perfil y registro</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="80" y="124" width="470" height="48" rx="10" fill="#03213C"/><text x="96.0" y="155.0" font-family="JetBrains Mono" font-size="20" font-weight="500" fill="#D9E9F8" text-anchor="start">[929]  203 000 113 010</text>
<path d="M560.0 148.0C600.0 148.0,600.0 148.0,640.0 148.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="660.0" y="156.0" font-family="JetBrains Mono" font-size="24" font-weight="700" fill="#04223D" text-anchor="start">203.0.113.10</text>
<text x="80.0" y="200.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Cada número de la IP con tres dígitos: 0 se escribe 000 y 10 se escribe 010.</text>
<rect x="48" y="232" width="620" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="266.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">[930]</text>
<text x="160.0" y="266.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">puerto</text>
<text x="290.0" y="266.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">el que indique la receptora</text>
<rect x="48" y="296" width="620" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="330.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">[933]</text>
<text x="160.0" y="330.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">contraseña</text>
<text x="290.0" y="330.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">solo IPR512; el IPC10 no la usa</text>
<rect x="48" y="360" width="620" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="394.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">[934]</text>
<text x="160.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">perfil</text>
<text x="290.0" y="394.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">supervisión, ej. 02</text>
<rect x="48" y="424" width="620" height="54" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="458.0" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#0A63B8" text-anchor="start">[935]</text>
<text x="160.0" y="458.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">ARM</text>
<text x="290.0" y="458.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">registra el módulo y muestra el estado</text>
<rect x="712" y="232" width="440" height="230" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M712 244a12 12 0 0 1 12 -12h416a12 12 0 0 1 12 12v34h-440z" fill="#E5F0FB"/><text x="726.0" y="260.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PERFIL IPC10</text><text x="946.0" y="260.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">SUPERVISIÓN</text><text x="726.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">01</text><text x="946.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">1200 s</text><rect x="716" y="327" width="432" height="40" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="726.0" y="352.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">02</text><text x="946.0" y="352.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">600 s</text><path d="M724 370H1140" stroke="#DDE8F2" stroke-width="1"/><text x="726.0" y="398.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">03</text><text x="946.0" y="398.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">300 s</text><path d="M724 416H1140" stroke="#DDE8F2" stroke-width="1"/><text x="726.0" y="444.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">04</text><text x="946.0" y="444.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">90 s</text>
<rect x="48" y="506" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="518" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Menos segundos = la receptora se entera antes si el módulo se cae, con más tráfico. En el IPR512 los perfiles los define la</tspan><tspan x="74.0" dy="21.6">receptora; en el IPC10 son fijos.</tspan></text>
</svg>