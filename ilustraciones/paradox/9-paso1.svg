<circle cx="48" cy="200" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="206.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="480" width="540" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="492" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Local y directo</tspan></text><text x="74.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El cable al conector serie: así entrás aunque la central no</tspan><tspan x="74.0" dy="21.6">tenga módulo IP ni internet, y es la forma más simple de</tspan><tspan x="74.0" dy="21.6">sacar la copia.</tspan></text>
<rect x="612" y="480" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="492" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="514.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Al terminar, desconectá</tspan></text><text x="638.0" y="541.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">No dejes la notebook conectada con la central en servicio y</tspan><tspan x="638.0" dy="21.6">el gabinete abierto: tamper de la caja y sesión abierta son</tspan><tspan x="638.0" dy="21.6">dos alertas para monitoreo.</tspan></text>
