<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Sumá un módulo y mirá qué falla aparece</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Sumá un módulo y mirá qué falla aparece</text>
<rect x="48" y="128" width="258" height="112" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="166" r="18" fill="#17A8D4"/><text x="82.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Desenergizá</text>
<text x="72.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">red y batería afuera</text>
<path d="M310.0 184.0C319.0 184.0,319.0 184.0,328.0 184.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="128" width="258" height="112" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="364" cy="166" r="18" fill="#17A8D4"/><text x="364.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Sumá el ZX8</text>
<text x="354.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">al bus, borne a borne</text>
<path d="M592.0 184.0C601.0 184.0,601.0 184.0,610.0 184.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="128" width="258" height="112" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="646" cy="166" r="18" fill="#17A8D4"/><text x="646.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="674.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Energizá</text>
<text x="636.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">red y batería</text>
<path d="M874.0 184.0C883.0 184.0,883.0 184.0,892.0 184.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="128" width="258" height="112" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="928" cy="166" r="18" fill="#17A8D4"/><text x="928.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="956.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">TBL</text>
<text x="918.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">¿hay una falla nueva?</text>
<circle cx="48" cy="128" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="134.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="272" width="540" height="230" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="304.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Lo esperable en una central nueva</text>
<rect x="92.6" y="320.0" width="34.8" height="32" rx="16.0" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="110.0" y="344.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="middle">8</text>
<text x="150.0" y="344.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">pérdida de reloj</text>
<rect x="92.6" y="376.0" width="34.8" height="32" rx="16.0" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="110.0" y="400.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="middle">3</text>
<text x="150.0" y="400.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">campana, si no hay sirena</text>
<text x="72.0" y="460.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Se resuelven con fecha y hora, y con sirena o 1 kΩ en BELL.</text>
<rect x="612" y="272" width="540" height="230" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="304.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Cualquier otra falla nueva</text>
<text x="636.0" y="336.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="636.0" dy="0.0">Es del ZX8 o de su cableado: lo que acabás de sumar.</tspan><tspan x="636.0" dy="24.3">Revisá esos cuatro hilos antes de seguir con el</tspan><tspan x="636.0" dy="24.3">próximo grupo.</tspan></text>
<rect x="48" y="528" width="1104" height="54" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="540" width="5" height="30" rx="2.5" fill="#D2492F"/><text x="74.0" y="562.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En obra con el sistema en servicio, avisá a monitoreo antes de desenergizar: la central puede reportar falla de AC o tamper.</tspan></text>
</svg>