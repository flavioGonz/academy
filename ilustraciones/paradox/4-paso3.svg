<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Cuántas horas aguanta sin red?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Cuántas horas aguanta sin red?</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="80" y="140" width="1072" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="110.0" y="214.0" font-family="JetBrains Mono" font-size="24" font-weight="600" fill="#04223D" text-anchor="start">horas  =  Ah de la batería  ÷  ( central + suma AUX, en amperes )</text>
<rect x="48" y="300" width="540" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Ejemplo EVOHD+</text>
<text x="72.0" y="384.0" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#41627F" text-anchor="start">7 Ah ÷ (0,100 + 0,130 A)</text>
<text x="72.0" y="444.0" font-family="Familjen Grotesk" font-size="32" font-weight="700" fill="#0E8F5E" text-anchor="start">≈ 30 h</text>
<rect x="612" y="300" width="540" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Tabla del manual EVOHD+</text>
<text x="636.0" y="384.0" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#41627F" text-anchor="start">17 Ah ÷ (0,100 + 0,470 A)</text>
<text x="636.0" y="444.0" font-family="Familjen Grotesk" font-size="32" font-weight="700" fill="#0E8F5E" text-anchor="start">≈ 30 h</text>
<rect x="48" y="500" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Margen</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Es una cuenta aproximada: la batería pierde capacidad con los años y el consumo sube cuando suena todo. Si la cuenta da corta,</tspan><tspan x="74.0" dy="21.6">batería más grande o menos carga en el AUX.</tspan></text>
</svg>