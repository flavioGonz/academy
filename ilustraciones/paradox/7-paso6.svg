<text x="588.0" y="297.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0A63B8" text-anchor="middle">2</text>
<rect x="624" y="250" width="52" height="70" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="650.0" y="297.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0A63B8" text-anchor="middle">3</text>
<rect x="686" y="250" width="52" height="70" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
