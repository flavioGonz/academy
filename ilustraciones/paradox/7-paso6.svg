<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El largo del código se decide antes de cargar usuarios</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="80.0" y="148.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">[701] opción 1: códigos de 4 o de 6 dígitos</text>
<text x="80.0" y="232.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#6E88A1" text-anchor="start">Antes · 4 dígitos</text>
