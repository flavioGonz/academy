<rect x="748" y="250" width="52" height="70" rx="10" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="774.0" y="297.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#B45309" text-anchor="middle">1</text>
<rect x="810" y="250" width="52" height="70" rx="10" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="836.0" y="297.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#B45309" text-anchor="middle">2</text>
<text x="752.0" y="352.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">la central repite los dos primeros</text>
<rect x="48" y="400" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="412" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El llamado del lunes</tspan></text><text x="74.0" y="460.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El usuario sigue tecleando 1234 y no anda: su código ahora</tspan><tspan x="74.0" dy="21.6">es 123412. Si el cambio es inevitable, avisale a cada</tspan><tspan x="74.0" dy="21.6">usuario su código nuevo.</tspan></text>
<rect x="612" y="400" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="412" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="638.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">En obra</tspan></text><text x="638.0" y="460.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con la central en servicio, cambiar el largo o el</tspan><tspan x="638.0" dy="21.6">particionado afecta a todos: coordinalo con el cliente y</tspan><tspan x="638.0" dy="21.6">con monitoreo.</tspan></text>
</svg>