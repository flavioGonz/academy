<text x="230.0" y="297.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0A63B8" text-anchor="middle">3</text>
<rect x="266" y="250" width="52" height="70" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="292.0" y="297.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0A63B8" text-anchor="middle">4</text>
<path d="M350.0 285.0C410.0 285.0,410.0 285.0,470.0 285.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="380.0" y="272.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">pasás a 6</text>
<text x="500.0" y="232.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#6E88A1" text-anchor="start">Después · 6 dígitos</text>
