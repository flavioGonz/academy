<rect x="612" y="420" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="432" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Reloj</tspan></text><text x="638.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Pérdida de reloj (grupo 8): cargá fecha y hora desde el</tspan><tspan x="638.0" dy="21.6">menú rápido o desde BabyWare (paso 1).</tspan></text>
