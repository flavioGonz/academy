<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La PGM manda, el relé carga</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La PGM manda, el relé carga</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="150" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 189.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></g><text x="112.0" y="201.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Evento</text><text x="112.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">grupo, subgrupo, part.</text>
<rect x="420" y="150" width="220" height="110" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(440 189.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="484.0" y="201.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">PGM de la placa</text><text x="484.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">100 a 150 mA</text>
<rect x="706" y="150" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="722.0" y="180.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Relé externo</text><text x="722.0" y="200.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#6E88A1" text-anchor="start">bobina 12 V</text><circle cx="746" cy="230" r="9" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="746.0" y="254.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#41627F" text-anchor="middle">COM</text><circle cx="806" cy="230" r="9" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="806.0" y="254.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#41627F" text-anchor="middle">NO</text><circle cx="866" cy="230" r="9" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="866.0" y="254.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#41627F" text-anchor="middle">NC</text>
<rect x="950" y="160" width="202" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(970 186.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/><circle cx="15" cy="12" r="1"/></g><text x="1014.0" y="198.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Carga</text><text x="1014.0" y="221.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">portón o luz</text>
<path d="M348.0 205.0C384.0 205.0,384.0 205.0,420.0 205.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="347.2" y="174.0" width="73.6" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="384.0" y="193.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">activa</text>
<path d="M640.0 205.0C673.0 205.0,673.0 205.0,706.0 205.0" fill="none" stroke="#17A8D4" stroke-width="4" stroke-linecap="round"/><circle cx="640.0" cy="205.0" r="5" fill="#17A8D4"/><circle cx="706.0" cy="205.0" r="5" fill="#17A8D4"/><rect x="636.2" y="174.0" width="73.6" height="28" rx="14" fill="#FFFFFF" stroke="#17A8D4" stroke-width="1.5"/><text x="673.0" y="193.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#17A8D4" text-anchor="middle">bobina</text>
<path d="M906.0 205.0C928.0 205.0,928.0 202.0,950.0 202.0" fill="none" stroke="#17A8D4" stroke-width="4" stroke-linecap="round"/><circle cx="906.0" cy="205.0" r="5" fill="#17A8D4"/><circle cx="950.0" cy="202.0" r="5" fill="#17A8D4"/>
<rect x="48" y="300" width="540" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Se apaga de dos formas</text>
<circle cx="77" cy="358.7" r="4.5" fill="#17A8D4"/><text x="92.0" y="364.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Evento de desactivación: por ejemplo, la falla de AC que</tspan><tspan x="92.0" dy="21.6">se restaura.</tspan></text><circle cx="77" cy="411.9" r="4.5" fill="#17A8D4"/><text x="92.0" y="417.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Tiempo: [281] a [296], 5 s de fábrica. Un pulso para el</tspan><tspan x="92.0" dy="21.6">portón.</tspan></text>
<rect x="612" y="300" width="540" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">De fábrica</text>
<circle cx="641" cy="358.7" r="4.5" fill="#17A8D4"/><text x="656.0" y="364.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">PGM1: botón B de cualquier control (08/99/99).</tspan></text><circle cx="641" cy="390.3" r="4.5" fill="#17A8D4"/><text x="656.0" y="395.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">PGM2: botón C.</tspan></text><circle cx="641" cy="421.9" r="4.5" fill="#17A8D4"/><text x="656.0" y="427.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Partición 01, 02 o 99 para ambas.</tspan></text>
<rect x="48" y="514" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="526" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="548.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Baja corriente</tspan></text><text x="74.0" y="575.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La PGM solo mueve la bobina de un relé. Un portón, una luz o una sirena extra van por el contacto del relé, nunca directo a la</tspan><tspan x="74.0" dy="21.6">placa.</tspan></text>
</svg>