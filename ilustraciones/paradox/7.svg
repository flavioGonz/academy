<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Dos particiones: la casa y el taller, cada una con lo suyo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="140" width="520" height="236" rx="22" fill="none" stroke="#0A63B8" stroke-width="2" stroke-dasharray="7 7"/><rect x="66" y="126" width="182" height="28" rx="14" fill="#F7FAFD"/><text x="78.0" y="146.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start">PARTICIÓN 1 · CASA</text>
<rect x="632" y="140" width="520" height="236" rx="22" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-dasharray="7 7"/><rect x="650" y="126" width="200" height="28" rx="14" fill="#F7FAFD"/><text x="662.0" y="146.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="start">PARTICIÓN 2 · TALLER</text>
<rect x="72" y="176" width="100" height="36" rx="10" fill="#03213C"/><text x="88.0" y="199.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">01 1</text>
<text x="188.0" y="200.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">zona 1 · puerta principal</text>
<rect x="72" y="226" width="100" height="36" rx="10" fill="#03213C"/><text x="88.0" y="249.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">05 1</text>
<text x="188.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">zona 2 · PIR del living</text>
<rect x="72" y="276" width="100" height="36" rx="10" fill="#03213C"/><text x="88.0" y="299.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">08 1</text>
<text x="188.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">zona 3 · ventanas</text>
<rect x="72" y="326" width="100" height="36" rx="10" fill="#03213C"/><text x="88.0" y="349.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">16 1</text>
<text x="188.0" y="350.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">zona 4 · medidores</text>
<rect x="656" y="176" width="100" height="36" rx="10" fill="#03213C"/><text x="672.0" y="199.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">01 2</text>
<text x="772.0" y="200.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">zona 5 · puerta del taller</text>
<rect x="656" y="226" width="100" height="36" rx="10" fill="#03213C"/><text x="672.0" y="249.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">08 2</text>
<text x="772.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">zona 6 · ventana del taller</text>
<text x="656.0" y="312.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">El tercer dígito de cada zona dice</text>
<text x="656.0" y="336.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">la partición: 1, 2, o 3 para ambas.</text>
<rect x="430" y="404" width="340" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(450 430.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text x="494.0" y="442.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Maestro del sistema</text><text x="494.0" y="465.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">particiones 1 y 2</text>
<rect x="812" y="520" width="340" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(832 546.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g><text x="876.0" y="558.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Usuario 005 · taller</text><text x="876.0" y="581.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">solo partición 2</text>
<path d="M470.0 404.0C400.0 404.0,400.0 378.0,330.0 378.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M730.0 404.0C800.0 404.0,800.0 378.0,870.0 378.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M1010.0 520.0C1010.0 441.9,1010.0 456.1,1010.0 378.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="48" y="520" width="720" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="532" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El particionado se prende una vez</tspan></text><text x="74.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">[700] opción 1. Si después se apaga, todo pasa a partición 1 y las zonas</tspan><tspan x="74.0" dy="21.6">asignadas a la 2 dejan de funcionar.</tspan></text>
</svg>