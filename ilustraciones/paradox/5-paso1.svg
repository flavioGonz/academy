<text x="980.0" y="398.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">sale</text>
<rect x="48" y="456" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="468" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="490.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Sigue a la próxima</tspan></text><text x="74.0" y="517.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si seguís con ENTER, la central pasa a la sección</tspan><tspan x="74.0" dy="21.6">siguiente: así se recorre la programación sin tocarla.</tspan></text>
<rect x="612" y="456" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="468" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="490.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">El orden importa</tspan></text><text x="638.0" y="517.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si tecleás un número antes del primer ENTER, estás</tspan><tspan x="638.0" dy="21.6">escribiendo el dato. Primero ENTER, después mirás.</tspan></text>
