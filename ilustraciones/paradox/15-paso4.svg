<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Bloqueo de instalador: el reseteo ya no borra</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Bloqueo de instalador: el reseteo ya no borra</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="48" y="124" width="540" height="260" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Sin bloqueo · [395] = 000</text>
<text x="72.0" y="196.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#6E88A1" text-anchor="start">Reseteo por botón</text>
<text x="72.0" y="240.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Vuelve todo a fábrica</text><text x="72.0" y="272.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">salvo ID de panel y contraseña de PC.</text><text x="72.0" y="304.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">El buffer de eventos no se borra.</text>
<rect x="612" y="124" width="540" height="260" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Con bloqueo · [395] = 147</text>
<text x="636.0" y="196.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#6E88A1" text-anchor="start">Reseteo por botón</text>
<text x="636.0" y="240.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">No borra la programación.</text><text x="636.0" y="272.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Al energizar, LED de estado</text><text x="636.0" y="304.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">rápido durante 6 s.</text>
<rect x="48" y="410" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="422" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="444.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Una decisión comercial</tspan></text><text x="74.0" y="470.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Se usa solo si está en el contrato con el cliente: protege</tspan><tspan x="74.0" dy="21.6">la cartera del instalador, pero ata al cliente a quien</tspan><tspan x="74.0" dy="21.6">tiene el código.</tspan></text>
<rect x="612" y="410" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="422" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="638.0" y="444.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Si te toca una ajena</tspan></text><text x="638.0" y="470.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Central bloqueada sin códigos: el camino es el cliente y el</tspan><tspan x="638.0" dy="21.6">instalador anterior. Si no hay forma y el bloqueo está</tspan><tspan x="638.0" dy="21.6">apagado, reseteo con autorización escrita.</tspan></text>
</svg>