<text x="48.0" y="530.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">05 = número de zona, dos dígitos. ENTER guarda y sale.</text>
<rect x="800" y="128" width="352" height="145" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="800" y="140" width="5" height="121" rx="2.5" fill="#B45309"/><text x="826.0" y="162.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">El mismo número se pisa</tspan></text><text x="826.0" y="188.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">Si después aprendés un inalámbrico en</tspan><tspan x="826.0" dy="21.6">la zona 05, pisa a la de teclado. Y</tspan><tspan x="826.0" dy="21.6">una de teclado pisa a una cableada</tspan><tspan x="826.0" dy="21.6">con el mismo número.</tspan></text>
<rect x="48" y="560" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="572" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En EVO la zona de teclado admite un solo detector, aun con ATZ, no reconoce tamper y sigue la definición de EOL de la central.</tspan></text>
