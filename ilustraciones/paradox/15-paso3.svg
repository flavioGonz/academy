<text x="812.0" y="270.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#FFD28A" text-anchor="start">10 minutos</text>
<text x="812.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">y la central lo reporta</text>
<rect x="48" y="360" width="540" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="372" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Para qué sirve</tspan></text><text x="74.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Frena al que prueba códigos de memoria o de manual en el</tspan><tspan x="74.0" dy="21.6">teclado, y el reporte avisa a monitoreo que alguien lo</tspan><tspan x="74.0" dy="21.6">intentó.</tspan></text>
<rect x="612" y="360" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="372" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="638.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Valores</tspan></text><text x="638.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">000 lo deja apagado (fábrica). Valores de ejemplo:</tspan><tspan x="638.0" dy="21.6">acordalos con el cliente, que también puede quedar afuera</tspan><tspan x="638.0" dy="21.6">por equivocarse.</tspan></text>
