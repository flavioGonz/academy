<text x="836.0" y="238.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">la falla de campana desaparece</text>
<path d="M764.0 215.0C786.0 215.0,786.0 215.0,808.0 215.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="48" y="380" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="392" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cuando hay sirena</tspan></text><text x="74.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con sirena: + al BELL+ y − al BELL−. La salida da 12 V en</tspan><tspan x="74.0" dy="21.6">alarma: una sirena de 30 W o dos de 20 W, y corta si pasa</tspan><tspan x="74.0" dy="21.6">de 3 A.</tspan></text>
<rect x="612" y="380" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="392" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Después, medí la batería</tspan></text><text x="638.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con la central en batería, medí con el tester: menos de</tspan><tspan x="638.0" dy="21.6">10,5 V es falla y a 8,5 V se apaga (paso 5). Y antes de</tspan><tspan x="638.0" dy="21.6">cerrar, polaridad de la batería.</tspan></text>
