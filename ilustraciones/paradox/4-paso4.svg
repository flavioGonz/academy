<rect x="432.5" y="215.0" width="75.0" height="31" rx="15.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="470.0" y="238.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#B45309" text-anchor="middle">TBL 3</text>
