<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El abonado va en cada partición y en cada canal</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">PARADOX · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El abonado va en cada partición y en cada canal</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="48" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="80" y="124" width="520" height="42" rx="10" fill="#03213C"/><text x="96.0" y="150.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">[810] 44   Contact ID en los dos teléfonos</text>
<text x="380.0" y="222.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="middle">Teléfono</text>
<text x="760.0" y="222.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="middle">IP</text>
<text x="60.0" y="300.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Partición 1</text>
<rect x="230" y="244" width="300" height="90" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="250.0" y="298.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">[811]</text>
<text x="510.0" y="298.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#04223D" text-anchor="end">1A01</text>
<rect x="610" y="244" width="300" height="90" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="630.0" y="298.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">[918]</text>
<text x="890.0" y="298.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#04223D" text-anchor="end">1A01</text>
<text x="60.0" y="410.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Partición 2</text>
<rect x="230" y="354" width="300" height="90" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="250.0" y="408.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">[812]</text>
<text x="510.0" y="408.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#04223D" text-anchor="end">1A01</text>
<rect x="610" y="354" width="300" height="90" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="630.0" y="408.0" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#0A63B8" text-anchor="start">[919]</text>
<text x="890.0" y="408.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#04223D" text-anchor="end">1A01</text>
<rect x="48" y="486" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="498" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="520.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Las cuatro, siempre</tspan></text><text x="74.0" y="547.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">[812] y [919] se cargan aunque la central no esté</tspan><tspan x="74.0" dy="21.6">particionada. Sin abonado, la central no tiene con qué</tspan><tspan x="74.0" dy="21.6">firmar los eventos de ese canal.</tspan></text>
<rect x="612" y="486" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="498" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="638.0" y="520.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Abonado real</tspan></text><text x="638.0" y="547.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">1A01 es de ejemplo. Un abonado de otra obra hace que el</tspan><tspan x="638.0" dy="21.6">evento llegue al cliente equivocado.</tspan></text>
</svg>