<text x="554.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">No actualizar sin plan.</text><text x="554.0" y="218.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Si hace falta, presupuestá el desbloqueo oficial (5 USD):</text><text x="554.0" y="246.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">BlueEye › menú instalador › ⋮ › Unlock Panel.</text>
<rect x="80" y="300" width="340" height="110" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="100.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Sin integración serie</text>
<text x="104.0" y="380.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">Actualizar, avisando al cliente.</text>
<rect x="530" y="318" width="622" height="92" rx="12" fill="#03213C"/><text x="546.0" y="340.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SE CARGA CON TM50, TM70, K641+ O K32LCD+ (ADMITEN LETRAS)</text><text x="546.0" y="367.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">MG/SP+: [ENTER] + código de instalador + [300] + código</text><text x="546.0" y="393.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">EVO:    mantener [0] + código + [3000] + código</text>
<rect x="48" y="446" width="540" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="478.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Obra nueva sin cableado</text>
<text x="72.0" y="512.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Evaluar M25 en banco: PoE, inalámbrico,</text>
<text x="72.0" y="538.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Swan 4G por suscripción, receptora compatible.</text>
<rect x="612" y="446" width="540" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="478.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Obra con cableado y bus</text>
<text x="636.0" y="512.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">SP+ o EVO siguen siendo la opción natural.</text>
<text x="636.0" y="538.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Anotá la decisión y quién la aprobó (paso 3).</text>
