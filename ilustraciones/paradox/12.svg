<rect x="485.5" y="231.0" width="159.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="565.0" y="252.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">con suscripción</text>
<rect x="467.5" y="489.0" width="195.0" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="565.0" y="510.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">solo módulos legado</text>
<rect x="860" y="130" width="292" height="113" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="860" y="142" width="5" height="89" rx="2.5" fill="#0A63B8"/><text x="886.0" y="164.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="886.0" dy="0.0">El módulo sale a internet y se</tspan><tspan x="886.0" dy="20.2">conecta a Swan; el sitio tiene</tspan><tspan x="886.0" dy="20.2">días de suscripción y fecha de</tspan><tspan x="886.0" dy="20.2">renovación.</tspan></text>
<rect x="860" y="400" width="292" height="113" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="860" y="412" width="5" height="89" rx="2.5" fill="#B45309"/><text x="886.0" y="434.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="886.0" dy="0.0">Sin Swan, directo al módulo.</tspan><tspan x="886.0" dy="20.2">Con IP150 1.xx o 4.0.4 pide la</tspan><tspan x="886.0" dy="20.2">clave de fábrica: no lo</tspan><tspan x="886.0" dy="20.2">expongas así.</tspan></text>
<rect x="48" y="572" width="1104" height="52" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="72.0" y="605.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">El monitoreo va por su propio canal a la receptora: no depende de la app ni de la suscripción.</text>
</svg>