<rect x="48" y="470" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La lista es dinámica</tspan></text><text x="74.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Se llena cuando un equipo pregunta por el nombre, no con</tspan><tspan x="74.0" dy="21.6">:resolve del router, y cada IP se borra al vencer el TTL.</tspan></text>
<rect x="612" y="470" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="482" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="504.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Usalo para casos puntuales</tspan></text><text x="638.0" y="531.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con CDN varias marcas comparten IP: el bloqueo puede cortar</tspan><tspan x="638.0" dy="21.6">servicios que nadie quería cortar.</tspan></text>
