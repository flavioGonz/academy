<text x="978.0" y="346.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#D2492F" text-anchor="start">WinBox al router</text>
<rect x="48" y="400" width="520" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="412" width="5" height="75" rx="2.5" fill="#B45309"/><text x="74.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo mismo con cualquier interfaz</tspan></text><text x="74.0" y="460.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La WAN pasa a PPPoE: pppoe-out1 va a la lista WAN, o las</tspan><tspan x="74.0" dy="20.2">reglas de WAN no la ven.</tspan></text>
<rect x="632" y="400" width="520" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="632" y="412" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="658.0" y="434.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="658.0" dy="0.0">Interfaces dinámicas</tspan></text><text x="658.0" y="460.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="658.0" dy="0.0">Los túneles L2TP o SSTP del servidor son dinámicos: entran a</tspan><tspan x="658.0" dy="20.2">VPN desde el perfil, /ppp/profile interface-list=VPN.</tspan></text>
