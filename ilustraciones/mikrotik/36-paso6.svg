<rect x="48" y="140" width="560" height="230" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="66.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL · TRES LÍNEAS, CERO REGLAS NUEVAS</text><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/interface/vlan/add name=vlan10-admin \</text><text x="66.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">    interface=bridge vlan-id=10</text><text x="66.0" y="256.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/address/add address=10.10.10.1/24 \</text><text x="66.0" y="286.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">    interface=vlan10-admin</text><text x="66.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6EE7B7" text-anchor="start">/interface/list/member/add list=ADMIN \</text><text x="66.0" y="346.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6EE7B7" text-anchor="start">    interface=vlan10-admin</text>
