<text x="48.0" y="478.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#D2492F" text-anchor="start"><tspan x="48.0" dy="0.0">No ve el router en Neighbors ni</tspan><tspan x="48.0" dy="21.6">puede entrar por MAC.</tspan></text>
<rect x="860" y="360" width="292" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(880 386.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="924.0" y="398.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook en la LAN</text><text x="924.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">WinBox · Neighbors</text>
