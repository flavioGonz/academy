<text x="400.0" y="330.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">ADEMÁS, APAGADOS</text>
<rect x="400.0" y="345" width="173.2" height="30" rx="15" fill="#E5F0FB"/><text x="486.6" y="366.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">bandwidth-server</text><rect x="581.2" y="345" width="72.0" height="30" rx="15" fill="#E5F0FB"/><text x="617.2" y="366.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">socks</text>
<rect x="400.0" y="385" width="72.0" height="30" rx="15" fill="#E5F0FB"/><text x="436.0" y="406.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">proxy</text><rect x="480.0" y="385" width="62.8" height="30" rx="15" fill="#E5F0FB"/><text x="511.4" y="406.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">upnp</text>
<rect x="48" y="540" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="552" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La lista LAN viene en la configuración por defecto. Si el equipo no la tiene (un CCR, un CHR), creala antes y poné ahí el</tspan><tspan x="74.0" dy="21.6">bridge: si no, te quedás sin MAC-WinBox también en la LAN.</tspan></text>
