<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres formas de bloquear por DNS</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 32</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres formas de bloquear por DNS</text>
<rect x="48" y="140" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="178.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Adlist (7.15+)</text>
<text x="68.0" y="204.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">/ip/dns/adlist</text>
<text x="68.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Lista de dominios: el router contesta</tspan><tspan x="68.0" dy="21.6">0.0.0.0. Solo el nombre exacto.</tspan></text>
<rect x="64" y="340" width="318" height="42" rx="10" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="0"/>
<text x="78.0" y="367.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">example.net</text>
<text x="368.0" y="367.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="end">0.0.0.0</text>
<rect x="64" y="394" width="318" height="42" rx="10" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="0"/>
<text x="78.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">www.example.net</text>
<text x="368.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="end">pasa</text>
<rect x="425" y="140" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="445.0" y="178.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">NXDOMAIN</text>
<text x="445.0" y="204.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">match-subdomain=yes</text>
<text x="445.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="445.0" dy="0.0">Un sitio entero: el nombre y todo lo</tspan><tspan x="445.0" dy="21.6">de abajo no existen.</tspan></text>
<rect x="441" y="340" width="318" height="42" rx="10" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="0"/>
<text x="455.0" y="367.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">example.com</text>
<text x="745.0" y="367.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="end">no existe</text>
<rect x="441" y="394" width="318" height="42" rx="10" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="0"/>
<text x="455.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">www.example.com</text>
<text x="745.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="end">no existe</text>
<rect x="802" y="140" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="822.0" y="178.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">FWD + address-list</text>
<text x="822.0" y="204.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">firewall forward</text>
<text x="822.0" y="236.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="822.0" dy="0.0">El router anota lo que contestó y el</tspan><tspan x="822.0" dy="21.6">firewall corta esas IP.</tspan></text>
<rect x="818" y="340" width="318" height="42" rx="10" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="0"/>
<text x="832.0" y="367.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">example.org</text>
<text x="1122.0" y="367.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="end">IP a la lista</text>
<rect x="818" y="394" width="318" height="42" rx="10" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="0"/>
<text x="832.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">conexión</text>
<text x="1122.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="end">reject</text>
<rect x="48" y="500" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El límite de las tres</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Vale para los equipos que usan el DNS del router: sumale el DNS transparente. DoH y VPN pasan igual: esto filtra, no es un</tspan><tspan x="74.0" dy="21.6">candado.</tspan></text>
</svg>