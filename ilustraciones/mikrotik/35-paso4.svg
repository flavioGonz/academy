<rect x="48" y="440" width="1104" height="108" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="72.0" y="476.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Desde RouterOS 7.13, sin output=none no llega</text>
<text x="72.0" y="506.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start"><tspan x="72.0" dy="0.0">fetch intenta guardar la respuesta en un archivo y Netwatch no tiene ese permiso (solo read, write, test, reboot). Desde la</tspan><tspan x="72.0" dy="21.6">terminal anda: por eso engaña.</tspan></text>
<rect x="48" y="568" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="580" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="602.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Después de cada actualización, probá el aviso desenchufando: es la única forma de saber que sigue llegando.</tspan></text>
