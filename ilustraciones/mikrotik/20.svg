<rect x="640" y="380" width="512" height="140" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="640" y="392" width="5" height="116" rx="2.5" fill="#0E8F5E"/><text x="666.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">Por qué funciona</tspan></text><text x="666.0" y="440.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">El túnel lo abre el sitio hacia afuera: el CGNAT del</tspan><tspan x="666.0" dy="20.2">cliente deja de importar. Desde la notebook, WinBox a</tspan><tspan x="666.0" dy="20.2">10.10.10.2 a través del hub. Sirve también para MikroTik</tspan><tspan x="666.0" dy="20.2">MIPS sin Back To Home.</tspan></text>
<rect x="640" y="560" width="512" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="572" width="5" height="48" rx="2.5" fill="#B45309"/><text x="666.0" y="594.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Licencia Free: 1 Mbps de subida por interfaz. Alcanza para</tspan><tspan x="666.0" dy="20.2">WinBox y monitoreo, no para video.</tspan></text>
