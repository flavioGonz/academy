<text x="68.0" y="410.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="68.0" dy="0.0">¿Necesitás una función que</tspan><tspan x="68.0" dy="25.7">solo trae stable?</tspan></text>
<rect x="560" y="150" width="300" height="96" rx="16" fill="#FFFFFF" stroke="#D2492F" stroke-width="3"/><text x="580.0" y="194.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">testing o development</text><text x="580.0" y="217.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">solo en el banco</text>
