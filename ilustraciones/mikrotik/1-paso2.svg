<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Leé qué trae de fábrica antes de tocar nada</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Leé qué trae de fábrica antes de tocar nada</text>
<rect x="48" y="132" width="352" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="0"/>
<text x="64.0" y="161.0" font-family="JetBrains Mono" font-size="14.5" font-weight="500" fill="#7DD3FC" text-anchor="start">/interface/list/member/print</text>
<path d="M224.0 182.0C224.0 198.5,224.0 195.5,224.0 212.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="216" width="352" height="216" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="66.0" y="248.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Listas de interfaces</text>
<text x="66.0" y="284.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">WAN  →  ether1</text>
<text x="66.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">LAN  →  bridge</text>
<text x="66.0" y="390.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="66.0" dy="0.0">Las reglas apuntan a las listas, no a</tspan><tspan x="66.0" dy="20.2">los puertos.</tspan></text>
<rect x="424" y="132" width="352" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="0"/>
<text x="440.0" y="161.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7DD3FC" text-anchor="start">/ip/firewall/filter/print</text>
<path d="M600.0 182.0C600.0 198.5,600.0 195.5,600.0 212.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="216" width="352" height="216" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="442.0" y="248.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Firewall de fábrica</text>
<text x="442.0" y="284.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">defconf: drop all not</text>
<text x="442.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">  coming from LAN</text>
<text x="442.0" y="332.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">defconf: drop all from</text>
<text x="442.0" y="356.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">  WAN not DSTNATed</text>
<text x="442.0" y="392.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="442.0" dy="0.0">Protegen al router y a la LAN de lo que</tspan><tspan x="442.0" dy="20.2">llega por WAN.</tspan></text>
<rect x="800" y="132" width="352" height="46" rx="10" fill="#03213C" stroke="#03213C" stroke-width="0"/>
<text x="816.0" y="161.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7DD3FC" text-anchor="start">/ip/address/print</text>
<path d="M976.0 182.0C976.0 198.5,976.0 195.5,976.0 212.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="216" width="352" height="216" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="818.0" y="248.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Direcciones IP</text>
<text x="818.0" y="284.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">192.168.88.1/24</text>
<text x="818.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">  en bridge</text>
<text x="818.0" y="390.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="818.0" dy="0.0">La IP de gestión vive en el bridge, no</tspan><tspan x="818.0" dy="20.2">en un puerto.</tspan></text>
<rect x="250" y="456" width="392" height="130" rx="18" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="270.0" y="490.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Así queda el equipo</text><text x="622.0" y="490.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="end">config de fábrica</text><rect x="270" y="522" width="64" height="46" rx="8" fill="#B45309" stroke="#B45309" stroke-width="2"/><text x="302.0" y="551.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether1</text><rect x="342" y="522" width="64" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="2"/><text x="374.0" y="551.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether2</text><rect x="414" y="522" width="64" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="2"/><text x="446.0" y="551.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether3</text><rect x="486" y="522" width="64" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="2"/><text x="518.0" y="551.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether4</text><rect x="558" y="522" width="64" height="46" rx="8" fill="#0A63B8" stroke="#0A63B8" stroke-width="2"/><text x="590.0" y="551.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether5</text>
<rect x="275.2" y="611" width="53.6" height="30" rx="15" fill="#FFF4DE"/><text x="302.0" y="632.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">WAN</text>
<path d="M344.0 596v8H620.0v-8" fill="none" stroke="#6E88A1" stroke-width="2"/>
<rect x="344.8" y="611" width="274.4" height="30" rx="15" fill="#E5F0FB"/><text x="482.0" y="632.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">LAN · bridge · 192.168.88.1</text>
<rect x="820" y="456" width="332" height="93" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="820" y="468" width="5" height="69" rx="2.5" fill="#B45309"/><text x="846.0" y="490.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="846.0" dy="0.0">Los CCR pueden venir sin nada de</tspan><tspan x="846.0" dy="20.2">esto: ahí bridge, IP y DHCP se arman</tspan><tspan x="846.0" dy="20.2">a mano.</tspan></text>
</svg>