<path d="M600.0 406.0C600.0 464.3,700.0 453.7,700.0 512.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="658.4" y="457.7" width="39.2" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="678.0" y="476.7" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">no</text>
<path d="M890.0 186.0C911.0 186.0,911.0 186.0,932.0 186.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M1042.0 232.0C1042.0 267.2,1042.0 260.8,1042.0 296.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M1042.0 380.0C1042.0 417.4,1042.0 410.6,1042.0 448.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M890.0 516.0C911.0 516.0,911.0 516.0,932.0 516.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="128" width="560" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="140" width="5" height="48" rx="2.5" fill="#B45309"/><text x="74.0" y="162.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El dst-nat cambia el destino antes de la decisión: un port</tspan><tspan x="74.0" dy="20.2">forwarding hacia el NVR cae en forward, nunca en input.</tspan></text>
<rect x="48.0" y="599" width="256.0" height="30" rx="15" fill="#0A63B8"/><text x="176.0" y="620.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">ping 192.168.88.1 → input</text>
<rect x="380.0" y="599" width="228.4" height="30" rx="15" fill="#17A8D4"/><text x="494.2" y="620.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">ping 1.1.1.1 → forward</text>
<rect x="700.0" y="599" width="302.0" height="30" rx="15" fill="#011E38"/><text x="851.0" y="620.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">/ping desde el router → output</text>
</svg>