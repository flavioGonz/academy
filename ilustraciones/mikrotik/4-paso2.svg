<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La regla apunta a la lista, no a cada IP</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La regla apunta a la lista, no a cada IP</text>
<rect x="48" y="150" width="420" height="250" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="72.0" y="188.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">address-list</text>
<text x="72.0" y="218.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">admins</text>
<rect x="68" y="246" width="380" height="50" rx="10" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/>
<text x="86.0" y="277.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">192.168.88.10</text>
<text x="430.0" y="277.0" font-family="Instrument Sans" font-size="14" font-weight="400" fill="#6E88A1" text-anchor="end">notebook lab</text>
<rect x="68" y="308" width="380" height="50" rx="10" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/>
<text x="86.0" y="339.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">203.0.113.25</text>
<text x="430.0" y="339.0" font-family="Instrument Sans" font-size="14" font-weight="400" fill="#6E88A1" text-anchor="end">oficina ejemplo</text>
<path d="M472.0 275.0C516.0 275.0,516.0 275.0,560.0 275.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="568" y="210" width="584" height="130" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="592.0" y="244.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FC3E3" text-anchor="start">chain=input  action=accept</text>
<text x="592.0" y="274.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">protocol=tcp  dst-port=8291</text>
<text x="592.0" y="304.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#17A8D4" text-anchor="start">src-address-list=admins</text>
<text x="592.0" y="330.0" font-family="Instrument Sans" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="start">winbox solo admins</text>
<rect x="48" y="432" width="540" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(66 448) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="106.0" y="470.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Cambió la IP de la oficina?</text><text x="68.0" y="502.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Editás la entrada en la lista. La regla del firewall no se</tspan><tspan x="68.0" dy="21.6">toca y no corrés riesgo de desordenarla.</tspan></text>
<rect x="612" y="432" width="540" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(630 448) scale(1.15)" fill="none" stroke="#0A63B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="670.0" y="470.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Lo mismo con interfaces</text><text x="632.0" y="502.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Las interface lists (WAN, LAN) hacen lo mismo con puertos:</tspan><tspan x="632.0" dy="21.6">si la WAN pasa a PPPoE, la sumás a la lista WAN.</tspan></text>
</svg>