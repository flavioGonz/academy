<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Por qué cadena pasa cada paquete?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 4 · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Por qué cadena pasa cada paquete?</text>
<rect x="48" y="300" width="140" height="84" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="118.0" y="336.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="middle">entra por</text>
<text x="118.0" y="362.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">una interfaz</text>
<rect x="222" y="272" width="230" height="140" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="240.0" y="304.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">prerouting</text><text x="240.0" y="332.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">raw</text><text x="240.0" y="356.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">connection tracking</text><text x="240.0" y="380.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FCD34D" text-anchor="start">dst-nat</text>
<rect x="486" y="278" width="170" height="128" rx="16" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="571.0" y="310.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">decisión</text>
<text x="571.0" y="332.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">de ruteo</text>
<text x="571.0" y="364.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="middle">¿el destino es</text>
<text x="571.0" y="386.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="middle">IP del router?</text>
<rect x="700" y="140" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="3"/><text x="795.0" y="184.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#0A63B8" text-anchor="middle">input</text><text x="795.0" y="208.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">filter: al router</text>
<rect x="700" y="470" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="3"/><text x="795.0" y="514.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#17A8D4" text-anchor="middle">forward</text><text x="795.0" y="538.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">filter: pasa a través</text>
<rect x="932" y="140" width="220" height="92" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="1042.0" y="178.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">el router</text>
<text x="1042.0" y="204.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="middle">WinBox · DNS · ping</text>
<rect x="932" y="296" width="220" height="84" rx="16" fill="#FFFFFF" stroke="#002F58" stroke-width="3"/><text x="1042.0" y="336.0" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#002F58" text-anchor="middle">output</text><text x="1042.0" y="360.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">lo que genera el router</text>
<rect x="932" y="448" width="220" height="118" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="950.0" y="480.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">postrouting</text><text x="950.0" y="508.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FCD34D" text-anchor="start">src-nat</text><text x="950.0" y="532.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">(masquerade)</text><text x="950.0" y="556.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">y sale</text>
