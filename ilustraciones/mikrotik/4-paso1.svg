<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Ubicá las dos reglas que protegen</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Ubicá las dos reglas que protegen</text>
<rect x="48" y="140" width="540" height="340" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="68.0" y="159" width="127.2" height="30" rx="15" fill="#0A63B8"/><text x="131.6" y="180.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">chain=input</text>
<text x="248.0" y="180.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">protege al router</text>
<text x="68.0" y="222.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">defconf:</text>
<rect x="68" y="236" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="84.0" y="260.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">accept established,related,untracked</text><rect x="68" y="282" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="84.0" y="306.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">drop invalid</text><rect x="68" y="328" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="84.0" y="352.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">accept ICMP</text><rect x="68" y="374" width="500" height="38" rx="8" fill="#F7FAFD" stroke="#F7FAFD" stroke-width="1.5"/><text x="84.0" y="398.5" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">…</text><rect x="68" y="420" width="500" height="38" rx="8" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><text x="84.0" y="444.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start">drop all not coming from LAN</text>
<rect x="612" y="140" width="540" height="340" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="632.0" y="159" width="145.6" height="30" rx="15" fill="#17A8D4"/><text x="704.8" y="180.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">chain=forward</text>
<text x="812.0" y="180.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">protege a la LAN</text>
<text x="632.0" y="222.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">defconf:</text>
<rect x="632" y="236" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="648.0" y="260.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">fasttrack</text><rect x="632" y="282" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="648.0" y="306.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">accept established,related,untracked</text><rect x="632" y="328" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="648.0" y="352.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">drop invalid</text><rect x="632" y="374" width="500" height="38" rx="8" fill="#F7FAFD" stroke="#F7FAFD" stroke-width="1.5"/><text x="648.0" y="398.5" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">…</text><rect x="632" y="420" width="500" height="38" rx="8" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><text x="648.0" y="444.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start">drop all from WAN not DSTNATed</text>
<rect x="48" y="506" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="518" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el destino es una IP del router (también 192.168.88.1),</tspan><tspan x="74.0" dy="21.6">el paquete entra por input y llega a esta regla.</tspan></text>
<rect x="612" y="506" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="518" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Lo que entra por la WAN hacia la LAN se descarta, salvo que</tspan><tspan x="638.0" dy="21.6">tenga un dst-nat (lección 10).</tspan></text>
</svg>