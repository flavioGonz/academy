<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Los archivos con secretos se guardan bajo llave</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Los archivos con secretos se guardan bajo llave</text>
<path d="M110 168a8 8 0 0 1 8 -8h46l18 18v64a8 8 0 0 1 -8 8h-56a8 8 0 0 1 -8 -8z" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/><path d="M164 160v18h18" fill="none" stroke="#B45309" stroke-width="2.5"/><path d="M122 192L168 192" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M122 204L168 204" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M122 216L154 216" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/><g transform="translate(160 224) scale(.9)" fill="#FFF4DE" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="146.0" y="274.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">antes-sensible.rsc</text>
<path d="M330 168a8 8 0 0 1 8 -8h46l18 18v64a8 8 0 0 1 -8 8h-56a8 8 0 0 1 -8 -8z" fill="#FFFFFF" stroke="#002F58" stroke-width="2.5"/><path d="M384 160v18h18" fill="none" stroke="#002F58" stroke-width="2.5"/><text x="366.0" y="212.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#002F58" text-anchor="middle">0101</text><text x="366.0" y="274.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">antes.backup</text>
<text x="48.0" y="318.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Tienen claves WiFi, PPPoE, VPN o el equipo entero.</text>
<rect x="612" y="140" width="540" height="120" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(630 156) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="670.0" y="178.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Lugar con acceso restringido</text><text x="632.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Carpeta del cliente con permisos, gestor de claves o</tspan><tspan x="632.0" dy="21.6">almacenamiento cifrado.</tspan></text>
<rect x="612" y="280" width="540" height="120" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(630 296) scale(1.15)" fill="none" stroke="#D2492F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="670.0" y="318.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Nunca en un chat ni en un mail sin cifrar</text><text x="632.0" y="350.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Un archivo reenviado una vez ya no se controla.</tspan></text>
<path d="M450.0 210.0C527.0 210.0,527.0 200.0,604.0 200.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M110 408a8 8 0 0 1 8 -8h46l18 18v64a8 8 0 0 1 -8 8h-56a8 8 0 0 1 -8 -8z" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><path d="M164 400v18h18" fill="none" stroke="#0A63B8" stroke-width="2.5"/><path d="M122 432L168 432" stroke="#0A63B8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M122 444L168 444" stroke="#0A63B8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M122 456L154 456" stroke="#0A63B8" stroke-width="2" fill="none" stroke-linecap="round"/><text x="146.0" y="514.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">antes.rsc</text>
<text x="230.0" y="440.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Sin show-sensitive: no trae secretos.</text>
<text x="230.0" y="466.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Va al legajo del cliente, junto al de después.</text>
<rect x="48" y="560" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="572" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El .backup se guardó con contraseña en el paso 1: anotala en el gestor de claves, no al lado del archivo.</tspan></text>
</svg>