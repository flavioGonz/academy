<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Lo que ve la nube antes y durante el failover</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Lo que ve la nube antes y durante el failover</text>
<text x="48.0" y="150.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">Fibra activa</text>
<rect x="48" y="168" width="540" height="210" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="66.0" y="195.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL</text><text x="66.0" y="224.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/cloud/force-update</text><text x="66.0" y="256.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/cloud/print</text><text x="66.0" y="288.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#6EE7B7" text-anchor="start">public-address: 203.0.113.10</text><text x="66.0" y="320.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">vpn-relay-ipv4-status:</text><text x="66.0" y="352.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#6EE7B7" text-anchor="start">  reachable directly</text>
<text x="612.0" y="150.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#B45309" text-anchor="start">4G activo</text>
<rect x="612" y="168" width="540" height="210" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="630.0" y="195.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL</text><text x="630.0" y="224.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/cloud/force-update</text><text x="630.0" y="256.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/cloud/print</text><text x="630.0" y="288.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#FCD34D" text-anchor="start">public-address: 198.51.100.77</text><text x="630.0" y="320.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">vpn-relay-ipv4-status:</text><text x="630.0" y="352.0" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#FCD34D" text-anchor="start">  reachable via relay</text>
<rect x="48" y="430" width="1104" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="442" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El servidor de la nube contesta con la IP desde la que recibió el pedido: el nombre .sn.mynetname.net sigue a la WAN por la que</tspan><tspan x="74.0" dy="21.6">sale el router, con TTL de 60 segundos. Con el 4G en IP privada o CGNAT, los celulares con Back To Home entran por el relay de</tspan><tspan x="74.0" dy="21.6">MikroTik.</tspan></text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">198.51.100.77 es un ejemplo: con CGNAT, la IP pública es del operador y es compartida.</text>
</svg>