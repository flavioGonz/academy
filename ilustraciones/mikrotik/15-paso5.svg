<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>PPPoE ocupa 8 bytes: MTU 1492 y MSS ajustado</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">PPPoE ocupa 8 bytes: MTU 1492 y MSS ajustado</text>
<text x="48.0" y="158.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">LO QUE ENTRA EN UNA TRAMA ETHERNET (1500 BYTES DE CARGA)</text>
<rect x="48" y="180" width="1104" height="76" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<rect x="48" y="180" width="71" height="76" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="83.3" y="214.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">PPPoE 6</text>
<text x="83.3" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">+ PPP 2</text>
<rect x="127" y="188" width="1017" height="60" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="635.3" y="225.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#0A63B8" text-anchor="middle">paquete IP: hasta 1492 bytes</text>
<text x="48.0" y="296.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Por eso: max-mtu=1492 max-mru=1492 en el cliente PPPoE.</text>
<rect x="48" y="330" width="530" height="170" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="364.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#D2492F" text-anchor="start">Sin MSS ajustado</text>
<text x="68.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="68.0" dy="0.0">Muchos routers no avisan que el paquete es grande</tspan><tspan x="68.0" dy="23.0">(ICMP) y muchos firewalls lo bloquean: páginas que</tspan><tspan x="68.0" dy="23.0">cargan a medias.</tspan></text>
<rect x="622" y="330" width="530" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="642.0" y="364.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">Con change-mss</text>
<text x="642.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="642.0" dy="0.0">El router corrige el MSS en el SYN de cada conexión TCP</tspan><tspan x="642.0" dy="23.0">que sale por pppoe-antel: los equipos negocian</tspan><tspan x="642.0" dy="23.0">segmentos que entran.</tspan></text>
<rect x="48" y="526" width="1104" height="104" rx="14" fill="#03213C"/><text x="66.0" y="552.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">SI EL PERFIL PPP NO LO HACE (change-tcp-mss)</text><text x="66.0" y="582.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/firewall/mangle/add chain=forward out-interface=pppoe-antel protocol=tcp</text><text x="66.0" y="608.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  tcp-flags=syn action=change-mss new-mss=clamp-to-pmtu passthrough=yes comment=&quot;MSS PPPoE&quot;</text>
</svg>