<rect x="364.4" y="379" width="127.2" height="30" rx="15" fill="#FCEAE6"/><text x="428.0" y="400.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">development</text>
