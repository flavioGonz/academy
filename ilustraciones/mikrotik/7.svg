<rect x="48" y="440" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="452" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Si viene de RouterOS 6</tspan></text><text x="74.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">No se salta directo a la última: primero 7.12.1 y recién</tspan><tspan x="74.0" dy="21.6">después aparecen las nuevas en el canal.</tspan></text>
<rect x="612" y="440" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="452" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Si no encuentra actualizaciones</tspan></text><text x="638.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Desde 7.23 el chequeo de actualizaciones usa HTTPS: el</tspan><tspan x="638.0" dy="21.6">router necesita salir a internet por TCP 443.</tspan></text>
<rect x="48" y="568" width="1104" height="54" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="580" width="5" height="30" rx="2.5" fill="#D2492F"/><text x="74.0" y="602.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">No cortes la energía mientras actualiza. En un sitio remoto: alguien en el lugar o un plan de rescate (Netinstall).</tspan></text>
