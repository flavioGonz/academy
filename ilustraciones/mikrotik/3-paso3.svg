<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Equipo heredado: qué buscar y qué es raro</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Equipo heredado: qué buscar y qué es raro</text>
<rect x="48" y="140" width="1104" height="312" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 152a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v40h-1104z" fill="#E5F0FB"/><text x="64.0" y="171.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">COMANDO</text><text x="464.0" y="171.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">NORMAL</text><text x="794.0" y="171.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">SOSPECHOSO</text><text x="64.0" y="223.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">/system/scheduler/print</text><text x="464.0" y="223.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#0E8F5E" text-anchor="start">vacío o tareas que reconocés</text><text x="794.0" y="223.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">tareas que bajan cosas con fetch</text><path d="M60 244H1140" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="275.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">/system/script/print</text><text x="464.0" y="275.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#0E8F5E" text-anchor="start">scripts propios, documentados</text><text x="794.0" y="275.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">scripts que nadie conoce</text><path d="M60 296H1140" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="327.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">/ip/socks/print</text><text x="464.0" y="327.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#0E8F5E" text-anchor="start">enabled: no</text><text x="794.0" y="327.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">SOCKS habilitado</text><path d="M60 348H1140" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="379.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">/interface/l2tp-client/print</text><text x="464.0" y="379.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#0E8F5E" text-anchor="start">vacío o tus túneles</text><text x="794.0" y="379.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">cliente desconocido, ej. lvpn</text><path d="M60 400H1140" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="431.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">filter where dst-port~&quot;5678&quot;</text><text x="464.0" y="431.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#0E8F5E" text-anchor="start">ninguna regla</text><text x="794.0" y="431.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">regla que acepta el 5678</text>
<rect x="48" y="476" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="488" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="510.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Si encontrás algo</tspan></text><text x="74.0" y="537.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si aparece algo sospechoso: contraseña nueva para todos los</tspan><tspan x="74.0" dy="21.6">usuarios, revisión del firewall y nota en el legajo del</tspan><tspan x="74.0" dy="21.6">cliente.</tspan></text>
<rect x="612" y="476" width="540" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="488" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="638.0" y="510.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Por qué no alcanza con actualizar</tspan></text><text x="638.0" y="537.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">En Mēris los atacantes entraron en 2018 y dejaron su</tspan><tspan x="638.0" dy="21.6">configuración. Actualizar no la borra: hay que buscarla.</tspan></text>
</svg>