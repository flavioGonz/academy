<rect x="48" y="540" width="1104" height="81" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="552" width="5" height="57" rx="2.5" fill="#0A63B8"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La regla de la documentación</tspan></text><text x="74.0" y="601.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La pérdida real empieza en un salto y se ve en todos los que siguen. Dos direcciones que se alternan son un lazo de ruteo.</tspan></text>
