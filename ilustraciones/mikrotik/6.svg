<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿.backup o export? Cada uno sirve para otra cosa</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿.backup o export? Cada uno sirve para otra cosa</text>
<rect x="48" y="140" width="540" height="350" rx="18" fill="#FFFFFF" stroke="#002F58" stroke-width="2"/>
<path d="M76 174a8 8 0 0 1 8 -8h38l18 18v54a8 8 0 0 1 -8 8h-48a8 8 0 0 1 -8 -8z" fill="#FFFFFF" stroke="#002F58" stroke-width="2.5"/><path d="M122 166v18h18" fill="none" stroke="#002F58" stroke-width="2.5"/><text x="108.0" y="218.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#002F58" text-anchor="middle">0101</text>
<text x="164.0" y="196.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">.backup · binario</text>
<text x="164.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">/system/backup/save</text>
<circle cx="83" cy="285" r="4" fill="#0A63B8"/><text x="98.0" y="290.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="98.0" dy="0.0">Clona el equipo completo, usuarios incluidos.</tspan></text><circle cx="83" cy="317.95" r="4" fill="#0A63B8"/><text x="98.0" y="322.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="98.0" dy="0.0">No se puede leer ni comparar.</tspan></text><circle cx="83" cy="350.9" r="4" fill="#0A63B8"/><text x="98.0" y="355.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="98.0" dy="0.0">En otro modelo puede traer problemas de interfaces y</tspan><tspan x="98.0" dy="23.0">MAC.</tspan></text>
<rect x="68" y="406" width="500" height="60" rx="12" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="0"/>
<circle cx="96" cy="436" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(84 424)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="126.0" y="442.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Para volver atrás en el mismo equipo</text>
<rect x="612" y="140" width="540" height="350" rx="18" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<path d="M640 174a8 8 0 0 1 8 -8h38l18 18v54a8 8 0 0 1 -8 8h-48a8 8 0 0 1 -8 -8z" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2.5"/><path d="M686 166v18h18" fill="none" stroke="#0A63B8" stroke-width="2.5"/><path d="M652 198L690 198" stroke="#0A63B8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M652 210L690 210" stroke="#0A63B8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M652 222L676 222" stroke="#0A63B8" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="728.0" y="196.0" font-family="Familjen Grotesk" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">export · texto .rsc</text>
<text x="728.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">/export file=antes</text>
<circle cx="647" cy="285" r="4" fill="#0A63B8"/><text x="662.0" y="290.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="662.0" dy="0.0">Se lee con cualquier editor y se compara con diff.</tspan></text><circle cx="647" cy="317.95" r="4" fill="#0A63B8"/><text x="662.0" y="322.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="662.0" dy="0.0">No lleva contraseñas de usuarios ni certificados.</tspan></text><circle cx="647" cy="350.9" r="4" fill="#0A63B8"/><text x="662.0" y="355.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="662.0" dy="0.0">Con show-sensitive suma claves WiFi, PPPoE y VPN.</tspan></text>
<rect x="632" y="406" width="500" height="60" rx="12" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="0"/>
<circle cx="660" cy="436" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(648 424)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="690.0" y="442.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Para leer, comparar y migrar</text>
<rect x="48" y="520" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="532" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En obra se hacen los dos: el .backup para restaurar rápido, el export para el legajo y para saber qué cambió.</tspan></text>
</svg>