<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Safe Mode: si la sesión se cae, el router deshace</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Safe Mode: si la sesión se cae, el router deshace</text>
<rect x="48" y="150" width="252" height="140" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2.5"/>
<rect x="68.0" y="165" width="81.2" height="30" rx="15" fill="#011E38"/><text x="108.6" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Ctrl+X</text>
<text x="68.0" y="236.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Entrás a Safe Mode</text>
<text x="68.0" y="266.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">[admin@MikroTik] &lt;SAFE&gt;</text>
<path d="M304.0 225.0C315.0 225.0,315.0 225.0,326.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="330" y="150" width="252" height="140" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="2.5"/>
<rect x="350.0" y="165" width="81.2" height="30" rx="15" fill="#011E38"/><text x="390.6" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">cambio</text>
<text x="350.0" y="236.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Agregás la regla</text>
<text x="350.0" y="266.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">comment=&quot;prueba-safe&quot;</text>
<path d="M586.0 225.0C597.0 225.0,597.0 225.0,608.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="612" y="150" width="252" height="140" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/>
<rect x="632.0" y="165" width="81.2" height="30" rx="15" fill="#011E38"/><text x="672.6" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Ctrl+D</text>
<text x="632.0" y="236.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Salís sin confirmar</text>
<text x="632.0" y="266.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">o se corta el cable</text>
<path d="M868.0 225.0C879.0 225.0,879.0 225.0,890.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="894" y="150" width="252" height="140" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/>
<rect x="914.0" y="165" width="62.8" height="30" rx="15" fill="#011E38"/><text x="945.4" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">undo</text>
<text x="914.0" y="236.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">El router deshace</text>
<text x="914.0" y="266.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">la regla desaparece</text>
<rect x="48" y="330" width="540" height="130" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(66 346) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="106.0" y="368.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Querés que el cambio quede?</text><text x="68.0" y="400.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Apretá Ctrl+X otra vez antes de salir: dejás Safe Mode y los</tspan><tspan x="68.0" dy="21.6">cambios se guardan.</tspan></text>
<rect x="612" y="330" width="540" height="130" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(630 346) scale(1.15)" fill="none" stroke="#0A63B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g><text x="670.0" y="368.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Te cortaste el acceso?</text><text x="632.0" y="400.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">No hagas nada: cuando la sesión muere, el router vuelve solo</tspan><tspan x="632.0" dy="21.6">a como estaba antes de Ctrl+X.</tspan></text>
<rect x="48" y="494" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="506" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Ojo con los scripts largos</tspan></text><text x="74.0" y="555.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Safe Mode recuerda hasta 100 acciones. Si pegás un script largo y se pasa, sale solo del modo seguro y ya no deshace nada:</tspan><tspan x="74.0" dy="21.6">trabajá de a pasos chicos.</tspan></text>
</svg>