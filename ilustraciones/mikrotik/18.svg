<text x="582.0" y="332.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">&lt;serie&gt;.sn.mynetname.net  →  public-address</text>
<text x="582.0" y="358.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">TTL 60 s · /ip/cloud/force-update lo actualiza ya</text>
