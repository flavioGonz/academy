<path d="M348.0 472.0C451.0 472.0,451.0 340.0,554.0 340.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="388.4" y="381.0" width="125.2" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="451.0" y="400.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">1 · resuelve</text>
<path d="M198.0 430.0L198.0 266.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/><rect x="109.6" y="329.0" width="176.8" height="28" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="1.5"/><text x="198.0" y="348.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">2 · intenta entrar</text>
<rect x="560" y="420" width="592" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="560" y="432" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="586.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="586.0" dy="0.0">El nombre no abre nada</tspan></text><text x="586.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="586.0" dy="0.0">Llega a la IP, pero el firewall por defecto sigue descartando lo</tspan><tspan x="586.0" dy="21.6">que entra de internet. Publicar un servicio es otra decisión</tspan><tspan x="586.0" dy="21.6">(lección 32).</tspan></text>
<rect x="48" y="560" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="572" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Detrás de CGNAT el nombre apunta a una IP compartida del proveedor: para entrar, Back To Home (lección 30) o un concentrador</tspan><tspan x="74.0" dy="21.6">(lección 31).</tspan></text>
</svg>