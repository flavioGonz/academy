<text x="470.0" y="560.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Cada regla usa in-interface-list y out-interface-list: la zona de origen y la de destino.</text>
<text x="470.0" y="588.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Lo que no coincide con ningún casillero baja hasta el drop final.</text>
