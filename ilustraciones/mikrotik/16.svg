<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un paquete principal y extras que se habilitan</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un paquete principal y extras que se habilitan</text>
<rect x="48" y="140" width="520" height="250" rx="20" fill="#011E38"/>
<text x="76.0" y="196.0" font-family="JetBrains Mono" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="start">routeros</text>
<text x="76.0" y="240.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#D9E9F8" text-anchor="start"><tspan x="76.0" dy="0.0">Casi todo viene acá: firewall, ruteo, VPN, DHCP,</tspan><tspan x="76.0" dy="23.0">herramientas. Se actualiza con System &gt; Packages &gt;</tspan><tspan x="76.0" dy="23.0">Check for Updates.</tspan></text>
<rect x="76.0" y="339" width="311.6" height="30" rx="15" fill="#17A8D4"/><text x="231.8" y="360.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">.npk de la arquitectura del equipo</text>
<text x="622.0" y="160.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start">PAQUETES EXTRA (flags X A = disponibles, no instalados)</text>
<rect x="622" y="190" width="200" height="52" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="722.0" y="222.1" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">container</text>
<rect x="842" y="190" width="200" height="52" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="942.0" y="222.1" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">zerotier</text>
<rect x="622" y="262" width="230" height="52" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="737.0" y="294.1" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">user-manager</text>
<rect x="622" y="334" width="200" height="52" rx="12" fill="#FFFFFF" stroke="#D2492F" stroke-width="2"/><text x="722.0" y="366.1" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">wifi-qcom</text>
<rect x="942" y="334" width="200" height="52" rx="12" fill="#FFFFFF" stroke="#D2492F" stroke-width="2"/><text x="1042.0" y="366.1" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">wireless</text>
<path d="M822 360L942 360" stroke="#D2492F" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<circle cx="882" cy="360" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(870 348)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="622.0" y="420.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#D2492F" text-anchor="start"><tspan x="622.0" dy="0.0">wifi-qcom y wireless no pueden estar activos a la vez (desde</tspan><tspan x="622.0" dy="21.6">7.13). Un extra se habilita y se aplica con reinicio.</tspan></text>
<rect x="48" y="480" width="520" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="514.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Download</text>
<text x="68.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="68.0" dy="0.0">Baja la versión y espera: reiniciás vos cuando el</tspan><tspan x="68.0" dy="23.0">cliente puede.</tspan></text>
<rect x="632" y="480" width="520" height="116" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="652.0" y="514.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#B45309" text-anchor="start">Download&amp;Install</text>
<text x="652.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="652.0" dy="0.0">Baja e instala: reinicia solo al terminar.</tspan></text>
</svg>