<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Si publicás el NVR: un puerto, para una lista</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Si publicás el NVR: un puerto, para una lista</text>
<rect x="48" y="124" width="1104" height="52" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="136" width="5" height="28" rx="2.5" fill="#0A63B8"/><text x="74.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Primera opción: VPN (lección 8). Publicar es para cuando no queda otra, por ejemplo una central de monitoreo que no puede usar túnel.</tspan></text>
<rect x="48" y="250" width="290" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(68 276.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g><text x="112.0" y="288.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Central de monitoreo</text><text x="112.0" y="311.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">203.0.113.25</text>
<rect x="48" y="430" width="290" height="84" rx="16" fill="#FFFFFF" stroke="#D2492F" stroke-width="3"/><g transform="translate(68 456.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="112.0" y="468.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Cualquier otra IP</text><text x="112.0" y="491.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">escaneos</text>
<rect x="420" y="240" width="400" height="290" rx="20" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="442.0" y="276.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Router · dst-nat</text>
<text x="442.0" y="314.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">in-interface-list=WAN</text>
<text x="442.0" y="342.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">tcp dst-port=8000</text>
<text x="442.0" y="370.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6EE7B7" text-anchor="start">src-address-list=nvr-permitidos</text>
<text x="442.0" y="398.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7DD3FC" text-anchor="start">→ 192.168.88.50:8000</text>
<rect x="438" y="436" width="364" height="74" rx="10" fill="#2A1A1A" stroke="#D2492F" stroke-width="1.5"/>
<text x="454.0" y="466.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FCA5A5" text-anchor="start">80 · 443 · 8291 del router</text>
<text x="454.0" y="492.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#FCA5A5" text-anchor="start">nunca se publican</text>
<rect x="900" y="290" width="252" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(920 316.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="964.0" y="328.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">NVR</text><text x="964.0" y="351.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">192.168.88.50</text>
<path d="M338.0 292.0C377.0 292.0,377.0 300.0,416.0 300.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M824.0 340.0C862.0 340.0,862.0 332.0,900.0 332.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/><rect x="816.6" y="305.0" width="90.8" height="28" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="1.5"/><text x="862.0" y="324.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="middle">TCP 8000</text>
<path d="M338.0 472.0C377.0 472.0,377.0 470.0,416.0 470.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<circle cx="380" cy="455" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(368 443)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="48.0" y="562.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#D2492F" text-anchor="start">No está en la lista: el dst-nat no coincide y el firewall lo descarta.</text>
<text x="48.0" y="606.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">En la lista, cada IP con comentario y fecha de revisión: &quot;central monitoreo, revisar 2027-04&quot;.</text>
</svg>