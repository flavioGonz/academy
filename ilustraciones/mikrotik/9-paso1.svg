<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Qué te dice /ip/cloud/print</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Qué te dice /ip/cloud/print</text>
<rect x="48" y="140" width="560" height="220" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 154a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="160" r="5" fill="#C2D4E6"/><circle cx="86" cy="160" r="5" fill="#C2D4E6"/><circle cx="104" cy="160" r="5" fill="#C2D4E6"/><text x="124.0" y="166.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Terminal · /ip/cloud/print</text><text x="68.0" y="210.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">ddns-enabled</text><text x="588.0" y="210.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">yes</text><text x="68.0" y="248.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">dns-name</text><text x="588.0" y="248.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">&lt;serie&gt;.sn.mynetname.net</text><rect x="58" y="264" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="286.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">public-address</text><text x="588.0" y="286.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">203.0.113.10</text><text x="68.0" y="324.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">status</text><text x="588.0" y="324.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">updated</text>
<rect x="632" y="140" width="520" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="632" y="152" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="658.0" y="174.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="658.0" dy="0.0">dns-name</tspan></text><text x="658.0" y="200.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="658.0" dy="0.0">El nombre fijo del router. Lo arma con el número de</tspan><tspan x="658.0" dy="21.6">serie.</tspan></text>
<rect x="632" y="258.15" width="520" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="632" y="270.15" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="658.0" y="292.1" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="658.0" dy="0.0">public-address</tspan></text><text x="658.0" y="319.1" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="658.0" dy="0.0">La IP con la que el router llega a los servidores de</tspan><tspan x="658.0" dy="21.6">MikroTik. Es la que vas a comparar.</tspan></text>
<rect x="632" y="376.29999999999995" width="520" height="81" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="632" y="388.29999999999995" width="5" height="57" rx="2.5" fill="#0A63B8"/><text x="658.0" y="410.3" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="658.0" dy="0.0">status</tspan></text><text x="658.0" y="437.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="658.0" dy="0.0">Si dice updated, el nombre ya apunta a esa IP.</tspan></text>
<rect x="48" y="384" width="560" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="396" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Tener el nombre no abre nada: el firewall de fábrica sigue</tspan><tspan x="74.0" dy="21.6">descartando lo que llega de internet.</tspan></text>
<text x="48.0" y="520.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">Los servicios cloud no existen en RouterOS x86.</text>
</svg>