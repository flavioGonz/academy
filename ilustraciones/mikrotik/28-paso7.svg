<rect x="48" y="420" width="540" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="432" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="74.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">La LAN también</tspan></text><text x="74.0" y="480.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Para que la LAN navegue por la central: masquerade hacia el</tspan><tspan x="74.0" dy="20.2">túnel (paso 5) o que la central haga el NAT.</tspan></text>
<rect x="612" y="420" width="540" height="99" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="432" width="5" height="75" rx="2.5" fill="#B45309"/><text x="638.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Después, volvé a no</tspan></text><text x="638.0" y="480.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Probalo en el banco y volvé a add-default-route=no: para unir</tspan><tspan x="638.0" dy="20.2">redes alcanza con las rutas a cada LAN.</tspan></text>
