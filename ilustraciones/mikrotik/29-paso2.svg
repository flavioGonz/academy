<rect x="60" y="128" width="600" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="60" y="140" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="86.0" y="162.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="86.0" dy="0.0">Por qué ARP sí contesta</tspan></text><text x="86.0" y="188.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="86.0" dy="0.0">El firewall de Windows suele frenar el ping. ARP no se puede</tspan><tspan x="86.0" dy="21.6">frenar: sin ARP el equipo no hablaría con nadie de su red.</tspan></text>
