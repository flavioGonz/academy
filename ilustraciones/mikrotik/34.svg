<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres protocolos, una sola tabla de vecinos</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 34</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres protocolos, una sola tabla de vecinos</text>
<rect x="48" y="130" width="352" height="250" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="70.0" y="172.0" font-family="Familjen Grotesk" font-size="26" font-weight="700" fill="#0A63B8" text-anchor="start">MNDP</text>
<text x="70.0" y="200.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">de MikroTik</text>
<circle cx="75" cy="241" r="4" fill="#0A63B8"/><text x="90.0" y="246.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="90.0" dy="0.0">UDP 5678, por broadcast</tspan></text><circle cx="75" cy="276.6" r="4" fill="#0A63B8"/><text x="90.0" y="281.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="90.0" dy="0.0">lo usa WinBox en Neighbors</tspan></text><circle cx="75" cy="312.20000000000005" r="4" fill="#0A63B8"/><text x="90.0" y="317.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="90.0" dy="0.0">entre equipos MikroTik</tspan></text>
<path d="M224.0 384.0L224.0 440.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="130" width="352" height="250" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="446.0" y="172.0" font-family="Familjen Grotesk" font-size="26" font-weight="700" fill="#41627F" text-anchor="start">CDP</text>
<text x="446.0" y="200.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">de Cisco, 1994</text>
<circle cx="451" cy="241" r="4" fill="#6E88A1"/><text x="466.0" y="246.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="466.0" dy="0.0">multicast 01:00:0c:cc:cc:cc</tspan></text><circle cx="451" cy="276.6" r="4" fill="#6E88A1"/><text x="466.0" y="281.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="466.0" dy="0.0">anuncio cada 60 s</tspan></text><circle cx="451" cy="312.20000000000005" r="4" fill="#6E88A1"/><text x="466.0" y="317.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="466.0" dy="0.0">solo si hay equipos Cisco</tspan></text>
<path d="M600.0 384.0L600.0 440.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="130" width="352" height="250" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="822.0" y="172.0" font-family="Familjen Grotesk" font-size="26" font-weight="700" fill="#0B7FA6" text-anchor="start">LLDP</text>
<text x="822.0" y="200.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">IEEE 802.1AB</text>
<circle cx="827" cy="241" r="4" fill="#17A8D4"/><text x="842.0" y="246.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="842.0" dy="0.0">EtherType 0x88CC</tspan></text><circle cx="827" cy="276.6" r="4" fill="#17A8D4"/><text x="842.0" y="281.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="842.0" dy="0.0">habla casi cualquier marca</tspan></text><circle cx="827" cy="312.20000000000005" r="4" fill="#17A8D4"/><text x="842.0" y="317.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="842.0" dy="0.0">switches, teléfonos IP</tspan></text>
<path d="M976.0 384.0L976.0 440.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="48" y="448" width="1104" height="92" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="72.0" y="486.0" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#17A8D4" text-anchor="start">/ip/neighbor</text>
<text x="72.0" y="518.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#D9E9F8" text-anchor="start">identidad · plataforma · versión · IP · MAC · puerto físico donde lo ve</text>
<rect x="48" y="560" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="572" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que el router aprende de los vecinos, los vecinos lo aprenden de él: nombre, modelo, versión e IP salen por cada puerto de</tspan><tspan x="74.0" dy="21.6">la lista.</tspan></text>
</svg>