<text x="636.0" y="198.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">Recién ahí:</text>
<text x="636.0" y="230.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">/user/disable admin</text>
