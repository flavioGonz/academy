ill="#41627F" text-anchor="start">full</text>
<text x="700.0" y="498.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">X = deshabilitado: admin ya no puede entrar.</text>
<rect x="48" y="530" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="542" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="564.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si deshabilitás admin y tu usuario no entra, quedás afuera: la única salida es reset o Netinstall.</tspan></text>
