<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Adlist: subí la caché y probá el nombre exacto</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 32 · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Adlist: subí la caché y probá el nombre exacto</text>
<rect x="48" y="140" width="610" height="190" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="66.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL</text><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/dns/set cache-size=16384</text><text x="66.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/file/add name=adlist-prueba.txt \</text><text x="66.0" y="252.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">  contents=&quot;0.0.0.0 example.net\nads.example.net\n&quot;</text><text x="66.0" y="280.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/dns/adlist/add file=adlist-prueba.txt</text><text x="66.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start">/ip/dns/adlist/print   # name-count, match-count</text>
<text x="700.0" y="160.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">NSLOOKUP DESDE LA NOTEBOOK</text>
<rect x="700" y="176" width="452" height="152" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M700 188a12 12 0 0 1 12 -12h428a12 12 0 0 1 12 12v26h-452z" fill="#E5F0FB"/><text x="714.0" y="200.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">NOMBRE</text><text x="964.0" y="200.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">RESPUESTA</text><text x="714.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">example.net</text><text x="964.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">0.0.0.0</text><path d="M712 252H1140" stroke="#DDE8F2" stroke-width="1"/><text x="714.0" y="276.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">ads.example.net</text><text x="964.0" y="276.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">0.0.0.0</text><rect x="704" y="293" width="444" height="32" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="714.0" y="314.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">www.example.net</text><text x="964.0" y="314.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">su IP real</text>
<rect x="700" y="350" width="452" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="700" y="362" width="5" height="100" rx="2.5" fill="#B45309"/><text x="726.0" y="384.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">www.example.net pasa</tspan></text><text x="726.0" y="410.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">La adlist bloquea solo el nombre listado, sin</tspan><tspan x="726.0" dy="21.6">comodines. Para un sitio con subdominios:</tspan><tspan x="726.0" dy="21.6">NXDOMAIN con match-subdomain.</tspan></text>
<rect x="48" y="420" width="610" height="200" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="68.0" y="456.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">La lista vive en la caché DNS</text>
<text x="68.0" y="492.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#0A63B8" text-anchor="start">≈ 75 bytes por nombre</text>
<text x="68.0" y="522.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#0A63B8" text-anchor="start">75 000 nombres ≈ 6 MiB</text>
<text x="68.0" y="556.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Si no entra: &quot;adlist read: max cache size reached&quot;. Subí cache-size,</tspan><tspan x="68.0" dy="20.2">borrá la adlist y agregala de nuevo.</tspan></text>
</svg>