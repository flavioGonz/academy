<rect x="820" y="322" width="332" height="124" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="840.0" y="360.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">2 · Menor distancia</text><text x="840.0" y="392.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="840.0" dy="0.0">Solo entre rutas al mismo destino:</tspan><tspan x="840.0" dy="20.2">conectada 0, estática 1, OSPF 110.</tspan></text>
<rect x="820" y="464" width="332" height="124" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="840.0" y="502.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">3 · Gateway vivo</text><text x="840.0" y="534.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="840.0" dy="0.0">Una ruta con gateway inalcanzable</tspan><tspan x="840.0" dy="20.2">queda inactiva.</tspan></text>
<rect x="48" y="470" width="726" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="482" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La ruta por defecto se usa cuando nada más coincide. Y cada ruta hacia una red remota</tspan><tspan x="74.0" dy="20.2">necesita su ruta de vuelta en la otra punta.</tspan></text>
