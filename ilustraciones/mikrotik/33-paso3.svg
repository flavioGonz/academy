<text x="68.0" y="406.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#D2492F" text-anchor="start">Abierto</text>
<text x="68.0" y="438.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start"><tspan x="68.0" dy="0.0">Responde a cualquiera y lo usan para amplificar ataques. En</tspan><tspan x="68.0" dy="21.6">el foro: 409 GB de subida en una semana hasta que avisó el</tspan><tspan x="68.0" dy="21.6">proveedor.</tspan></text>
<rect x="612" y="372" width="540" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="632.0" y="406.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">Cerrado</text>
<text x="632.0" y="438.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start"><tspan x="632.0" dy="0.0">Drop de UDP y TCP 53 que entra por la WAN, arriba de todo.</tspan><tspan x="632.0" dy="21.6">La LAN sigue usando el DNS del router.</tspan></text>
<rect x="48" y="548" width="1104" height="76" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="66.0" y="575.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PRUEBA</text><text x="66.0" y="604.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">nslookup mikrotik.com &lt;IP WAN del router&gt;   # desde la notebook WAN: sin respuesta</text>
