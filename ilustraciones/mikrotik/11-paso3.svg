<text x="450.0" y="274.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">ruta al testigo</text>
<rect x="812" y="140" width="340" height="176" rx="16" fill="#FFFFFF" stroke="#6E88A1" stroke-width="2.5"/>
