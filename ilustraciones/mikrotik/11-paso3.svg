<text x="580.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">el ping de check-gateway viaja hasta el testigo, pasando por el módem</text>
<rect x="48" y="546" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="558" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="580.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Solo resuelven el gateway las rutas con scope menor o igual al target-scope: la /32 (scope=10) sirve; la ruta del DHCP del 4G</tspan><tspan x="74.0" dy="21.6">(scope 30) no, así el testigo de la fibra nunca se prueba por el 4G.</tspan></text>
