<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Por qué rutas recursivas y no ping al módem?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Por qué rutas recursivas y no ping al módem?</text>
<rect x="48" y="140" width="540" height="420" rx="18" fill="#FFFFFF" stroke="#D2492F" stroke-width="2"/>
<circle cx="80" cy="174" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(68 162)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="110.0" y="181.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">check-gateway al módem</text>
<rect x="72" y="220" width="140" height="64" rx="14" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="142.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Router</text>
<rect x="248" y="220" width="140" height="64" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="318.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Módem</text>
<rect x="424" y="220" width="140" height="64" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="494.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Testigo</text>
<path d="M212 252L248 252" stroke="#0A63B8" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M388 252L424 252" stroke="#D2492F" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="4 6"/>
<path d="M398 236l16 32M414 236l-16 32" stroke="#D2492F" stroke-width="3"/>
<text x="406.0" y="310.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">fibra cortada</text>
<path d="M142 288 C 142 340, 318 340, 318 290" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-ok)"/>
<text x="230.0" y="360.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">el módem contesta</text>
<rect x="72" y="400" width="492" height="136" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(90 416) scale(1.15)" fill="none" stroke="#D2492F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="130.0" y="438.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">La ruta 1 sigue activa</text><text x="92.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">El router cree que hay internet y no conmuta. El local</tspan><tspan x="92.0" dy="21.6">queda sin conexión aunque el 4G esté listo.</tspan></text>
<rect x="612" y="140" width="540" height="420" rx="18" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="644" cy="174" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(632 162)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="674.0" y="181.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">check-gateway al testigo</text>
<rect x="636" y="220" width="140" height="64" rx="14" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="706.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Router</text>
<rect x="812" y="220" width="140" height="64" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="882.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Módem</text>
<rect x="988" y="220" width="140" height="64" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="1058.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Testigo</text>
<path d="M776 252L812 252" stroke="#0A63B8" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M952 252L988 252" stroke="#D2492F" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="4 6"/>
<path d="M962 236l16 32M978 236l-16 32" stroke="#D2492F" stroke-width="3"/>
<text x="970.0" y="310.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">fibra cortada</text>
<path d="M706 288 C 706 350, 1058 350, 1058 290" fill="none" stroke="#D2492F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<text x="882.0" y="366.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">el testigo no contesta</text>
<rect x="636" y="400" width="492" height="136" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(654 416) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="694.0" y="438.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">La ruta 1 cae, entra la 2</text><text x="656.0" y="470.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">El router se da cuenta de que no hay internet por ISP1</tspan><tspan x="656.0" dy="21.6">y usa la ruta de distance=2.</tspan></text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Por eso la default apunta al testigo (gateway=1.1.1.1, target-scope=11) y el testigo se alcanza por su ISP (scope=10).</text>
</svg>