<rect x="640" y="392" width="170" height="64" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="725.0" y="430.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Internet</text>
