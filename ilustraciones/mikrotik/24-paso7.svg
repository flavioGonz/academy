<text x="48.0" y="444.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start"><tspan x="48.0" dy="0.0">La PC recibe respuesta de la IP a la que</tspan><tspan x="48.0" dy="20.2">llamó. Sin el masquerade, el NVR le</tspan><tspan x="48.0" dy="20.2">contestaría directo desde 192.168.88.50 y</tspan><tspan x="48.0" dy="20.2">la PC la descartaría.</tspan></text>
<rect x="48" y="538" width="1104" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="550" width="5" height="48" rx="2.5" fill="#B45309"/><text x="74.0" y="572.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Alternativa: DNS local (nvr.ejemplo.com → 192.168.88.50). El NVR ve la IP real de cada PC, pero solo sirve si el puerto de afuera es</tspan><tspan x="74.0" dy="20.2">igual al de adentro: el DNS cambia la IP, no el puerto.</tspan></text>
