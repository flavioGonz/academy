<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Safe Mode: un punto de vuelta para tus cambios</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Safe Mode: un punto de vuelta para tus cambios</text>
<rect x="48" y="130" width="490" height="130" rx="14" fill="#03213C"/><text x="66.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">NEW TERMINAL</text><text x="66.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">[admin@MikroTik] &gt;   Ctrl+X o F4</text><text x="66.0" y="212.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FD3F0" text-anchor="start">[Safe Mode taken]</text><text x="66.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">[admin@MikroTik] &lt;SAFE&gt;</text>
<text x="48.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">/system/history mientras estás en Safe Mode</text>
<rect x="48" y="316" width="490" height="152" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 328a12 12 0 0 1 12 -12h466a12 12 0 0 1 12 12v26h-490z" fill="#E5F0FB"/><text x="62.0" y="340.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2"></text><text x="132.0" y="340.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">ACCIÓN</text><text x="62.0" y="378.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">F</text><text x="132.0" y="378.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">regla de firewall agregada</text><path d="M60 392H526" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="416.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">F</text><text x="132.0" y="416.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">IP de gestión cambiada</text><path d="M60 430H526" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="454.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">F</text><text x="132.0" y="454.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">ruta por defecto cambiada</text>
<rect x="48" y="492" width="490" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="504" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Tope del historial</tspan></text><text x="74.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Entran 100 acciones. Si te pasás, sale solo del modo</tspan><tspan x="74.0" dy="21.6">seguro y no deshace nada: pasos chicos.</tspan></text>
<rect x="680" y="150" width="470" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="680" y="162" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="706.0" y="184.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="706.0" dy="0.0">Confirmás: Ctrl+X otra vez o soltás el botón</tspan></text><text x="706.0" y="210.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="706.0" dy="0.0">Los cambios quedan y el prompt pierde el &lt;SAFE&gt;.</tspan><tspan x="706.0" dy="21.6">Salir con /quit también los deja.</tspan></text>
<rect x="680" y="350" width="470" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="680" y="362" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="706.0" y="384.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="706.0" dy="0.0">Se corta tu sesión o salís con Ctrl+D</tspan></text><text x="706.0" y="410.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="706.0" dy="0.0">RouterOS deshace todo lo marcado con F. Si se cortó</tspan><tspan x="706.0" dy="21.6">la conexión, lo hace cuando da la sesión por muerta</tspan><tspan x="706.0" dy="21.6">(la documentación toma 9 minutos de timeout TCP).</tspan></text>
<path d="M548.0 380.0C548.0 283.8,670.0 301.2,670.0 205.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/><rect x="559.3" y="269.5" width="99.4" height="28" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="1.5"/><text x="609.0" y="288.5" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="middle">todo bien</text>
<path d="M548.0 410.0C609.0 410.0,609.0 430.0,670.0 430.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/><rect x="561.1" y="376.0" width="108.0" height="28" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="1.5"/><text x="615.1" y="395.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">algo falló</text>
</svg>