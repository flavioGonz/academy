<text x="595.0" y="572.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#41627F" text-anchor="middle">Los puertos son esclavos: la IP va en el bridge</text>
<rect x="812" y="130" width="340" height="120" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="812" y="142" width="5" height="96" rx="2.5" fill="#0E8F5E"/><text x="838.0" y="164.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="838.0" dy="0.0">H = hardware offloading</tspan></text><text x="838.0" y="190.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="838.0" dy="0.0">El switch chip conmuta a velocidad de</tspan><tspan x="838.0" dy="20.2">cable y la CPU queda libre para</tspan><tspan x="838.0" dy="20.2">rutear.</tspan></text>
<rect x="812" y="300" width="340" height="120" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="812" y="312" width="5" height="96" rx="2.5" fill="#D2492F"/><text x="838.0" y="334.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="838.0" dy="0.0">¿Un segundo bridge? No</tspan></text><text x="838.0" y="360.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="838.0" dy="0.0">Fuera de los CRS1xx/2xx, solo un</tspan><tspan x="838.0" dy="20.2">bridge por switch chip tiene H. El</tspan><tspan x="838.0" dy="20.2">segundo bridge va por la CPU.</tspan></text>
<rect x="812" y="482" width="340" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="812" y="494" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="838.0" y="516.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="838.0" dy="0.0">Para separar redes</tspan></text><text x="838.0" y="543.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="838.0" dy="0.0">Cámaras, oficina e invitados: un</tspan><tspan x="838.0" dy="20.2">bridge y VLAN para separar.</tspan></text>
