<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El dst-nat va atado a la IP fija, no a la lista WAN</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El dst-nat va atado a la IP fija, no a la lista WAN</text>
<rect x="48" y="136" width="1104" height="226" rx="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="84" cy="174" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(72 162)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="116.0" y="181.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Así</text>
<text x="84.0" y="226.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">chain=dstnat in-interface=ether1 dst-address=203.0.113.10</text>
<text x="84.0" y="256.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">protocol=tcp dst-port=8443 src-address-list=monitoreo</text>
<text x="84.0" y="286.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">action=dst-nat to-addresses=192.168.88.20 to-ports=443</text>
<text x="84.0" y="332.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">Solo la central, solo por la IP fija. La respuesta sale por la fija mientras sea la principal.</text>
<rect x="48" y="386" width="1104" height="226" rx="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="84" cy="424" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(72 412)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="116.0" y="431.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Así no</text>
<text x="84.0" y="476.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">chain=dstnat in-interface-list=WAN</text>
<text x="84.0" y="506.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">protocol=tcp dst-port=8443</text>
<text x="84.0" y="536.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">action=dst-nat to-addresses=192.168.88.20 to-ports=443</text>
<text x="84.0" y="582.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#D2492F" text-anchor="start">Agarra por las dos WAN y para cualquiera. Lo que entra por el PPPoE responde por la fija y se pierde.</text>
</svg>