<rect x="912" y="130" width="240" height="93" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="912" y="142" width="5" height="69" rx="2.5" fill="#0A63B8"/><text x="938.0" y="164.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="938.0" dy="0.0">La gestión del router va</tspan><tspan x="938.0" dy="20.2">por la VLAN 99, nunca por</tspan><tspan x="938.0" dy="20.2">la VLAN 1.</tspan></text>
<rect x="48" y="130" width="260" height="93" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="142" width="5" height="69" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="164.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Una cámara infectada no ve</tspan><tspan x="74.0" dy="20.2">las PCs: para cruzar tiene</tspan><tspan x="74.0" dy="20.2">que pasar por el router.</tspan></text>
