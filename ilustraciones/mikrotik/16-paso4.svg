<rect x="48" y="330" width="560" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="342" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="364.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">1 · La arquitectura manda</tspan></text><text x="74.0" y="390.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En System &gt; Resources mirá architecture-name (acá arm64 es el</tspan><tspan x="74.0" dy="21.6">ejemplo) y bajá el .npk de esa misma arquitectura.</tspan></text>
<rect x="632" y="330" width="520" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="632" y="342" width="5" height="78" rx="2.5" fill="#B45309"/><text x="658.0" y="364.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="658.0" dy="0.0">2 · En la raíz, no en una carpeta</tspan></text><text x="658.0" y="390.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="658.0" dy="0.0">Si lo soltás dentro de una carpeta, no se instala. Tiene</tspan><tspan x="658.0" dy="21.6">que quedar en la raíz.</tspan></text>
<rect x="48" y="490" width="560" height="104" rx="14" fill="#03213C"/><text x="66.0" y="516.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">3 · VERIFICÁ Y REINICIÁ</text><text x="66.0" y="546.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/file/print where name~&quot;.npk&quot;</text><text x="66.0" y="572.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/system/reboot</text>
