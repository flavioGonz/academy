<rect x="48" y="480" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="492" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Equipos WiFi con actualización manual: subí también wifi-qcom o wireless de la misma versión. Nunca cortes la energía durante</tspan><tspan x="74.0" dy="21.6">la instalación.</tspan></text>
