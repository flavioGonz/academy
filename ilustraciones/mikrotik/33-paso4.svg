<text x="918.0" y="322.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#D2492F" text-anchor="start">blacklist</text>
<rect x="918.0" y="513" width="145.6" height="30" rx="15" fill="#FCEAE6"/><text x="990.8" y="534.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">timeout 1 día</text>
<rect x="48" y="132" width="470" height="96" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="68.0" y="166.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">src-address-list=admins → accept</text>
<text x="68.0" y="196.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#04223D" text-anchor="start">Va primero: tu oficina no cuenta conexiones.</text>
<rect x="48" y="584" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="596" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="618.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Cuenta conexiones nuevas, no logins fallidos: un login exitoso también suma. Sin el drop final, la lista negra no bloquea nada.</tspan></text>
