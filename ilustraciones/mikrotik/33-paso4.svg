<rect x="634.0" y="513" width="127.2" height="30" rx="15" fill="#FFF4DE"/><text x="697.6" y="534.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">timeout 1 h</text>
