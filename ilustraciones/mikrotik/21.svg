<rect x="48" y="440" width="420" height="99" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="452" width="5" height="75" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que cifra es IPsec</tspan></text><text x="74.0" y="500.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">use-ipsec=required: el servidor solo acepta L2TP</tspan><tspan x="74.0" dy="20.2">dentro de IPsec. L2TP solo no cifra.</tspan></text>
<rect x="490" y="440" width="412" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="490" y="452" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="516.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="516.0" dy="0.0">Lo que identifica es PPP</tspan></text><text x="516.0" y="500.9" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="516.0" dy="0.0">Pool, perfil PPP y un secret por persona con</tspan><tspan x="516.0" dy="20.2">service=l2tp.</tspan></text>
<text x="48.0" y="630.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Para quien solo tiene el cliente nativo: Windows, macOS, iOS o Android.</text>
