<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Con PPPoE, la WAN pasa a ser pppoe-antel</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Con PPPoE, la WAN pasa a ser pppoe-antel</text>
<rect x="48" y="150" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Antel</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">internet</text>
<rect x="48" y="330" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="3"/><g transform="translate(68 356.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="112.0" y="368.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">ONT de Antel</text><text x="112.0" y="391.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">modo puente</text>
<path d="M163.0 234.0C163.0 286.8,163.0 277.2,163.0 330.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="163.0" cy="234.0" r="5" fill="#0A63B8"/><circle cx="163.0" cy="330.0" r="5" fill="#0A63B8"/>
<rect x="48" y="460" width="300" height="113" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="472" width="5" height="89" rx="2.5" fill="#0A63B8"/><text x="74.0" y="494.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El modo puente se pide a Antel</tspan><tspan x="74.0" dy="20.2">(MiAntel o 121); en fibra lo</tspan><tspan x="74.0" dy="20.2">cambia el proveedor de forma</tspan><tspan x="74.0" dy="20.2">remota.</tspan></text>
<rect x="440" y="130" width="712" height="420" rx="22" fill="#011E38"/>
<text x="468.0" y="170.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">MikroTik · RouterOS 7</text>
<text x="468.0" y="194.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">cada capa se apoya en la de abajo</text>
<rect x="468" y="220" width="656" height="52" rx="12" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><text x="796.0" y="251.4" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">lista WAN · masquerade · reglas  →  apuntan a pppoe-antel</text>
<rect x="468" y="290" width="656" height="78" rx="12" fill="#17A8D4"/>
<text x="488.0" y="322.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start">pppoe-antel  (interfaz lógica)</text>
<text x="488.0" y="350.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">usuario y contraseña · IP, ruta y DNS · MTU/MRU 1492</text>
<rect x="468" y="386" width="656" height="62" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="488.0" y="423.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#B45309" text-anchor="start">vlan-wan · a confirmar con Antel (solo si la piden)</text>
<rect x="468" y="466" width="656" height="56" rx="12" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="488.0" y="500.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">ether1 · puerto físico, sin IP ni cliente DHCP</text>
<path d="M278.0 372.0C359.0 372.0,359.0 494.0,440.0 494.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="278.0" cy="372.0" r="5" fill="#0A63B8"/><circle cx="440.0" cy="494.0" r="5" fill="#0A63B8"/><rect x="326.5" y="400.0" width="65.0" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="359.0" y="419.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">cable</text>
<text x="440.0" y="590.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#B45309" text-anchor="start"><tspan x="440.0" dy="0.0">Ninguna fuente leída confirma VLAN con el ONT en puente: probá primero sin VLAN</tspan><tspan x="440.0" dy="21.6">(pppoe-client/scan) y confirmalo con Antel.</tspan></text>
</svg>