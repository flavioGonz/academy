<rect x="48" y="488" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="500" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si activás el filtrado primero y la gestión todavía no está en su VLAN, el puerto por el que estás conectado deja de hablar con</tspan><tspan x="74.0" dy="21.6">el router. Por eso: rescate abierto, revisión de la tabla y recién ahí el interruptor.</tspan></text>
