<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Activá Safe Mode: el botón o Ctrl+X</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Activá Safe Mode: el botón o Ctrl+X</text>
<rect x="48" y="140" width="560" height="250" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 154a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="160" r="5" fill="#C2D4E6"/><circle cx="86" cy="160" r="5" fill="#C2D4E6"/><circle cx="104" cy="160" r="5" fill="#C2D4E6"/><text x="124.0" y="166.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">WinBox · admin@192.168.88.1</text>
<rect x="58" y="192" width="540" height="60" rx="10" fill="#F7FAFD" stroke="#DDE8F2" stroke-width="1.5"/>
<rect x="72" y="202" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="120.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">Undo</text>
<rect x="178" y="202" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="226.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">Redo</text>
<rect x="298" y="202" width="150" height="40" rx="10" fill="#17A8D4" stroke="#17A8D4" stroke-width="2"/><text x="373.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Safe Mode</text>
<rect x="468" y="202" width="116" height="40" rx="10" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="526.0" y="228.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">Disconnect</text>
<circle cx="448" cy="202" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="448.0" y="208.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="72.0" y="290.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Barra de arriba de WinBox 4 (esquema, no captura):</text>
<text x="72.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">Undo, Redo y el interruptor Safe Mode.</text>
<text x="72.0" y="354.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">En WebFig también hay botón Safe Mode.</text>
<rect x="660" y="140" width="490" height="130" rx="14" fill="#03213C"/><text x="678.0" y="166.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">NEW TERMINAL</text><text x="678.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">[admin@MikroTik] &gt;      Ctrl+X</text><text x="678.0" y="222.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FD3F0" text-anchor="start">[Safe Mode taken]</text><text x="678.0" y="248.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">[admin@MikroTik] &lt;SAFE&gt;</text>
<rect x="660.0" y="309" width="256.0" height="30" rx="15" fill="#E3F5EC"/><text x="788.0" y="330.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">Ctrl+X otra vez: confirma</text>
<rect x="660.0" y="357" width="219.2" height="30" rx="15" fill="#FCEAE6"/><text x="769.6" y="378.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">Ctrl+D: descarta todo</text>
<rect x="48" y="440" width="1102" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="452" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cuándo mirar la terminal</tspan></text><text x="74.0" y="500.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En un enlace malo, el botón puede quedar apretado sin que el router haya entrado en modo seguro. El aviso [Safe Mode taken] y</tspan><tspan x="74.0" dy="21.6">el &lt;SAFE&gt; en la terminal son la confirmación de que sí entró.</tspan></text>
</svg>