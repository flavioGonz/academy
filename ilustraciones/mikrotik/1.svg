<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Por dónde entro a un MikroTik recién sacado de la caja?</text>
<rect x="48" y="140" width="450" height="170" rx="20" fill="#011E38" stroke="#011E38" stroke-width="2"/><text x="68.0" y="178.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="start">Router de laboratorio</text><text x="68.0" y="202.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">RouterOS 7 · config de fábrica</text><rect x="68" y="232" width="74" height="54" rx="8" fill="#B45309" stroke="#B45309" stroke-width="2"/><rect x="88" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="105.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether1</text><rect x="152" y="232" width="74" height="54" rx="8" fill="#17A8D4" stroke="#17A8D4" stroke-width="2"/><rect x="172" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="189.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">ether2</text><rect x="236" y="232" width="74" height="54" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="256" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="273.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">ether3</text><rect x="320" y="232" width="74" height="54" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="340" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="357.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">ether4</text><rect x="404" y="232" width="74" height="54" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/><rect x="424" y="242" width="34" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/><text x="441.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">ether5</text>
<path d="M155.0 324v10H475.0v-10" fill="none" stroke="#6E88A1" stroke-width="2"/>
<rect x="288.8" y="347" width="136.4" height="30" rx="15" fill="#E5F0FB"/><text x="357.0" y="368.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">LAN · bridge</text>
<rect x="78.2" y="323" width="53.6" height="30" rx="15" fill="#FFF4DE"/><text x="105.0" y="344.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">WAN</text>
<path d="M105.0 364.0C105.0 394.8,105.0 389.2,105.0 420.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="105.0" cy="438" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(93.0 426)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="105.0" y="490.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#D2492F" text-anchor="middle">ether1 no:</text>
<text x="105.0" y="512.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#D2492F" text-anchor="middle">es la WAN</text>
<rect x="232" y="430" width="240" height="84" rx="16" fill="#FFFFFF" stroke="#17A8D4" stroke-width="3"/><g transform="translate(252 456.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="296.0" y="468.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook</text><text x="296.0" y="491.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">WinBox</text>
<path d="M352.0 430.0C270.6 430.0,270.6 310.0,189.1 310.0" fill="none" stroke="#0A63B8" stroke-width="4" stroke-linecap="round"/><circle cx="352.0" cy="430.0" r="5" fill="#0A63B8"/><circle cx="189.1" cy="310.0" r="5" fill="#0A63B8"/>
<circle cx="452" cy="430" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(440 418)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="232.0" y="560.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">Cualquier puerto LAN sirve (ether2 a ether5).</text>
<text x="600.0" y="160.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">DOS CAMINOS PARA ENTRAR</text>
<rect x="600" y="178" width="552" height="168" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(618 194) scale(1.15)" fill="none" stroke="#0A63B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="658.0" y="216.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Por IP · 192.168.88.1</text><text x="620.0" y="248.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="620.0" dy="0.0">El DHCP de fábrica le da a la notebook una IP de esa red. Es</tspan><tspan x="620.0" dy="21.6">el camino normal cuando el equipo tiene la config por</tspan><tspan x="620.0" dy="21.6">defecto.</tspan></text>
<rect x="600" y="362" width="552" height="192" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(618 378) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/></g><text x="658.0" y="400.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Por MAC · Neighbors</text><text x="620.0" y="432.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="620.0" dy="0.0">No necesita IP: WinBox habla con el equipo por la dirección</tspan><tspan x="620.0" dy="21.6">física. Te salva si la IP no responde, figura 0.0.0.0 o el</tspan><tspan x="620.0" dy="21.6">equipo no trae config (los CCR).</tspan></text>
<rect x="600" y="572" width="552" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="600" y="584" width="5" height="48" rx="2.5" fill="#B45309"/><text x="626.0" y="606.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="626.0" dy="0.0">La MAC no cruza routers: tenés que estar en el mismo segmento de</tspan><tspan x="626.0" dy="20.2">red que el equipo.</tspan></text>
</svg>