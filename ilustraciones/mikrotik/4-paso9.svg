<rect x="48" y="492" width="520" height="99" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="504" width="5" height="75" rx="2.5" fill="#D2492F"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Contador en 0</tspan></text><text x="74.0" y="553.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Manda la primera regla que coincide: la de abajo queda en 0</tspan><tspan x="74.0" dy="20.2">aunque esté bien escrita. move la devuelve a su lugar.</tspan></text>
<rect x="634" y="492" width="518" height="99" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="634" y="504" width="5" height="75" rx="2.5" fill="#0A63B8"/><text x="660.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="660.0" dy="0.0">¿Llega el paquete?</tspan></text><text x="660.0" y="553.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Si no sube ninguna, el tráfico no llega: mirá con Torch</tspan><tspan x="660.0" dy="20.2">(mientras corre, FastTrack se apaga).</tspan></text>
