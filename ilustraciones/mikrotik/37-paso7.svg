<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Dos cortes distintos, el mismo resultado</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 37 · PASO 7</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Dos cortes distintos, el mismo resultado</text>
<rect x="48" y="132" width="540" height="290" rx="18" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="172.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Corte 1 · la sesión se cae</text>
<rect x="68" y="196" width="500" height="40" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="84.0" y="221.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">pppoe-client disable pppoe-antel</text><rect x="68" y="250" width="500" height="40" rx="8" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><text x="84.0" y="275.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#B45309" text-anchor="start">pppoe-antel baja: la /32 queda inactiva</text><rect x="68" y="304" width="500" height="40" rx="8" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><text x="84.0" y="329.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start">las recursivas caen, entra la del DHCP</text><rect x="68" y="358" width="500" height="40" rx="8" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><text x="84.0" y="383.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start">masquerade borra sus conexiones solo</text>
<rect x="612" y="132" width="540" height="290" rx="18" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="636.0" y="172.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Corte 2 · PPPoE arriba, sin internet</text>
<rect x="632" y="196" width="500" height="40" rx="8" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><text x="648.0" y="221.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">drop en output a los testigos</text><rect x="632" y="250" width="500" height="40" rx="8" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><text x="648.0" y="275.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#B45309" text-anchor="start">la sesión sigue: solo los testigos fallan</text><rect x="632" y="304" width="500" height="40" rx="8" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><text x="648.0" y="329.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start">las recursivas caen, entra la del DHCP</text><rect x="632" y="358" width="500" height="40" rx="8" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><text x="648.0" y="383.5" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#B45309" text-anchor="start">las conexiones por la fibra quedan</text>
<rect x="48" y="446" width="1104" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(66 462) scale(1.15)" fill="none" stroke="#0A63B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17h.01"/></g><text x="106.0" y="484.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Al volver la fibra</text><text x="68.0" y="516.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Lo que se armó por el 4G sigue en conntrack, porque ether2 nunca bajó: una llamada SIP o una VPN pueden quedar colgadas. Miralo</tspan><tspan x="68.0" dy="21.6">con /ip/firewall/connection/print where reply-dst-address~&quot;^192.168.8.&quot; y, si hace falta, un Netwatch que borra las conexiones</tspan><tspan x="68.0" dy="21.6">UDP cuando vuelve el testigo.</tspan></text>
</svg>