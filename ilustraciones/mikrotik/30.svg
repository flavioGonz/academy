<path d="M754.0 260.0C827.0 260.0,827.0 232.0,900.0 232.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="785.9" y="215.0" width="82.2" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="827.0" y="234.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">servers</text>
<path d="M900.0 422.0C827.0 422.0,827.0 360.0,754.0 360.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<circle cx="815" cy="395" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(803 383)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<rect x="450" y="500" width="700" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="450" y="512" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="476.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="476.0" dy="0.0">drop en input: la defconf ya lo hace</tspan></text><text x="476.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="476.0" dy="0.0">Con firewall propio, dos reglas de input: drop UDP y TCP 53 desde la lista</tspan><tspan x="476.0" dy="21.6">WAN. Si no, el router es un resolver abierto y presta su enlace a ataques de</tspan><tspan x="476.0" dy="21.6">amplificación.</tspan></text>
<rect x="40" y="500" width="380" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="40" y="512" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="66.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="66.0" dy="0.0">El DHCP le entrega 192.168.88.1 como DNS</tspan><tspan x="66.0" dy="21.6">a la LAN.</tspan></text>
