<rect x="612" y="488" width="540" height="120" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(630 504) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="670.0" y="526.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Back To Home</text><text x="632.0" y="558.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">WireGuard por los relays de MikroTik. Anda aunque no haya IP</tspan><tspan x="632.0" dy="21.6">pública.</tspan></text>
