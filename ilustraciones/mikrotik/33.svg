<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Qué frena cada regla de protección</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 33</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Qué frena cada regla de protección</text>
<rect x="48" y="124" width="1104" height="440" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 136a12 12 0 0 1 12 -12h1080a12 12 0 0 1 12 12v28h-1104z" fill="#E5F0FB"/><text x="64.0" y="149.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CADENA</text><text x="214.0" y="149.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">REGLA</text><text x="684.0" y="149.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ FRENA</text><rect x="62.0" y="168.0" width="72.0" height="30" rx="15" fill="#0A63B8"/><text x="98.0" y="189.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">input</text><text x="214.0" y="189.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#04223D" text-anchor="start">accept established,related,untracked</text><text x="684.0" y="189.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">las respuestas de lo que ya aceptaste</text><path d="M60 204H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="208.0" width="72.0" height="30" rx="15" fill="#0A63B8"/><text x="98.0" y="229.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">input</text><text x="214.0" y="229.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">drop invalid</text><text x="684.0" y="229.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">paquetes que no son de ninguna conexión</text><path d="M60 244H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="248.0" width="72.0" height="30" rx="15" fill="#0A63B8"/><text x="98.0" y="269.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">input</text><text x="214.0" y="269.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#04223D" text-anchor="start">accept ICMP (ping WAN a 5/s)</text><text x="684.0" y="269.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">ping y avisos de error; el de afuera, limitado</text><path d="M60 284H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="288.0" width="72.0" height="30" rx="15" fill="#0A63B8"/><text x="98.0" y="309.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">input</text><text x="214.0" y="309.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#0E8F5E" text-anchor="start">accept src-address-list=admins</text><text x="684.0" y="309.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">tu gestión, siempre antes de cualquier drop</text><path d="M60 324H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="328.0" width="72.0" height="30" rx="15" fill="#0A63B8"/><text x="98.0" y="349.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">input</text><text x="214.0" y="349.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">drop all not coming from LAN</text><text x="684.0" y="349.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">todo lo demás que llega al router de afuera</text><path d="M60 364H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="368.0" width="90.4" height="30" rx="15" fill="#17A8D4"/><text x="107.2" y="389.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">forward</text><text x="214.0" y="389.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#04223D" text-anchor="start">fasttrack + accept established</text><text x="684.0" y="389.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">velocidad para lo que ya está aceptado</text><path d="M60 404H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="408.0" width="90.4" height="30" rx="15" fill="#17A8D4"/><text x="107.2" y="429.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">forward</text><text x="214.0" y="429.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">drop invalid</text><text x="684.0" y="429.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">basura y paquetes sin conexión conocida</text><path d="M60 444H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="448.0" width="90.4" height="30" rx="15" fill="#17A8D4"/><text x="107.2" y="469.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">forward</text><text x="214.0" y="469.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">drop WAN not DSTNATed</text><text x="684.0" y="469.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">de afuera hacia la LAN sin port forwarding</text><path d="M60 484H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="488.0" width="72.0" height="30" rx="15" fill="#FFF4DE"/><text x="98.0" y="509.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">extra</text><text x="214.0" y="509.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D2492F" text-anchor="start">drop UDP/TCP 53 desde WAN</text><text x="684.0" y="509.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">el DNS del router usado para amplificar</text><path d="M60 524H1140" stroke="#DDE8F2" stroke-width="1"/><rect x="62.0" y="528.0" width="72.0" height="30" rx="15" fill="#FFF4DE"/><text x="98.0" y="549.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">extra</text><text x="214.0" y="549.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#04223D" text-anchor="start">listas SSH por etapas</text><text x="684.0" y="549.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">fuerza bruta, solo si SSH quedó expuesto</text>
<rect x="48" y="580" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="592" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="614.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Se lee de arriba abajo y manda la primera que coincide. Lo permitido va arriba del drop; lo extra no reemplaza a no exponer</tspan><tspan x="74.0" dy="21.6">gestión ni DNS.</tspan></text>
</svg>