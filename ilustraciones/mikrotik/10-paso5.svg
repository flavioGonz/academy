<rect x="948" y="400" width="180" height="70" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="1038.0" y="432.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">NVR</text><text x="1038.0" y="454.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">192.168.88.50</text>
<path d="M722.0 398.0C722.0 335.3,798.0 346.7,798.0 284.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="642.0" y="330.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start">a 203.0.113.10</text>
<text x="642.0" y="350.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start">:8000</text>
<path d="M964.0 284.0C964.0 346.7,1036.0 335.3,1036.0 398.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="1022.0" y="330.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start">dst-nat</text>
<path d="M1012.0 398.0C1012.0 336.4,942.0 347.6,942.0 286.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<path d="M822.0 286.0C822.0 347.6,752.0 336.4,752.0 398.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="636.0" y="504.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#0E8F5E" text-anchor="start"><tspan x="636.0" dy="0.0">El NVR ve como origen al router: le contesta al router, y el</tspan><tspan x="636.0" dy="20.2">router se lo devuelve a la PC.</tspan></text>
<rect x="48" y="560" width="1104" height="72" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="572" width="5" height="48" rx="2.5" fill="#B45309"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con hairpin, el dst-nat cambia: en lugar de in-interface-list=WAN usa dst-address-type=local dst-address=!192.168.88.1, para no tapar</tspan><tspan x="74.0" dy="20.2">el acceso al propio router.</tspan></text>
</svg>