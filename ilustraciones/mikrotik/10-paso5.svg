<text x="458.0" y="330.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="start">dst-nat</text>
<path d="M382.0 446.0C319.0 446.0,319.0 446.0,256.0 446.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<text x="318.0" y="430.0" font-family="Instrument Sans" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">contesta directo</text>
<text x="72.0" y="504.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start"><tspan x="72.0" dy="0.0">La PC esperaba respuesta de 203.0.113.10, le llega de</tspan><tspan x="72.0" dy="20.2">192.168.88.50 y la descarta.</tspan></text>
<rect x="612" y="140" width="540" height="400" rx="18" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="644" cy="174" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(632 162)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="674.0" y="181.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Con hairpin (masquerade)</text>
