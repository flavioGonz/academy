<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El signo $ dentro de comillas acorta la clave</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El signo $ dentro de comillas acorta la clave</text>
<text x="48.0" y="142.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">LO QUE ESCRIBÍS</text>
<text x="700.0" y="142.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">LO QUE QUEDA GUARDADO</text>
<rect x="48" y="180" width="560" height="70" rx="12" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="70.0" y="222.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">password=&quot;Clave$Lab2026&quot;</text>
<path d="M612.0 215.0C652.0 215.0,652.0 215.0,692.0 215.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<rect x="700" y="180" width="452" height="70" rx="12" fill="#FFFFFF" stroke="#D2492F" stroke-width="2"/>
<text x="722.0" y="222.0" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Clave</text>
<text x="1130.0" y="222.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="end">más corta, sin aviso</text>
<circle cx="48" cy="180" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(36 168)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<rect x="48" y="310" width="560" height="70" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="70.0" y="352.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">password=&quot;Clave\$Lab2026&quot;</text>
<path d="M612.0 345.0C652.0 345.0,652.0 345.0,692.0 345.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="700" y="310" width="452" height="70" rx="12" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2"/>
<text x="722.0" y="352.0" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Clave$Lab2026</text>
<text x="1130.0" y="352.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="end">completa</text>
<circle cx="48" cy="310" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(36 298)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<rect x="48" y="420" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="432" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué pasa</tspan></text><text x="74.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Entre comillas, RouterOS lee $Lab2026 como una variable. Como no existe, la reemplaza por nada y la clave queda en Clave. Con</tspan><tspan x="74.0" dy="21.6">la barra invertida, \$ es un signo pesos común.</tspan></text>
<rect x="48" y="556" width="1104" height="52" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="568" width="5" height="28" rx="2.5" fill="#B45309"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ejemplo de clave solo para el laboratorio: en obra usá 12 caracteres o más y guardala en el gestor de claves.</tspan></text>
</svg>