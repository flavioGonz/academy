<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Primero preguntá, después mirá, después capturá</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Primero preguntá, después mirá, después capturá</text>
<rect x="48" y="228" width="249" height="342" rx="16" fill="#011E38" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="262.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">1 · Preguntar</text>
<rect x="68" y="282" width="209" height="38" rx="12" fill="#17A8D4"/><text x="172.5" y="306.8" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">ping · traceroute</text>
<text x="68.0" y="358.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="68.0" dy="0.0">¿Hay camino hasta</tspan><tspan x="68.0" dy="23.0">8.8.8.8? ¿Hasta qué</tspan><tspan x="68.0" dy="23.0">salto llega?</tspan></text>
<text x="68.0" y="526.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start"><tspan x="68.0" dy="0.0">Genera tráfico de prueba.</tspan></text>
<path d="M301.0 428.0L329.0 428.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="333" y="202" width="249" height="368" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="353.0" y="236.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">2 · Mirar</text>
<rect x="353" y="256" width="209" height="38" rx="12" fill="#0A63B8"/><text x="457.5" y="280.8" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Torch</text>
<text x="353.0" y="332.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="353.0" dy="0.0">¿Qué hace la cámara</tspan><tspan x="353.0" dy="23.0">ahora? Flujos y tasas</tspan><tspan x="353.0" dy="23.0">en vivo.</tspan></text>
<text x="353.0" y="526.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="353.0" dy="0.0">No genera nada: observa.</tspan></text>
<path d="M586.0 402.0L614.0 402.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="618" y="176" width="249" height="394" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="638.0" y="210.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">3 · Capturar</text>
<rect x="638" y="230" width="209" height="38" rx="12" fill="#0A63B8"/><text x="742.5" y="254.8" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">sniffer → .pcap</text>
<text x="638.0" y="306.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">¿Qué dicen los</tspan><tspan x="638.0" dy="23.0">paquetes? Se abre en</tspan><tspan x="638.0" dy="23.0">Wireshark.</tspan></text>
<text x="638.0" y="526.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="638.0" dy="0.0">Guarda a archivo.</tspan></text>
<path d="M871.0 376.0L899.0 376.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="903" y="150" width="249" height="420" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="923.0" y="184.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">4 · Registrar</text>
<rect x="923" y="204" width="209" height="38" rx="12" fill="#0A63B8"/><text x="1027.5" y="228.8" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">log=yes</text>
<text x="923.0" y="280.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="923.0" dy="0.0">¿Qué regla del firewall</tspan><tspan x="923.0" dy="23.0">descarta y a quién?</tspan></text>
<text x="923.0" y="526.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="923.0" dy="0.0">Temporal: después log=no.</tspan></text>
<text x="48.0" y="632.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Subís de escalón solo si el anterior no alcanza para explicar la falla.</text>
</svg>