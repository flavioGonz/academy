<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>DoH: dos paliativos y lo que queda afuera</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 31 · PASO 6</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">DoH: dos paliativos y lo que queda afuera</text>
<rect x="48" y="150" width="350" height="190" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(66 166) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="106.0" y="188.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Firefox</text><text x="68.0" y="220.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Antes de prender DoH por su cuenta</tspan><tspan x="68.0" dy="21.6">pregunta por use-application-dns.net.</tspan><tspan x="68.0" dy="21.6">Si el router contesta NXDOMAIN, no lo</tspan><tspan x="68.0" dy="21.6">prende.</tspan></text>
<rect x="425" y="150" width="350" height="190" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(443 166) scale(1.15)" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="483.0" y="188.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">DNS sobre TLS</text><text x="445.0" y="220.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="445.0" dy="0.0">Reject al TCP 853 desde la LAN: los</tspan><tspan x="445.0" dy="21.6">equipos que usan DoT vuelven al 53,</tspan><tspan x="445.0" dy="21.6">que ya se redirige.</tspan></text>
<rect x="802" y="150" width="350" height="190" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(820 166) scale(1.15)" fill="none" stroke="#D2492F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g><text x="860.0" y="188.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Queda afuera</text><text x="822.0" y="220.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="822.0" dy="0.0">DoH configurado a mano, apps con DoH</tspan><tspan x="822.0" dy="21.6">propio y VPN. Van por el 443 como</tspan><tspan x="822.0" dy="21.6">cualquier sitio y no se redirigen.</tspan></text>
<rect x="48" y="380" width="1104" height="162" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="66.0" y="407.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL (resumen)</text><text x="66.0" y="436.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/dns/static/add name=use-application-dns.net type=NXDOMAIN</text><text x="66.0" y="464.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/firewall/filter/add chain=forward in-interface-list=LAN protocol=tcp dst-port=853 action=reject</text><text x="66.0" y="492.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">/tool/torch bridge src-address=192.168.88.254/32 ip-protocol=tcp port=443</text><text x="66.0" y="520.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start"># ¿aparece 8.8.8.8 o 1.1.1.1 en el 443? es DoH</text>
</svg>