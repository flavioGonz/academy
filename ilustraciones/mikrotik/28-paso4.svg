<rect x="48" y="440" width="540" height="130" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="68.0" y="478.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Opción 1 · Ruta de vuelta</text><text x="68.0" y="510.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">En la central: dst-address=192.168.88.0/24 gateway=10.255.1.2.</tspan><tspan x="68.0" dy="20.2">Lo limpio: desde allá también pueden llegar a tus equipos.</tspan></text>
<rect x="612" y="440" width="540" height="130" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="632.0" y="478.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Opción 2 · Masquerade al túnel (paso 5)</text><text x="632.0" y="510.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Si no podés tocar la central: todo llega como 10.255.1.2. Desde</tspan><tspan x="632.0" dy="20.2">allá no pueden iniciar conexiones a tus equipos.</tspan></text>
