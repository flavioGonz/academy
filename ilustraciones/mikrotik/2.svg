<rect x="48" y="510" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="522" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="544.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué no alcanza con admin y read</tspan></text><text x="74.0" y="571.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El grupo read de fábrica puede reiniciar y ver configuración sensible. Para alguien que solo mira, armá un grupo propio como</tspan><tspan x="74.0" dy="21.6">monitoreo. Para dar de baja a un técnico, deshabilitás su usuario y nadie más cambia la clave.</tspan></text>
