<text x="78.0" y="380.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="78.0" dy="0.0">El cliente DHCP y la IP fija compiten por la misma</tspan><tspan x="78.0" dy="23.0">interfaz: dos direcciones y dos rutas por defecto</tspan><tspan x="78.0" dy="23.0">posibles en ether1.</tspan></text>
<text x="652.0" y="380.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="652.0" dy="0.0">Una sola fuente: dirección, ruta y DNS cargados a</tspan><tspan x="652.0" dy="23.0">mano, con comment=&quot;WAN fija&quot; para encontrarlos</tspan><tspan x="652.0" dy="23.0">después.</tspan></text>
