<rect x="660" y="140" width="492" height="200" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="678.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">NOTEBOOK · LINUX O MAC</text><text x="678.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ diff antes.rsc despues.rsc</text><text x="678.0" y="226.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#FCD34D" text-anchor="start">&lt; # &lt;fecha 10:02&gt; by RouterOS 7.x</text><text x="678.0" y="256.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#FCD34D" text-anchor="start">&gt; # &lt;fecha 10:09&gt; by RouterOS 7.x</text><text x="678.0" y="286.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6EE7B7" text-anchor="start">&gt; /system identity</text><text x="678.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6EE7B7" text-anchor="start">&gt; set name=LAB-MT01</text>
<text x="660.0" y="370.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">En Windows: fc antes.rsc despues.rsc</text>
<rect x="48" y="430" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="442" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cómo se lee</tspan></text><text x="74.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">&lt; es lo que estaba en el archivo de antes, &gt; lo que aparece</tspan><tspan x="74.0" dy="21.6">en el de después. Lo verde es tu cambio.</tspan></text>
<rect x="612" y="430" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="442" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="464.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">La línea ámbar no cuenta</tspan></text><text x="638.0" y="490.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La primera línea trae la fecha del export: siempre cambia.</tspan><tspan x="638.0" dy="21.6">No es un cambio de configuración.</tspan></text>
