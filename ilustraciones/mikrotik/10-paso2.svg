<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada parte del dst-nat cierra una puerta</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada parte del dst-nat cierra una puerta</text>
<rect x="48" y="140" width="1104" height="84" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<rect x="68.0" y="169" width="101.6" height="30" rx="15" fill="#011E38"/><text x="118.8" y="190.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Por dónde</text>
<text x="200.0" y="176.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">in-interface-list=WAN</text>
<text x="200.0" y="204.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Solo lo que llega desde internet, por cualquier WAN de la lista.</text>
<rect x="48" y="240" width="1104" height="84" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<rect x="68.0" y="269" width="110.0" height="30" rx="15" fill="#011E38"/><text x="123.0" y="290.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Qué puerto</text>
<text x="200.0" y="276.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">protocol=tcp dst-port=8000</text>
<text x="200.0" y="304.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Solo el puerto que usa la app del NVR. Nada de &quot;todos por las dudas&quot;.</text>
<rect x="48" y="340" width="1104" height="84" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/>
<rect x="68.0" y="369" width="68.0" height="30" rx="15" fill="#011E38"/><text x="102.0" y="390.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Quién</text>
<text x="200.0" y="376.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">src-address-list=nvr-permitidos</text>
<text x="200.0" y="404.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Solo las IP que están en la lista. Las demás ni llegan al NVR.</text>
<rect x="48" y="440" width="1104" height="84" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<rect x="68.0" y="469" width="84.8" height="30" rx="15" fill="#011E38"/><text x="110.4" y="490.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">A dónde</text>
<text x="200.0" y="476.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0A63B8" text-anchor="start">to-addresses=192.168.88.50 to-ports=8000</text>
<text x="200.0" y="504.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">La IP interna del NVR y su puerto real.</text>
<rect x="48" y="548" width="1104" height="78" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="66.0" y="575.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">LA LISTA, CON FECHA DE REVISIÓN</text><text x="66.0" y="604.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#D9E9F8" text-anchor="start">/ip/firewall/address-list/add list=nvr-permitidos address=203.0.113.25 comment=&quot;central monitoreo ejemplo, revisar 2027-04&quot;</text>
</svg>