<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Elegí el canal antes de buscar la actualización</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Elegí el canal antes de buscar la actualización</text>
<rect x="48" y="140" width="700" height="72" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="2.5"/>
<circle cx="84" cy="176" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(72 164)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="120.0" y="170.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">long-term</text>
<text x="120.0" y="196.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Sale poco y trae solo arreglos críticos. Para el equipo que no se puede caer.</text>

<rect x="618.0" y="151" width="110.0" height="30" rx="15" fill="#E3F5EC"/><text x="673.0" y="172.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">producción</text>
<rect x="48" y="224" width="700" height="72" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<circle cx="84" cy="260" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(72 248)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="120.0" y="254.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">stable</text>
<text x="120.0" y="280.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Cada pocos meses, con funciones nuevas ya probadas.</text>

<rect x="618.0" y="235" width="110.0" height="30" rx="15" fill="#E3F5EC"/><text x="673.0" y="256.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">producción</text>
<rect x="48" y="308" width="700" height="72" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<circle cx="84" cy="344" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(72 332)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="120.0" y="338.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">testing</text>
<text x="120.0" y="364.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Cada pocas semanas, con prueba interna básica.</text>

<rect x="584.4" y="319" width="143.6" height="30" rx="15" fill="#FCEAE6"/><text x="656.2" y="340.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">no en clientes</text>
<rect x="48" y="392" width="700" height="72" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/>
<circle cx="84" cy="428" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(72 416)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="120.0" y="422.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">development</text>
<text x="120.0" y="448.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Para entusiastas y laboratorio.</text>

<rect x="584.4" y="403" width="143.6" height="30" rx="15" fill="#FCEAE6"/><text x="656.2" y="424.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">no en clientes</text>
<rect x="780" y="140" width="372" height="162" rx="14" fill="#03213C" stroke="#03213C" stroke-width="0"/><text x="798.0" y="167.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">TERMINAL</text><text x="798.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">…/update/set channel=long-term</text><text x="798.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">…/update/check-for-updates</text><text x="798.0" y="252.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7DD3FC" text-anchor="start">…/update/install</text><text x="798.0" y="280.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7FA6C9" text-anchor="start"># descarga, instala y reinicia</text>
<text x="780.0" y="328.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">…/update = /system/package/update</text>
<rect x="48" y="484" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="496" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="518.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Entre long-term y stable no hay un ganador: lo importante es no quedarse años sin actualizar. Según Eclypsium, unos 300.000</tspan><tspan x="74.0" dy="21.6">MikroTik seguían vulnerables a fallas que ya tenían parche.</tspan></text>
</svg>