<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Una IP: dirección, máscara e interfaz</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · LECCIÓN 26</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Una IP: dirección, máscara e interfaz</text>
<rect x="48" y="130" width="640" height="110" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="168.0" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#0A63B8" text-anchor="start">/ip/address/add</text>
<text x="72.0" y="214.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">address=10.10.20.1/24 interface=ether5</text>
<text x="48.0" y="286.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">LO QUE ROUTEROS CALCULA SOLO</text>
<rect x="48" y="304" width="640" height="230" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 316a12 12 0 0 1 12 -12h616a12 12 0 0 1 12 12v34h-640z" fill="#E5F0FB"/><text x="64.0" y="332.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">QUÉ</text><text x="274.0" y="332.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">VALOR</text><text x="64.0" y="378.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">red</text><text x="274.0" y="378.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">10.10.20.0</text><path d="M60 396H676" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="424.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">hosts</text><text x="274.0" y="424.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">10.10.20.1 a 10.10.20.254</text><path d="M60 442H676" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="470.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">broadcast</text><text x="274.0" y="470.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">10.10.20.255</text><path d="M60 488H676" stroke="#DDE8F2" stroke-width="1"/><text x="64.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#04223D" text-anchor="start">ruta conectada</text><rect x="272.0" y="495.0" width="246.8" height="30" rx="15" fill="#17A8D4"/><text x="395.4" y="516.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">DAc 10.10.20.0/24 ether5</text>
<text x="740.0" y="146.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.6">¿DÓNDE VA LA IP?</text>
<rect x="740" y="180" width="412" height="78" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/>
<circle cx="774" cy="219" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(762 207)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="806.0" y="214.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">En el bridge</text>
<text x="806.0" y="238.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#41627F" text-anchor="start">la LAN de la defconf: 192.168.88.1/24</text>
<rect x="740" y="272" width="412" height="78" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/>
<circle cx="774" cy="311" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(762 299)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="806.0" y="306.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">En una interfaz VLAN</text>
<text x="806.0" y="330.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#41627F" text-anchor="start">vlan20-cctv sobre el bridge</text>
<rect x="740" y="364" width="412" height="78" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/>
<circle cx="774" cy="403" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(762 391)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="806.0" y="398.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">En un puerto ruteado</text>
<text x="806.0" y="422.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#41627F" text-anchor="start">ether5 fuera del bridge</text>
<rect x="740" y="456" width="412" height="78" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/>
<circle cx="774" cy="495" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(762 483)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="806.0" y="490.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">En un puerto dentro del bridge</text>
<text x="806.0" y="514.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#41627F" text-anchor="start">es esclavo: termina en el bridge</text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">Una interfaz puede tener varias IP, o ninguna.</text>
</svg>