<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El CHR arranca con admin sin contraseña: endurecelo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">MIKROTIK · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El CHR arranca con admin sin contraseña: endurecelo</text>
<rect x="48" y="136" width="700" height="62" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="167" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="84.0" y="173.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="116.0" y="163.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Creá tu usuario</text>
<text x="116.0" y="186.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">/user/add name=tecnico-lucia group=full</text>
<rect x="48" y="210" width="700" height="62" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<circle cx="84" cy="241" r="17" fill="#B45309" stroke="#FFFFFF" stroke-width="3"/><text x="84.0" y="247.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="116.0" y="237.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Entrá con ese usuario y probá</text>
<text x="116.0" y="260.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">recién ahí seguí</text>
<rect x="48" y="284" width="700" height="62" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="315" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="84.0" y="321.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="116.0" y="311.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Deshabilitá admin</text>
<text x="116.0" y="334.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">/user/disable admin</text>
<rect x="48" y="358" width="700" height="62" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="389" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="84.0" y="395.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="116.0" y="385.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Apagá servicios que no usás</text>
<text x="116.0" y="408.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">telnet, ftp, www, api, api-ssl</text>
<rect x="48" y="432" width="700" height="62" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="463" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="84.0" y="469.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="116.0" y="459.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">WinBox y SSH solo desde la oficina y el túnel</text>
<text x="116.0" y="482.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">available-from=203.0.113.50/32,10.10.10.0/24</text>
<rect x="48" y="506" width="700" height="62" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="84" cy="537" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="84.0" y="543.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="116.0" y="533.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">MAC server, discovery y DNS remoto</text>
<text x="116.0" y="556.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">en none / allow-remote-requests=no</text>
<rect x="784" y="136" width="368" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="784" y="148" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="810.0" y="170.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="810.0" dy="0.0">Día uno</tspan></text><text x="810.0" y="196.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="810.0" dy="0.0">Arranca en una IP pública con admin y</tspan><tspan x="810.0" dy="21.6">sin contraseña: endurecerlo es el</tspan><tspan x="810.0" dy="21.6">primer paso, no el último.</tspan></text>
<rect x="784" y="330" width="368" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="784" y="342" width="5" height="100" rx="2.5" fill="#B45309"/><text x="810.0" y="364.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="810.0" dy="0.0">El orden importa</tspan></text><text x="810.0" y="390.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="810.0" dy="0.0">Si deshabilitás admin antes de probar</tspan><tspan x="810.0" dy="21.6">tu usuario, te podés quedar afuera del</tspan><tspan x="810.0" dy="21.6">VPS.</tspan></text>
<rect x="784" y="494" width="368" height="72" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="784" y="506" width="5" height="48" rx="2.5" fill="#0A63B8"/><text x="810.0" y="528.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="810.0" dy="0.0">Después, el firewall de input (paso 2):</tspan><tspan x="810.0" dy="20.2">lista WAN creada a mano y drop del resto.</tspan></text>
</svg>