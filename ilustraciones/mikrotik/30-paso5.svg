<rect x="400" y="170" width="330" height="150" rx="18" fill="#011E38" stroke="#011E38" stroke-width="2"/>
<text x="565.0" y="212.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">MikroTik</text>
<text x="565.0" y="242.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="middle">use-doh-server=&lt;URL-DoH&gt;</text>
<text x="565.0" y="268.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#D9E9F8" text-anchor="middle">verify-doh-cert=yes</text>
<text x="565.0" y="294.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">servers: solo para el nombre DoH</text>
<rect x="900" y="160" width="252" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(920 186.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></g><text x="964.0" y="198.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Servidor DoH</text><text x="964.0" y="221.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">HTTPS · TCP 443</text>
<rect x="900" y="300" width="252" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(920 326.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="964.0" y="338.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">DNS comunes</text><text x="964.0" y="361.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">servers</text>
<path d="M282.0 245.0C339.0 245.0,339.0 245.0,396.0 245.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<path d="M734.0 215.0C815.0 215.0,815.0 200.0,896.0 200.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/><rect x="752.4" y="176.5" width="125.2" height="28" rx="14" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="1.5"/><text x="815.0" y="195.5" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="middle">cifrado :443</text>
<path d="M734.0 290.0C815.0 290.0,815.0 342.0,896.0 342.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/><rect x="739.5" y="327.0" width="151.0" height="28" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="1.5"/><text x="815.0" y="346.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">no son respaldo</text>
<rect x="48" y="420" width="540" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="432" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que dice la documentación 7.25</tspan></text><text x="74.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si el servidor DoH no responde, toda la LAN recibe</tspan><tspan x="74.0" dy="21.6">SERVFAIL. El router no vuelve solo a los DNS comunes.</tspan></text>
<rect x="612" y="420" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="432" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Antes de dejarlo en un cliente</tspan></text><text x="638.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Algunos servicios piden HTTP/2: solo ARM64 y x86.</tspan><tspan x="638.0" dy="21.6">Cloudflare, Google, NextDNS y OpenDNS andan en todos.</tspan><tspan x="638.0" dy="21.6">Errores: /log/print where topics~&quot;dns&quot;.</tspan></text>
</svg>