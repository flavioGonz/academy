<rect x="930" y="140" width="222" height="113" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="930" y="152" width="5" height="89" rx="2.5" fill="#0A63B8"/><text x="956.0" y="174.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="956.0" dy="0.0">Si no existe la lista</tspan><tspan x="956.0" dy="20.2">WAN:</tspan><tspan x="956.0" dy="20.2">/interface/list/add</tspan><tspan x="956.0" dy="20.2">name=WAN</tspan></text>
<rect x="930" y="330" width="222" height="113" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="930" y="342" width="5" height="89" rx="2.5" fill="#B45309"/><text x="956.0" y="364.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="956.0" dy="0.0">Antes de enchufar</tspan><tspan x="956.0" dy="20.2">internet a un CRS:</tspan><tspan x="956.0" dy="20.2">firewall (lección de</tspan><tspan x="956.0" dy="20.2">cerrar puertas).</tspan></text>
<rect x="48" y="560" width="820" height="52" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="572" width="5" height="28" rx="2.5" fill="#D2492F"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Hacelo desde otro puerto y en Safe Mode: si sacás del bridge el puerto por donde entrás, te cortás.</tspan></text>
