<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada placa cae en un perfil; la regla actúa en el suyo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada placa cae en un perfil; la regla actúa en el suyo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="352" height="120" rx="16" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="68.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Dominio</text>
<text x="68.0" y="202.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">unida a Active Directory</text>
<text x="68.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">entra: bloqueado salvo regla</text>
<rect x="420" y="128" width="352" height="120" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="440.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Privado</text>
<text x="440.0" y="202.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">una red tuya, de confianza</text>
<text x="440.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">entra: bloqueado salvo regla</text>
<rect x="792" y="128" width="352" height="120" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="812.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Público</text>
<text x="812.0" y="202.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">cualquier red ajena</text>
<text x="812.0" y="228.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">entra: bloqueado salvo regla</text>
<text x="48.0" y="290.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">La regla &#x27;LAB VMS web 8443&#x27; tiene -Profile Private,Domain</text>
<rect x="48" y="312" width="540" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="86" cy="352" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(74 340)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="118.0" y="359.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#0E8F5E" text-anchor="start">Placa en Privado</text>
<text x="72.0" y="400.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Su perfil está activo: la regla actúa y el 8443 entra</tspan><tspan x="72.0" dy="21.6">desde la subred local.</tspan></text>
<rect x="612" y="312" width="540" height="150" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="650" cy="352" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(638 340)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="682.0" y="359.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#D2492F" text-anchor="start">Placa en Público</text>
<text x="636.0" y="400.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">La regla existe pero no actúa: para esa placa, es como si</tspan><tspan x="636.0" dy="21.6">no estuviera. El 8443 queda bloqueado.</tspan></text>
<rect x="48" y="492" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="504" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="526.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Perfil primero, regla después</tspan></text><text x="74.0" y="553.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Antes de crear nada, mirá el perfil con Get-NetConnectionProfile. Después abrí por puerto o por programa, con origen limitado,</tspan><tspan x="74.0" dy="21.6">y exportá la configuración antes de tocar.</tspan></text>
</svg>