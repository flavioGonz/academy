<rect x="48" y="176" width="252" height="120" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="80" cy="214" r="18" fill="#17A8D4"/><text x="80.0" y="220.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="108.0" y="221.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Encendido</text>
<text x="68.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">funcionando</text>
