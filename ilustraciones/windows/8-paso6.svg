<text x="676.0" y="221.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Vuelve la luz</text>
<text x="636.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Power On: arranca solo</text>
