<circle cx="932" cy="214" r="18" fill="#17A8D4"/><text x="932.0" y="220.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="960.0" y="221.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Confirmá</text>
<text x="920.0" y="266.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">evento 6008</text>
<rect x="48" y="330" width="1104" height="131" rx="14" fill="#03213C"/><path d="M48 344a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v20h-1104z" fill="#0B3A66"/><text x="66.0" y="354.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="397.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Get-WinEvent -FilterHashtable @{LogName=&#x27;System&#x27;; Id=6008} -MaxEvents 3</text><text x="66.0" y="422.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">TimeCreated            Id    Mensaje</text><text x="66.0" y="447.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3F7" text-anchor="start">(fecha y hora)         6008  el apagado anterior fue inesperado</text>
<rect x="48" y="500" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El 6008 marca un apagado inesperado: corte de luz o pantallazo azul. Nunca hagas esta prueba en un servidor en producción con</tspan><tspan x="74.0" dy="21.6">discos girando.</tspan></text>
</svg>