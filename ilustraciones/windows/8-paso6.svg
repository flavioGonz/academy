<rect x="332" y="176" width="252" height="120" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="364" cy="214" r="18" fill="#D2492F"/><text x="364.0" y="220.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="392.0" y="221.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Corte</text>
