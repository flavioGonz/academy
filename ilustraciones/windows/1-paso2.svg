<rect x="48" y="528" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="540" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="562.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Va a la planilla</tspan></text><text x="74.0" y="589.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Anotalo en la planilla de obra junto con los dos valores de SMB: con edición, versión y build sabés qué reglas de seguridad</tspan><tspan x="74.0" dy="21.6">trae ese Windows antes de culpar a la red.</tspan></text>
