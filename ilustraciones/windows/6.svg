<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Escritorio remoto: por VPN y desde la subred de gestión</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Escritorio remoto: por VPN y desde la subred de gestión</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="150" width="210" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Internet</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">escaneos al 3389</text>
<rect x="48" y="400" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 426.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="112.0" y="438.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Técnico en la casa</text><text x="112.0" y="461.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">cliente VPN</text>
<rect x="400" y="270" width="310" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(420 296.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g><text x="464.0" y="308.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">Router del cliente</text><text x="464.0" y="331.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">VPN · sin reenvío al 3389</text>
<rect x="770" y="200" width="382" height="270" rx="22" fill="none" stroke="#0E8F5E" stroke-width="2" stroke-dasharray="7 7"/><rect x="788" y="186" width="209" height="28" rx="14" fill="#F7FAFD"/><text x="800.0" y="206.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0E8F5E" text-anchor="start">gestión 10.10.10.0/24</text>
<rect x="800" y="240" width="330" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(820 266.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="864.0" y="278.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Servidor del VMS</text><text x="864.0" y="301.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">RDP 3389 · NLA activa</text>
<rect x="800" y="350" width="330" height="40" rx="10" fill="#03213C"/><text x="816.0" y="374.9" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">-RemoteAddress 10.10.10.0/24</text>
<text x="806.0" y="420.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">La regla de RDP solo acepta</text>
<text x="806.0" y="444.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">esta subred.</text>
<path d="M258.0 192.0C329.0 192.0,329.0 300.0,400.0 300.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/><rect x="266.4" y="215.0" width="125.2" height="28" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="1.5"/><text x="329.0" y="234.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">3389 directo</text>
<circle cx="352" cy="272" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(340 260)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<path d="M278.0 442.0C416.5 442.0,416.5 354.0,555.0 354.0" fill="none" stroke="#6E88A1" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#a-gray)"/><rect x="366.8" y="367.0" width="99.4" height="28" rx="14" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="416.5" y="386.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="middle">túnel VPN</text>
<path d="M710.0 312.0C755.0 312.0,755.0 282.0,800.0 282.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="48" y="520" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="532" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El 3389 nunca abierto a internet</tspan></text><text x="74.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ni con contraseña larga ni con otro puerto: expuesto a</tspan><tspan x="74.0" dy="21.6">internet recibe fuerza bruta y bloqueos de cuenta todo el</tspan><tspan x="74.0" dy="21.6">día.</tspan></text>
<rect x="612" y="520" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="532" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="554.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Adentro, NLA y origen limitado</tspan></text><text x="638.0" y="581.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">NLA autentica antes de abrir la sesión y viene activada.</tspan><tspan x="638.0" dy="21.6">Cambiar el puerto solo baja el ruido de los escaneos.</tspan></text>
</svg>