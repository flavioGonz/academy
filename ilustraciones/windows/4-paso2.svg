<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Si no borrás la ruta vieja, quedan dos gateways</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Si no borrás la ruta vieja, quedan dos gateways</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="94.0" y="147.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Get-NetRoute -DestinationPrefix &#x27;0.0.0.0/0&#x27;</text>
<rect x="48" y="176" width="540" height="300" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="208.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Sin Remove-NetRoute</text>
<rect x="68" y="230" width="500" height="40" rx="10" fill="#03213C"/><text x="84.0" y="255.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">0.0.0.0/0   192.168.88.1   vieja</text>
<rect x="68" y="280" width="500" height="40" rx="10" fill="#03213C"/><text x="84.0" y="305.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">0.0.0.0/0   10.10.10.1     nueva</text>
<text x="72.0" y="360.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Dos rutas por defecto en la misma placa: el tráfico puede</tspan><tspan x="72.0" dy="21.6">salir por un gateway que ya no existe.</tspan></text>
<rect x="612" y="176" width="540" height="300" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="208.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Con Remove-NetRoute antes</text>
<rect x="632" y="230" width="500" height="40" rx="10" fill="#03213C"/><text x="648.0" y="255.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">0.0.0.0/0   10.10.10.1     nueva</text>
<text x="636.0" y="310.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">Una sola ruta por defecto, la que pusiste con</tspan><tspan x="636.0" dy="21.6">-DefaultGateway. Es lo que tenés que ver al verificar.</tspan></text>
<rect x="48" y="500" width="1104" height="102" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="512" width="5" height="78" rx="2.5" fill="#0A63B8"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">El orden del paso 2</tspan></text><text x="74.0" y="561.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Remove-NetIPAddress -InterfaceAlias $if -AddressFamily IPv4 y Remove-NetRoute -InterfaceAlias $if -DestinationPrefix</tspan><tspan x="74.0" dy="21.6">&#x27;0.0.0.0/0&#x27;, los dos con -Confirm:$false, antes de New-NetIPAddress. IPs de ejemplo.</tspan></text>
</svg>