="386" cy="184" r="4.5" fill="#0A63B8"/><circle cx="469" cy="308" r="4.5" fill="#0A63B8"/><circle cx="552" cy="297" r="4.5" fill="#0A63B8"/><circle cx="635" cy="284" r="4.5" fill="#0A63B8"/>
<text x="48.0" y="440.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#41627F" text-anchor="start">Ese día, en la misma columna:</text>
<rect x="48.0" y="455.0" width="254.6" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="175.3" y="476.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">instalación: aplicación nueva</text>
<rect x="330.0" y="455.0" width="175.1" height="29" rx="14.5" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="417.5" y="476.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="middle">falla de aplicación</text>
<text x="48.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Dibujo genérico: el índice va de 1 a 10 por día.</text>
<rect x="720" y="128" width="432" height="190" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="744.0" y="172.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#0A63B8" text-anchor="start">1074</text>
<text x="840.0" y="168.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">quién pidió el reinicio</text>
<text x="744.0" y="210.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="744.0" dy="0.0">Un usuario, el servicio de Windows Update como</tspan><tspan x="744.0" dy="21.6">SYSTEM o un programa: queda escrito con fecha</tspan><tspan x="744.0" dy="21.6">y hora.</tspan></text>
<rect x="720" y="336" width="432" height="190" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="744.0" y="380.0" font-family="JetBrains Mono" font-size="30" font-weight="700" fill="#D2492F" text-anchor="start">6008</text>
<text x="840.0" y="376.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">apagado inesperado</text>
<text x="744.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="744.0" dy="0.0">Nadie lo pidió: corte de luz o pantallazo</tspan><tspan x="744.0" dy="21.6">azul. Se lee junto con lo que pasó antes.</tspan></text>
<rect x="48" y="552" width="1104" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="564" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="586.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Get-WinEvent -FilterHashtable @{LogName=&#x27;System&#x27;; Id=1074} filtra en el origen: mucho más rápido que traer todo y filtrar con</tspan><tspan x="74.0" dy="21.6">Where-Object.</tspan></text>
</svg>