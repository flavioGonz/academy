<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un equipo 24/7 no duerme y vuelve solo tras un corte</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un equipo 24/7 no duerme y vuelve solo tras un corte</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="620" height="400" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">En Windows: powercfg</text>
<rect x="72" y="178" width="300" height="40" rx="10" fill="#03213C"/><text x="88.0" y="203.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">standby-timeout-ac 0</text>
<text x="392.0" y="204.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">suspensión: nunca</text>
<rect x="72" y="244" width="300" height="40" rx="10" fill="#03213C"/><text x="88.0" y="269.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">hibernate-timeout-ac 0</text>
<text x="392.0" y="270.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">hibernación: nunca</text>
<rect x="72" y="310" width="300" height="40" rx="10" fill="#03213C"/><text x="88.0" y="335.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">disk-timeout-ac 0</text>
<text x="392.0" y="336.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">apagar disco: nunca</text>
<rect x="72" y="376" width="300" height="40" rx="10" fill="#03213C"/><text x="88.0" y="401.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">monitor-timeout-ac 15</text>
<text x="392.0" y="402.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">el monitor sí se apaga</text>
<rect x="72" y="442" width="300" height="40" rx="10" fill="#03213C"/><text x="88.0" y="467.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">/hibernate off</text>
<text x="392.0" y="468.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="start">sin hibernación ni inicio rápido</text>
<text x="72.0" y="510.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">0 quiere decir &quot;nunca&quot;.</text>
<rect x="692" y="128" width="460" height="400" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="712.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">En el BIOS o UEFI</text>
<text x="716.0" y="196.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Restore on AC Power Loss</text>
<text x="716.0" y="222.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">o After Power Failure</text>
<rect x="716" y="256" width="412" height="64" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="736.0" y="284.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Power On</text>
<text x="736.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">vuelve siempre que vuelve la luz</text>
<rect x="716" y="336" width="412" height="64" rx="12" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="736.0" y="364.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#B45309" text-anchor="start">Last State</text>
<text x="736.0" y="388.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">solo si estaba prendido</text>
<rect x="716" y="416" width="412" height="64" rx="12" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<text x="736.0" y="444.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">Power Off</text>
<text x="736.0" y="468.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">queda apagado</text>
<rect x="48" y="552" width="1104" height="81" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="564" width="5" height="57" rx="2.5" fill="#B45309"/><text x="74.0" y="586.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Last State y la UPS</tspan></text><text x="74.0" y="613.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con una UPS que apaga el equipo en orden, &quot;Last State&quot; recuerda &quot;apagado&quot; y no vuelve: con UPS conviene Power On.</tspan></text>
</svg>