<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Valores de ejemplo: el número de proceso cambia en cada equipo</text>
<rect x="48" y="176" width="1104" height="181" rx="14" fill="#03213C"/><path d="M48 190a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v20h-1104z" fill="#0B3A66"/><text x="66.0" y="200.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="243.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Get-NetTCPConnection -State Listen | Sort-Object LocalPort |</text><text x="66.0" y="268.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">&gt;&gt;  Select-Object LocalAddress, LocalPort, OwningProcess</text><text x="66.0" y="293.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">LocalAddress    LocalPort  OwningProcess</text><text x="66.0" y="318.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3F7" text-anchor="start">0.0.0.0         135        1104</text><text x="66.0" y="343.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">192.168.88.10   139        4</text>
<rect x="58" y="300" width="1084" height="27" rx="6" fill="none" stroke="#17A8D4" stroke-width="2"/>
<rect x="48" y="404" width="700" height="106" rx="14" fill="#03213C"/><path d="M48 418a14 14 0 0 1 14 -14h672a14 14 0 0 1 14 14v20h-700z" fill="#0B3A66"/><text x="66.0" y="428.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="471.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Get-Process -Id 1104</text><text x="66.0" y="496.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3F7" text-anchor="start">ProcessName : svchost</text>
<path d="M300.0 324.0C300.0 365.8,300.0 358.2,300.0 400.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="316.0" y="370.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="start">OwningProcess → Get-Process</text>
<rect x="780" y="404" width="372" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="780" y="416" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="806.0" y="438.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="806.0" dy="0.0">LocalAddress</tspan></text><text x="806.0" y="464.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="806.0" dy="0.0">0.0.0.0 es todas las placas. Si figura</tspan><tspan x="806.0" dy="21.6">la IP de una placa, el servicio solo</tspan><tspan x="806.0" dy="21.6">atiende por esa.</tspan></text>
<rect x="48" y="556" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="568" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Lo mismo a la vieja usanza: netstat -ano | findstr LISTENING. La última columna es el mismo número de proceso.</tspan></text>
</svg>