<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Que el servicio arranque solo y vuelva si se cae</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Que el servicio arranque solo y vuelva si se cae</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="352" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Tipo de inicio</text>
<text x="72.0" y="194.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Automático</text>
<text x="72.0" y="218.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">start= auto</text>
<text x="72.0" y="252.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Automático retrasado</text>
<text x="72.0" y="276.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">start= delayed-auto</text>
<text x="72.0" y="310.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Manual</text>
<text x="72.0" y="334.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">start= demand</text>
<text x="72.0" y="368.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Deshabilitado</text>
<text x="72.0" y="392.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#6E88A1" text-anchor="start">start= disabled</text>
<text x="72.0" y="424.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Retrasado: si depende de la red</text>
<text x="72.0" y="446.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">o de la base de datos.</text>
<rect x="424" y="128" width="728" height="330" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="444.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Recuperación ante fallas</text>
<rect x="448" y="182" width="210" height="110" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="466.0" y="216.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">1.ª falla</text>
<text x="466.0" y="246.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">reiniciar</text>
<text x="466.0" y="274.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">a los 3 minutos</text>
<rect x="680" y="182" width="210" height="110" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="698.0" y="216.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">2.ª falla</text>
<text x="698.0" y="246.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">reiniciar</text>
<text x="698.0" y="274.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">a los 3 minutos</text>
<rect x="912" y="182" width="210" height="110" rx="14" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/>
<text x="930.0" y="216.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">siguientes</text>
<text x="930.0" y="246.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">reiniciar</text>
<text x="930.0" y="274.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">a los 3 minutos</text>
<rect x="448" y="316" width="680" height="56" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="468.0" y="350.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Contador a cero después de 24 h sin fallas</text>
<text x="468.0" y="412.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Valores de partida de una plantilla; con failureflag 1 también</text>
<text x="468.0" y="436.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">actúa si el servicio se detiene con error.</text>
<rect x="48" y="482" width="1104" height="150" rx="16" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/><text x="68.0" y="514.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Lo que no es servicio: tarea programada al inicio</text>
<rect x="72.0" y="552.0" width="99.6" height="28" rx="14.0" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="121.8" y="572.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">AtStartup</text>
<rect x="222.0" y="552.0" width="183.6" height="28" rx="14.0" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="313.8" y="572.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">NT AUTHORITY\SYSTEM</text>
<rect x="476.0" y="552.0" width="183.6" height="28" rx="14.0" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="567.8" y="572.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">sin sesión iniciada</text>
<rect x="692.0" y="552.0" width="158.4" height="28" rx="14.0" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="771.2" y="572.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">RunLevel Highest</text>
<rect x="894.0" y="552.0" width="158.4" height="28" rx="14.0" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="973.2" y="572.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">WorkingDirectory</text>
<text x="72.0" y="614.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Corre al encender aunque nadie entre al equipo, con privilegios altos y su propia carpeta.</text>
</svg>