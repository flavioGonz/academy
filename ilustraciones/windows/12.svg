<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Tres llaves, y ninguna vive solo dentro del equipo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres llaves, y ninguna vive solo dentro del equipo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="352" height="270" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(72 150) scale(1.6)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/></g>
<text x="122.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Administrador local</text>
<text x="122.0" y="198.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">único por equipo</text>
<circle cx="77" cy="244.7" r="4.5" fill="#0E8F5E"/><text x="92.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Windows LAPS si hay dominio</tspan></text><circle cx="77" cy="284.3" r="4.5" fill="#0E8F5E"/><text x="92.0" y="289.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">guardado en AD o Entra ID</tspan></text><circle cx="77" cy="323.9" r="4.5" fill="#B45309"/><text x="92.0" y="329.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">la puerta si el dominio no</tspan><tspan x="92.0" dy="21.6">responde</tspan></text>
<rect x="420" y="128" width="352" height="270" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(444 150) scale(1.6)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g>
<text x="494.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Clave de BitLocker</text>
<text x="494.0" y="198.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">48 dígitos de recuperación</text>
<circle cx="449" cy="244.7" r="4.5" fill="#0E8F5E"/><text x="464.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="464.0" dy="0.0">fuera del disco cifrado</tspan></text><circle cx="449" cy="284.3" r="4.5" fill="#0E8F5E"/><text x="464.0" y="289.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="464.0" dy="0.0">gestor de contraseñas o AD</tspan></text><circle cx="449" cy="323.9" r="4.5" fill="#B45309"/><text x="464.0" y="329.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="464.0" dy="0.0">sin ella no hay recuperación</tspan></text>
<rect x="792" y="128" width="352" height="270" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(816 150) scale(1.6)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g>
<text x="866.0" y="172.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Contraseña DSRM</text>
<text x="866.0" y="198.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">del controlador de dominio</text>
<circle cx="821" cy="244.7" r="4.5" fill="#0E8F5E"/><text x="836.0" y="250.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="836.0" dy="0.0">nunca en texto plano</tspan></text><circle cx="821" cy="284.3" r="4.5" fill="#0E8F5E"/><text x="836.0" y="289.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="836.0" dy="0.0">ni en un script ni en un ticket</tspan></text><circle cx="821" cy="323.9" r="4.5" fill="#B45309"/><text x="836.0" y="329.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="836.0" dy="0.0">se pide de forma segura</tspan></text>
<rect x="48" y="424" width="1104" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="436" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="458.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Regla</tspan></text><text x="74.0" y="484.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ninguna llave vive solo dentro del equipo que protege: la clave de recuperación no va en el mismo disco cifrado y las</tspan><tspan x="74.0" dy="21.6">contraseñas no se pegan en scripts ni tickets.</tspan></text>
</svg>