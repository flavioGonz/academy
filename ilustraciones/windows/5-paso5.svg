<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La regla sola no muestra puertos: pedí sus filtros</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La regla sola no muestra puertos: pedí sus filtros</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Get-NetFirewallRule muestra nombre, estado y perfil, no puertos ni IP</text>
<rect x="48" y="170" width="1104" height="131" rx="14" fill="#03213C"/><path d="M48 184a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v20h-1104z" fill="#0B3A66"/><text x="66.0" y="194.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="237.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Get-NetFirewallRule -DisplayName &#x27;LAB VMS web 8443&#x27;</text><text x="66.0" y="262.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">DisplayName : LAB VMS web 8443    Enabled : True    Profile : Private, Domain</text><text x="66.0" y="287.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFB020" text-anchor="start">(sin puerto ni dirección)</text>
<rect x="48" y="340" width="540" height="131" rx="14" fill="#03213C"/><path d="M48 354a14 14 0 0 1 14 -14h512a14 14 0 0 1 14 14v20h-540z" fill="#0B3A66"/><text x="66.0" y="364.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="407.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; … | Get-NetFirewallPortFilter</text><text x="66.0" y="432.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">Protocol  : TCP</text><text x="66.0" y="457.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3F7" text-anchor="start">LocalPort : 8443</text>
<rect x="612" y="340" width="540" height="131" rx="14" fill="#03213C"/><path d="M612 354a14 14 0 0 1 14 -14h512a14 14 0 0 1 14 14v20h-540z" fill="#0B3A66"/><text x="630.0" y="364.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="630.0" y="407.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; … | Get-NetFirewallAddressFilter</text><text x="630.0" y="432.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3F7" text-anchor="start">RemoteAddress : LocalSubnet</text><text x="630.0" y="457.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">LocalAddress  : Any</text>
<rect x="48" y="510" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="522" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="544.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Así se audita un servidor que ya tiene reglas: por cada regla, sus filtros de puerto y de dirección. Al terminar el</tspan><tspan x="74.0" dy="21.6">laboratorio, Remove-NetFirewallRule con el mismo nombre.</tspan></text>
</svg>