<rect x="612" y="488" width="540" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="500" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="522.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Regla</tspan></text><text x="638.0" y="549.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">No digas &quot;no hay red&quot; hasta probar el puerto exacto del</tspan><tspan x="638.0" dy="21.6">servicio: el ping dice que hay alguien, no que el servicio</tspan><tspan x="638.0" dy="21.6">atiende.</tspan></text>
