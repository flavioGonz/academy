<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Una línea en hosts: una herramienta la ve, la otra no</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Una línea en hosts: una herramienta la ve, la otra no</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="94.0" y="147.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">C:\Windows\System32\drivers\etc\hosts (como administrador)</text>
<rect x="48" y="172" width="520" height="46" rx="10" fill="#03213C"/><text x="64.0" y="201.3" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#D9E9F8" text-anchor="start">192.168.88.50   vms-lab</text>
<rect x="48" y="252" width="540" height="180" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="86" cy="292" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(74 280)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="118.0" y="299.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Resolve-DnsName vms-lab</text>
<text x="72.0" y="340.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Usa el resolvedor de Windows: archivo hosts, caché y</tspan><tspan x="72.0" dy="21.6">después DNS. Encuentra 192.168.88.50, como lo haría el</tspan><tspan x="72.0" dy="21.6">VMS.</tspan></text>
<rect x="612" y="252" width="540" height="180" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="650" cy="292" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(638 280)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="682.0" y="299.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">nslookup vms-lab</text>
<text x="636.0" y="340.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">Pregunta solo al servidor DNS: no lee hosts ni la caché.</tspan><tspan x="636.0" dy="21.6">Además le agrega los sufijos de búsqueda a un nombre sin</tspan><tspan x="636.0" dy="21.6">punto final.</tspan></text>
<rect x="48" y="460" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="472" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="494.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Al terminar, borrá la línea de hosts. Empezá con Resolve-DnsName y usá nslookup para comparar y aislar fallas del resolvedor.</tspan></text>
</svg>