<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Abrí la carpeta del NAS con un usuario del equipo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Abrí la carpeta del NAS con un usuario del equipo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Probá las dos formas</text>
<rect x="48" y="190" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 216.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="112.0" y="228.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook</text><text x="112.0" y="251.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Windows 11 24H2</text>
<rect x="48" y="300" width="300" height="40" rx="10" fill="#03213C"/><text x="64.0" y="325.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#D9E9F8" text-anchor="start">\\192.168.88.30\video</text>
<rect x="420" y="128" width="732" height="168" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="458" cy="170" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(446 158)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="492.0" y="177.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#D2492F" text-anchor="start">Como invitado, sin usuario</text>
<text x="444.0" y="214.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="444.0" dy="0.0">Pro 24H2 ya no hace el acceso invitado: Windows no abre la carpeta aunque el NAS</tspan><tspan x="444.0" dy="21.6">responda y el cable esté bien.</tspan></text>
<rect x="420" y="316" width="732" height="168" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="458" cy="358" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(446 346)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="492.0" y="365.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#0E8F5E" text-anchor="start">Con usuario y contraseña del NAS</text>
<text x="444.0" y="402.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="444.0" dy="0.0">Abre si el NAS también firma SMB. Si igual falla con usuario propio, el siguiente</tspan><tspan x="444.0" dy="21.6">paso es el firmware del NAS o del grabador.</tspan></text>
<path d="M348.0 320.0C348.0 260.6,420.0 271.4,420.0 212.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<path d="M348.0 320.0C348.0 364.0,420.0 356.0,420.0 400.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="48" y="512" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="524" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="546.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La IP 192.168.88.30 y la carpeta video son de ejemplo. Bajar la seguridad del cliente SMB es la última opción, no la primera.</tspan></text>
</svg>