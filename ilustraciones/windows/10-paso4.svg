<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Excluí solo lo que pide el fabricante del VMS</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Excluí solo lo que pide el fabricante del VMS</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Microsoft Defender, PowerShell como administrador</text>
<rect x="48" y="172" width="1104" height="131" rx="14" fill="#03213C"/><path d="M48 186a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v20h-1104z" fill="#0B3A66"/><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="239.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; (Get-MpPreference).ExclusionPath</text><text x="66.0" y="264.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Add-MpPreference -ExclusionPath &#x27;D:\LabGrabacion&#x27;</text><text x="66.0" y="289.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Add-MpPreference -ExclusionExtension &#x27;.blk&#x27;,&#x27;.idx&#x27;,&#x27;.pic&#x27;</text>
<rect x="48" y="340" width="540" height="150" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="86" cy="380" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(74 368)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="118.0" y="387.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#0E8F5E" text-anchor="start">La carpeta de grabación</text>
<text x="72.0" y="426.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Las carpetas, extensiones y procesos que indique el</tspan><tspan x="72.0" dy="21.6">fabricante del VMS instalado, anotados en el informe.</tspan></text>
<rect x="612" y="340" width="540" height="150" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/>
<circle cx="650" cy="380" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(638 368)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="682.0" y="387.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#D2492F" text-anchor="start">Un disco entero &quot;por las dudas&quot;</text>
<text x="636.0" y="426.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">Excluir reduce la protección: lo que no se escanea, no se</tspan><tspan x="636.0" dy="21.6">revisa. Solo lo que pide el fabricante.</tspan></text>
<rect x="48" y="516" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="528" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="550.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Al terminar el laboratorio, Remove-MpPreference con los mismos parámetros deja todo como estaba.</tspan></text>
</svg>