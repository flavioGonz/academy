<rect x="48" y="380" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="392" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="74.0" y="414.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cambiar el número no alcanza</tspan></text><text x="74.0" y="440.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Otro puerto externo que apunta al 3389 es lo mismo: el</tspan><tspan x="74.0" dy="21.6">servidor queda expuesto, solo que lo encuentran un poco más</tspan><tspan x="74.0" dy="21.6">tarde.</tspan></text>
