<rect x="612" y="496" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="508" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="530.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Red aislada</tspan></text><text x="638.0" y="557.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Conectado a la red del cliente, un DHCP de laboratorio</tspan><tspan x="638.0" dy="21.6">puede repartir direcciones. Probalo aislado.</tspan></text>
