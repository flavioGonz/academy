<rect x="470" y="430" width="290" height="84" rx="16" fill="#FFFFFF" stroke="#D2492F" stroke-width="3"/><g transform="translate(490 456.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="534.0" y="468.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">NAS o grabador viejo</text><text x="534.0" y="491.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">sin firma · invitado</text>
<path d="M278.0 472.0C374.0 472.0,374.0 472.0,470.0 472.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/><rect x="311.4" y="441.0" width="125.2" height="28" rx="14" fill="#FFFFFF" stroke="#D2492F" stroke-width="1.5"/><text x="374.0" y="460.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">\\IP\carpeta</text>
<circle cx="800" cy="472" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(788 460)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="830.0" y="466.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">&quot;Dejó de abrir&quot;</text>
<text x="830.0" y="490.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">y la red está bien</text>
<rect x="48" y="548" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="560" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="582.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Qué conviene hacer</tspan></text><text x="74.0" y="609.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Primero firmware del NAS o grabador, o una cuenta con contraseña propia del equipo. Volver a permitir invitados o quitar la</tspan><tspan x="74.0" dy="21.6">firma deja el puesto más expuesto.</tspan></text>
