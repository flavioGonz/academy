<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Antes que la IP: edición, versión y build</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="520" height="262" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 142a14 14 0 0 1 14 -14h492a14 14 0 0 1 14 14v26h-520z" fill="#E5F0FB"/><circle cx="68" cy="148" r="5" fill="#C2D4E6"/><circle cx="86" cy="148" r="5" fill="#C2D4E6"/><circle cx="104" cy="148" r="5" fill="#C2D4E6"/><text x="124.0" y="154.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">HKLM:\…\Windows NT\CurrentVersion</text><text x="68.0" y="198.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">EditionID</text><text x="548.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Professional</text><rect x="58" y="214" width="500" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="236.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">DisplayVersion</text><text x="548.0" y="236.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">24H2</text><text x="68.0" y="274.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">CurrentBuild</text><text x="548.0" y="274.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">26100</text><text x="68.0" y="312.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">UBR</text><text x="548.0" y="312.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">parche del mes</text>
<text x="68.0" y="372.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Valores de ejemplo: en la obra, los del equipo.</text>
<rect x="600" y="128" width="552" height="262" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="620.0" y="160.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Desde 24H2 y Server 2025</text>
<text x="624.0" y="196.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">RequireSecuritySignature</text>
<rect x="1068.0" y="175.0" width="60.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="1098.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">True</text>
<text x="624.0" y="222.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">firma SMB obligatoria en cada conexión</text>
<path d="M620 246H1132" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="624.0" y="282.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#04223D" text-anchor="start">EnableInsecureGuestLogons</text>
<rect x="1059.0" y="261.0" width="69.0" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="1093.5" y="282.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">False</text>
<text x="624.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Windows 11 Pro ya no entra como invitado</text>
<text x="624.0" y="350.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Get-SmbClientConfiguration</text>
