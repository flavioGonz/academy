<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Capa por capa: de tu puesto hacia afuera</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Capa por capa: de tu puesto hacia afuera</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="252" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="166" r="18" fill="#17A8D4"/><text x="82.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110.0" y="172.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿Mi placa está bien?</text>
<rect x="64" y="196" width="220" height="40" rx="10" fill="#03213C"/><text x="80.0" y="221.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">ipconfig /all</text>
<text x="68.0" y="270.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">IP, máscara, puerta de</tspan><tspan x="68.0" dy="21.6">enlace y DNS</tspan></text>
<text x="68.0" y="350.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="68.0" dy="0.0">Si esto está mal, lo demás</tspan><tspan x="68.0" dy="20.2">no importa.</tspan></text>
<path d="M304.0 278.0C316.0 278.0,316.0 278.0,328.0 278.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="332" y="128" width="252" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="366" cy="166" r="18" fill="#17A8D4"/><text x="366.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="394.0" y="172.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿Llego al gateway?</text>
<rect x="348" y="196" width="220" height="40" rx="10" fill="#03213C"/><text x="364.0" y="221.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">ping 192.168.88.1</text>
<text x="352.0" y="270.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="352.0" dy="0.0">el primer salto de la red</tspan></text>
<text x="352.0" y="350.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="352.0" dy="0.0">Sin gateway, nada sale de la</tspan><tspan x="352.0" dy="20.2">subred.</tspan></text>
<path d="M588.0 278.0C600.0 278.0,600.0 278.0,612.0 278.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="616" y="128" width="252" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="650" cy="166" r="18" fill="#17A8D4"/><text x="650.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="678.0" y="172.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿El equipo está vivo?</text>
<rect x="632" y="196" width="220" height="40" rx="10" fill="#03213C"/><text x="648.0" y="221.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">arp -a</text>
<text x="636.0" y="270.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">su MAC en la tabla ARP</tspan></text>
<text x="636.0" y="350.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="636.0" dy="0.0">Hay MAC: respondió, aunque</tspan><tspan x="636.0" dy="20.2">el ping falle.</tspan></text>
<path d="M872.0 278.0C884.0 278.0,884.0 278.0,896.0 278.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="900" y="128" width="252" height="300" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="934" cy="166" r="18" fill="#17A8D4"/><text x="934.0" y="172.1" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="962.0" y="172.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">¿Dónde se pierde?</text>
<rect x="916" y="196" width="220" height="40" rx="10" fill="#03213C"/><text x="932.0" y="221.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">pathping -n</text>
<text x="920.0" y="270.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start"><tspan x="920.0" dy="0.0">pérdida y demora por salto</tspan></text>
<text x="920.0" y="350.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start"><tspan x="920.0" dy="0.0">Para destinos en otra red.</tspan></text>
<rect x="48" y="456" width="1104" height="130" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="72.0" y="494.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#B45309" text-anchor="start">Un ping que falla no prueba que el equipo esté apagado</text>
<text x="72.0" y="528.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Muchos equipos y firewalls bloquean ICMP, que es lo que usa el ping. El Firewall de Windows, por ejemplo, bloquea lo</tspan><tspan x="72.0" dy="23.0">entrante salvo que haya regla. Antes de mandar a alguien al sitio, mirá ARP en su subred.</tspan></text>
</svg>