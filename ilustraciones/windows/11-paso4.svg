<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Backup de los volúmenes críticos a un segundo disco</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Windows Server 2025 de prueba, con un disco E: aparte</text>
<rect x="48" y="172" width="1104" height="131" rx="14" fill="#03213C"/><path d="M48 186a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v20h-1104z" fill="#0B3A66"/><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">Símbolo del sistema (administrador)</text><text x="66.0" y="239.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">C:\&gt; wbadmin start backup -backupTarget:E: -allCritical -quiet</text><text x="66.0" y="264.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">C:\&gt; wbadmin get versions -backupTarget:E:</text><text x="66.0" y="289.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#9FE3F7" text-anchor="start">Identificador de versión: (fecha-hora del backup)</text>
<rect x="58" y="271" width="1084" height="27" rx="6" fill="none" stroke="#17A8D4" stroke-width="2"/>
<rect x="48" y="360" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(68 386.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="112.0" y="398.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Servidor</text><text x="112.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">C: y volúmenes críticos</text>
<rect x="480" y="360" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(500 386.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="544.0" y="398.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Disco E:</text><text x="544.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">destino del backup</text>
<path d="M348.0 402.0C414.0 402.0,414.0 402.0,480.0 402.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="351.4" y="371.0" width="125.2" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="414.0" y="390.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">-allCritical</text>
<rect x="840" y="340" width="312" height="124" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="860.0" y="372.0" font-family="Familjen Grotesk" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">Paso 5: a la planilla</text>
<text x="864.0" y="404.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">identificador y fecha</text>
<text x="864.0" y="432.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">de esta versión</text>
<rect x="48" y="488" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="500" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="522.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">-allCritical incluye lo necesario para restaurar el sistema. Un backup se confirma restaurando: en el paso 6, un archivo a otra</tspan><tspan x="74.0" dy="21.6">carpeta con -recoveryTarget. -recreateDisks borra datos: solo si sabés lo que hace.</tspan></text>
</svg>