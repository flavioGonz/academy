<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Quién es administrador local en este equipo?</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">S-1-5-32-544 es el grupo Administradores en cualquier idioma</text>
<rect x="48" y="172" width="1104" height="181" rx="14" fill="#03213C"/><path d="M48 186a14 14 0 0 1 14 -14h1076a14 14 0 0 1 14 14v20h-1104z" fill="#0B3A66"/><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9FC3E3" text-anchor="start" letter-spacing="1.2">PowerShell (administrador)</text><text x="66.0" y="239.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">PS&gt; Get-LocalGroupMember -SID S-1-5-32-544</text><text x="66.0" y="264.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FA6C9" text-anchor="start">ObjectClass  Name                        PrincipalSource</text><text x="66.0" y="289.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">Usuario      SRV-VMS-01\Administrador    Local</text><text x="66.0" y="314.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">Grupo        EMPRESA\Admins. del dominio  ActiveDirectory</text><text x="66.0" y="339.8" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFB020" text-anchor="start">Usuario      SRV-VMS-01\soporte2         Local</text>
<rect x="58" y="321" width="1084" height="27" rx="6" fill="none" stroke="#B45309" stroke-width="2"/>
<rect x="48" y="386" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="398" width="5" height="100" rx="2.5" fill="#B45309"/><text x="74.0" y="420.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Cuenta desconocida</tspan></text><text x="74.0" y="446.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si aparece una cuenta que nadie reconoce, anotala y</tspan><tspan x="74.0" dy="21.6">consultá antes de borrarla: puede ser la de un software o</tspan><tspan x="74.0" dy="21.6">de otro proveedor.</tspan></text>
<rect x="612" y="386" width="540" height="102" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="398" width="5" height="78" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="420.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Mínimo privilegio</tspan></text><text x="638.0" y="446.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Cada equipo con su administrador local único y recuperable,</tspan><tspan x="638.0" dy="21.6">y el resto de las cuentas con lo mínimo que necesitan.</tspan></text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Nombres de ejemplo.</text>
