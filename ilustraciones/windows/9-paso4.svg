<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Un filtro dice qué log, qué nivel y desde cuándo</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un filtro dice qué log, qué nivel y desde cuándo</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<circle cx="65" cy="141" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="65.0" y="147.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Errores y críticos del log Sistema de las últimas 24 horas</text>
<rect x="48" y="176" width="1104" height="50" rx="10" fill="#03213C"/><text x="64.0" y="206.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">Get-WinEvent -FilterHashtable @{LogName=&#x27;System&#x27;; Level=1,2; StartTime=(Get-Date).AddHours(-24)}</text>
<path d="M250.0 230.0C250.0 257.5,250.0 252.5,250.0 280.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="125" y="284" width="250" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="145.0" y="318.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">LogName=&#x27;System&#x27;</text>
<text x="145.0" y="348.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">qué log</text>
<text x="145.0" y="376.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">System, Application…</text>
<path d="M520.0 230.0C520.0 257.5,520.0 252.5,520.0 280.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="395" y="284" width="250" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="415.0" y="318.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">Level=1,2</text>
<text x="415.0" y="348.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">qué nivel</text>
<text x="415.0" y="376.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">1 crítico · 2 error</text>
<path d="M850.0 230.0C850.0 257.5,850.0 252.5,850.0 280.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="725" y="284" width="250" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="745.0" y="318.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#0A63B8" text-anchor="start">StartTime=…</text>
<text x="745.0" y="348.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">desde cuándo</text>
<text x="745.0" y="376.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">las últimas 24 horas</text>
<rect x="48" y="428" width="540" height="130" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="72.0" y="466.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">FilterHashtable</text>
<text x="72.0" y="500.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">El servicio de registro devuelve solo lo que coincide:</tspan><tspan x="72.0" dy="21.6">rápido aunque el log sea grande.</tspan></text>
<rect x="612" y="428" width="540" height="130" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/>
<text x="636.0" y="466.0" font-family="JetBrains Mono" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">… | Where-Object</text>
<text x="636.0" y="500.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="636.0" dy="0.0">Trae todos los eventos a PowerShell y recién ahí filtra:</tspan><tspan x="636.0" dy="21.6">con logs grandes tarda mucho más.</tspan></text>
</svg>