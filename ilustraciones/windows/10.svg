<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El disco que graba se mide con tres números</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">WINDOWS</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El disco que graba se mide con tres números</text>
<style>text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style>
<rect x="48" y="128" width="352" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="70.0" y="170.0" font-family="Familjen Grotesk" font-size="24" font-weight="600" fill="#04223D" text-anchor="start">Latencia</text>
<rect x="68" y="188" width="312" height="36" rx="10" fill="#03213C"/><text x="84.0" y="210.9" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">Avg. Disk sec/Transfer</text>
<text x="70.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">cuánto tarda cada operación</text>
<rect x="68" y="280" width="312" height="56" rx="10" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/>
<text x="82.0" y="313.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start"><tspan x="82.0" dy="0.0">más de 25 ms sostenidos: no da abasto</tspan></text>
<rect x="420" y="128" width="352" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="442.0" y="170.0" font-family="Familjen Grotesk" font-size="24" font-weight="600" fill="#04223D" text-anchor="start">IOPS</text>
<rect x="440" y="188" width="312" height="36" rx="10" fill="#03213C"/><text x="456.0" y="210.9" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">Disk Transfers/sec</text>
<text x="442.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">operaciones por segundo</text>
<rect x="440" y="280" width="312" height="56" rx="10" fill="#E5F0FB" stroke="#C2D4E6" stroke-width="1.5"/>
<text x="454.0" y="313.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start"><tspan x="454.0" dy="0.0">se compara contra lo que da ese disco</tspan></text>
<rect x="792" y="128" width="352" height="230" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="814.0" y="170.0" font-family="Familjen Grotesk" font-size="24" font-weight="600" fill="#04223D" text-anchor="start">Cola</text>
<rect x="812" y="188" width="312" height="36" rx="10" fill="#03213C"/><text x="828.0" y="210.9" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#D9E9F8" text-anchor="start">Avg. Disk Queue Length</text>
<text x="814.0" y="256.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">cuántas esperan su turno</text>
<rect x="812" y="280" width="312" height="56" rx="10" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/>
<text x="826.0" y="313.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="start"><tspan x="826.0" dy="0.0">un disco solo: no más de 2</tspan></text>
<text x="48.0" y="392.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Umbrales según woshub; para grabación manda la guía del fabricante del VMS.</text>
<rect x="48" y="414" width="1104" height="170" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="446.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">Y el antivirus no escanea la base de grabación</text>
<text x="72.0" y="486.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#41627F" text-anchor="start">Ejemplo de Milestone:</text>
<rect x="270.0" y="465.0" width="168.0" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="354.0" y="486.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">C:\mediadatabase</text>
<rect x="500.0" y="465.0" width="60.0" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="530.0" y="486.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">.blk</text>
<rect x="596.0" y="465.0" width="60.0" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="626.0" y="486.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">.idx</text>
<rect x="692.0" y="465.0" width="60.0" height="29" rx="14.5" fill="#FFFFFF" stroke="#6E88A1" stroke-width="1.5"/><text x="722.0" y="486.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="middle">.pic</text>
<text x="72.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">El escaneo consume recursos y puede bloquear archivos: corta la grabación o corrompe la base. Se excluye solo lo que pide el</tspan><tspan x="72.0" dy="21.6">fabricante, nunca un disco entero.</tspan></text>
</svg>