<text x="84.0" y="352.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Restore on AC Power Loss</text>
<text x="712.0" y="352.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">[Power On]</text>
<text x="84.0" y="412.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">(otras opciones)</text>
<text x="712.0" y="412.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#9FC3E3" text-anchor="end">…</text>
<text x="84.0" y="470.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">Opciones:  Power On  ·  Last State  ·  Power Off</text>
<text x="84.0" y="520.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">Menú dibujado, no copiado de una marca.</text>
<rect x="776" y="176" width="376" height="260" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="796.0" y="208.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Cómo puede llamarse</text>
<text x="800.0" y="236.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#0A63B8" text-anchor="start">Restore on AC Power Loss</text>
<text x="800.0" y="270.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#0A63B8" text-anchor="start">After Power Failure</text>
<text x="800.0" y="304.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"></text>
<text x="800.0" y="338.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Según la marca, en Power,</text>
<text x="800.0" y="372.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Advanced, Chipset o ACPI.</text>
