<text x="94.0" y="147.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#41627F" text-anchor="start">Menú genérico: el nombre y la pestaña cambian según la marca</text>
<rect x="48" y="176" width="700" height="400" rx="16" fill="#0B3A66" stroke="#0B3A66" stroke-width="2"/>
<rect x="68" y="192" width="120" height="40" rx="8" fill="#03213C" stroke="#4E7396" stroke-width="1.5"/>
