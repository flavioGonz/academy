<text x="664.0" y="218.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Boot</text>
<text x="84.0" y="292.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#9FC3E3" text-anchor="start">(otras opciones)</text>
<text x="712.0" y="292.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#9FC3E3" text-anchor="end">…</text>
