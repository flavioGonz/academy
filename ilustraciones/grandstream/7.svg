<rect x="48" y="566" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="578" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Hasta cinco destinos por tecla, cada uno con su horario: un</tspan><tspan x="74.0" dy="21.6">solo IVR para día, noche y feriados.</tspan></text>
<rect x="612" y="566" width="540" height="97" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="578" width="5" height="73" rx="2.5" fill="#D2492F"/><text x="638.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si Timeout o Invalid quedan sin destino, al terminar las</tspan><tspan x="638.0" dy="21.6">repeticiones la central corta: el que no marca nada se</tspan><tspan x="638.0" dy="21.6">queda afuera.</tspan></text>
