<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">País de la línea y PCMA, antes de entregar</text>
<rect x="48" y="132" width="600" height="300" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 146a14 14 0 0 1 14 -14h572a14 14 0 0 1 14 14v26h-600z" fill="#E5F0FB"/><circle cx="68" cy="152" r="5" fill="#C2D4E6"/><circle cx="86" cy="152" r="5" fill="#C2D4E6"/><circle cx="104" cy="152" r="5" fill="#C2D4E6"/><text x="124.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · web</text><text x="66.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">PBX Settings &gt; Interface Settings &gt; Analog Hardware</text><text x="68.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">FXO Opermode</text><text x="628.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">país de la línea</text><rect x="58" y="248" width="580" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">PCMA Override</text><text x="628.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">PCMA</text><text x="68.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Tone Region</text><text x="628.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">tonos del FXS</text><text x="68.0" y="346.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">FXO Ports (ACIM)</text><text x="628.0" y="346.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Detect (más adelante)</text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="690" y="132" width="462" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="710.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">PCMA Override</text>
<text x="710.0" y="194.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">El manual: Norteamérica usa PCMU; el resto del</tspan><tspan x="710.0" dy="21.6">mundo, PCMA salvo que se sepa otra cosa. Viene en</tspan><tspan x="710.0" dy="21.6">PCMU.</tspan></text>
<rect x="690" y="292" width="462" height="140" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="710.0" y="324.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">FXO Opermode</text>
<text x="710.0" y="354.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">Impedancia, umbral de timbre y corriente de lazo</tspan><tspan x="710.0" dy="21.6">por país. Viene en Estados Unidos; si Uruguay no</tspan><tspan x="710.0" dy="21.6">está, anotá lo que quedó.</tspan></text>
<rect x="48" y="470" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="482" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">PCMA Override reinicia la central. En un comercio abierto, coordiná el horario antes de guardar.</tspan></text>
