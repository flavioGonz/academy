<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Primera pregunta: ¿ese equipo puede mandar video?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · CASO DE ESTUDIO · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Primera pregunta: ¿ese equipo puede mandar video?</text>
<rect x="48" y="124" width="544" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(68 146) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 15 5l2 5-12 3.5z"/><path d="m17 10 3.5 1.5M9 13l1 4M6 17h8"/></g>
<text x="112.0" y="170.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Portero GDS371x</text>
<circle cx="77" cy="216.4" r="4.5" fill="#17A8D4"/><text x="92.0" y="222.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Manda video al que atiende</tspan></text><circle cx="77" cy="253.3" r="4.5" fill="#B45309"/><text x="92.0" y="258.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">No recibe video del otro lado</tspan></text><circle cx="77" cy="290.3" r="4.5" fill="#17A8D4"/><text x="92.0" y="295.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Que no vea a recepción es lo normal</tspan></text>
<rect x="608" y="124" width="544" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(628 146) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g>
<text x="672.0" y="170.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Teléfono GRP o GXP</text>
<circle cx="637" cy="216.4" r="4.5" fill="#17A8D4"/><text x="652.0" y="222.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">GRP2601 a 2604: solo audio</tspan></text><circle cx="637" cy="253.3" r="4.5" fill="#17A8D4"/><text x="652.0" y="258.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">GRP2614 en adelante: foto JPEG del portero</tspan></text><circle cx="637" cy="290.3" r="4.5" fill="#B45309"/><text x="652.0" y="295.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">No es un flujo H.264</tspan></text>
<rect x="48" y="360" width="544" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(68 382) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
<text x="112.0" y="406.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">GXV34x0</text>
<circle cx="77" cy="452.4" r="4.5" fill="#17A8D4"/><text x="92.0" y="458.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Obturador de privacidad: tapa el sensor</tspan></text><circle cx="77" cy="489.3" r="4.5" fill="#B45309"/><text x="92.0" y="494.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Se puede atender solo con audio</tspan></text><circle cx="77" cy="526.3" r="4.5" fill="#17A8D4"/><text x="92.0" y="531.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="92.0" dy="0.0">Video deshabilitado: solo audio</tspan></text>
<rect x="608" y="360" width="544" height="220" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<g transform="translate(628 382) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g>
<text x="672.0" y="406.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Wave en el celular</text>
<circle cx="637" cy="452.4" r="4.5" fill="#17A8D4"/><text x="652.0" y="458.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Pide permiso de cámara: Allow</tspan></text><circle cx="637" cy="489.3" r="4.5" fill="#B45309"/><text x="652.0" y="494.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Video: invitación que el otro acepta</tspan></text><circle cx="637" cy="526.3" r="4.5" fill="#17A8D4"/><text x="652.0" y="531.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Sin permiso, no hay cámara</tspan></text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="48.0" y="628.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#6E88A1" text-anchor="start">Si el equipo puede mandar y del otro lado no se ve, recién ahí la captura en la UCM.</text>
</svg>