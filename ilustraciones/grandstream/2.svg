<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cada ajuste de la extensión evita un problema</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada ajuste de la extensión evita un problema</text>
<rect x="48" y="130" width="560" height="290" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 144a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="150" r="5" fill="#C2D4E6"/><circle cx="86" cy="150" r="5" fill="#C2D4E6"/><circle cx="104" cy="150" r="5" fill="#C2D4E6"/><text x="124.0" y="156.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · extensión 1001</text><text x="66.0" y="196.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Extension/Trunk &gt; Extensions</text><text x="68.0" y="230.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Contraseña SIP</text><text x="588.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">aleatoria</text><text x="68.0" y="268.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Concurrent Registrations</text><text x="588.0" y="268.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">1 o 2</text><text x="68.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">NAT</text><text x="588.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">activado</text><text x="68.0" y="344.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Direct Media</text><text x="588.0" y="344.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">desactivado</text><text x="68.0" y="382.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">DTMF Mode</text><text x="588.0" y="382.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">RFC4733</text>
<path d="M614.0 225.0C633.0 225.0,633.0 225.0,652.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="664.0" y="230.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Nadie adivina la cuenta para llamar gratis</text>
<path d="M614.0 263.0C633.0 263.0,633.0 263.0,652.0 263.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="664.0" y="268.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Menos equipos usando la misma cuenta (fábrica: 3)</text>
<path d="M614.0 301.0C633.0 301.0,633.0 301.0,652.0 301.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="664.0" y="306.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">El teléfono detrás de un router recibe respuesta</text>
<path d="M614.0 339.0C633.0 339.0,633.0 339.0,652.0 339.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="664.0" y="344.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">El audio pasa por la central y cruza el NAT</text>
<path d="M614.0 377.0C633.0 377.0,633.0 377.0,652.0 377.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="664.0" y="382.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Buzón e IVR reconocen las teclas</text>
<text x="664.0" y="170.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.5">QUÉ EVITA</text>
<rect x="48" y="452" width="540" height="124" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="464" width="5" height="100" rx="2.5" fill="#0A63B8"/><text x="74.0" y="486.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por qué importa</tspan></text><text x="74.0" y="513.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ninguno de estos valores se ve desde afuera: la extensión</tspan><tspan x="74.0" dy="21.6">anda igual. La diferencia aparece el día que alguien prueba</tspan><tspan x="74.0" dy="21.6">contraseñas o el audio se corta de un lado.</tspan></text>
<rect x="612" y="452" width="540" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="464" width="5" height="78" rx="2.5" fill="#B45309"/><text x="638.0" y="486.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Dónde empiezan los problemas</tspan></text><text x="638.0" y="513.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">La mayoría de los audios cortados y de los fraudes empiezan</tspan><tspan x="638.0" dy="21.6">en una extensión floja, no en el troncal.</tspan></text>
</svg>