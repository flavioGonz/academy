<rect x="612" y="532" width="540" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="544" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="638.0" y="566.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Marcar internos sirve para que el que llama disque un</tspan><tspan x="638.0" dy="21.6">interno directo. Si un día se prende, con lista blanca</tspan><tspan x="638.0" dy="21.6">(lección IVR con horario).</tspan></text>
