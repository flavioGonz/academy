<rect x="926" y="126" width="226" height="368" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="946.0" y="158.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Cómo sale</text>
<text x="946.0" y="186.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="946.0" dy="0.0">El número sale como se</tspan><tspan x="946.0" dy="20.2">marcó: 8 cifras los</tspan><tspan x="946.0" dy="20.2">fijos, 09 y 7 cifras los</tspan><tspan x="946.0" dy="20.2">celulares.</tspan></text>
<text x="946.0" y="281.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="946.0" dy="0.0">Si Antel contesta 404 o</tspan><tspan x="946.0" dy="20.2">484, no es el formato</tspan><tspan x="946.0" dy="20.2">que espera: miralo en el</tspan><tspan x="946.0" dy="20.2">Request-URI de la</tspan><tspan x="946.0" dy="20.2">captura y ajustá con</tspan><tspan x="946.0" dy="20.2">Prepend o Strip.</tspan></text>
<rect x="48" y="520" width="1104" height="54" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="532" width="5" height="30" rx="2.5" fill="#D2492F"/><text x="74.0" y="554.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Emergencias: el 911 no se prueba llamando. Se revisa que el patrón exista, que no pida PIN y que salga por la troncal de Antel.</tspan></text>
