<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La extensión usa la ruta si su nivel alcanza</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La extensión usa la ruta si su nivel alcanza</text>
<rect x="48" y="470" width="124" height="70" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="110.0" y="500.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#04223D" text-anchor="middle">Internal</text>
<rect x="178" y="400" width="124" height="140" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="240.0" y="430.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#04223D" text-anchor="middle">Local</text>
<rect x="308" y="330" width="124" height="210" rx="10" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="370.0" y="360.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#04223D" text-anchor="middle">National</text>
<rect x="438" y="260" width="124" height="280" rx="10" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="500.0" y="290.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#04223D" text-anchor="middle">International</text>
<text x="48.0" y="170.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">Cada extensión y cada ruta</text>
<text x="48.0" y="198.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#04223D" text-anchor="start">tienen un Privilege Level:</text>
<text x="48.0" y="572.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#6E88A1" text-anchor="start">menos</text>
<text x="562.0" y="572.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="end">más permiso</text>
<path d="M110.0 590.0C333.0 590.0,333.0 590.0,556.0 590.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="600" y="150" width="552" height="184" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M600 162a12 12 0 0 1 12 -12h528a12 12 0 0 1 12 12v34h-552z" fill="#E5F0FB"/><text x="614.0" y="178.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">EXTENSIÓN</text><text x="824.0" y="178.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">NACIONAL</text><text x="984.0" y="178.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">INTERNACIONAL</text><text x="614.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Nivel Local</text><text x="824.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">✗ no sale</text><text x="984.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">✗ no sale</text><path d="M612 242H1140" stroke="#DDE8F2" stroke-width="1"/><text x="614.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Nivel National</text><text x="824.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">✓ sale</text><text x="984.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">✗ no sale</text><path d="M612 288H1140" stroke="#DDE8F2" stroke-width="1"/><text x="614.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Nivel International</text><text x="824.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">✓ sale</text><text x="984.0" y="316.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">✓ pide PIN</text>
<text x="600.0" y="136.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="0.6">RUTA NACIONAL: NATIONAL · RUTA INTERNACIONAL: INTERNATIONAL + PIN</text>
<rect x="600" y="360" width="552" height="124" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="600" y="372" width="5" height="100" rx="2.5" fill="#0E8F5E"/><text x="626.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="626.0" dy="0.0">Por qué protege</tspan></text><text x="626.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="626.0" dy="0.0">Si roban la contraseña de una interna National, el fraude</tspan><tspan x="626.0" dy="21.6">choca contra la ruta internacional: no le alcanza el nivel. Y</tspan><tspan x="626.0" dy="21.6">si roban una International, todavía falta el PIN.</tspan></text>
<rect x="600" y="506" width="552" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="600" y="518" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="626.0" y="540.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="626.0" dy="0.0">Nivel igual o mayor que el de la ruta: pasa. Menor: la</tspan><tspan x="626.0" dy="21.6">central rechaza la llamada.</tspan></text>
</svg>