<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 5</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Un SIP ALG reescribe lo que la central mandó bien</text>
<rect x="48" y="170" width="230" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(68 196.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="112.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">UCM</text><text x="112.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">manda bien</text>
<rect x="48" y="272" width="330" height="40" rx="10" fill="#03213C"/><text x="64.0" y="297.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#7FE0A8" text-anchor="start">c=IN IP4 203.0.113.10</text>
<path d="M282.0 212.0C356.0 212.0,356.0 212.0,430.0 212.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="440" y="170" width="300" height="84" rx="16" fill="#FFFFFF" stroke="#D2492F" stroke-width="3"/><g transform="translate(460 196.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g><text x="504.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Router con SIP ALG</text><text x="504.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">reescribe SIP y SDP</text>
<path d="M744.0 212.0C817.0 212.0,817.0 212.0,890.0 212.0" fill="none" stroke="#D2492F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a-alert)"/>
<rect x="900" y="170" width="252" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(920 196.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g><text x="964.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Otro extremo</text><text x="964.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">recibe otra cosa</text>
<rect x="822" y="272" width="330" height="40" rx="10" fill="#03213C"/><text x="838.0" y="297.2" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#FFB4A3" text-anchor="start">c=IN IP4 192.168.88.20</text>
<text x="48.0" y="360.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Síntomas típicos:</text>
<circle cx="53" cy="388.7" r="4.5" fill="#D2492F"/><text x="68.0" y="394.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">audio de un solo lado</tspan></text><circle cx="53" cy="418.3" r="4.5" fill="#D2492F"/><text x="68.0" y="423.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">corte a los 30 y pico segundos (ACK perdido)</tspan></text><circle cx="53" cy="447.9" r="4.5" fill="#D2492F"/><text x="68.0" y="453.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">registra pero no entran llamadas</tspan></text>
<circle cx="440" cy="170" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="440.0" y="176.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="612" y="350" width="540" height="230" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="382.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Si sospechás del ALG</text>
<circle cx="641" cy="404.7" r="4.5" fill="#0E8F5E"/><text x="656.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Apagalo (SIP ALG o SIP Helper).</tspan></text><circle cx="641" cy="432.3" r="4.5" fill="#0E8F5E"/><text x="656.0" y="437.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Reiniciá el router o limpiá las sesiones.</tspan></text><circle cx="641" cy="459.9" r="4.5" fill="#0E8F5E"/><text x="656.0" y="465.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Repetí la captura y compará el c= con el anterior.</tspan></text><circle cx="641" cy="487.5" r="4.5" fill="#B45309"/><text x="656.0" y="492.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="656.0" dy="0.0">Si no se puede apagar: TLS, otro segmento o cambiar el</tspan><tspan x="656.0" dy="21.6">router.</tspan></text>
<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Capturá en el propio equipo y compará lo que salió con lo que llegó: así se ve quién reescribió.</text>
</svg>