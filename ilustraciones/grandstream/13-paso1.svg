<rect x="520" y="132" width="632" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="540.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Reposo, todo colgado</text>
<text x="540.0" y="204.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Anotá: ____ V</text>
<text x="540.0" y="240.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="540.0" dy="0.0">Referencia de las fuentes: de 24 a 70 V; muchas líneas andan cerca de</tspan><tspan x="540.0" dy="21.6">48 V.</tspan></text>
<rect x="520" y="300" width="632" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="540.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Descolgado, con el teléfono de prueba</text>
<text x="540.0" y="372.0" font-family="JetBrains Mono" font-size="22" font-weight="600" fill="#04223D" text-anchor="start">Anotá: ____ V</text>
<text x="540.0" y="408.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="540.0" dy="0.0">Cae a pocos voltios: entre 4 y 18 V según la distancia a la central</tspan><tspan x="540.0" dy="21.6">(Sandman).</tspan></text>
<rect x="520" y="470" width="632" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="520" y="482" width="5" height="51" rx="2.5" fill="#B45309"/><text x="546.0" y="504.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="546.0" dy="0.0">Si en reposo ya da valores de descolgado, algo en paralelo tiene</tspan><tspan x="546.0" dy="21.6">tomada la línea.</tspan></text>
<rect x="520" y="560" width="632" height="75" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="520" y="572" width="5" height="51" rx="2.5" fill="#D2492F"/><text x="546.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="546.0" dy="0.0">Con la línea sonando hay unos 70 V de alterna: no toques los</tspan><tspan x="546.0" dy="21.6">contactos.</tspan></text>
