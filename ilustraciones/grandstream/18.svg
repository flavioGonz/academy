<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>De la ficha a la configuración: el método</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">De la ficha a la configuración: el método</text>
<rect x="48" y="136" width="352" height="172" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="172" r="18" fill="#17A8D4"/>
<text x="82.0" y="178.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="112.0" y="179.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Foto del estado</text>
<text x="72.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Dashboard, Active Calls y CDR antes</tspan><tspan x="72.0" dy="21.6">de tocar nada</tspan></text>
<path d="M400.0 222.0C412.0 222.0,412.0 222.0,424.0 222.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="136" width="352" height="172" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="458" cy="172" r="18" fill="#17A8D4"/>
<text x="458.0" y="178.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="488.0" y="179.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Medí el par</text>
<text x="448.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="448.0" dy="0.0">Tensión en reposo y descolgado, con</tspan><tspan x="448.0" dy="21.6">el UCM desconectado</tspan></text>
<path d="M776.0 222.0C788.0 222.0,788.0 222.0,800.0 222.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="136" width="352" height="172" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="834" cy="172" r="18" fill="#17A8D4"/>
<text x="834.0" y="178.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="864.0" y="179.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Teléfono de prueba</text>
<text x="824.0" y="222.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="824.0" dy="0.0">Tono, timbre y número en pantalla en</tspan><tspan x="824.0" dy="21.6">la misma ficha</tspan></text>
<rect x="48" y="332" width="352" height="172" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="82" cy="368" r="18" fill="#17A8D4"/>
<text x="82.0" y="374.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="112.0" y="375.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Sacá lo que cuelga</text>
<text x="72.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">Alarma, posnet, fax y teléfonos: una</tspan><tspan x="72.0" dy="21.6">línea, un equipo</tspan></text>
<path d="M400.0 418.0C412.0 418.0,412.0 418.0,424.0 418.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="332" width="352" height="172" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<circle cx="458" cy="368" r="18" fill="#0E8F5E"/>
<text x="458.0" y="374.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="488.0" y="375.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Cambiá el par de puerto</text>
<text x="448.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="448.0" dy="0.0">La línea 2 al FXO1 y la 1 al FXO2:</tspan><tspan x="448.0" dy="21.6">¿la falla sigue a la línea?</tspan></text>
<path d="M776.0 418.0C788.0 418.0,788.0 418.0,800.0 418.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="332" width="352" height="172" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<circle cx="834" cy="368" r="18" fill="#17A8D4"/>
<text x="834.0" y="374.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="864.0" y="375.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Configuración y grabación</text>
<text x="824.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="824.0" dy="0.0">Ruta entrante, detección, Analog</tspan><tspan x="824.0" dy="21.6">Record Trace y syslog</tspan></text>
<path d="M1076 308V320H224V332" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<rect x="48" y="540" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="552" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si la falla sigue a la línea: reclamo a Antel al 121, con</tspan><tspan x="74.0" dy="21.6">número, síntoma, horario y mediciones.</tspan></text>
<rect x="612" y="540" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="552" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="574.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si se queda en el puerto: es la central. Configuración,</tspan><tspan x="638.0" dy="21.6">detección y, si hace falta, el puerto.</tspan></text>
</svg>