<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El síntoma exacto, antes de tocar nada</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · CASO DE ESTUDIO · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El síntoma exacto, antes de tocar nada</text>
<rect x="48" y="124" width="544" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Quién no oye a quién?</text>
<text x="68.0" y="196.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">La oficina al de afuera, o el de afuera a la oficina.</tspan></text>
<rect x="608" y="124" width="544" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="628.0" y="156.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿En qué llamadas?</text>
<text x="628.0" y="196.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="628.0" dy="0.0">Troncal, internas entre sí, internos remotos.</tspan></text>
<rect x="48" y="256" width="544" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="288.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Desde cuándo y qué cambió?</text>
<text x="68.0" y="328.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Firmware, router, External Host, una VLAN nueva.</tspan></text>
<rect x="608" y="256" width="544" height="116" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="628.0" y="288.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Desde el primer segundo?</text>
<text x="628.0" y="328.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="628.0" dy="0.0">Si además corta a los 30 y pico: lección Audio de un</tspan><tspan x="628.0" dy="23.0">lado.</tspan></text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="404" width="544" height="176" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="436.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#D2492F" text-anchor="start">La oficina no oye al de afuera</text>
<circle cx="73" cy="464.4" r="4.5" fill="#17A8D4"/><text x="88.0" y="470.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">El audio de afuera va adonde dijo la central.</tspan></text><circle cx="73" cy="499.3" r="4.5" fill="#D2492F"/><text x="88.0" y="504.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Mirá la c= del SDP que sale de la UCM.</tspan></text><circle cx="73" cy="534.3" r="4.5" fill="#17A8D4"/><text x="88.0" y="539.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">En el caso: External Host sin las redes de Antel.</tspan></text>
<rect x="608" y="404" width="544" height="176" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="628.0" y="436.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#B45309" text-anchor="start">El de afuera no oye a la oficina</text>
<circle cx="633" cy="464.4" r="4.5" fill="#17A8D4"/><text x="648.0" y="470.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="648.0" dy="0.0">El audio de la central sale mal.</tspan></text><circle cx="633" cy="499.3" r="4.5" fill="#B45309"/><text x="648.0" y="504.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="648.0" dy="0.0">Mirá por qué interfaz sale y hacia qué IP.</tspan></text><circle cx="633" cy="534.3" r="4.5" fill="#17A8D4"/><text x="648.0" y="539.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="648.0" dy="0.0">En la troncal: una red de Antel sin ruta estática.</tspan></text>
</svg>