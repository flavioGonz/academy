or="start">Invalid Input Prompt Repeats</text><text x="608.0" y="586.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">1</text><text x="68.0" y="624.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Timeout · Invalid</text><text x="608.0" y="624.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ring Group 6000</text>
<rect x="660" y="334" width="492" height="118" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="660" y="346" width="5" height="94" rx="2.5" fill="#D2492F"/><text x="686.0" y="368.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="686.0" dy="0.0">«Lo siento, no lo entiendo» es el aviso de opción</tspan><tspan x="686.0" dy="21.6">inválida: al IVR le llegó un dígito que no es tecla</tspan><tspan x="686.0" dy="21.6">ni interno, a veces un DTMF falso de la línea</tspan><tspan x="686.0" dy="21.6">analógica.</tspan></text>
<rect x="660" y="494" width="492" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="660" y="506" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="686.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="686.0" dy="0.0">Si el firmware tiene Advanced Call Features &gt;</tspan><tspan x="686.0" dy="21.6">Announcement, el audio no se saltea y pasa solo al</tspan><tspan x="686.0" dy="21.6">destino: no espera teclas.</tspan></text>
