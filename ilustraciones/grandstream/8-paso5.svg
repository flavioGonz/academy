<text x="366.0" y="286.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">la sexta ya no entra:</text>
<text x="366.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">va al desborde</text>
