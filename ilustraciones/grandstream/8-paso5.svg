<circle cx="570" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="570.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="640" y="440" width="512" height="152" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M640 452a12 12 0 0 1 12 -12h488a12 12 0 0 1 12 12v26h-512z" fill="#E5F0FB"/><text x="654.0" y="464.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">TIEMPO</text><text x="884.0" y="464.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">VALOR</text><text x="654.0" y="502.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Agent Ring Time</text><text x="884.0" y="502.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">30 s sonando</text><path d="M652 516H1140" stroke="#DDE8F2" stroke-width="1"/><text x="654.0" y="540.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Retry Time</text><text x="884.0" y="540.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">5 s y pasa al otro</text><path d="M652 554H1140" stroke="#DDE8F2" stroke-width="1"/><text x="654.0" y="578.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Agent Rest Time</text><text x="884.0" y="578.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">10 s después de cortar</text>
<rect x="48" y="530" width="560" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="542" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="564.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Max Queue Length viene en 0, que es sin límite: sin tope, la</tspan><tspan x="74.0" dy="21.6">cola nunca desborda por largo y la espera crece sin fin.</tspan></text>
