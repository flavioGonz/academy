<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Para un saludo: IVR o Announcement</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 8</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Para un saludo: IVR o Announcement</text>
<rect x="48" y="124" width="540" height="276" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="156.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">IVR 7000</text>
<text x="68.0" y="182.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Basic Call Features &gt; IVR</text>
<circle cx="73" cy="218.4" r="4.5" fill="#B45309"/><text x="88.0" y="224.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Escucha teclas mientras suena la bienvenida</tspan></text><circle cx="73" cy="259.3" r="4.5" fill="#17A8D4"/><text x="88.0" y="264.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Response Timeout, repeticiones, Timeout e Invalid</tspan></text><circle cx="73" cy="300.3" r="4.5" fill="#17A8D4"/><text x="88.0" y="305.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Teclas por horario si después piden opciones</tspan></text><circle cx="73" cy="341.2" r="4.5" fill="#0E8F5E"/><text x="88.0" y="346.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Con la receta del paso 5, deriva limpio</tspan></text>
<rect x="612" y="124" width="540" height="276" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="156.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#0E8F5E" text-anchor="start">Announcement</text>
<text x="632.0" y="182.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Advanced Call Features &gt; Announcement</text>
<circle cx="637" cy="218.4" r="4.5" fill="#0E8F5E"/><text x="652.0" y="224.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Un audio que no se puede saltear</tspan></text><circle cx="637" cy="259.3" r="4.5" fill="#17A8D4"/><text x="652.0" y="264.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Name, Prompt y Default Destination</tspan></text><circle cx="637" cy="300.3" r="4.5" fill="#17A8D4"/><text x="652.0" y="305.9" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Se elige como destino de una ruta entrante</tspan></text><circle cx="637" cy="341.2" r="4.5" fill="#0E8F5E"/><text x="652.0" y="346.8" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">No espera teclas: un DTMF falso no lo cambia</tspan></text>
<circle cx="612" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="612.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
