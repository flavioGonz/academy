<path d="M754.0 490.0C800.0 490.0,800.0 490.0,846.0 490.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="48.0" y="590.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Announcement figura en el manual del UCM630x y del UCM630xA vigentes; en firmwares viejos puede no estar.</text>
