<rect x="700" y="150" width="452" height="145" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="700" y="162" width="5" height="121" rx="2.5" fill="#D2492F"/><text x="726.0" y="184.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">Por qué no 1234</tspan></text><text x="726.0" y="210.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">Un buzón entra por teléfono. Con un PIN trivial</tspan><tspan x="726.0" dy="21.6">cualquiera escucha los mensajes, y si alguien</tspan><tspan x="726.0" dy="21.6">activa el acceso remoto por DID, también desde</tspan><tspan x="726.0" dy="21.6">afuera.</tspan></text>
<rect x="700" y="376" width="452" height="145" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="700" y="388" width="5" height="121" rx="2.5" fill="#0A63B8"/><text x="726.0" y="410.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="726.0" dy="0.0">Buzón a correo</tspan></text><text x="726.0" y="436.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">Send Voicemail to Email necesita el SMTP de la</tspan><tspan x="726.0" dy="21.6">central configurado (paso 4). Keep Voicemail</tspan><tspan x="726.0" dy="21.6">after Emailing viene activo: el mensaje queda</tspan><tspan x="726.0" dy="21.6">también en la central.</tspan></text>
