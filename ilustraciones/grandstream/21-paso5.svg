-size="15" font-weight="400" fill="#41627F" text-anchor="start">Algo en el medio filtra o reescribe</text><text x="622.0" y="325.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">c= sale bien y llega distinto</text><path d="M60 348H1140" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="381.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">H4</text><text x="142.0" y="381.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Codec</text><text x="622.0" y="381.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">Active Calls y la m= de cada lado</text>
