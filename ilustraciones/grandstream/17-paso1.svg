<rect x="48" y="132" width="600" height="300" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 146a14 14 0 0 1 14 -14h572a14 14 0 0 1 14 14v26h-600z" fill="#E5F0FB"/><circle cx="68" cy="152" r="5" fill="#C2D4E6"/><circle cx="86" cy="152" r="5" fill="#C2D4E6"/><circle cx="104" cy="152" r="5" fill="#C2D4E6"/><text x="124.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · web</text><text x="66.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Extension/Trunk &gt; Inbound Routes &gt; Add</text><text x="68.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Trunks</text><text x="628.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Antel_Linea1</text><text x="68.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Pattern</text><text x="628.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">_.</text><rect x="58" y="286" width="580" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Default Destination</text><text x="628.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">IVR 7000</text><text x="68.0" y="346.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Time Condition</text><text x="628.0" y="346.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Office Time: IVR 7000</text><text x="68.0" y="384.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">fuera de horario</text><text x="628.0" y="384.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ring Group 6000</text>
