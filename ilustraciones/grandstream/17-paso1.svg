<rect x="690" y="132" width="462" height="160" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="710.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Por qué _.</text>
<text x="710.0" y="194.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="710.0" dy="0.0">El punto acepta uno o más caracteres de cualquier</tspan><tspan x="710.0" dy="21.6">tipo. Por una línea analógica no llega número</tspan><tspan x="710.0" dy="21.6">llamado: el patrón no filtra nada.</tspan></text>
<rect x="690" y="312" width="462" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="690" y="324" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="716.0" y="346.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="716.0" dy="0.0">El IVR 7000 y el grupo 6000 son los de las</tspan><tspan x="716.0" dy="21.6">lecciones IVR con horario y Grupo o cola.</tspan></text>
<rect x="48" y="460" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="472" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="494.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Repetí con Antel_Linea2 y su propio destino. Después llamá a cada línea desde un celular y mirá Active Calls: el destino nunca</tspan><tspan x="74.0" dy="21.6">es s.</tspan></text>
