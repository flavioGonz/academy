<rect x="48" y="132" width="560" height="250" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 146a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="152" r="5" fill="#C2D4E6"/><circle cx="86" cy="152" r="5" fill="#C2D4E6"/><circle cx="104" cy="152" r="5" fill="#C2D4E6"/><text x="124.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · web</text><text x="66.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">System Settings &gt; HTTP Server</text><text x="68.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Redirect From Port 80</text><text x="588.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">No</text><text x="68.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Port</text><text x="588.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">8089 (nunca 80 ni 443)</text><rect x="58" y="286" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Enable IP Address Whitelist</text><text x="588.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Sí</text><text x="68.0" y="346.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Lista (hasta 10 IPs)</text><text x="588.0" y="346.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">red local y oficina</text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
