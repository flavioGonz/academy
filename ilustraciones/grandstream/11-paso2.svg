<text x="702.0" y="252.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Oficina técnica 198.51.100.20</text>
<text x="702.0" y="276.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">ve la página de login</text>
<circle cx="670" cy="322" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(658 310)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<text x="702.0" y="328.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">Cualquier otra IP de internet</text>
<text x="702.0" y="352.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">ni siquiera ve el login</text>
<rect x="48" y="420" width="1104" height="102" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="48" y="432" width="5" height="78" rx="2.5" fill="#D2492F"/><text x="74.0" y="454.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Antes de guardar</tspan></text><text x="74.0" y="480.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si activás la lista blanca o Geo-IP en remoto sin incluir tu propia IP, te quedás afuera de la central. Agregala primero,</tspan><tspan x="74.0" dy="21.6">guardá, y recién después activá.</tspan></text>
<rect x="48" y="548" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="560" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="582.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">SSH viene apagado y así se queda; GDMS Remote SSH, encendido solo durante un soporte. AMI no se habilita en una central</tspan><tspan x="74.0" dy="21.6">expuesta.</tspan></text>
