<text x="702.0" y="176.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="start">Red local 192.168.88.0/24</text>
<text x="702.0" y="200.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">ve la página de login</text>
