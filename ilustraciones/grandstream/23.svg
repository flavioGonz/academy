<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cuelga y no corta: dos mundos, dos causas</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · CASO DE ESTUDIO</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cuelga y no corta: dos mundos, dos causas</text>
<rect x="48" y="118" width="540" height="400" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="68.0" y="150.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#B45309" text-anchor="start">FXO · línea de Antel</text>
<rect x="612" y="118" width="540" height="400" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="632.0" y="150.0" font-family="Familjen Grotesk" font-size="20" font-weight="600" fill="#D2492F" text-anchor="start">SIP · vendedor en la casa</text>
<rect x="68" y="170" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(88 196.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g><text x="132.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Línea de Antel</text><text x="132.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">el cliente colgó</text>
<rect x="348" y="170" width="220" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(368 196.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="412.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">UCM · FXO1</text><text x="412.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">troncal tomada</text>
<path d="M298.0 212.0C320.0 212.0,320.0 212.0,342.0 212.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<text x="68.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">Por el par llega ocupado de 425 Hz, polaridad o</text>
<text x="68.0" y="340.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">corte de corriente, y la UCM no lo reconoce.</text>
<circle cx="73" cy="378.7" r="4.5" fill="#B45309"/><text x="88.0" y="384.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">La interna queda con el tu tu tu</tspan></text><circle cx="73" cy="410.3" r="4.5" fill="#17A8D4"/><text x="88.0" y="415.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Arreglo: tonos de Uruguay, Busy Detection, PSTN Detection</tspan></text><circle cx="73" cy="441.9" r="4.5" fill="#0E8F5E"/><text x="88.0" y="447.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Red: Maximum Call Duration y Max Message Length</tspan></text>
<rect x="632" y="170" width="190" height="84" rx="16" fill="#011E38" stroke="#011E38" stroke-width="2"/><g transform="translate(652 196.0) scale(1.35)" fill="none" stroke="#17A8D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M7.5 6.5h.01M7.5 17.5h.01"/></g><text x="696.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="start">UCM</text><text x="696.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#9FC3E3" text-anchor="start">manda el BYE</text>
<rect x="942" y="170" width="190" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(962 196.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g><text x="1006.0" y="208.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Teléfono</text><text x="1006.0" y="231.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">no cortó</text>
<path d="M822 212H862" stroke="#0A63B8" stroke-width="3"/>
<path d="M902 212H936" stroke="#D2492F" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="882" cy="212" r="18" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><g transform="translate(870 200)" fill="none" stroke="#D2492F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<rect x="790.2" y="257.0" width="183.6" height="27" rx="13.5" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="882.0" y="276.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#D2492F" text-anchor="middle">router: NAT vencido</text>
<text x="842.0" y="200.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">BYE</text>
<text x="632.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">El corte se manda, pero el BYE no llega: el router</text>
<text x="632.0" y="340.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">se olvidó del puerto, o el Contact tiene otra IP.</text>
<circle cx="637" cy="378.7" r="4.5" fill="#D2492F"/><text x="652.0" y="384.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">El teléfono corta solo a los 30 s: su RTP timeout</tspan></text><circle cx="637" cy="410.3" r="4.5" fill="#17A8D4"/><text x="652.0" y="415.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Arreglo: Enable Keep-alive y NAT en la extensión</tspan></text><circle cx="637" cy="441.9" r="4.5" fill="#0E8F5E"/><text x="652.0" y="447.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Red: RTP Timeout y Session Timer en la UCM</tspan></text>
<rect x="48" y="540" width="1104" height="55" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="552" width="5" height="31" rx="2.5" fill="#0A63B8"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El CDR y Active Calls dicen por dónde entró la llamada colgada: eso separa los mundos antes de tocar un solo campo.</tspan></text>
</svg>