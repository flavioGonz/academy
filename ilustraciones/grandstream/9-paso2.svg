<rect x="48" y="344" width="540" height="220" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="376.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">No funciona: cambiar solo afuera</text>
<rect x="72" y="398" width="492" height="44" rx="10" fill="#03213C"/><text x="88.0" y="425.6" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#FFB4A3" text-anchor="start">UDP 5555 afuera  →  5060 adentro</text>
<text x="72.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="72.0" dy="0.0">SIP lleva el puerto dentro de sus encabezados: si querés</tspan><tspan x="72.0" dy="21.6">otro puerto, se cambia en la central y en el router a la</tspan><tspan x="72.0" dy="21.6">vez.</tspan></text>
<rect x="612" y="344" width="540" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="356" width="5" height="100" rx="2.5" fill="#B45309"/><text x="638.0" y="378.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Puerto abierto, puerto vigilado</tspan></text><text x="638.0" y="404.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Abrir 5060 a internet sin Fail2ban, lista blanca o Geo-IP</tspan><tspan x="638.0" dy="21.6">deja la central expuesta a barridos de fuerza bruta. Eso se</tspan><tspan x="638.0" dy="21.6">cierra en Central cerrada.</tspan></text>
<rect x="612" y="504" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="516" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="538.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">RemoteConnect de Grandstream es la alternativa paga que</tspan><tspan x="638.0" dy="21.6">evita tocar el router.</tspan></text>
</svg>