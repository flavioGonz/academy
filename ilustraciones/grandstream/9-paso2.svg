<rect x="48" y="140" width="900" height="184" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 152a12 12 0 0 1 12 -12h876a12 12 0 0 1 12 12v34h-900z" fill="#E5F0FB"/><text x="62.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PROTOCOLO</text><text x="212.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">AFUERA</text><text x="402.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">HACIA LA UCM</text><text x="732.0" y="168.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">PARA QUÉ</text><text x="62.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">UDP</text><text x="212.0" y="214.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">5060</text><text x="402.0" y="214.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">192.168.88.20:5060</text><text x="732.0" y="214.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">señalización SIP</text><path d="M60 232H936" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="260.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">UDP</text><text x="212.0" y="260.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">10000-20000</text><text x="402.0" y="260.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">192.168.88.20:10000-20000</text><text x="732.0" y="260.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">audio RTP</text><path d="M60 278H936" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">SIP ALG</text><text x="212.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">apagado</text><text x="402.0" y="306.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"></text><text x="732.0" y="306.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">que nadie reescriba</text>
