<rect x="620" y="384" width="532" height="97" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="620" y="396" width="5" height="73" rx="2.5" fill="#0E8F5E"/><text x="646.0" y="418.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="646.0" dy="0.0">Grandstream lo dice en el manual del GXV3350: en algunas</tspan><tspan x="646.0" dy="21.6">redes 720P es demasiado y deja sin video o con mala</tspan><tspan x="646.0" dy="21.6">imagen; conviene VGA o CIF y 384 kbps o menos.</tspan></text>
<rect x="620" y="520" width="532" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="620" y="532" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="646.0" y="554.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="646.0" dy="0.0">Más bit rate mejora la imagen solo si la red lo deja</tspan><tspan x="646.0" dy="21.6">pasar; si no, la pérdida la empeora.</tspan></text>
