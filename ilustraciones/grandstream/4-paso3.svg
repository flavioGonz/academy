<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Rejected es alcance o credenciales</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Rejected es alcance o credenciales</text>
<rect x="48" y="132" width="520" height="210" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 146a14 14 0 0 1 14 -14h492a14 14 0 0 1 14 14v26h-520z" fill="#E5F0FB"/><circle cx="68" cy="152" r="5" fill="#C2D4E6"/><circle cx="86" cy="152" r="5" fill="#C2D4E6"/><circle cx="104" cy="152" r="5" fill="#C2D4E6"/><text x="124.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · web</text><text x="66.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">System Status &gt; Dashboard &gt; Trunks</text><text x="68.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Registered</text><text x="548.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">registró, listo</text><rect x="58" y="248" width="500" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Rejected</text><text x="548.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">no registró</text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48.0" y="386.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Si dice Rejected, dos preguntas:</text>
<rect x="48" y="410" width="520" height="136" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="442.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">1. ¿Llego al proveedor?</text>
<circle cx="73" cy="468.7" r="4.5" fill="#17A8D4"/><text x="88.0" y="474.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Desde una PC en la misma red de la central, el host del</tspan><tspan x="88.0" dy="21.6">proveedor resuelve y responde.</tspan></text>
<rect x="612" y="132" width="540" height="150" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="164.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">2. ¿Las credenciales son las del proveedor?</text>
<circle cx="637" cy="190.7" r="4.5" fill="#17A8D4"/><text x="652.0" y="196.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Usuario, Auth ID y contraseña copiados y pegados, no</tspan><tspan x="652.0" dy="21.6">tipeados.</tspan></text><circle cx="637" cy="239.9" r="4.5" fill="#17A8D4"/><text x="652.0" y="245.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="652.0" dy="0.0">Revisá los tres campos contra los datos del proveedor.</tspan></text>
<rect x="612" y="310" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="322" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="344.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">El Dashboard muestra el estado de todos los troncales</tspan><tspan x="638.0" dy="21.6">juntos: miralo antes de que llame el cliente.</tspan></text>
<rect x="612" y="420" width="540" height="54" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="612" y="432" width="5" height="30" rx="2.5" fill="#0E8F5E"/><text x="638.0" y="454.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Recién con Registered pasá a las cuatro pruebas del paso 4.</tspan></text>
</svg>