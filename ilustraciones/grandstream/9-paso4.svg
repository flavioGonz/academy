<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Si el remoto no registra, que pregunte por STUN</text>
<rect x="70.0" y="130" width="240" height="62" rx="12" fill="#011E38"/><text x="190.0" y="157.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Teléfono remoto</text><text x="190.0" y="179.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">detrás de su router</text><path d="M190 192V420" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="490.0" y="130" width="220" height="62" rx="12" fill="#011E38"/><text x="600.0" y="157.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Router hogareño</text><text x="600.0" y="179.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">NAT</text><path d="M600 192V420" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="875.0" y="130" width="250" height="62" rx="12" fill="#011E38"/><text x="1000.0" y="157.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Servidor STUN</text><text x="1000.0" y="179.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">stun.ipvideotalk.com</text><path d="M1000 192V420" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M190 240H994" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="595.0" y="230.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">¿con qué IP y puerto me ves?</text>
<path d="M1000 310H196" stroke="#0E8F5E" stroke-width="3" marker-end="url(#a-ok)"/><text x="595.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">te veo como 198.51.100.7:puerto</text>
<circle cx="214" cy="382" r="18" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><g transform="translate(202 370)" fill="none" stroke="#0E8F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
<text x="244.0" y="388.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">Con esa dirección se registra en la UCM, 203.0.113.10, y la anuncia en el SDP.</text>
<rect x="48" y="450" width="560" height="170" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 464a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="470" r="5" fill="#C2D4E6"/><circle cx="86" cy="470" r="5" fill="#C2D4E6"/><circle cx="104" cy="470" r="5" fill="#C2D4E6"/><text x="124.0" y="476.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Teléfono · web</text><text x="68.0" y="520.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">STUN Server</text><text x="588.0" y="520.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">stun.ipvideotalk.com</text><rect x="58" y="536" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="558.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">NAT Traversal</text><text x="588.0" y="558.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">STUN</text>
<circle cx="48" cy="450" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="456.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="640" y="450" width="512" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="640" y="462" width="5" height="100" rx="2.5" fill="#B45309"/><text x="666.0" y="484.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="666.0" dy="0.0">Cuándo no sirve</tspan></text><text x="666.0" y="510.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="666.0" dy="0.0">Con NAT simétrico STUN no alcanza: el router cambia el</tspan><tspan x="666.0" dy="21.6">puerto para cada destino. Ahí van keep-alive y puertos</tspan><tspan x="666.0" dy="21.6">abiertos.</tspan></text>
