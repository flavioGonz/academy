<circle cx="677" cy="190.7" r="4.5" fill="#17A8D4"/><text x="692.0" y="196.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="692.0" dy="0.0">Fijos: 8 cifras, empiezan con 2 o 4</tspan></text><circle cx="677" cy="220.3" r="4.5" fill="#17A8D4"/><text x="692.0" y="225.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="692.0" dy="0.0">Celulares: 9 cifras, empiezan con 09</tspan></text><circle cx="677" cy="249.9" r="4.5" fill="#17A8D4"/><text x="692.0" y="255.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="692.0" dy="0.0">Emergencias: 911</tspan></text>
