<text x="672.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="672.0" dy="0.0">El de la línea por la que salió: Outbound Route CID no</tspan><tspan x="672.0" dy="21.6">aplica a troncales analógicas.</tspan></text>
<rect x="48" y="516" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="528" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="550.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si preferís un prefijo para tomar línea: _9X. con Strip 1, como el ejemplo de Grandstream. El 911 no se usa para pruebas.</tspan></text>
