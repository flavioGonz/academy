<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Elegí el modo de red antes de configurar nada</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Elegí el modo de red antes de configurar nada</text>
<rect x="48" y="130" width="352" height="400" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="172.0" font-family="Familjen Grotesk" font-size="26" font-weight="600" fill="#04223D" text-anchor="start">Switch</text>
<text x="72.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">por defecto</text>
<rect x="72" y="222" width="304" height="78" rx="12" fill="#011E38"/>
<text x="88.0" y="250.0" font-family="Familjen Grotesk" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">UCM6300</text>
<rect x="198" y="236" width="76" height="50" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="236.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">WAN</text>
<rect x="288" y="236" width="76" height="50" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="326.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">LAN</text>
<text x="72.0" y="340.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">WAN: subida a la red</text>
<text x="72.0" y="368.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">LAN: puente, para una PC</text>
<path d="M72 392H376" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="72.0" y="424.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">Sirve si la red ya tiene</text>
<text x="72.0" y="448.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">DHCP y router propios.</text>
<rect x="424" y="130" width="352" height="400" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="448.0" y="172.0" font-family="Familjen Grotesk" font-size="26" font-weight="600" fill="#04223D" text-anchor="start">Route</text>
<text x="448.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">la central rutea</text>
<rect x="448" y="222" width="304" height="78" rx="12" fill="#011E38"/>
<text x="464.0" y="250.0" font-family="Familjen Grotesk" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">UCM6300</text>
<rect x="574" y="236" width="76" height="50" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="612.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">WAN</text>
<rect x="664" y="236" width="76" height="50" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="702.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">LAN</text>
<text x="448.0" y="340.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">WAN: subida a la red</text>
<text x="448.0" y="368.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">LAN: router con su DHCP</text>
<path d="M448 392H752" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="448.0" y="424.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">Habilita DHCP opción 66</text>
<text x="448.0" y="448.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">y Dynamic Defense.</text>
<rect x="448.0" y="483" width="252.8" height="30" rx="15" fill="#E3F5EC"/><text x="574.4" y="504.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">opción 66 · Dynamic Defense</text>
<rect x="800" y="130" width="352" height="400" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="824.0" y="172.0" font-family="Familjen Grotesk" font-size="26" font-weight="600" fill="#04223D" text-anchor="start">Dual</text>
<text x="824.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">dos salidas</text>
<rect x="824" y="222" width="304" height="78" rx="12" fill="#011E38"/>
<text x="840.0" y="250.0" font-family="Familjen Grotesk" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">UCM6300</text>
<rect x="950" y="236" width="76" height="50" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="988.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">WAN</text>
<rect x="1040" y="236" width="76" height="50" rx="8" fill="#0B3A66" stroke="#4E7396" stroke-width="2"/>
<text x="1078.0" y="278.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">LAN</text>
<text x="824.0" y="340.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">WAN (LAN2): subida 1</text>
<text x="824.0" y="368.0" font-family="JetBrains Mono" font-size="16" font-weight="500" fill="#04223D" text-anchor="start">LAN (LAN1): subida 2</text>
<path d="M824 392H1128" stroke="#DDE8F2" stroke-width="1.5"/>
<text x="824.0" y="424.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">Dos redes independientes;</text>
<text x="824.0" y="448.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start">elegís Default Interface.</text>
<rect x="48" y="556" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="568" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Antes que nada</tspan></text><text x="74.0" y="617.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Decidilo con la central vacía. Cambiar el modo en producción corta la web y los teléfonos: hacelo en ventana de mantenimiento y</tspan><tspan x="74.0" dy="21.6">con el LCD o la consola a mano.</tspan></text>
</svg>