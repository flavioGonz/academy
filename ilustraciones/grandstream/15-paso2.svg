<circle cx="81" cy="310.7" r="4.5" fill="#17A8D4"/><text x="96.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Destination Number: tu celular.</tspan></text><circle cx="81" cy="338.3" r="4.5" fill="#17A8D4"/><text x="96.0" y="343.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">La UCM llama a tu celular.</tspan></text><circle cx="81" cy="365.9" r="4.5" fill="#17A8D4"/><text x="96.0" y="371.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">La web te avisa: atendé.</tspan></text><circle cx="81" cy="393.5" r="4.5" fill="#17A8D4"/><text x="96.0" y="398.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Después te avisa: cortá.</tspan></text><circle cx="81" cy="421.1" r="4.5" fill="#17A8D4"/><text x="96.0" y="426.4" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="96.0" dy="0.0">Mide ocupado, polaridad y corte.</tspan></text>
<rect x="612" y="132" width="540" height="330" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="632.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">Con dos líneas: Auto Detect</text>
