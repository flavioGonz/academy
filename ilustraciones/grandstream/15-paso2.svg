<circle cx="645" cy="310.7" r="4.5" fill="#17A8D4"/><text x="660.0" y="316.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Destination Channel: FXO2.</tspan></text><circle cx="645" cy="340.3" r="4.5" fill="#17A8D4"/><text x="660.0" y="345.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Destination Number: el número real de la línea 2.</tspan></text><circle cx="645" cy="369.9" r="4.5" fill="#17A8D4"/><text x="660.0" y="375.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">La UCM atiende y corta sola.</tspan></text><circle cx="645" cy="399.5" r="4.5" fill="#17A8D4"/><text x="660.0" y="404.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="660.0" dy="0.0">Las dos líneas, libres antes de empezar.</tspan></text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="484" width="1104" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="496" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="518.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El resultado llena Busy Tone, Polarity Reversal y Current Disconnect en la troncal. Activá la polaridad solo si la detección la</tspan><tspan x="74.0" dy="21.6">encontró.</tspan></text>
<rect x="48" y="576" width="1104" height="54" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="588" width="5" height="30" rx="2.5" fill="#B45309"/><text x="74.0" y="610.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La línea queda ocupada alrededor de un minuto: hacelo fuera del horario de atención.</tspan></text>
