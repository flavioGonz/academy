<text x="632.0" y="466.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">Se queda en el puerto: es la central. Troncal, ruta entrante</tspan><tspan x="632.0" dy="21.6">y detección de ese puerto; después, el hardware.</tspan></text>
<rect x="48" y="560" width="1104" height="54" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="572" width="5" height="30" rx="2.5" fill="#0A63B8"/><text x="74.0" y="594.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Al terminar, volvé cada par a su puerto: las troncales Antel_Linea1 y Antel_Linea2 están atadas al FXO1 y al FXO2.</tspan></text>
