<text x="68.0" y="466.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">Sigue a la línea 2: es la línea o algo conectado en ella.</tspan><tspan x="68.0" dy="21.6">Revisá lo que cuelga del par y, si sigue, reclamo a Antel.</tspan></text>
