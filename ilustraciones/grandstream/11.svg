<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cada capa frena lo que la anterior dejó pasar</text>
<rect x="48" y="150" width="216" height="84" rx="16" fill="#FFFFFF" stroke="#D2492F" stroke-width="3"/><g transform="translate(68 176.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g><text x="112.0" y="188.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Barrido</text><text x="112.0" y="211.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">INVITE, REGISTER</text>
<text x="60.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start">varios intentos</text>
<text x="60.0" y="292.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#D2492F" text-anchor="start">por segundo</text>
<rect x="280" y="130" width="160" height="380" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<g transform="translate(342 150) scale(1.5)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></g>
<text x="360.0" y="222.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Router</text>
<text x="360.0" y="256.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">solo puertos con</text>
<text x="360.0" y="278.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">nombre y motivo</text>
<rect x="456" y="130" width="160" height="380" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<g transform="translate(518 150) scale(1.5)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/></g>
<text x="536.0" y="222.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Geo-IP</text>
<text x="536.0" y="256.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">solo los países</text>
<text x="536.0" y="278.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">que usás</text>
<rect x="632" y="130" width="160" height="380" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<g transform="translate(694 150) scale(1.5)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g>
<text x="712.0" y="222.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Fail2ban</text>
<text x="712.0" y="256.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">600 s de baneo</text>
<text x="712.0" y="278.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">tras intentos fallidos</text>
<rect x="808" y="130" width="160" height="380" rx="16" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<g transform="translate(870 150) scale(1.5)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/></g>
<text x="888.0" y="222.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Administración</text>
<text x="888.0" y="256.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">lista blanca web,</text>
<text x="888.0" y="278.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">sin 80 ni 443,</text>
<text x="888.0" y="300.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">SSH y AMI apagados</text>
