<g transform="translate(1046 150) scale(1.5)" fill="none" stroke="#0E8F5E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></g>
<text x="1064.0" y="222.0" font-family="Familjen Grotesk" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">Rutas</text>
<text x="1064.0" y="256.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">privilegio y PIN:</text>
<text x="1064.0" y="278.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">si entran, no</text>
<text x="1064.0" y="300.0" font-family="Instrument Sans" font-size="14" font-weight="500" fill="#41627F" text-anchor="middle">llaman afuera</text>
<path d="M256 418L1128 438L1128 442L256 462z" fill="#D2492F" opacity=".35"/>
<path d="M256 418L1128 438M256 462L1128 442" stroke="#D2492F" stroke-width="1.5" fill="none"/>
<text x="60.0" y="430.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">lo que sigue</text>
<text x="60.0" y="452.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">pasando, capa</text>
<text x="60.0" y="474.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#D2492F" text-anchor="start">tras capa</text>
<rect x="48" y="540" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="552" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Ninguna capa sola alcanza. Un administrador de Wazo vio varios INVITE maliciosos por segundo y juntó más de 50 IPs en sus</tspan><tspan x="74.0" dy="21.6">primeros baneos: por eso Fail2ban mira y las rutas caras piden PIN igual.</tspan></text>
</svg>