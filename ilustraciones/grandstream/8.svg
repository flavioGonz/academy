<text x="48.0" y="600.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">&quot;Que suene en todos lados&quot; es un grupo. Cuando hay más llamadas que personas, es una cola.</text>
