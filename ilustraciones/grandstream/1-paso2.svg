<rect x="612" y="132" width="540" height="250" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M612 146a14 14 0 0 1 14 -14h512a14 14 0 0 1 14 14v26h-540z" fill="#E5F0FB"/><circle cx="632" cy="152" r="5" fill="#C2D4E6"/><circle cx="650" cy="152" r="5" fill="#C2D4E6"/><circle cx="668" cy="152" r="5" fill="#C2D4E6"/><text x="688.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · web</text><text x="630.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Maintenance &gt; Login Settings &gt; Change Password</text><rect x="622" y="210" width="520" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="632.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Nueva contraseña</text><text x="1132.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">10 a 30 caracteres</text><text x="632.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Debe tener</text><text x="1132.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Aa · 0-9 · especial</text><text x="632.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Guardala en</text><text x="1132.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">la ficha del cliente</text>
<circle cx="612" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="612.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="612" y="412" width="540" height="145" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="424" width="5" height="121" rx="2.5" fill="#D2492F"/><text x="638.0" y="446.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Por qué en el primer ingreso</tspan></text><text x="638.0" y="472.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Dejar la clave de fábrica es de las causas más comunes de</tspan><tspan x="638.0" dy="21.6">centrales comprometidas. La UCM6510 con firmware hasta</tspan><tspan x="638.0" dy="21.6">1.0.20.52 ni siquiera limitaba los intentos de login</tspan><tspan x="638.0" dy="21.6">(CVE-2025-28172).</tspan></text>
