<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">En el GRP: el portero, su número y el mismo PIN</text>
<rect x="48" y="132" width="520" height="270" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 146a14 14 0 0 1 14 -14h492a14 14 0 0 1 14 14v26h-520z" fill="#E5F0FB"/><circle cx="68" cy="152" r="5" fill="#C2D4E6"/><circle cx="86" cy="152" r="5" fill="#C2D4E6"/><circle cx="104" cy="152" r="5" fill="#C2D4E6"/><text x="124.0" y="158.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">GRP26xx · web</text><text x="66.0" y="198.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">External Service &gt; GDS</text><text x="68.0" y="232.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Service Type</text><text x="548.0" y="232.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">GDS</text><text x="68.0" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Account</text><text x="548.0" y="270.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Account 1</text><text x="68.0" y="308.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">System Number</text><text x="548.0" y="308.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">8001</text><rect x="58" y="324" width="500" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="346.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Access Password</text><text x="548.0" y="346.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">4829 (el del GDS)</text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="612.0" y="158.0" font-family="Familjen Grotesk" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">¿Muestra la imagen del portero?</text>
<rect x="612" y="176" width="540" height="240" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M612 188a12 12 0 0 1 12 -12h516a12 12 0 0 1 12 12v28h-540z" fill="#E5F0FB"/><text x="626.0" y="201.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">GRP</text><text x="896.0" y="201.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">CON GDS37XX</text><text x="626.0" y="241.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">2601, 2602, 2603, 2604</text><text x="896.0" y="241.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">solo audio</text><path d="M624 256H1140" stroke="#DDE8F2" stroke-width="1"/><text x="626.0" y="281.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">2612, 2613</text><text x="896.0" y="281.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">solo audio</text><path d="M624 296H1140" stroke="#DDE8F2" stroke-width="1"/><text x="626.0" y="321.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">2614, 2615, 2616</text><text x="896.0" y="321.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">audio y video JPEG</text><path d="M624 336H1140" stroke="#DDE8F2" stroke-width="1"/><text x="626.0" y="361.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">2624, 2634, 2636</text><text x="896.0" y="361.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">audio y video JPEG</text><path d="M624 376H1140" stroke="#DDE8F2" stroke-width="1"/><text x="626.0" y="401.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">2650, 2670</text><text x="896.0" y="401.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">audio y video JPEG</text>
<rect x="48" y="430" width="520" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="442" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Access Password tiene que ser igual al Remote PIN del</tspan><tspan x="74.0" dy="21.6">GDS: es lo que manda la tecla OpenDoor.</tspan></text>
<rect x="612" y="430" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="442" width="5" height="51" rx="2.5" fill="#B45309"/><text x="638.0" y="464.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Si el portero entra por RemoteConnect, el video MJPEG no</tspan><tspan x="638.0" dy="21.6">anda en los GRP: para ver imagen conviene un GXV.</tspan></text>
</svg>