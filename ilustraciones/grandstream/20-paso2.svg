<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>El IVR del caso: tres cosas que se juntan</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">El IVR del caso: tres cosas que se juntan</text>
<rect x="48" y="124" width="560" height="272" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M48 138a14 14 0 0 1 14 -14h532a14 14 0 0 1 14 14v26h-560z" fill="#E5F0FB"/><circle cx="68" cy="144" r="5" fill="#C2D4E6"/><circle cx="86" cy="144" r="5" fill="#C2D4E6"/><circle cx="104" cy="144" r="5" fill="#C2D4E6"/><text x="124.0" y="150.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">UCM · IVR 7000 · como estaba</text><text x="66.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Basic Call Features &gt; IVR</text><rect x="58" y="202" width="540" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="68.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Dial Other Extensions</text><text x="588.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Extension, Ring Group</text><text x="68.0" y="262.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Digit Timeout (s)</text><text x="588.0" y="262.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">3</text><text x="68.0" y="300.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Response Timeout (s)</text><text x="588.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">10</text><text x="68.0" y="338.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Response Timeout Prompt Repeats</text><text x="588.0" y="338.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">3</text><text x="68.0" y="376.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Invalid Input Prompt Repeats</text><text x="588.0" y="376.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">3</text>
<rect x="640" y="124" width="512" height="234" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><path d="M640 138a14 14 0 0 1 14 -14h484a14 14 0 0 1 14 14v26h-512z" fill="#E5F0FB"/><circle cx="660" cy="144" r="5" fill="#C2D4E6"/><circle cx="678" cy="144" r="5" fill="#C2D4E6"/><circle cx="696" cy="144" r="5" fill="#C2D4E6"/><text x="716.0" y="150.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="start">Key Pressing Events</text><text x="658.0" y="190.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Standard Key Event</text><text x="660.0" y="224.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">teclas 0 a 9</text><text x="1132.0" y="224.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">ninguna</text><rect x="650" y="240" width="492" height="34" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="2"/><text x="660.0" y="262.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Tecla *</text><text x="1132.0" y="262.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Select an Option</text><text x="660.0" y="300.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Timeout</text><text x="1132.0" y="300.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ring Group 6000</text><text x="660.0" y="338.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Invalid</text><text x="1132.0" y="338.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#04223D" text-anchor="end">Ring Group 6000</text>
<circle cx="48" cy="124" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="130.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="48" y="424" width="352" height="128" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="68.0" y="456.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">1 · Marcar internos prendido</text>
<text x="68.0" y="486.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">El IVR queda esperando que el que</tspan><tspan x="68.0" dy="21.6">llama disque un número.</tspan></text>
<rect x="420" y="424" width="352" height="128" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="440.0" y="456.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">2 · Ninguna tecla numerada</text>
<text x="440.0" y="486.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="440.0" dy="0.0">Un dígito solo puede ser un interno;</tspan><tspan x="440.0" dy="21.6">si no existe, es inválido.</tspan></text>
<rect x="792" y="424" width="352" height="128" rx="16" fill="#FCEAE6" stroke="#D2492F" stroke-width="2"/><text x="812.0" y="456.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#D2492F" text-anchor="start">3 · Repeticiones en 3</text>
<text x="812.0" y="486.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="812.0" dy="0.0">Saludo y aviso pueden sonar hasta</tspan><tspan x="812.0" dy="21.6">tres veces antes del grupo.</tspan></text>
<rect x="48" y="572" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="584" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="606.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">La fila * con «Select an Option» no estaba guardada: era una fila nueva abierta en el formulario. Una tecla sin destino no se</tspan><tspan x="74.0" dy="21.6">guarda: se quita con el ícono (-).</tspan></text>
</svg>