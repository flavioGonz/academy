<circle cx="73" cy="404.7" r="4.5" fill="#B45309"/><text x="88.0" y="410.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Siempre lo mismo: corta un timer, no el BYE</tspan></text><circle cx="73" cy="434.3" r="4.5" fill="#17A8D4"/><text x="88.0" y="439.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">30 s: RTP timeout de un GXV3350</tspan></text><circle cx="73" cy="463.9" r="4.5" fill="#17A8D4"/><text x="88.0" y="469.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">1800 s: Session Expiration de la UCM</tspan></text><circle cx="73" cy="493.5" r="4.5" fill="#17A8D4"/><text x="88.0" y="498.8" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="88.0" dy="0.0">Cualquier cosa: no lo corta nadie</tspan></text>
