<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Backup a tu notebook antes de tocar el firmware</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Backup a tu notebook antes de tocar el firmware</text>
<rect x="48" y="140" width="340" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="184.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Anotá la versión</text>
<text x="72.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Maintenance &gt; Upgrade</text>
<text x="72.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">botón Detect</text>
<text x="364.0" y="184.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="end">primero</text>
<path d="M392.0 225.0C406.0 225.0,406.0 225.0,420.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="424" y="140" width="340" height="170" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="448.0" y="184.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Bajá el backup</text>
<text x="448.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Maintenance &gt; Backup</text>
<text x="448.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">archivo .tar a la notebook</text>
<text x="740.0" y="184.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="end">después</text>
<circle cx="424" cy="140" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="424.0" y="146.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<path d="M768.0 225.0C782.0 225.0,782.0 225.0,796.0 225.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
<rect x="800" y="140" width="340" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="824.0" y="184.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Recién ahí, upgrade</text>
<text x="824.0" y="220.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#0A63B8" text-anchor="start">Maintenance &gt; Upgrade</text>
<text x="824.0" y="260.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start">paso 5, con el .tar a salvo</text>
<text x="1116.0" y="184.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#6E88A1" text-anchor="end">al final</text>
<rect x="424" y="360" width="340" height="84" rx="16" fill="#FFFFFF" stroke="#0E8F5E" stroke-width="3"/><g transform="translate(444 386.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></g><text x="488.0" y="398.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Notebook del técnico</text><text x="488.0" y="421.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">backup-cliente.tar</text>
<path d="M594.0 314.0C594.0 337.1,594.0 332.9,594.0 356.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<rect x="800" y="340" width="352" height="189" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="800" y="352" width="5" height="165" rx="2.5" fill="#0E8F5E"/><text x="826.0" y="374.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="826.0" dy="0.0">El punto de vuelta atrás</tspan></text><text x="826.0" y="400.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="826.0" dy="0.0">Para restaurar, el archivo va en .tar</tspan><tspan x="826.0" dy="21.6">o .tgz, pesa menos de 100 MB y su</tspan><tspan x="826.0" dy="21.6">nombre no lleva caracteres</tspan><tspan x="826.0" dy="21.6">especiales. Guardalo fuera de la</tspan><tspan x="826.0" dy="21.6">central: si la central muere, el</tspan><tspan x="826.0" dy="21.6">backup no puede morir con ella.</tspan></text>
<rect x="48" y="360" width="340" height="97" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="372" width="5" height="73" rx="2.5" fill="#0A63B8"/><text x="74.0" y="394.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Después conviene programar backups</tspan><tspan x="74.0" dy="21.6">automáticos a USB, SD, SFTP, NAS o</tspan><tspan x="74.0" dy="21.6">S3 (Maintenance &gt; Backup).</tspan></text>
</svg>