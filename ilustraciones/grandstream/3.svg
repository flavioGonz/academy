<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Cómo encuentra el teléfono su configuración</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Cómo encuentra el teléfono su configuración</text>
<rect x="48" y="128" width="540" height="380" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="160.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">SIP SUBSCRIBE</text><text x="68.0" y="184.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">en cualquier modo de red</text>
<rect x="78.0" y="210" width="180" height="62" rx="12" fill="#011E38"/><text x="168.0" y="237.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Teléfono</text><text x="168.0" y="259.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">recién reseteado</text><path d="M168 272V480" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="378.0" y="210" width="180" height="62" rx="12" fill="#011E38"/><text x="468.0" y="237.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">UCM</text><text x="468.0" y="259.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">Zero Config</text><path d="M468 272V480" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M168 320H462" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="318.0" y="310.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">SUBSCRIBE a multicast</text>
<path d="M468 378H174" stroke="#0E8F5E" stroke-width="3" marker-end="url(#a-ok)"/><text x="318.0" y="368.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">NOTIFY con la URL</text>
<path d="M168 436H462" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="318.0" y="426.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">baja el XML</text>
<rect x="612" y="128" width="540" height="380" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="160.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">DHCP opción 66</text><text x="632.0" y="184.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">solo con la UCM en Route</text>
<rect x="642.0" y="210" width="180" height="62" rx="12" fill="#011E38"/><text x="732.0" y="237.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Teléfono</text><text x="732.0" y="259.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">recién reseteado</text><path d="M732 272V480" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="942.0" y="210" width="180" height="62" rx="12" fill="#011E38"/><text x="1032.0" y="237.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">UCM</text><text x="1032.0" y="259.0" font-family="JetBrains Mono" font-size="14" font-weight="400" fill="#9FC3E3" text-anchor="middle">Zero Config</text><path d="M1032 272V480" stroke="#C2D4E6" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M732 320H1026" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="882.0" y="310.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">DHCP DISCOVER</text>
<path d="M1032 378H738" stroke="#0E8F5E" stroke-width="3" marker-end="url(#a-ok)"/><text x="882.0" y="368.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">OFFER + opción 66</text>
<path d="M732 436H1026" stroke="#0A63B8" stroke-width="3" marker-end="url(#a-blue)"/><text x="882.0" y="426.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">baja el XML</text>
<rect x="48" y="530" width="540" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="542" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="564.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El XML lo arma la UCM con las plantillas y viaja por TFTP,</tspan><tspan x="74.0" dy="21.6">HTTP o HTTPS. El teléfono lo aplica y registra solo.</tspan></text>
<rect x="612" y="530" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="612" y="542" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="638.0" y="564.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">En Route la UCM es el DHCP de su LAN y entrega la URL, por</tspan><tspan x="638.0" dy="21.6">ejemplo https://192.168.2.1:8089/zccgi/</tspan></text>
</svg>