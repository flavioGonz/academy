<rect x="612" y="360" width="540" height="124" rx="14" fill="#FCEAE6" stroke="#FCEAE6" stroke-width="1.5"/><rect x="612" y="372" width="5" height="100" rx="2.5" fill="#D2492F"/><text x="638.0" y="394.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="638.0" dy="0.0">Leer el lugar equivocado</tspan></text><text x="638.0" y="420.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Con DID Mode en To-header, este INVITE se leería como</tspan><tspan x="638.0" dy="21.6">21000000: no matchea _2900XXXX y la llamada no llega a la</tspan><tspan x="638.0" dy="21.6">interna.</tspan></text>
<rect x="48" y="540" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="552" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="574.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Request-line viene de fábrica. Cada proveedor manda el DID donde quiere: si las entrantes no matchean, es lo primero que se</tspan><tspan x="74.0" dy="21.6">mira.</tspan></text>
