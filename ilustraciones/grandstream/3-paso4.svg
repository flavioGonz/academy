<rect x="920" y="206" width="170" height="110" rx="16" fill="#F1F4F7" stroke="#C2D4E6" stroke-width="2"/><rect x="932" y="196" width="34" height="112" rx="14" fill="#3A4A5C"/><rect x="980" y="220" width="96" height="40" rx="6" fill="#0B1A28"/><rect x="982.0" y="270" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1005.0" y="270" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1028.0" y="270" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1051.0" y="270" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="982.0" y="283" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1005.0" y="283" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1028.0" y="283" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1051.0" y="283" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="982.0" y="296" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1005.0" y="296" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1028.0" y="296" width="17.0" height="8" rx="2" fill="#B9C9D8"/><rect x="1051.0" y="296" width="17.0" height="8" rx="2" fill="#B9C9D8"/><text x="1005.0" y="342.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="middle">GRP</text><text x="1005.0" y="364.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="middle">inglés · hora de Montevideo</text>
<text x="880.0" y="412.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">el idioma lo pisó el Model</text>
<text x="880.0" y="432.0" font-family="Instrument Sans" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Template; la hora vino de abajo</text>
<rect x="48" y="474" width="1104" height="102" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="486" width="5" height="78" rx="2.5" fill="#B45309"/><text x="74.0" y="508.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="74.0" dy="0.0">Por encima de todo, lo manual</tspan></text><text x="74.0" y="535.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Lo que alguien tocó a mano en la web del teléfono no lo pisa ninguna plantilla. Por eso el teléfono que se aprovisiona no se</tspan><tspan x="74.0" dy="21.6">toca: si quedó distinto, reset de fábrica y que lo tome Zero Config.</tspan></text>
</svg>