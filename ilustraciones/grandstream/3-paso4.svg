<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 4</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Qué plantilla gana cuando dos dicen distinto</text>
<rect x="48" y="136" width="640" height="92" rx="14" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/>
<text x="72.0" y="176.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Model Template</text>
<text x="72.0" y="204.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">por modelo · la que gana</text>
<text x="664.0" y="190.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="end">Idioma del GRP: inglés</text>
<rect x="48" y="244" width="640" height="92" rx="14" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/>
<text x="72.0" y="284.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Global Template</text>
<text x="72.0" y="312.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">varias, una por defecto</text>
<text x="664.0" y="298.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="end">(sin idioma)</text>
<rect x="48" y="352" width="640" height="92" rx="14" fill="#E5F0FB" stroke="#0A63B8" stroke-width="2"/>
<text x="72.0" y="392.0" font-family="Familjen Grotesk" font-size="21" font-weight="600" fill="#04223D" text-anchor="start">Global Policy</text>
<text x="72.0" y="420.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#6E88A1" text-anchor="start">una sola · todos los equipos</text>
<text x="664.0" y="406.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#04223D" text-anchor="end">Idioma: español · Montevideo</text>
<path d="M720.0 438.0C720.0 279.6,720.0 308.4,720.0 150.0" fill="none" stroke="#0E8F5E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ok)"/>
<text x="740.0" y="300.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">más</text>
<text x="740.0" y="322.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">prioridad</text>
