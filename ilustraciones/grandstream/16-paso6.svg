<rect x="48" y="480" width="540" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="492" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Si vos escuchás bajo al que llama, subí RX de a poco. Si al</tspan><tspan x="74.0" dy="21.6">otro lado te escuchan bajo, subí TX.</tspan></text>
<rect x="612" y="480" width="540" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="612" y="492" width="5" height="51" rx="2.5" fill="#B45309"/><text x="638.0" y="514.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="638.0" dy="0.0">Eco, ruido o volumen raro: primero la impedancia (ACIM,</tspan><tspan x="638.0" dy="21.6">Detect en Analog Hardware); recién después las ganancias.</tspan></text>
