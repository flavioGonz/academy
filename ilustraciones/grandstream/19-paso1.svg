<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>La planilla que se le pide a Antel antes de la obra</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">GRANDSTREAM · PASO 1</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">La planilla que se le pide a Antel antes de la obra</text>
<rect x="48" y="126" width="730" height="484" rx="12" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="1.5"/><path d="M48 138a12 12 0 0 1 12 -12h706a12 12 0 0 1 12 12v32h-730z" fill="#E5F0FB"/><text x="62.0" y="153.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">DATO</text><text x="392.0" y="153.0" font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#6E88A1" text-anchor="start" letter-spacing="1.2">EJEMPLO</text><text x="62.0" y="197.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Número de servicio</text><text x="392.0" y="197.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">P00000 (de ejemplo)</text><path d="M60 214H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="241.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Plan y canales</text><text x="392.0" y="241.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">TSIP8 · 8 simultáneas</text><path d="M60 258H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="285.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">IP del cliente y máscara</text><text x="392.0" y="285.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">198.51.100.2 / 255.255.255.252</text><path d="M60 302H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="329.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Gateway de Antel</text><text x="392.0" y="329.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">198.51.100.1</text><path d="M60 346H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="373.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Servidor SIP y puerto</text><text x="392.0" y="373.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">203.0.113.10 · 5060 UDP</text><rect x="52" y="393" width="722" height="38" rx="8" fill="#E5F0FB" stroke="#17A8D4" stroke-width="1.5"/><text x="62.0" y="417.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Redes a rutear (SIP y audio)</text><text x="392.0" y="417.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">203.0.113.0/24</text><path d="M60 434H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="461.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Números de la troncal</text><text x="392.0" y="461.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">2900 1001 a 2900 1008</text><path d="M60 478H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="505.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Número por defecto</text><text x="392.0" y="505.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">2900 1001</text><path d="M60 522H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="549.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Codecs y DTMF</text><text x="392.0" y="549.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">G.711, T.38 · RFC 2833 o inband</text><path d="M60 566H766" stroke="#DDE8F2" stroke-width="1"/><text x="62.0" y="593.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="start">Formato entrante y saliente</text><text x="392.0" y="593.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#41627F" text-anchor="start">8 cifras, 598 o 09: a confirmar</text>
<circle cx="48" cy="126" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="132.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="818" y="126" width="334" height="200" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="838.0" y="158.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Lo que casi nunca viene</text>
<circle cx="843" cy="185.1" r="4.5" fill="#B45309"/><text x="858.0" y="190.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="858.0" dy="0.0">Todas las IP desde las que Antel</tspan><tspan x="858.0" dy="20.2">manda señalización y audio</tspan></text><circle cx="843" cy="231.6" r="4.5" fill="#B45309"/><text x="858.0" y="236.5" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="858.0" dy="0.0">El formato del número que llega en</tspan><tspan x="858.0" dy="20.2">las entrantes</tspan></text><circle cx="843" cy="278.1" r="4.5" fill="#B45309"/><text x="858.0" y="283.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="858.0" dy="0.0">Si el servidor contesta los OPTIONS</tspan><tspan x="858.0" dy="20.2">de la central</tspan></text>
<rect x="818" y="348" width="334" height="113" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="818" y="360" width="5" height="89" rx="2.5" fill="#0A63B8"/><text x="844.0" y="382.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="844.0" dy="0.0">El número de servicio, una P y cinco</tspan><tspan x="844.0" dy="20.2">cifras, es el que pide el 0800 2599</tspan><tspan x="844.0" dy="20.2">para un reclamo. No es un número de</tspan><tspan x="844.0" dy="20.2">teléfono.</tspan></text>
<text x="48.0" y="642.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Todos los valores son de ejemplo.</text>
</svg>