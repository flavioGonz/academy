<rect x="730" y="352" width="422" height="75" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="730" y="364" width="5" height="51" rx="2.5" fill="#0E8F5E"/><text x="756.0" y="386.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="756.0" dy="0.0">Si Uruguay aparece en Tone Country, usalo. Si</tspan><tspan x="756.0" dy="21.6">no, Custom con estos valores.</tspan></text>
<rect x="48" y="494" width="1104" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="506" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="528.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Busy Tone Count: el manual sugiere 4, 6 u 8 para evitar cortes al azar; más alto corta más tarde, y muy alto puede no cortar</tspan><tspan x="74.0" dy="21.6">nunca.</tspan></text>
