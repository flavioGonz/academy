<rect x="72" y="176" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="114.0" y="196.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Auto-Detect</text>
<text x="114.0" y="218.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">probalo primero</text>
<rect x="72" y="236" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="114.0" y="256.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">Bellcore/Telcordia</text>
<text x="114.0" y="278.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">el de fábrica</text>
<rect x="72" y="296" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="114.0" y="316.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">ETSI-FSK During Ringing</text>
<rect x="72" y="356" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="114.0" y="376.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">ETSI-DTMF During Ringing</text>
<rect x="72" y="416" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="114.0" y="436.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">ETSI-FSK Prior to Ringing with LR</text>
<text x="114.0" y="458.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">también DTAS y RP</text>
<rect x="72" y="476" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#0A63B8" stroke-width="2"/>
<text x="114.0" y="496.0" font-family="JetBrains Mono" font-size="17" font-weight="600" fill="#04223D" text-anchor="start">ETSI-DTMF Prior to Ringing with LR</text>
<text x="114.0" y="518.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">también DTAS y RP</text>
<circle cx="48" cy="132" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="48.0" y="138.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="730" y="132" width="422" height="180" rx="16" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><text x="750.0" y="164.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#0E8F5E" text-anchor="start">En cada prueba</text>
<circle cx="755" cy="190.7" r="4.5" fill="#17A8D4"/><text x="770.0" y="196.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="770.0" dy="0.0">Llamá desde un celular.</tspan></text><circle cx="755" cy="220.3" r="4.5" fill="#17A8D4"/><text x="770.0" y="225.6" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="770.0" dy="0.0">Dejá sonar al menos dos timbres.</tspan></text><circle cx="755" cy="249.9" r="4.5" fill="#17A8D4"/><text x="770.0" y="255.2" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="770.0" dy="0.0">Mirá el número en CDR y en el teléfono que</tspan><tspan x="770.0" dy="21.6">atiende.</tspan></text>
<rect x="730" y="332" width="422" height="97" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="730" y="344" width="5" height="73" rx="2.5" fill="#B45309"/><text x="756.0" y="366.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="756.0" dy="0.0">Antes, un teléfono con pantalla en el par: si</tspan><tspan x="756.0" dy="21.6">no muestra el número, la línea no tiene la</tspan><tspan x="756.0" dy="21.6">facilidad de Antel.</tspan></text>
<rect x="48" y="594" width="1104" height="54" rx="14" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1.5"/><rect x="48" y="606" width="5" height="30" rx="2.5" fill="#0E8F5E"/><text x="74.0" y="628.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">El que funciona va a la ficha de la línea, junto con la tensión y los tonos.</tspan></text>
</svg>