<rect x="700" y="366" width="452" height="97" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="700" y="378" width="5" height="73" rx="2.5" fill="#B45309"/><text x="726.0" y="400.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="726.0" dy="0.0">Bajar la retención para que entre en el disco es</tspan><tspan x="726.0" dy="21.6">perder evidencia. Si falta espacio, se agranda el</tspan><tspan x="726.0" dy="21.6">disco.</tspan></text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Según el Manual del Instalador: hasta 4 cámaras, 250 GB SSD; 8 a 16 cámaras, 500 GB SSD.</text>
