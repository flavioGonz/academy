<rect x="198.0" y="210.0" width="240.0" height="79.2" rx="6" fill="#FFFFFF" stroke="#04223D" stroke-width="2.5"/><rect x="200.0" y="212.0" width="236.0" height="15.8" rx="4" fill="#0A63B8"/><text x="318.0" y="274.9" font-family="JetBrains Mono" font-size="32" font-weight="700" fill="#04223D" text-anchor="middle">SAB 2024</text>
