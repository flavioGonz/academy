<text x="636.0" y="480.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">Un 9 leído como 0: no se actúa, se avisa.</text>
<rect x="48" y="534" width="1104" height="75" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="48" y="546" width="5" height="51" rx="2.5" fill="#0A63B8"/><text x="74.0" y="568.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">En Roseville el 71 % de las alertas de vehículo buscado eran lecturas equivocadas; no hubo detenciones porque cada una se</tspan><tspan x="74.0" dy="21.6">verificaba.</tspan></text>
