<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Qué hacés con cada tarjeta</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS LPR · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Qué hacés con cada tarjeta</text>
<rect x="48" y="128" width="400" height="104" rx="12" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="2"/><rect x="60" y="140" width="80" height="80" rx="8" fill="#0B1A28"/><text x="154.0" y="162.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#04223D" text-anchor="start">SBA 1234</text><text x="154.0" y="188.0" font-family="Instrument Sans" font-size="15" font-weight="700" fill="#0E8F5E" text-anchor="start" letter-spacing="0.5">AUTORIZADO</text>
<text x="480.0" y="172.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="480.0" dy="0.0">Nada. Pasa solo si la barrera está automatizada.</tspan></text>
<rect x="48" y="252" width="400" height="104" rx="12" fill="#FFF4DE" stroke="#D99A06" stroke-width="2"/><rect x="60" y="264" width="80" height="80" rx="8" fill="#0B1A28"/><text x="154.0" y="286.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#04223D" text-anchor="start">SCD 5678</text><text x="154.0" y="312.0" font-family="Instrument Sans" font-size="15" font-weight="700" fill="#D99A06" text-anchor="start" letter-spacing="0.5">DENEGADO</text>
<text x="480.0" y="296.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="480.0" dy="0.0">Verificás con el residente antes de abrir. Casi siempre es una visita</tspan><tspan x="480.0" dy="24.3">o un auto nuevo.</tspan></text>
<rect x="48" y="376" width="400" height="104" rx="12" fill="#FCEAE6" stroke="#D2492F" stroke-width="3"/><rect x="60" y="388" width="80" height="80" rx="8" fill="#0B1A28"/><text x="154.0" y="410.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#04223D" text-anchor="start">SAB 2024</text><text x="154.0" y="436.0" font-family="Instrument Sans" font-size="15" font-weight="700" fill="#D2492F" text-anchor="start" letter-spacing="0.5">LISTA NEGRA</text>
<text x="480.0" y="420.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="480.0" dy="0.0">Mirás el recorte y seguís el protocolo del cliente. No se abre por las</tspan><tspan x="480.0" dy="24.3">dudas.</tspan></text>
<rect x="48" y="500" width="400" height="104" rx="12" fill="#FFF8D6" stroke="#B8860B" stroke-width="2"/><rect x="60" y="512" width="80" height="80" rx="8" fill="#0B1A28"/><text x="154.0" y="534.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#04223D" text-anchor="start">sin chapa</text><text x="154.0" y="560.0" font-family="Instrument Sans" font-size="15" font-weight="700" fill="#B8860B" text-anchor="start" letter-spacing="0.5">SIN LECTURA</text>
<text x="480.0" y="544.0" font-family="Instrument Sans" font-size="18" font-weight="500" fill="#04223D" text-anchor="start"><tspan x="480.0" dy="0.0">Mirás la foto. Si la patente se ve, Cargar matrícula y el servidor</tspan><tspan x="480.0" dy="24.3">vuelve a decidir.</tspan></text>
</svg>