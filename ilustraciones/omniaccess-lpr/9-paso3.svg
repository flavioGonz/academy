<rect x="760" y="470" width="392" height="104" rx="12" fill="#FCEAE6" stroke="#D2492F" stroke-width="3"/><rect x="772" y="482" width="80" height="80" rx="8" fill="#0B1A28"/><text x="866.0" y="504.0" font-family="JetBrains Mono" font-size="19" font-weight="700" fill="#04223D" text-anchor="start">SCD 5678</text><text x="866.0" y="530.0" font-family="Instrument Sans" font-size="15" font-weight="700" fill="#D2492F" text-anchor="start" letter-spacing="0.5">MERODEO</text><text x="866.0" y="552.0" font-family="Instrument Sans" font-size="14" font-weight="400" fill="#41627F" text-anchor="start">3 pasadas en 30 min · 1 acceso</text>
<rect x="48" y="500" width="640" height="75" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="48" y="512" width="5" height="51" rx="2.5" fill="#B45309"/><text x="74.0" y="534.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="74.0" dy="0.0">Con menos de 20 s entre envíos, la segunda y la tercera se descartan y</tspan><tspan x="74.0" dy="21.6">no hay alerta. Solo en una instalación de prueba.</tspan></text>
