<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS LPR · PASO 3</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Tres lecturas separadas por 30 s disparan el merodeo</text>
<rect x="48" y="128" width="1104" height="128" rx="12" fill="#03213C"/><text x="64.0" y="161.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">for i in 1 2 3; do</text><text x="64.0" y="187.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">  curl -s -X POST 192.0.2.10:10000/api/webhooks/hikvision ... &lt;licensePlate&gt;SCD5678&lt;/licensePlate&gt; ...</text><text x="64.0" y="213.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">  echo; sleep 30</text><text x="64.0" y="239.6" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#D9E9F8" text-anchor="start">done</text>
