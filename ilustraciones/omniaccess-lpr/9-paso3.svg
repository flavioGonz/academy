<rect x="500" y="380" width="233" height="14" rx="7" fill="#D99A06" opacity=".35"/>
<circle cx="500" cy="400" r="12" fill="#04223D"/>
<text x="500.0" y="364.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">pasada 2</text>
