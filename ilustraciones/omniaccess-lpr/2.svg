<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>¿Quién sube la barrera: la cámara o el servidor?</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS LPR</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">¿Quién sube la barrera: la cámara o el servidor?</text>
<rect x="48" y="130" width="420" height="400" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="68.0" y="162.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Cerebro 1 · la cámara</text><text x="68.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">lista cargada desde OmniAccess</text>
<g transform="translate(90 240) scale(1.3)"><rect x="0" y="-14" width="74" height="30" rx="7" fill="#011E38"/><rect x="70" y="-10" width="14" height="22" rx="3" fill="#0B3A66"/><path d="M-6 -20 H82" stroke="#011E38" stroke-width="5" stroke-linecap="round"/><circle cx="62" cy="1" r="5" fill="#17A8D4"/></g>
<rect x="245.0" y="214.0" width="170.0" height="56.1" rx="6" fill="#FFFFFF" stroke="#04223D" stroke-width="2.5"/><rect x="247.0" y="216.0" width="166.0" height="11.2" rx="4" fill="#0A63B8"/><text x="330.0" y="260.0" font-family="JetBrains Mono" font-size="24" font-weight="700" fill="#04223D" text-anchor="middle">SBA 1234</text>
<text x="330.0" y="290.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#0E8F5E" text-anchor="middle">está en su lista blanca</text>
<path d="M130.0 268.0 L130.0 360.0 L267.0 360.0 L267.0 420.0" fill="none" stroke="#17A8D4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140.0" y="340.0" font-family="JetBrains Mono" font-size="16" font-weight="600" fill="#17A8D4" text-anchor="start">relé</text>
<rect x="250" y="420" width="34" height="70" rx="6" fill="#FFFFFF" stroke="#41627F" stroke-width="2.5"/><path d="M267 430 L310 320" stroke="#0E8F5E" stroke-width="8" stroke-linecap="round"/>
<text x="330.0" y="452.0" font-family="Instrument Sans" font-size="16" font-weight="600" fill="#0E8F5E" text-anchor="start">semáforo verde</text>
<text x="330.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">y barrera arriba</text>
<text x="68.0" y="512.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">Lista negra: pasa a la lista de bloqueo.</text>
<rect x="500" y="130" width="652" height="400" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="520.0" y="162.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Cerebro 2 · el servidor</text><text x="520.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">decide en este orden</text>
<circle cx="540" cy="224" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="540.0" y="230.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="572.0" y="230.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">¿La cámara informó su lista?</text>
<rect x="572.0" y="249.0" width="185.6" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="664.8" y="270.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">sí: manda la cámara</text>
<circle cx="540" cy="316" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="540.0" y="322.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="572.0" y="322.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">¿La matrícula está en el padrón?</text>
<rect x="572.0" y="341.0" width="370.4" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="757.2" y="362.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">sí: Autorizado (Modo LPR en Lista Blanca)</text>
<circle cx="540" cy="408" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="540.0" y="414.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="572.0" y="414.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Ninguna de las dos</text>
<rect x="572.0" y="433.0" width="93.2" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="618.6" y="454.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">Denegado</text>
<text x="520.0" y="506.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#41627F" text-anchor="start">Antirrebote: 5 s por matrícula, 20 s por cámara.</text>
<rect x="48.0" y="567.0" width="121.2" height="31" rx="15.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="108.6" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#0E8F5E" text-anchor="middle">Autorizado</text>
<text x="198.0" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">pasa solo</text>
<rect x="420.0" y="567.0" width="102.2" height="31" rx="15.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="471.1" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#B45309" text-anchor="middle">Denegado</text>
<text x="570.0" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">se verifica</text>
<rect x="792.0" y="567.0" width="130.7" height="31" rx="15.5" fill="#FCEAE6" stroke="#D2492F" stroke-width="1.5"/><text x="857.4" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="middle">Lista negra</text>
<text x="942.0" y="590.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#41627F" text-anchor="start">protocolo</text>
