<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS LPR · PASO 7</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Reclamo «no me abrió»: dos caminos según haya evento</text>
<rect x="430" y="130" width="340" height="84" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><g transform="translate(450 156.0) scale(1.35)" fill="none" stroke="#0A63B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16 7l2.5 2.5"/></g><text x="494.0" y="168.0" font-family="Instrument Sans" font-size="19" font-weight="600" fill="#04223D" text-anchor="start">Buscar la matrícula</text><text x="494.0" y="191.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">a la hora del reclamo</text>
<rect x="48" y="300" width="520" height="210" rx="16" fill="#FFF4DE" stroke="#B45309" stroke-width="2"/><text x="68.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#B45309" text-anchor="start">Hay evento Denegado</text>
<rect x="632" y="300" width="520" height="210" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="652.0" y="332.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">No hay evento</text>
<path d="M500.0 214.0C400.0 214.0,400.0 296.0,300.0 296.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="346.0" y="226.0" width="108.0" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="400.0" y="245.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">hay evento</text>
<path d="M700.0 214.0C800.0 214.0,800.0 296.0,900.0 296.0" fill="none" stroke="#0A63B8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="763.2" y="226.0" width="73.6" height="28" rx="14" fill="#FFFFFF" stroke="#0A63B8" stroke-width="1.5"/><text x="800.0" y="245.0" font-family="JetBrains Mono" font-size="14" font-weight="600" fill="#0A63B8" text-anchor="middle">no hay</text>
<text x="72.0" y="372.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">La matrícula no está en el padrón,</text>
<text x="72.0" y="406.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">está mal cargada o suspendida.</text>
<text x="72.0" y="440.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Revisar usuario, credencial y grupo.</text>
<text x="72.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Exportar el ZIP para la respuesta.</text>
<text x="656.0" y="372.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">La cámara no lo leyó.</text>
<text x="656.0" y="406.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Mirar la grabación de esa hora</text>
<text x="656.0" y="440.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">para confirmar que pasó.</text>
<text x="656.0" y="474.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Revisar esa cámara en Dispositivos.</text>
<text x="48.0" y="560.0" font-family="Instrument Sans" font-size="16" font-weight="500" fill="#41627F" text-anchor="start">Matrícula de prueba para practicar: SBA1234. En un barrio real, primero el recorte y la grabación; después la respuesta.</text>
