<text x="636.0" y="350.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#D2492F" text-anchor="start">Imagen sana, pero no lee: falla silenciosa.</text>
<text x="48.0" y="428.0" font-family="Instrument Sans" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">Para revertir, en este orden:</text>
