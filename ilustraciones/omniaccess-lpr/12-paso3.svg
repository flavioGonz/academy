<text x="96.0" y="536.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Reiniciar la cámara</text>
<circle cx="626" cy="530" r="17" fill="#17A8D4" stroke="#FFFFFF" stroke-width="3"/><text x="626.0" y="536.0" font-family="Familjen Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="656.0" y="536.0" font-family="Instrument Sans" font-size="17" font-weight="500" fill="#04223D" text-anchor="start">Esperar unos 80 s y mirar Webhooks</text>
