<text x="70.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="70.0" dy="0.0">Entraron, no salieron y no son de</tspan><tspan x="70.0" dy="23.0">ningún lote.</tspan></text>
