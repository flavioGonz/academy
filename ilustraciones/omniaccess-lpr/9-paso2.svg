<text x="446.0" y="186.0" font-family="Instrument Sans" font-size="20" font-weight="700" fill="#04223D" text-anchor="start"><tspan x="446.0" dy="0.0">Vehículo del barrio adentro</tspan><tspan x="446.0" dy="27.0">hace mucho</tspan></text>
<text x="446.0" y="258.0" font-family="Instrument Sans" font-size="17" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="446.0" dy="0.0">Más de 4 días sin salir (valor</tspan><tspan x="446.0" dy="23.0">por defecto).</tspan></text>
