<text x="68.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="68.0" dy="0.0">La empuja por la red local en Montevideo. No necesita</tspan><tspan x="68.0" dy="21.6">internet ni un servidor NTP. Pregunta antes de tocar.</tspan></text>
<rect x="612" y="380" width="540" height="170" rx="16" fill="#FFFFFF" stroke="#C2D4E6" stroke-width="2"/><text x="632.0" y="412.0" font-family="Familjen Grotesk" font-size="18" font-weight="600" fill="#04223D" text-anchor="start">NTP</text><text x="632.0" y="436.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#6E88A1" text-anchor="start">si hay un servidor de hora en la red</text>
<text x="632.0" y="476.0" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="632.0" dy="0.0">La cámara pide la hora a ese servidor cada cierto tiempo.</tspan><tspan x="632.0" dy="21.6">Solo anda si el equipo lo alcanza.</tspan></text>
