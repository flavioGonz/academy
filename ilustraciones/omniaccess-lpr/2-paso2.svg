<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
<title>Mandá la misma lectura tres veces y leé la respuesta</title>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A63B8"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17A8D4"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E88A1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E8F5E"/></marker><marker id="a-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D2492F"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E6EEF6" stroke-width="1"/></pattern></defs>
<rect width="1200" height="675" fill="#F7FAFD"/>
<rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
<text x="48.0" y="56.0" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#17A8D4" text-anchor="start" letter-spacing="2.2">OMNIACCESS LPR · PASO 2</text>
<text x="48.0" y="94.0" font-family="Familjen Grotesk" font-size="32" font-weight="600" fill="#04223D" text-anchor="start">Mandá la misma lectura tres veces y leé la respuesta</text>
<rect x="48" y="130" width="700" height="234" rx="14" fill="#03213C"/><text x="66.0" y="156.0" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#7FA6C9" text-anchor="start" letter-spacing="1.5">PC DE LA RED DE PRUEBA → 192.0.2.10:10000</text><text x="66.0" y="186.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ curl ... &lt;licensePlate&gt;SBA1234&lt;/licensePlate&gt;</text><text x="66.0" y="212.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#FFB4A6" text-anchor="start">{&quot;status&quot;:&quot;processed&quot;,&quot;decision&quot;:&quot;DENY&quot;}</text><text x="66.0" y="238.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ curl ...   (enseguida, mismo comando)</text><text x="66.0" y="264.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#FFE08A" text-anchor="start">{&quot;message&quot;:&quot;Debounced&quot;,&quot;plate&quot;:&quot;SBA1234&quot;}</text><text x="66.0" y="290.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">   ... Registrar desde el monitor, esperar 25 s ...</text><text x="66.0" y="316.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#D9E9F8" text-anchor="start">$ curl ...</text><text x="66.0" y="342.0" font-family="JetBrains Mono" font-size="15" font-weight="400" fill="#7EE2B8" text-anchor="start">{&quot;status&quot;:&quot;processed&quot;,&quot;decision&quot;:&quot;GRANT&quot;}</text>
<path d="M80 470H1120" stroke="#6E88A1" stroke-width="2"/>
<circle cx="110" cy="470" r="8" fill="#04223D"/>
<text x="110.0" y="452.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">0 s</text>
<rect x="80.2" y="495.0" width="59.6" height="29" rx="14.5" fill="#FFF4DE" stroke="#B45309" stroke-width="1.5"/><text x="110.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">DENY</text>
<circle cx="230" cy="470" r="8" fill="#04223D"/>
<text x="230.0" y="452.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">2 s</text>
<rect x="179.2" y="495.0" width="101.6" height="29" rx="14.5" fill="#E5F0FB" stroke="#41627F" stroke-width="1.5"/><text x="230.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#41627F" text-anchor="middle">Debounced</text>
<circle cx="640" cy="470" r="8" fill="#04223D"/>
<text x="640.0" y="452.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">alta</text>
<rect x="589.2" y="495.0" width="101.6" height="29" rx="14.5" fill="#E5F0FB" stroke="#0A63B8" stroke-width="1.5"/><text x="640.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0A63B8" text-anchor="middle">Registrar</text>
<circle cx="980" cy="470" r="8" fill="#04223D"/>
<text x="980.0" y="452.0" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#04223D" text-anchor="middle">27 s</text>
<rect x="946.0" y="495.0" width="68.0" height="29" rx="14.5" fill="#E3F5EC" stroke="#0E8F5E" stroke-width="1.5"/><text x="980.0" y="516.0" font-family="Instrument Sans" font-size="15" font-weight="600" fill="#0E8F5E" text-anchor="middle">GRANT</text>
<rect x="110" y="464" width="300" height="12" rx="6" fill="#D99A06" opacity=".45"/>
<text x="260.0" y="560.0" font-family="JetBrains Mono" font-size="15" font-weight="500" fill="#B45309" text-anchor="middle">ventana de 5 s</text>
<rect x="790" y="130" width="362" height="124" rx="14" fill="#FFF4DE" stroke="#FFF4DE" stroke-width="1.5"/><rect x="790" y="142" width="5" height="100" rx="2.5" fill="#B45309"/><text x="816.0" y="164.0" font-family="Instrument Sans" font-size="17" font-weight="600" fill="#04223D" text-anchor="start"><tspan x="816.0" dy="0.0">Cuidado</tspan></text><text x="816.0" y="190.9" font-family="Instrument Sans" font-size="16" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">Solo en una instalación de prueba:</tspan><tspan x="816.0" dy="21.6">cada envío crea un evento real que se</tspan><tspan x="816.0" dy="21.6">ve en el monitor y en el historial.</tspan></text>
<rect x="790" y="300" width="362" height="93" rx="14" fill="#FFFFFF" stroke="#DDE8F2" stroke-width="1.5"/><rect x="790" y="312" width="5" height="69" rx="2.5" fill="#0A63B8"/><text x="816.0" y="334.0" font-family="Instrument Sans" font-size="15" font-weight="400" fill="#41627F" text-anchor="start"><tspan x="816.0" dy="0.0">La lectura sin chapa (NO_LEIDA) nunca se</tspan><tspan x="816.0" dy="20.2">descarta: dos lecturas sin chapa pueden</tspan><tspan x="816.0" dy="20.2">ser dos autos.</tspan></text>
</svg>